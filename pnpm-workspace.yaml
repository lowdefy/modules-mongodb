packages:
  - "apps/*"
  - "plugins/*"
  - "modules/*"
  - "apps/*/.lowdefy/*"

# Force a single dayjs copy across the tree. antd@6 resolves dayjs ^1.11.11
# (→ 1.11.19) while @lowdefy/blocks-antd pins dayjs 1.11.20 exactly, so pnpm
# installs two physical copies. blocks-antd calls dayjs.extend(utc) on its own
# copy, but antd builds the DatePicker's calendar-cell date objects with its
# copy; dayjs(cellDate) clones same-family instances, so blocks-antd's
# disabledDate closure gets an antd-copy clone that never had utc extended —
# "dayjs(...).utc is not a function" the moment a date picker opens. Deduping to
# one copy (satisfies both ranges) makes the utc plugin registration shared.
overrides:
  dayjs: 1.11.20

# No patchedDependencies: the three patches this branch carried (ai-utils
# generateMessageId, blocks-antd-x setInput + two-track welcome, blocks-aggrid
# menu cell + cell-renderer identity) all landed upstream and shipped in the
# 0.0.0-experimental-20260814133003 build, verified present in the published
# dist, so the patches were dropped on that bump.

# These pnpm keys live here, not under a "pnpm" key in package.json: pnpm 10+
# no longer reads that key and silently ignores it — it only warns.
packageExtensions:
  "@lowdefy/client":
    dependencies:
      antd: "6.3.1"

# pnpm 11 replaced onlyBuiltDependencies/ignoredBuiltDependencies with allowBuilds
# (package -> boolean) and fails install on any un-reviewed build script.
# mongodb-memory-server needs its postinstall; @swc/core, sharp and @sentry/cli
# ship prebuilt binaries via optional deps, so their install scripts (which just
# re-download those binaries) are intentionally skipped.
allowBuilds:
  mongodb-memory-server: true
  "@swc/core": false
  sharp: false
  "@sentry/cli": false

# Lowdefy ships as pinned experimental builds that we intentionally install the
# day they publish, so exempt the whole scope (plus the unscoped `lowdefy` CLI)
# from pnpm's default new-package cooldown. Patterns, not version pins, so this
# never churns on version bumps.
minimumReleaseAgeExclude:
  - "@lowdefy/*"
  - lowdefy
