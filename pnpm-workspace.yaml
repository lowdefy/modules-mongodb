packages:
  - "apps/*"
  - "plugins/*"
  - "modules/*"
  - "apps/*/.lowdefy/*"

# Force a single dayjs copy across the tree. antd@6 resolves dayjs ^1.11.11
# (→ 1.11.19) while @lowdefy/blocks-antd pins dayjs 1.11.20 exactly, so pnpm
# installs two physical copies. blocks-antd calls dayjs.extend(utc) on its own
# copy, but antd builds the DatePicker's calendar-cell date objects with its
# copy; dayjs(cellDate) clones same-family instances, so blocks-antd's
# disabledDate closure gets an antd-copy clone that never had utc extended —
# "dayjs(...).utc is not a function" the moment a date picker opens. Deduping to
# one copy (satisfies both ranges) makes the utc plugin registration shared.
overrides:
  dayjs: 1.11.20

# AgentChat carries three fixes the reporting chat depends on: it keys useChat by
# conversationId (without it useChat captures the transport at mount, so switching
# conversations persists the continued chat under the mount-time id); it adds a
# controlled composer with a `setInput` method (so starters can fill it); and it
# lets the `welcome` config render two tracks in-flow inside the message scroll
# area (so the empty state scrolls up with the transcript instead of vanishing).
#
# ai-utils passes generateMessageId when it builds the agent's UI message stream.
# The AI SDK only ids the assistant message it hands the stream-level onFinish
# when the caller supplies a generator — without it every assistant message an
# onFinish hook persists carries id: "", so a saved transcript has them all
# sharing one id, and AgentChat (which keys its bubbles by message id) renders
# the last reply in every assistant bubble on reload.
#
# Both keys are deliberately version-less: a pinned version is silently dropped
# by a version bump, where an unmatched patch fails the install loudly.
patchedDependencies:
  "@lowdefy/ai-utils": patches/@lowdefy__ai-utils.patch
  "@lowdefy/blocks-aggrid": patches/@lowdefy__blocks-aggrid.patch
  "@lowdefy/blocks-antd-x": patches/@lowdefy__blocks-antd-x.patch

# These keys live here, not under a "pnpm" key in package.json: pnpm 10+ no
# longer reads that key and silently ignores it — it only warns. A dropped
# patchedDependencies is invisible and undoes the AgentChat fix above on the
# next fresh install.
packageExtensions:
  "@lowdefy/client":
    dependencies:
      antd: "6.3.1"

# pnpm 11 replaced onlyBuiltDependencies/ignoredBuiltDependencies with allowBuilds
# (package -> boolean) and fails install on any un-reviewed build script.
# mongodb-memory-server needs its postinstall; @swc/core and sharp ship prebuilt
# binaries via optional deps, so their install scripts are intentionally skipped.
allowBuilds:
  mongodb-memory-server: true
  "@swc/core": false
  sharp: false
  # @sentry/cli (pulled in via the lowdefy 5.5.x server's @sentry/nextjs) ships a
  # prebuilt binary; its postinstall download is not needed for the build.
  "@sentry/cli": false

minimumReleaseAgeExclude:
  - "@lowdefy/actions-core@5.5.1"
  - "@lowdefy/ai-utils@5.5.1"
  - "@lowdefy/ajv@5.5.1"
  - "@lowdefy/api@5.5.1"
