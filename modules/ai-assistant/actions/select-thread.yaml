# select-thread.yaml — open a thread from the list: switch to it, load its stored
# messages, and flip back to the chat view.
#
# ONE click opens. Reads the key/label off the EVENT rather than the selection
# state, so this never depends on whether the ListSelector has committed its own
# selection write before the click handler runs.
- id: ai_set_active_thread
  type: SetState
  params:
    ai_conversation_id:
      _event: item.key
    ai_messages: []
    ai_title:
      _if_none:
        - _event: item.label
        - New chat

- id: ai_load_thread_messages
  type: CallAPI
  params:
    endpointId:
      _module.endpointId: get-thread
    payload:
      conversationId:
        _state: ai_conversation_id

- id: ai_apply_thread_messages
  type: SetState
  params:
    ai_messages:
      _if_none:
        - _actions: ai_load_thread_messages.response.response.messages
        - []
    ai_view: chat
