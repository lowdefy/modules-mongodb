# select-thread.yaml — open a thread from the list: load its stored messages
# FIRST, then commit the switch in one step, and flip back to the chat view.
#
# Load-then-commit, not commit-then-load: committing the id with empty messages
# first meant a transiently failed fetch left the switched thread active and
# empty, and the next send overwrote the thread's entire stored history via
# save-thread's full $set. Loading first, a failed fetch aborts the chain with
# the previously open thread still intact.
#
# ONE click opens. Reads the key/label off the EVENT rather than the selection
# state, so this never depends on whether the ListSelector has committed its own
# selection write before the click handler runs.
- id: ai_load_thread_messages
  type: CallAPI
  params:
    endpointId:
      _module.endpointId: get-thread
    payload:
      conversationId:
        _event: item.key

- id: ai_set_active_thread
  type: SetState
  params:
    ai_conversation_id:
      _event: item.key
    ai_messages:
      _if_none:
        - _actions: ai_load_thread_messages.response.response.messages
        - []
    ai_title:
      _if_none:
        - _event: item.label
        - New chat
    ai_view: chat
