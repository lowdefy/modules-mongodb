# stash-provisional-title.yaml — the instantly-shown thread name, derived from the first
# user message. Used on both save paths (send and reply-complete), so a thread persisted
# before its answer arrives is still named after the question rather than "New chat".
#
# Keeps a real title already on the thread — saved, typed by the user, or generated — so
# re-deriving never clobbers it. Reads `ai_title`, not the list, which lacks a thread minted by
# `enter` or by delete until its first save. `ai_title_provisional` is always the derived name, so
# titling can tell a typed name from it.
id: ai_stash_provisional_title
type: SetState
params:
  ai_title:
    _js:
      fn: |
        const current = state('ai_title') || null;
        if (current && current !== 'New chat') return current;
        return args.derived || current || 'New chat';
      args:
        derived: &derived
          _js:
            fn: |
              const msgs = event('messages') || [];
              const firstUser = msgs.find((m) => m.role === 'user');
              let text = '';
              if (firstUser) {
                text = (firstUser.parts || [])
                  .filter((p) => p.type === 'text')
                  .map((p) => p.text)
                  .join(' ');
                if (!text && typeof firstUser.content === 'string') text = firstUser.content;
              }
              text = (text || '').replace(/\s+/g, ' ').trim();
              if (!text) return null;
              return text.length > 48 ? text.slice(0, 48).trim() + '…' : text;
            args: {}
  ai_title_provisional:
    _if_none:
      - *derived
      - New chat
