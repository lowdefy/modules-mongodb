id: save-thread
type: Api
description: >
  Upserts a thread from the chat block: its messages, and on the first save its
  title, scope and tags. The chat calls it when a message is sent, when the reply
  completes and after a message is deleted. The agent's onFinish hook
  (save-thread-on-finish) also writes the reply, for a browser that left the page
  before it landed, so the history is merged with the stored one rather than
  replacing it: a stored message the browser never held is kept.

  Private per user: user_id comes from the session, never the payload.
payloadSchema:
  type: object
  required:
    - conversationId
    - messages
  additionalProperties: false
  properties:
    conversationId:
      type: string
      minLength: 1
    messages:
      type: array
      items:
        type: object
      description: Full UIMessage history (user + assistant) from the chat block.
    known_ids:
      type: array
      items:
        type: string
      description: >-
        Ids of every message the browser has held on this thread. A stored
        message among them that `messages` leaves out was removed on purpose and
        is dropped. Left out, the stored history is replaced by `messages`.
    title:
      type: string
      maxLength: 120
    scope:
      type: string
      description: Partition key — threads are listed per (scope, user).
    tag:
      # Null when the `tag` var is left at its default.
      type:
        - string
        - "null"
      description: Display label accumulated onto the thread as a chip.
routine:
  - _ref: api/routines/require_user.yaml
  # Every writer comes through here — the chat persists on send as well as on completion — so
  # an unreplayable history is filtered once, at the write, rather than at each call site.
  - :set_state:
      raw_messages:
        _payload: messages
      known_ids:
        _payload: known_ids
  - _ref: api/routines/sanitize_messages.yaml
  - id: load_stored_messages
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: ai_assistant_threads
    properties:
      query:
        conversationId:
          _payload: conversationId
        user_id:
          _user: id
      options:
        projection:
          _id: 0
          messages: 1
  - :set_state:
      stored_messages:
        _if_none:
          - _step: load_stored_messages.messages
          - []
      merge_prefer: sent
  - :set_state:
      removed_ids:
        _js: |
          const stored = (state('stored_messages') || []).map((message) => message.id);
          const known = state('known_ids');
          if (!Array.isArray(known)) return stored;
          const sent = new Set((state('replayable_messages') || []).map((message) => message.id));
          const knownSet = new Set(known);
          return stored.filter((id) => knownSet.has(id) && !sent.has(id));
  - _ref: api/routines/merge_messages.yaml
  - id: upsert_thread
    type: MongoDBUpdateOne
    connectionId:
      _module.connectionId: ai_assistant_threads
    properties:
      filter:
        conversationId:
          _payload: conversationId
        # In the filter as well as the $set: without it, knowing a
        # conversationId would be enough to overwrite somebody else's thread.
        user_id:
          _user: id
      update:
        $set:
          messages:
            _state: merged_messages
          scope:
            _payload: scope
          user_id:
            _user: id
          page_id:
            _module.var: page_id
          updated:
            _date: now
          # Sending in a thread makes it the active one too, and this is where a freshly
          # minted thread first gets a row at all — without it a new chat would not be
          # resumable until the user happened to re-open it.
          last_opened:
            _date: now
        # Every label the thread has touched, as a set — one entry however many
        # messages happened on it. Read back as the thread card's chips.
        # $each with an empty list when no tag was sent: a bare $addToSet of the
        # null payload stored tags [null] for every consumer that leaves the tag
        # var unset, which rendered as an empty chip on every thread card.
        $addToSet:
          tags:
            $each:
              _if:
                test:
                  _eq:
                    - _if_none:
                        - _payload: tag
                        - null
                    - null
                then: []
                else:
                  - _payload: tag
        $setOnInsert:
          created:
            _date: now
          # Named once, when the row is created: after that rename-thread and title-thread own
          # it, so a save from a tab holding an older name cannot put that name back.
          title:
            _payload: title
          # Initialised so live threads have one shape — see
          # docs/shared/soft-delete.md. Deliberately NOT in the filter above:
          # this is an upsert, and $exists is not an equality clause, so a
          # no-match would mint a SECOND row under the same conversationId
          # rather than skipping the write. An in-flight save landing after a
          # delete therefore rewrites the deleted row's messages, but leaves the
          # stamp intact, so it stays filtered out of every read.
          deleted: null
      options:
        upsert: true
  - :return:
      saved: true
