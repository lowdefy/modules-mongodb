id: delete-thread
type: Api
description: >
  Deletes a thread. Ownership-scoped to the session user.

  The row stays as a `deleted` change stamp (docs/shared/soft-delete.md), so
  every read filters it out and the stamp records who deleted it and when. Its
  text goes in the same write: the messages and the title are cleared, because
  the shell tells the user the chat is deleted. The stub is removed by the TTL
  index on `created`. save-thread and save-thread-on-finish skip a deleted row,
  so a reply finishing after the delete cannot write the text back.

payloadSchema:
  type: object
  required:
    - conversationId
  additionalProperties: false
  properties:
    conversationId:
      type: string
routine:
  - _ref: api/routines/require_user.yaml
  - id: delete
    type: MongoDBUpdateOne
    connectionId:
      _module.connectionId: ai_assistant_threads
    properties:
      # Required, not tidy-up: MongoDBUpdateOne throws on a zero match where the
      # MongoDBDeleteOne this replaced did not. Two zero matches are normal here
      # — a thread minted client-side has no row until its first message is
      # saved, and the filter below excludes already-deleted threads so a repeat
      # delete cannot overwrite the original stamp's who/when.
      disableNoMatchError: true
      filter:
        conversationId:
          _payload: conversationId
        user_id:
          _user: id
        deleted.timestamp:
          $exists: false
      update:
        $set:
          deleted:
            _ref: defaults/change_stamp.yaml
        $unset:
          messages: ""
          title: ""
  - :return:
      conversationId:
        _payload: conversationId
      deleted: true
