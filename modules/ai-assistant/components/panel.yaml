# panel.yaml — the docked assistant: an Intercom-style corner launcher and the
# floating panel it opens (FloatingPanel, from @lowdefy/modules-mongodb-plugins).
#
# Not a Drawer. A drawer masks or reflows the page, and even unmasked it leaves a
# full-height slab down one side, covering whatever the user wanted to look at
# while asking about it. This panel's wrapper is pointer-events:none, so the page
# behind stays fully clickable — and because shared_state is read per message
# send, the assistant follows whatever the user selects while it is open.
#
# Closing HIDES rather than unmounts (the block keeps children mounted after the
# first open), so scroll position, a half-typed message and an in-flight reply
# all survive being minimised — which is what makes it a side-channel rather than
# a modal you have to commit to.
#
# Layout, top to bottom:
#   header  — identity + New chat / Manage chats + expand / close  (fixed)
#   toolbar — the open thread's name, editable, + delete           (fixed)
#   body    — the conversation, or the thread list                 (scrolls)
id: ai_panel
type: FloatingPanel
visible:
  _module.var: visible
properties:
  title:
    _module.var: panel_title
  subtitle:
    _module.var: panel_subtitle
  avatar:
    icon:
      _module.var: panel_avatar_icon
  launcher:
    icon:
      _module.var: panel_launcher_icon
    label:
      _module.var: panel_launcher_label
    ariaLabel:
      _module.var: panel_launcher_aria_label
  width:
    _module.var: panel_width
  expandedWidth:
    _module.var: panel_expanded_width
  height:
    _module.var: panel_height
  placement:
    _module.var: panel_placement
events:
  # try/catch so a rejected thread fetch still clears ai_loading — otherwise the
  # chain aborts mid-way and the panel spins forever. On failure the user lands
  # on the freshly minted blank thread, which is usable.
  onOpen:
    try:
      # Both elements are action LISTS, so concat splices them into one chain — enter.yaml
      # is a list, not a single action. Consumer actions run after the resume and inside
      # the try: they read the thread `enter` just resolved, and a rejection there has to
      # clear ai_loading like any other or the panel spins forever.
      _build.array.concat:
        - _ref: actions/enter.yaml
        - _module.var: on_panel_open
    catch:
      - id: ai_end_loading_on_error
        type: SetState
        params:
          ai_loading: false
  onClose:
    - id: ai_reset_view
      type: SetState
      params:
        ai_view: chat
        ai_thread_selection: null

slots:
  _build.object.assign:
    - _ref: components/panel_slots.yaml
    # The footer slot is left out entirely when off: its presence alone draws the bar.
    - _build.if:
        test:
          _module.var: screenshot
        then:
          footer:
            blocks:
              - _ref: components/screenshot.yaml
        else: {}
