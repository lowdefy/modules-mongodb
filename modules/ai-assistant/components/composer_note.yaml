# composer_note.yaml — a short fixed note under the composer: the `composer_note` var, or the
# module's default notice while it is null (../shared/chat_composer_note.yaml). `false` hides it.
# It shows with the conversation only, not the thread list.
#
# vars:
#   id     — both shells mount this, so each passes its own (see notice.yaml).
#   height — a fixed height inside the panel, whose chat subtracts it to keep the composer in
#            view; null in the embedded shell, where the page grows to fit.
id:
  _var: id
type: Paragraph
visible:
  _and:
    - _ne:
        - _state: ai_view
        - threads
    - _eq:
        - _module.var: notice
        - null
    - _ne:
        - _module.var: composer_note
        - false
style:
  .element:
    margin: 0
    fontSize: 12px
    lineHeight: 1.4
    height:
      _var:
        key: height
        default: null
    overflow: hidden
properties:
  type: secondary
  content:
    _ref: ../shared/chat_composer_note.yaml
