# reply_pending.yaml — the open thread, as loaded, ends on the user's message: the agent was
# still answering when the chat that sent it went away, and its onFinish hook stores the reply on
# the server when it finishes. A slim status row says so in place of an empty answer, with a
# Check again that loads the thread once more.
#
# AgentChat has no slot inside its message list, so the row sits outside the chat, and keeps to
# one line so the chat below it keeps its composer in view.
#
# The id is passed in so each shell names its own, as notice.yaml's is.
id:
  _var: id
type: Box
visible:
  _and:
    - _ne:
        - _state: ai_view
        - threads
    - _eq:
        - _module.var: notice
        - null
    - _eq:
        - _state: ai_reply_pending
        - true
    - _ne:
        - _state: ai_loading
        - true
layout:
  direction: row
  align: middle
  gap: 8
style:
  margin: 4px 0 8px
  padding: 4px 4px 4px 12px
  borderRadius: 8px
  background: var(--ant-color-fill-quaternary)
blocks:
  - id:
      _build.string.concat:
        - _var: id
        - _spinner
    type: Spinner
    layout:
      flex: 0 0 auto
    properties:
      size: 14
  - id:
      _build.string.concat:
        - _var: id
        - _text
    type: Paragraph
    layout:
      flex: 1 1 auto
    style:
      .element:
        margin: 0
        fontSize: 13px
    properties:
      type: secondary
      content: The assistant is still replying.
  - id:
      _build.string.concat:
        - _var: id
        - _check_again
    type: Button
    layout:
      flex: 0 0 auto
    properties:
      title: Check again
      color: primary
      variant: link
      size: small
      icon: refresh
    events:
      onClick:
        _ref:
          path: actions/refresh-thread.yaml
          vars:
            id:
              _build.string.concat:
                - _var: id
                - _refresh
