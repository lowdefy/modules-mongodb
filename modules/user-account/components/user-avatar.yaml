id: user_avatar
type: Box
layout:
  gap: 8
  contentAlign: center
blocks:
  - id: avatar
    type: Avatar
    properties:
      src:
        _var: user.profile.picture
      # Empty-picture fallback: the Avatar block's built-in icon. This is what an
      # invitee who has not onboarded renders as — the write seams store no
      # `profile.picture` for a profile with no name, because initials in a gradient
      # circle would claim an identity that hasn't been supplied yet.
      icon: AiOutlineUser
  - id: name
    type: Title
    visible:
      _var:
        key: show_name
        default: true
    properties:
      level: 5
      content:
        _var: user.profile.name
