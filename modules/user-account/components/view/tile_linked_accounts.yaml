# Linked accounts tile (design Decision 5): read-only visibility of the sign-in
# methods linked to the caller's account, from a native read over user-accounts
# (the same read that feeds the Security tile's credential-presence gate). This is
# visibility, not management. Link/unlink flows are a v1 non-goal.
_ref:
  module: layout
  component: card
  vars:
    id: tile_linked_accounts
    title: Linked accounts
    blocks:
      - id: linked_accounts_body
        type: Box
        layout:
          gap: 12
        blocks:
          # Rows sit flush in the tile card, and the last row drops its rule so it
          # does not double up with the hint that follows.
          - id: linked_accounts_list
            type: Html
            properties:
              html:
                _nunjucks:
                  # The caller's linked accounts (get_accounts.accounts: one row
                  # per user-accounts doc, incl. the built-in `credential` row
                  # rendered as "Email & password"). Read-only visibility, not
                  # management (Decision 5). provider_id → friendly label / detail.
                  template: |
                    <div style="display:flex; flex-direction:column;">
                    {% for item in accounts %}
                      <div id="bl-{{ loop.index0 }}.linked_account_item" style="display:flex; align-items:center; gap:12px; padding:12px 0; font-size:13px;{% if not loop.last %} border-bottom:1px solid var(--ant-color-border-secondary);{% endif %}">
                        <span style="flex:1 1 auto; min-width:0;">
                          <div style="color:var(--ant-color-text); text-transform:capitalize;">{% if item.provider_id == 'credential' %}Email &amp; password{% else %}{{ item.provider_id }}{% endif %}</div>
                          <div style="color:var(--ant-color-text-tertiary); font-size:12px;">{% if item.provider_id == 'credential' %}Primary sign-in{% else %}{{ item.account_id }}{% endif %}</div>
                        </span>
                        <span style="flex:0 0 auto; padding:0 8px; border-radius:4px; font-size:12px; line-height:20px; background:var(--ant-color-success-bg); border:1px solid var(--ant-color-success-border); color:var(--ant-color-success-text);">Connected</span>
                      </div>
                    {% else %}
                      <div style="color:var(--ant-color-text-tertiary); font-size:13px;">No linked accounts.</div>
                    {% endfor %}
                    </div>
                  on:
                    accounts:
                      _request: get_accounts.0.accounts
          - id: linked_accounts_hint
            type: Html
            properties:
              html: '<div style="font-size:12px; color:var(--ant-color-text-tertiary);">Accounts you can use to sign in.</div>'
