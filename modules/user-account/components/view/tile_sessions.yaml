# Active sessions tile (design Decision 5): the caller's own signed-in devices,
# from a native read over user-sessions (token projected out: it's a bearer
# credential). One action: "Sign out others" (RevokeOtherSessions). Per-session
# revoke is deferred (token-exposure, Decision 5), so rows are display-only, and
# there is no "current device" marker (no non-secret current-session id is
# available without the token).
_ref:
  module: layout
  component: card
  vars:
    id: tile_sessions
    title: Active sessions
    header_buttons:
      - id: sessions_sign_out_others_btn
        type: Button
        layout:
          flex: 0 0 auto
        # Only offer the action when there is more than one session to revoke.
        visible:
          _gt:
            - _array.length:
                _if_none:
                  - _request: get_sessions
                  - []
            - 1
        properties:
          title: Sign out other sessions
          size: small
          color: danger
          variant: outlined
        events:
          onClick:
            # Revokes every session except the caller's current one, then
            # re-fetches so the list drops the revoked rows.
            _build.array.concat:
              - - id: revoke_other_sessions
                  type: RevokeOtherSessions
                  messages:
                    loading: Signing out other sessions…
                    success: Signed out your other sessions.
              - _ref: actions/refetch_account.yaml
    blocks:
      - id: sessions_body
        type: Box
        layout:
          gap: 12
        blocks:
          - _ref:
              path: ../shared/sessions/session_list.yaml
              vars:
                request: get_sessions
          - id: sessions_hint
            type: Html
            properties:
              # The second sentence references the "Sign out other sessions"
              # button, which only renders with more than one session (same gate
              # as the button); with a single session it would name a control the
              # user can't see, so it's dropped.
              html:
                _nunjucks:
                  template: '<div style="font-size:12px; color:var(--ant-color-text-tertiary);">Devices currently signed in to your account.{% if multi %} "Sign out other sessions" ends every session except this one.{% endif %}</div>'
                  on:
                    multi:
                      _gt:
                        - _array.length:
                            _if_none:
                              - _request: get_sessions
                              - []
                        - 1
