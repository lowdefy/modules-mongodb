# Two-factor enrolment modal (design Decision 5). One modal, four phases and three
# intents, both held as explicit values in state:
#   state.enroltotp.phase: choose | password | scan | codes; the only gate on every block
#   state.enroltotp.intent: enrol | replace | codes_only; drives the wording and which chain
#
# An enrolled caller opens on `choose` (intent null) and picks a path there;
# `codes_only` rotates recovery codes without touching the authenticator, so it
# skips `scan` and jumps from `password` straight to `codes`. A first-time caller
# opens straight on `password` with intent `enrol`.
#
# Both are seeded by the trigger (tile_security.yaml) BEFORE the dialog mounts:
# `onOpen` fires after the modal has painted, so a seed there would show an empty
# body (no group gates on a null phase) on the first open of a session.
#
# There is no native footer. The footer Ok auto-closes on success, which is wrong
# for a multi-step dialog: the password phase must not close and the scan phase
# must advance rather than exit. Each phase owns its own body button instead, so
# exactly one primary action is offered at a time; a Button already disables
# itself and spins while its onClick chain runs.
#
# `intent: replace` turns 2FA off before re-enrolling. BetterAuth's
# `POST /two-factor/enable` deletes the caller's twoFactor row and writes a new
# one with a fresh secret, carrying `verified: true` over from a verified row and
# never touching `user.two_factor_enabled`, which is what the sign-in hook gates
# the second-factor challenge on. Enabling straight over a working authenticator
# would therefore enforce a second factor against a secret the user has not
# scanned, and abandoning there locks them out with no admin 2FA reset anywhere
# in the suite. Disabling first makes replacement a first-time enrolment: abandon
# it and 2FA is simply off, and the user can set up again from here.
id: modal_enroltotp
type: Modal
layout:
  gap: 16
properties:
  # The default branch is load-bearing, not defensive: Modal passes `title`
  # straight through to antd, so a null title renders an unlabelled header.
  title:
    _switch:
      branches:
        - if:
            _eq:
              - _state: enroltotp.intent
              - enrol
          then: Set up two-factor authentication
        - if:
            _eq:
              - _state: enroltotp.intent
              - replace
          then: Replace your authenticator
        - if:
            _eq:
              - _state: enroltotp.intent
              - codes_only
          then: New backup codes
      default: Two-factor authentication
  width: 560
  footer: false
  # A stray click on the mask must not discard the one-time backup codes.
  maskClosable: false
events:
  # Every close path (the X, Esc, a mask click) routes here. Each leaf is nulled
  # by name. An `enroltotp: {}` write leaves the leaves undefined, and an input
  # that was invisible in the previous eval cycle then restores its remembered
  # value instead of clearing. Booleans reset to false, their boolean zero.
  onClose:
    - id: reset_enroltotp
      type: SetState
      params:
        enroltotp.phase: null
        enroltotp.intent: null
        enroltotp.password: null
        enroltotp.uri: null
        enroltotp.confirmation_code: null
        enroltotp.backup_codes: null
        enroltotp.codes_saved: false
        enroltotp.twofa_off: false
blocks:
  # ── Phase `choose` ── An enrolled caller lands here (intent null). No inputs
  # and no request runs; each button just seeds `phase: password` plus its intent.
  # The safe, common path (new codes) is primary; replacement is secondary with
  # its cost stated as a plain hint. The red replacement Alert deliberately does
  # NOT appear here. Next to "Get new backup codes" it would make the harmless
  # path look dangerous; it lives on phase `password` where the destructive call
  # is about to fire.
  - id: enroltotp_choose_intro
    type: Html
    visible:
      _eq:
        - _state: enroltotp.phase
        - choose
    layout:
      span: 24
    properties:
      html: '<div style="font-size:13.5px; color:var(--ant-color-text-secondary);">Get a new set of backup codes without changing your authenticator.</div>'
  - id: enroltotp_choose_codes_btn
    type: Button
    visible:
      _eq:
        - _state: enroltotp.phase
        - choose
    layout:
      span: 24
    properties:
      title: Get new backup codes
      block: true
      color: primary
      variant: solid
    events:
      onClick:
        - id: choose_codes_only
          type: SetState
          params:
            enroltotp.phase: password
            enroltotp.intent: codes_only
  - id: enroltotp_choose_replace
    type: Box
    visible:
      _eq:
        - _state: enroltotp.phase
        - choose
    layout:
      span: 24
      gap: 6
    blocks:
      - id: enroltotp_choose_replace_btn
        type: Button
        layout:
          span: 24
        properties:
          title: Replace authenticator
          block: true
          variant: outlined
        events:
          onClick:
            - id: choose_replace
              type: SetState
              params:
                enroltotp.phase: password
                enroltotp.intent: replace
      - id: enroltotp_choose_replace_hint
        type: Html
        layout:
          span: 24
        properties:
          html: '<div style="font-size:12px; color:var(--ant-color-text-tertiary);">Sets up a new authenticator app. Your current one stops working.</div>'
  # ── Phase `password` ──
  - id: enroltotp_intro_setup
    type: Html
    visible:
      _eq:
        - _state: enroltotp.phase
        - password
    layout:
      span: 24
    properties:
      # `codes_only` never touches the secret, so the enrol/replace wording
      # ("generate a new authenticator secret") would misdescribe it. The default
      # branch keeps enrol and replace exactly as they were.
      html:
        _switch:
          branches:
            - if:
                _eq:
                  - _state: enroltotp.intent
                  - codes_only
              then: '<div style="font-size:13.5px; color:var(--ant-color-text-secondary);">Enter your account password to get a new set of backup codes.</div>'
          default: '<div style="font-size:13.5px; color:var(--ant-color-text-secondary);">Enter your account password to generate a new authenticator secret.</div>'
  - id: enroltotp_replace_warning
    type: Alert
    visible:
      _and:
        - _eq:
            - _state: enroltotp.phase
            - password
        - _eq:
            - _state: enroltotp.intent
            - replace
    layout:
      span: 24
    properties:
      type: warning
      showIcon: true
      message: Your current authenticator stops working now.
      description: Two-factor turns off while you set up the new authenticator, and back on once you enter a code from it. If you stop partway, it stays off and you can start again here.
  - id: enroltotp.password
    type: PasswordInput
    visible:
      _eq:
        - _state: enroltotp.phase
        - password
    required: true
    layout:
      span: 24
    properties:
      label:
        title: Account password
        span: 24
        colon: false
  - id: enroltotp_generate
    type: Button
    visible:
      _and:
        - _eq:
            - _state: enroltotp.phase
            - password
        - _eq:
            - _state: enroltotp.intent
            - enrol
    layout:
      span: 24
    properties:
      title: Generate QR code
      block: true
      color: primary
      variant: solid
    events:
      onClick:
        try:
          # Validate names the input, not the modal: Validate's params is an
          # exact-id matcher with no cascade to descendants. Without it an empty
          # password round-trips to BetterAuth and comes back as the catch-all
          # toast, telling the user their password is wrong when they left it
          # blank and marking no field.
          - id: validate_enrol_password
            type: Validate
            params:
              blockIds:
                - enroltotp.password
          # Password-gated enable: returns the totpURI + backup codes on
          # _actions, stashed in state for the QR and phase `codes`.
          - id: enroltotp_enable
            type: TwoFactorEnable
            messages:
              error: false
            params:
              password:
                _state: enroltotp.password
          - id: stash_totp
            type: SetState
            params:
              enroltotp.phase: scan
              enroltotp.uri:
                _actions: enroltotp_enable.response.totpURI
              enroltotp.backup_codes:
                _actions: enroltotp_enable.response.backupCodes
              enroltotp.password: null
        catch:
          - id: enroltotp_enable_error
            type: DisplayMessage
            params:
              status: error
              content: Couldn't start two-factor setup. Check your password and try again.
  - id: enroltotp_replace_btn
    type: Button
    visible:
      _and:
        - _eq:
            - _state: enroltotp.phase
            - password
        - _eq:
            - _state: enroltotp.intent
            - replace
    layout:
      span: 24
    properties:
      title: Replace authenticator
      block: true
      color: primary
      variant: solid
    events:
      onClick:
        try:
          _build.array.concat:
            - - id: validate_replace_password
                type: Validate
                params:
                  blockIds:
                    - enroltotp.password
              # Disable needs an authoritative session and rotates the session
              # cookie; enable takes plain sessionMiddleware, so it runs on the
              # cookie this call sets.
              - id: enroltotp_replace_disable
                type: TwoFactorDisable
                messages:
                  error: false
                params:
                  password:
                    _state: enroltotp.password
              - id: mark_twofa_off
                type: SetState
                params:
                  enroltotp.twofa_off: true
            # Keeps the tile honest if the enable below throws: the event runner
            # has no `finally`, so without a refetch here a thrown enable would
            # leave the tile reading On while 2FA is genuinely off. Omitted under
            # `required`, where this Lowdefy request is itself gated on enrolment
            # and would throw mid-rotation — the caller is transiently unenrolled
            # between disable and enable — aborting the chain before the re-enable;
            # there the post-verify refetch restores the tile once enrolment completes.
            - _build.if:
                test:
                  _build.authConfig: twoFactor.required
                then: []
                else:
                  _ref: actions/refetch_account.yaml
            - - id: enroltotp_replace_enable
                type: TwoFactorEnable
                messages:
                  error: false
                params:
                  password:
                    _state: enroltotp.password
              - id: stash_replace_totp
                type: SetState
                params:
                  enroltotp.phase: scan
                  enroltotp.uri:
                    _actions: enroltotp_replace_enable.response.totpURI
                  enroltotp.backup_codes:
                    _actions: enroltotp_replace_enable.response.backupCodes
                  enroltotp.password: null
        catch:
          # `twofa_off` is an explicit flag, not an inference from the _actions
          # response shape: a failed action records {error, action, index} and a
          # successful one {type, response, index}, so `_not: <disable>.error` is
          # also true when the Validate failed and the disable never ran, the
          # most common way into this catch.
          - :if:
              _state: enroltotp.twofa_off
            :then:
              # The credential was spent, so clear it. A wrong password lands on
              # the else branch, where the field the user is about to correct
              # must survive.
              - id: clear_spent_password
                type: SetState
                params:
                  enroltotp.password: null
              - id: enroltotp_replace_off_error
                type: DisplayMessage
                params:
                  status: error
                  content: Two-factor is now off. Try again to finish setting up your new authenticator.
            :else:
              - id: enroltotp_replace_error
                type: DisplayMessage
                params:
                  status: error
                  content: Couldn't start two-factor setup. Check your password and try again.
  - id: enroltotp_getcodes
    type: Button
    visible:
      _and:
        - _eq:
            - _state: enroltotp.phase
            - password
        - _eq:
            - _state: enroltotp.intent
            - codes_only
    layout:
      span: 24
    properties:
      title: Get new codes
      block: true
      color: primary
      variant: solid
    events:
      onClick:
        try:
          - id: validate_getcodes_password
            type: Validate
            params:
              blockIds:
                - enroltotp.password
          # Rotates recovery codes only. Returns the new codes on _actions, and
          # leaves the secret, `verified` and `two_factor_enabled` untouched. It
          # jumps straight to phase `codes`, skipping `scan`: nothing about the
          # authenticator changed, so there is nothing to re-scan. No
          # `refetch_account`: the tile still reads On and nothing it shows moved,
          # so a refetch would be a request that can only fail.
          - id: enroltotp_generate_codes
            type: TwoFactorGenerateBackupCodes
            messages:
              error: false
            params:
              password:
                _state: enroltotp.password
          - id: stash_new_codes
            type: SetState
            params:
              enroltotp.phase: codes
              enroltotp.backup_codes:
                _actions: enroltotp_generate_codes.response.backupCodes
              enroltotp.password: null
        catch:
          - id: enroltotp_getcodes_error
            type: DisplayMessage
            params:
              status: error
              content: Couldn't generate new backup codes. Check your password and try again.
  # Back returns to `choose`, shown only when the caller arrived through it
  # (`replace` or `codes_only`). With `footer: false` there is no Cancel, so
  # without Back a user who reads the replacement warning and reconsiders would
  # have to dismiss the whole dialog. Nothing is spent yet. This is
  # reconsideration, not data loss.
  - id: enroltotp_back_btn
    type: Button
    visible:
      _and:
        - _eq:
            - _state: enroltotp.phase
            - password
        - _or:
            - _eq:
                - _state: enroltotp.intent
                - replace
            - _eq:
                - _state: enroltotp.intent
                - codes_only
    layout:
      span: 24
    properties:
      title: Back
      block: true
      variant: text
    events:
      onClick:
        - id: back_to_choose
          type: SetState
          params:
            enroltotp.phase: choose
            enroltotp.intent: null
            enroltotp.password: null
  # ── Phase `scan` ──
  - id: enroltotp_intro_scan
    type: Html
    visible:
      _eq:
        - _state: enroltotp.phase
        - scan
    layout:
      span: 24
    properties:
      html: '<div style="font-size:13.5px; color:var(--ant-color-text-secondary);">Scan this with your authenticator app, then enter the 6-digit code to confirm.</div>'
  - id: enroltotp_row
    type: Box
    visible:
      _eq:
        - _state: enroltotp.phase
        - scan
    layout:
      direction: row
      gap: 16
      align: top
      selfAlign: top
    blocks:
      - id: enroltotp_qr
        type: QRCode
        layout:
          span: 8
          sm:
            span: 24
        properties:
          value:
            _state: enroltotp.uri
          size: 132
          errorLevel: M
      - id: enroltotp_scancol
        type: Box
        layout:
          span: 16
          sm:
            span: 24
          gap: 16
        blocks:
          - id: enroltotp_manual_key_label
            type: Label
            layout:
              span: 24
            properties:
              title: Can't scan? Enter this key
              span: 24
              colon: false
            blocks:
              # A copyable Paragraph, not a disabled TextInput: browsers do not
              # allow text selection inside a disabled input, and TextInput has
              # no read-only-but-selectable option. The 52-char secret is rendered
              # as 4-char monospace pills that wrap within the modal, so it reads
              # and hand-transcribes cleanly; `copyable.text` copies the raw
              # ungrouped secret for an authenticator's manual-entry field.
              - id: enroltotp_manual_key
                type: Paragraph
                properties:
                  # An authenticator's manual-entry field wants the base32
                  # secret; the full otpauth:// URI generally fails there. The
                  # operator form of this needs nested _string.split plus array
                  # indexing to reach one query param.
                  content:
                    _js: |
                      const uri = state('enroltotp.uri');
                      if (!uri) return null;
                      const secret = new URLSearchParams(uri.split('?')[1] || '').get('secret');
                      if (!secret) return null;
                      const style = 'display:inline-block; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; letter-spacing:0.08em; padding:4px 9px; margin:0 6px 6px 0; background:var(--ant-color-fill-quaternary); border:1px solid var(--ant-color-border-secondary); border-radius:6px;';
                      return secret.match(/.{1,4}/g).map((c) => `<span style="${style}">${c}</span>`).join('');
                  copyable:
                    text:
                      _js: |
                        const uri = state('enroltotp.uri');
                        if (!uri) return null;
                        return new URLSearchParams(uri.split('?')[1] || '').get('secret');
          - id: enroltotp.confirmation_code
            type: TextInput
            required: true
            layout:
              span: 24
            properties:
              placeholder: 6-digit code
              label:
                title: Confirmation code
                span: 24
            events:
              # Enter runs the identical chain as the Confirm button.
              onPressEnter:
                _ref: actions/confirm_enroltotp_modal.yaml
  - id: enroltotp_confirm
    type: Button
    visible:
      _eq:
        - _state: enroltotp.phase
        - scan
    layout:
      span: 24
    properties:
      title: Confirm and enable
      block: true
      color: primary
      variant: solid
    events:
      onClick:
        _ref: actions/confirm_enroltotp_modal.yaml
  # ── Phase `codes` ── Shown once; the codes are never fetched again.
  - id: backupcodes_message
    type: Html
    visible:
      _eq:
        - _state: enroltotp.phase
        - codes
    layout:
      span: 24
    properties:
      html:
        _nunjucks:
          template: '<div style="font-size:13.5px; color:var(--ant-color-text-secondary);">{{ lead }} Store these backup codes somewhere safe. Each works once if you lose your authenticator.</div>'
          on:
            # A replacing user needs its own lead line: enable recreates the
            # twoFactor row with a fresh backup_codes array, so their previous
            # codes are dead too, and "Two-factor is on" reads as first-time
            # confirmation to someone for whom it already was.
            lead:
              _switch:
                branches:
                  - if:
                      _eq:
                        - _state: enroltotp.intent
                        - enrol
                    then: Two-factor is on.
                  - if:
                      _eq:
                        - _state: enroltotp.intent
                        - replace
                    then: Your new authenticator is active. These backup codes replace your previous set.
                  - if:
                      _eq:
                        - _state: enroltotp.intent
                        - codes_only
                    then: These backup codes replace your previous set.
                default: Two-factor is on.
  - id: backupcodes_grid
    type: Html
    visible:
      _eq:
        - _state: enroltotp.phase
        - codes
    layout:
      span: 24
    properties:
      html:
        _nunjucks:
          template: |
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 4px;">
            {% for code in codes %}
              <span style="font-family:ui-monospace,Menlo,monospace; font-size:13px; background:var(--ant-color-fill-quaternary); border:1px solid var(--ant-color-border-secondary); border-radius:6px; padding:7px 10px; text-align:center; letter-spacing:0.04em;">{{ code }}</span>
            {% endfor %}
            </div>
          on:
            codes:
              _state: enroltotp.backup_codes
  - id: backupcodes_alert
    type: Alert
    visible:
      _eq:
        - _state: enroltotp.phase
        - codes
    layout:
      span: 24
    properties:
      type: warning
      showIcon: true
      message: You won't see these again. Copy them before closing.
  - id: backupcodes_copy_btn
    type: Button
    visible:
      _eq:
        - _state: enroltotp.phase
        - codes
    layout:
      span: 24
    properties:
      title: Copy codes
      block: true
      icon: AiOutlineCopy
      variant: outlined
    events:
      onClick:
        - id: copy_backup_codes
          type: CopyToClipboard
          messages:
            success: Copied
          params:
            copy:
              _array.join:
                - _state: enroltotp.backup_codes
                - "\n"
  # An attention device, not a lock: Esc cannot be blocked, so its only job is
  # to make someone in dismiss-the-dialog mode read one sentence first. Gating
  # Done on the Copy click instead would mandate a clipboard write for a
  # one-time secret and still not evidence saving; people legitimately save
  # these by screenshot, password manager, or on paper.
  - id: enroltotp.codes_saved
    type: CheckboxSwitch
    visible:
      _eq:
        - _state: enroltotp.phase
        - codes
    layout:
      span: 24
    properties:
      description: I've saved my backup codes
      label:
        disabled: true
  - id: backupcodes_done_btn
    type: Button
    visible:
      _eq:
        - _state: enroltotp.phase
        - codes
    layout:
      span: 24
    properties:
      title: Done
      block: true
      color: primary
      variant: solid
      disabled:
        _not:
          _state: enroltotp.codes_saved
    events:
      onClick:
        - id: close_enroltotp
          type: CallMethod
          params:
            blockId: modal_enroltotp
            method: toggleOpen
