id: update-profile
type: Api
# Save the caller's own contact profile and re-denormalize it onto their session
# user, in one routine (Decisions 5 & 6). Built on the shared write-profile
# fragment (change-stamped contact write + UpdateUserProfile re-denorm), wrapped
# with this module's audit event and `request_stages.write` append.
#
# NB: the `_user` refresh (UpdateSession) that makes the header/avatar/menus pick
# up the new profile without a reload is fired by the CONSUMING PAGE after this
# API returns (onboarding / account workspace). UpdateSession is a client
# action and cannot run inside a server routine (Decision 6).
routine:
  _build.array.concat:
    # Baseline required-field guard (deployment-specific required fields are
    # validated client-side by the profile form).
    - - :if:
          _or:
            - _eq:
                - _payload: profile.given_name
                - null
            - _eq:
                - _payload: profile.family_name
                - null
        :then:
          :reject: Missing required profile fields.

    # Profile-photo guard. The AvatarUpload block compresses to ≤ 512 KB
    # client-side, but /api/endpoints callers bypass the client — so the server
    # re-checks. A 512 KB image is ~700 K base64 characters; the cap allows
    # headroom for the data-URI prefix, nothing more. Also refuse a photo that
    # is not an image data URI at all.
    - - :if:
          _and:
            - _ne:
                - _if_none:
                    - _payload: profile.photo
                    - null
                - null
            - _js:
                fn: |
                  const photo = args.photo;
                  return (
                    typeof photo !== 'string' ||
                    !photo.startsWith('data:image/') ||
                    photo.length > 720000
                  );
                args:
                  photo:
                    _payload: profile.photo
        :then:
          :reject: Profile photo must be an image of at most 500 KB.

    # Resolve which contact row is the caller's, from the walled connection:
    # {active organization, caller's email}. The organization half comes from the
    # wall, so the row always belongs to the organization the caller is acting in.
    - _ref:
        path: ../shared/contact/resolve-own-contact.yaml
        vars:
          connection_id:
            _module.connectionId: user-contacts-collection

    # No contact in the active organization is a real, reportable state — reject
    # it here rather than letting a null id reach the write as a no-match update.
    # Coalesce first: a no-match FindOne leaves the step's `_id` undefined, which
    # `_eq: [..., null]` does not catch on its own.
    - - :if:
          _eq:
            - _if_none:
                - _step: resolve_own_contact._id
                - null
            - null
        :then:
          :reject: No contact record for this account in the active organization.

    # Shared write-profile fragment: contact write (change-stamped) + the
    # UpdateUserProfile re-denorm onto the caller's user row. `_ref`'d by
    # relative path, not a manifest export (Decision 8).
    - _ref:
        path: ../shared/contact/write-profile.yaml
        vars:
          connection_id:
            _module.connectionId: user-contacts-collection
          contact_id:
            _step: resolve_own_contact._id
          user_id:
            _user: id
          # The caller's own active organization. The self-target exemption
          # skips the floor's member check, but the step still resolves a
          # target organization first — and under `tenant` an absent one is a
          # runtime error, so the self-service caller names its own.
          organization_id:
            _user: organization_id
          profile:
            _payload: profile
          avatar_colors:
            _module.var: avatar_colors
          write_stages:
            _build.array.concat:
              # Consumer-supplied write-stage extensions.
              - _module.var: request_stages.write
              # Onboarding-completion marker: set only when the caller requests
              # it (the onboarding page passes set_profile_created: true on a
              # successful save, Decision 5). Left untouched otherwise.
              - - $set:
                    profile.profile_created:
                      _if:
                        test:
                          _boolean:
                            _payload: set_profile_created
                        then: true
                        else:
                          $ifNull:
                            - "$profile.profile_created"
                            - "$$REMOVE"

    # Audit event through the events dependency. The template renders against
    # the freshly-written contact (profile.name).
    - - id: new-event
        type: CallApi
        properties:
          endpointId:
            _module.endpointId:
              id: new-event
              module: events
          payload:
            type: update-profile
            display:
              _build.object.fromEntries:
                - - _build.app: slug
                  - title:
                      _nunjucks:
                        template:
                          _if_none:
                            - _module.var: event_display.update-profile
                            - _ref:
                                path: defaults/event_display.yaml
                                key: update-profile
                        on:
                          user:
                            _step: reread_contact
                    description: null
            # T1: the onboarding save is the write that CREATES the caller's
            # name, so the session this event would stamp from doesn't hold one
            # yet ('' on the engine's user row). Pass the actor explicitly from
            # the freshly-written contact in that one case; null otherwise so
            # the plain template stamps as usual. Self-service API — the actor
            # IS the target, so the substitution can never name someone else.
            actor:
              _if:
                test:
                  _or:
                    - _eq:
                        - _if_none:
                            - _user: name
                            - _user: profile.name
                        - null
                    - _eq:
                        - _if_none:
                            - _user: name
                            - _user: profile.name
                        - ""
                then:
                  name:
                    _step: reread_contact.profile.name
                  id:
                    _user: id
                else: null
            references:
              contact_ids:
                - _step: resolve_own_contact._id
      - :return:
          success: true
