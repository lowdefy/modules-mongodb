# Account read (design Decision 5) — the caller's own auth user row joined to
# their contact, the spine of the workspace. Native read over `users` filtered to
# the caller (`_user.id`, a plain string — this deployment stores ids as strings,
# no ObjectId coercion), joined to `user-contacts` on {organizationId,
# lowercase_email} — the contact key. The organization clause is authored here
# because `users` is an unwalled connection and a `$lookup` is never scoped by the
# tenant wall, so an unqualified join would read another organization's row. It is
# policy-conditional (shared fragment): present under `tenant`, absent under
# `pinned`, where contacts carry no organizationId.
# Feeds:
#   profile        — the contact profile subdoc (profile tile display + edit-modal
#                    seed; display reads the contact directly, Decision 5)
#   email          — the login identity, from the auth user row (display only)
#   email_verified — Security-tile verified badge / resend gate
#   two_factor_enabled — Security-tile 2FA on/off state
#   contact_id     — the caller's contact id in the active organization
#   name           — the title-block display name, falling back to the auth user's
#                    own name so a not-yet-onboarded caller still gets a title
#                    (the same chain the members_base stage uses)
# Returns a single-element array; the page binds get_account.0.*.
id: get_account
type: MongoDBAggregation
connectionId:
  _module.connectionId: users
properties:
  pipeline:
    - $match:
        _id:
          _user: id
    - $limit: 1
    - $lookup:
        from: user-contacts
        let:
          caller_id: "$_id"
          caller_email:
            $toLower: "$email"
        pipeline:
          - $match:
              _build.object.assign:
                - _ref:
                    path: ../shared/org/tenant-clause.yaml
                    vars:
                      shape: match
                - $expr:
                    _ref:
                      path: ../shared/contact/contact-match-expr.yaml
                      vars:
                        contact_user_id_expr: "$userId"
                        contact_email_expr: "$lowercase_email"
                        person_id_expr: "$$caller_id"
                        person_email_expr: "$$caller_email"
        as: contact
    - $unwind:
        path: "$contact"
        preserveNullAndEmptyArrays: true
    - $project:
        _id: 0
        email: "$email"
        email_verified:
          $eq:
            - "$emailVerified"
            - true
        two_factor_enabled:
          $eq:
            - "$twoFactorEnabled"
            - true
        contact_id: "$contact._id"
        name:
          $ifNull:
            - "$contact.profile.name"
            - "$name"
        profile:
          $ifNull:
            - "$contact.profile"
            - {}
