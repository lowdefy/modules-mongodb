# The email/password registration chain, `_ref`'d by the "Create account"
# button's onClick and by the password field's (and, once the password field is
# open, the email field's) onPressEnter, so click and Enter run the identical
# sequence. Validates the form first. On no-session (verification required) it
# shows the check-email state; SignUp navigates itself when a session is
# returned.
try:
  # Enter in the email field runs this chain too. In the method chooser the
  # password field isn't open yet, so Enter does what the chooser's primary
  # button does, opens it, and stops there.
  - :if:
      _not:
        _state: signup_show_password
    :then:
      - id: show_signup_password_on_enter
        type: SetState
        params:
          signup_show_password: true
      - :return: null
  - id: validate_signup
    type: Validate
  - id: signup_do
    type: SignUp
    messages:
      error: false
    params:
      email:
        _state: email
      password:
        _state: password
      # BetterAuth's signup body requires `name`, but the
      # canonical profile is captured in onboarding (which
      # re-denorms `users.name` from the contact), so the
      # account is created bare, same as BetterAuth's own
      # magic-link first sign-in.
      name: ""
      # Where the emailed verification link lands after
      # verifying, the verify-email success render.
      callbackUrl:
        pageId:
          _module.pageId: verify-email
        urlQuery:
          verified: "1"
          email:
            _state: email
  - :if:
      _not:
        _actions: signup_do.response.token
    :then:
      - id: show_check_email
        type: SetState
        params:
          signup_view: check
          signup_email:
            _state: email
catch:
  # Validation failures surface their own field messages;
  # only toast when it was the SignUp call that failed.
  - id: toast_signup_error
    type: DisplayMessage
    skip:
      _ne:
        - _actions: validate_signup.error
        - null
    params:
      status: error
      content:
        _switch:
          branches:
            - if:
                _eq:
                  - _actions: signup_do.error.cause.code
                  - USER_ALREADY_EXISTS
              then: An account with this email already exists. Try signing in instead.
            - if:
                _eq:
                  - _actions: signup_do.error.cause.code
                  - MEMBERSHIP_REQUIRED
              then: Sign-ups for this app are by invitation only. Ask an administrator for an invitation.
          default: We couldn't create your account. Check your details and try again.
