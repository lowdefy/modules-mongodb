# The email/password sign-in chain, `_ref`'d by the "Sign in" button's onClick
# and by the password field's (and, once the password form is open, the email
# field's) onPressEnter, so click and Enter run the identical sequence.
#
# On session success `Login` resolves its own destination, the `?callbackUrl=`
# set by the unauthenticated-page redirect, else the app home, so no
# `callbackUrl` param is passed. A 2FA-enrolled user gets no session but a
# `twoFactorRedirect` outcome, routed to the two-factor page.
try:
  # Enter in the email field runs this chain too. In the method chooser the
  # password form isn't open yet, so Enter does what the chooser's primary
  # button does, opens it, and stops there.
  - :if:
      _not:
        _state: login_show_password
    :then:
      - id: show_password_form_on_enter
        type: SetState
        params:
          login_show_password: true
      - :return: null
  - id: login_do
    type: Login
    messages:
      error: false
    params:
      email:
        _state: email
      password:
        _state: password
  - :if:
      _eq:
        - _actions: login_do.response.twoFactorRedirect
        - true
    :then:
      - id: go_two_factor
        type: Link
        params:
          pageId:
            _module.pageId: two-factor
          urlQuery:
            callbackUrl:
              _url_query: callbackUrl
catch:
  - id: map_login_error
    type: SetState
    params:
      login_view:
        _switch:
          branches:
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - MEMBERSHIP_REQUIRED
              then: noaccess
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - EMAIL_NOT_VERIFIED
              then: noaccess
          default: signin
      login_error_title:
        _switch:
          branches:
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - EMAIL_NOT_VERIFIED
              then: Verify your email to continue
          default: You don't have access to this app
      login_error_desc:
        _switch:
          branches:
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - EMAIL_NOT_VERIFIED
              then: Your email address hasn't been verified yet. Check your inbox for the verification link, or resend it below.
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - MEMBERSHIP_REQUIRED
              then: Your sign-in worked, but no one has granted you access to this app yet. Ask an administrator for an invitation.
          default: Something went wrong while signing you in. Try again.
      # The typed address, captured for the resend affordance
      # before the noaccess flip hides the email input (an
      # invisible input's value is dropped from state). Set only
      # for EMAIL_NOT_VERIFIED, so its presence both gates the
      # button's visibility and carries the address to
      # verify-email; null for every other code so a prior
      # attempt can't leave it stale.
      login_resend_email:
        _switch:
          branches:
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - EMAIL_NOT_VERIFIED
              then:
                _state: email
          default: null
      # Retryable errors stay on the signin view and surface as
      # a persistent inline notice (error-typed, red) so the user
      # can read it at their own pace. Nulled for the terminal
      # (noaccess) codes so the notice can't linger over the wall.
      login_notice_title:
        _switch:
          branches:
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - MEMBERSHIP_REQUIRED
              then: null
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - EMAIL_NOT_VERIFIED
              then: null
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - INVALID_EMAIL_OR_PASSWORD
              then: Incorrect email or password
          default: Sign-in failed
      login_notice_desc:
        _switch:
          branches:
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - MEMBERSHIP_REQUIRED
              then: null
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - EMAIL_NOT_VERIFIED
              then: null
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - INVALID_EMAIL_OR_PASSWORD
              then: Check your details and try again.
          default: Something went wrong while signing you in. Try again.
      login_notice_type:
        _switch:
          branches:
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - MEMBERSHIP_REQUIRED
              then: null
            - if:
                _eq:
                  - _actions: login_do.error.cause.code
                  - EMAIL_NOT_VERIFIED
              then: null
          default: error
