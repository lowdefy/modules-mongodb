# The reset-link request chain, `_ref`'d by the "Send reset link" button's
# onClick and the email field's onPressEnter so click and Enter run the
# identical sequence. Requests the reset link, then always shows the sent
# confirmation. RequestPasswordReset is enumeration-safe server-side; the catch
# flips to the same confirmation so a failure never reveals account existence.
try:
  - id: request_reset
    type: RequestPasswordReset
    messages:
      error: false
    params:
      email:
        _state: email
      redirectTo:
        _build.string.concat:
          - "/"
          - _module.pageId: reset-password
  - id: show_sent
    type: SetState
    params:
      forgot_view: sent
      forgot_email:
        _state: email
catch:
  - id: show_sent_on_error
    type: SetState
    params:
      forgot_view: sent
      forgot_email:
        _state: email
