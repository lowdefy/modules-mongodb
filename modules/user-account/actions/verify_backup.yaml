# The backup-code verify chain, `_ref`'d by both the Verify button's onClick and
# the backup_code field's onPressEnter so click and Enter run the identical
# sequence. Same TwoFactorVerify action as the TOTP chain but dispatches on the
# backupCode param, with the same success navigation.
try:
  - id: tf_verify_backup
    type: TwoFactorVerify
    messages:
      error: false
    params:
      backupCode:
        _state: backup_code
      trustDevice:
        _state: trust_device
  - id: tf_backup_continue
    type: Link
    params:
      url:
        _if_none:
          - _url_query: callbackUrl
          - "/"
catch:
  - id: tf_backup_no_cookie
    type: Link
    skip:
      _ne:
        - _actions: tf_verify_backup.error.cause.code
        - INVALID_TWO_FACTOR_COOKIE
    params:
      pageId:
        _module.pageId: login
  - id: tf_backup_error
    type: DisplayMessage
    skip:
      _eq:
        - _actions: tf_verify_backup.error.cause.code
        - INVALID_TWO_FACTOR_COOKIE
    params:
      status: error
      content: That backup code is invalid or has already been used. Try another.
