# The password-reset chain, `_ref`'d by the "Update password" button's onClick
# and both password fields' onPressEnter so click and Enter run the identical
# sequence. Validates the confirm-match, then resets with the URL token. On
# success it shows the success state; a bad/expired token maps to the expired
# wall, any other failure to the inline alert.
try:
  - id: validate_reset
    type: Validate
  - id: reset_do
    type: ResetPassword
    messages:
      error: false
    params:
      newPassword:
        _state: password
      token:
        _url_query: token
  - id: show_reset_success
    type: SetState
    params:
      reset_view: success
catch:
  # Validation failures show their own field messages; only map the
  # reset-call failure when the call itself ran and failed. A dead
  # token (INVALID_TOKEN) flips to the expired wall. It can't be
  # retried from here; any other failure raises the persistent inline
  # alert and stays on the form so the user can try again.
  - id: map_reset_error
    type: SetState
    skip:
      _ne:
        - _actions: validate_reset.error
        - null
    params:
      reset_view:
        _if:
          test:
            _eq:
              - _actions: reset_do.error.cause.code
              - INVALID_TOKEN
          then: expired
          else: form
      reset_error:
        _if:
          test:
            _eq:
              - _actions: reset_do.error.cause.code
              - INVALID_TOKEN
          then: false
          else: true
