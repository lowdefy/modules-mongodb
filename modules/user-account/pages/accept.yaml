# Accept-invitation page. Serves authPages.acceptInvitation. Public, thin,
# engine-trusting: its job is session-ensuring + one client call. Renders via
# `accept_view` (noinvite | nosession | signedin | member | invalid |
# link_expired | withdrawn | wrong_email), chosen by components/accept_view.yaml.
#
# The invitation is read natively (get_invitation) by the invitationId query
# parameter, display only (org / inviter / invited email / status / expiry).
# BetterAuth's AcceptInvitation enforces the session-email <-> invitation-email
# match and expiry itself server-side, so a mismatch that slips past the render
# choice fails safely.
#
# Each rejecting view is logged server-side (best-effort, non-blocking) via
# log-invitation-rejection so a report can be traced without reproducing it.
#
# Joining is logged through log-member-joined, which saves one org-member-joined
# event per accepted invitation whatever the number of calls: after a
# successful accept, on a retry that finds the invitation already accepted, and
# on the member render (a reload after an accept whose page never got to log).
# A failed log never stops the person entering the app.
_ref:
  module: layout
  component: auth-page
  vars:
    id: accept
    title: ""
    requests:
      - _ref: requests/get_invitation.yaml
    events:
      # A missing invitationId gets its own render; a read failure shows its
      # error and renders nothing; a found-but-empty result is a genuine
      # bad/consumed link.
      #
      # The render is chosen only once the browser's session is known. Under
      # `policy: pinned` the server resolves an invitee who has signed in but
      # not yet accepted to no caller (their session has no active
      # organization), so `_user` starts empty and fills in from the browser's
      # session store when its fetch settles. Choosing before that sends a
      # signed-in invitee back to sign in. When `_user` is empty, settle_session
      # waits for the store; it fails exactly in that pinned case ("a session
      # is active but the server resolved no user"), and the catch chooses the
      # render then, with `_user` read from the settled store.
      onInit:
        try:
          - :if:
              _eq:
                - _url_query: invitationId
                - null
            :then:
              - id: no_invitation_id
                type: SetState
                params:
                  accept_view: noinvite
            :else:
              - id: fetch_invitation
                type: Request
                params: get_invitation
              # Read the row through `_request`, which indexes into the
              # response array as expected. An `_actions:
              # fetch_invitation.response.0` path does NOT — it yields the whole
              # array, which renders as a blank inviter/org/email and makes
              # every status branch miss.
              - id: set_invite
                type: SetState
                params:
                  invite:
                    _request: get_invitation.0
              - id: settle_session
                type: UpdateSession
                skip:
                  _ne:
                    - _user: id
                    - null
                messages:
                  error: false
              - id: select_accept_view
                type: SetState
                params:
                  accept_view:
                    _ref: components/accept_view.yaml
              - id: log_joined_on_member
                type: CallAPI
                async: true
                skip:
                  _ne:
                    - _state: accept_view
                    - member
                messages:
                  error: false
                params:
                  endpointId:
                    _module.endpointId: log-member-joined
                  payload:
                    invitationId:
                      _url_query: invitationId
        catch:
          - :if:
              _eq:
                - _error: actionId
                - settle_session
            :then:
              - id: select_accept_view_settled
                type: SetState
                params:
                  accept_view:
                    _ref: components/accept_view.yaml
      # Best-effort diagnostic: one server-side log line naming which guard
      # rejected the attempt, so a "can't be used" report is traceable
      # without reproducing it. Runs on onInitAsync (not onInit) and
      # wrapped in try/catch so a logging hiccup never blocks or errors the
      # page. log-invitation-rejection is an AUTHENTICATED endpoint (not
      # public), so only the three views that structurally require a session
      # (they come after the nosession branch in components/accept_view.yaml)
      # are logged;
      # `invalid` is skipped since it can occur with no session at all and
      # the call would just fail closed there.
      onInitAsync:
        try:
          - :if:
              _or:
                - _eq:
                    - _state: accept_view
                    - link_expired
                - _eq:
                    - _state: accept_view
                    - withdrawn
                - _eq:
                    - _state: accept_view
                    - wrong_email
            :then:
              - id: log_rejection
                type: CallAPI
                messages:
                  error: false
                params:
                  endpointId: user-account/log-invitation-rejection
                  payload:
                    invitationId:
                      _url_query: invitationId
                    reason:
                      _state: accept_view
                    invitedEmail:
                      _state: invite.email
                    callerEmail:
                      _user: email
        catch: []
    blocks:
      # ---- No session, offer login / signup ----
      - id: accept_title_nosession
        type: Title
        visible:
          _eq:
            - _state: accept_view
            - nosession
        properties:
          content: You're invited
          level: 3
      - id: accept_invite_context
        type: Box
        visible:
          _or:
            - _eq:
                - _state: accept_view
                - nosession
            - _eq:
                - _state: accept_view
                - signedin
        layout:
          align: middle
          selfAlign: middle
          gap: 11
        style:
          background: "var(--ant-color-primary-bg)"
          border: "1px solid var(--ant-color-primary-border)"
          borderRadius: 10
          padding: 11px 13px
        blocks:
          - id: accept_invite_avatar
            type: Avatar
            layout:
              flex: 0 1 auto
            properties:
              content:
                _nunjucks:
                  template: "{{ (name or '?') | first | upper }}"
                  on:
                    name:
                      _state: invite.inviter_name
              color: "#7048e8"
          - id: accept_invite_who
            type: Html
            layout:
              flex: 1 1 auto
            properties:
              html:
                _nunjucks:
                  template: <div class="text-xs opacity-70">{{ inviter }} invited you to</div><div class="text-sm font-semibold">{{ org }}</div>
                  on:
                    inviter:
                      _state: invite.inviter_name
                    org:
                      _state: invite.org_name
      - id: accept_nosession_lead
        type: Html
        visible:
          _eq:
            - _state: accept_view
            - nosession
        properties:
          html:
            _nunjucks:
              template: To accept, sign in or create your account with <b>{{ email }}</b>.
              on:
                email:
                  _state: invite.email
        style:
          fontSize: 13
          color: "var(--ant-color-text-secondary)"
      # Sign up / sign in, then return to this page (invitationId preserved) so
      # the signed-in render can accept. Both buttons also carry the invited
      # address as `?email=`, which the signup and login pages prefill and lock:
      # BetterAuth only accepts the invitation for a session on that address, so
      # any other value is guaranteed to fail — and under `policy: tenant`
      # registering a different address mints that user their own organization
      # (no membership, no pending invitation for it), leaving them with an
      # unusable invitation and an organization nobody asked for.
      - id: accept_signup
        type: Button
        visible:
          _eq:
            - _state: accept_view
            - nosession
        properties:
          title: Create account and accept
          block: true
          size: large
          color: primary
          variant: solid
        events:
          onClick:
            - id: go_signup_accept
              type: Link
              params:
                # signup exists only where a password registration form does
                # (emailAndPassword.enabled); passwordless collapses signup into
                # login, so target login there. The invitee's email → link
                # creates the account at verify time.
                pageId:
                  _build.if:
                    test:
                      _build.authConfig: emailAndPassword.enabled
                    then:
                      _module.pageId: signup
                    else:
                      _module.pageId: login
                urlQuery:
                  email:
                    _state: invite.email
                  # The engine consumes `?callbackUrl=` raw, so the value has to
                  # carry `basePath` itself. Take the live URL rather than
                  # rebuilding it from the page id, which would drop it.
                  callbackUrl:
                    _string.concat:
                      - _location: pathname
                      - _location: search
      - id: accept_login
        type: Button
        visible:
          _eq:
            - _state: accept_view
            - nosession
        properties:
          title: Sign in and accept
          block: true
          size: large
          variant: outlined
        events:
          onClick:
            - id: go_login_accept
              type: Link
              params:
                pageId:
                  _module.pageId: login
                urlQuery:
                  email:
                    _state: invite.email
                  # The engine consumes `?callbackUrl=` raw, so the value has to
                  # carry `basePath` itself. Take the live URL rather than
                  # rebuilding it from the page id, which would drop it.
                  callbackUrl:
                    _string.concat:
                      - _location: pathname
                      - _location: search

      # ---- Signed in, email matches ----
      - id: accept_title_signedin
        type: Title
        visible:
          _eq:
            - _state: accept_view
            - signedin
        properties:
          content: Accept your invitation
          level: 3
      - id: accept_signed_in_as
        type: Box
        visible:
          _eq:
            - _state: accept_view
            - signedin
        layout:
          align: middle
          selfAlign: middle
          gap: 10
        blocks:
          - id: accept_signed_in_avatar
            type: Avatar
            layout:
              flex: 0 1 auto
            properties:
              content:
                _nunjucks:
                  template: "{{ (name or '?') | first | upper }}"
                  on:
                    name:
                      _user: name
              size: small
              color: "#0e7490"
          - id: accept_signed_in_text
            type: Html
            layout:
              flex: 1 1 auto
            properties:
              html:
                _nunjucks:
                  template: <div class="text-sm">Signed in as <b>{{ email }}</b></div><div class="text-xs opacity-70">This matches your invitation.</div>
                  on:
                    email:
                      _user: email
      # Accept the invitation. BetterAuth merges the profile fragment and applies
      # invite-time attributes engine-side; on success we log the join and enter
      # the app. A retry against an invitation this caller already accepted (an
      # interrupted first attempt) fails "not found" although they are in, so the
      # catch re-reads the invitation: accepted means log the join and enter.
      - id: accept_continue
        type: Button
        visible:
          _eq:
            - _state: accept_view
            - signedin
        properties:
          title: Accept and continue
          block: true
          size: large
          color: primary
          variant: solid
        events:
          onClick:
            try:
              - id: accept_do
                type: AcceptInvitation
                messages:
                  error: false
                params:
                  invitationId:
                    _url_query: invitationId
              - id: log_joined
                type: CallAPI
                messages:
                  error: false
                params:
                  endpointId:
                    _module.endpointId: log-member-joined
                  payload:
                    invitationId:
                      _url_query: invitationId
              # LOCAL FORK: refresh the client's _user BEFORE routing. The
              # accept just gave this session its organization; without the
              # refresh the router still reads awaiting_organization from the
              # stale client user and bounces straight back to the awaiting
              # page — the accept/awaiting ping-pong.
              - id: refresh_session_after_accept
                type: UpdateSession
              - id: accept_enter_app
                type: Link
                params:
                  home: true
            catch:
              # LOCAL FORK: a retry against an invitation THIS caller already
              # consumed (an interrupted first accept) fails "not found" even
              # though they are in. Re-read the invitation: consumed by them →
              # refresh the session and enter; anything else is a real error.
              - id: refetch_invitation_after_error
                type: Request
                params: get_invitation
              - :if:
                  _eq:
                    - _request: get_invitation.0.status
                    - accepted
                :then:
                  - id: log_joined_after_retry
                    type: CallAPI
                    async: true
                    messages:
                      error: false
                    params:
                      endpointId:
                        _module.endpointId: log-member-joined
                      payload:
                        invitationId:
                          _url_query: invitationId
                  - id: refresh_session_after_retry
                    type: UpdateSession
                  - id: enter_app_after_retry
                    type: Link
                    params:
                      home: true
                :else:
                  - id: accept_error
                    type: DisplayMessage
                    params:
                      status: error
                      content: This invitation couldn't be accepted. It may have expired or been sent to a different email address. Ask for a new one.
      - id: accept_not_you
        type: Html
        visible:
          _eq:
            - _state: accept_view
            - signedin
        properties:
          html: Not you? <a href="logout">Sign out</a>
        style:
          textAlign: center
          fontSize: 12
          color: "var(--ant-color-text-secondary)"

      # ---- Already a member ----
      - id: accept_already_member
        type: Result
        visible:
          _eq:
            - _state: accept_view
            - member
        properties:
          status: success
          title: You're already a member
          subTitle: Your account already has access to this app.
      - id: accept_go_to_app
        type: Button
        visible:
          _eq:
            - _state: accept_view
            - member
        properties:
          title: Go to app
          block: true
          size: large
          color: primary
          variant: solid
        events:
          onClick:
            # Refresh first: the "already a member" caller often arrives here
            # with a stale client user (accepted moments ago in this tab) and
            # the router would bounce them back to awaiting without it.
            - id: member_refresh_session
              type: UpdateSession
            - id: member_enter_app
              type: Link
              params:
                home: true

      # ---- Missing invitationId (required parameter absent) ----
      - id: accept_no_invitation
        type: Result
        visible:
          _eq:
            - _state: accept_view
            - noinvite
        properties:
          status: error
          title: This link is missing its invitation
          subTitle: Open the invitation link from your email. It carries the reference this page needs.

      # ---- No usable data (invitation row not found) ----
      - id: accept_invalid
        type: Result
        visible:
          _eq:
            - _state: accept_view
            - invalid
        properties:
          icon:
            name: clock
            color: "var(--ant-color-warning)"
          status: warning
          title: This invitation can't be used
          subTitle: This invitation may have expired, already been used, or been sent to a different email address. Ask whoever invited you for a new one.

      # ---- Past its expiry date (status still pending) ----
      - id: accept_link_expired
        type: Result
        visible:
          _eq:
            - _state: accept_view
            - link_expired
        properties:
          icon:
            name: clock
            color: "var(--ant-color-warning)"
          status: warning
          title: This invitation has expired
          subTitle:
            _nunjucks:
              template: Ask {{ inviter }} to send you a new invitation.
              on:
                inviter:
                  _if_none:
                    - _state: invite.inviter_name
                    - whoever invited you

      # ---- Withdrawn (canceled by the org, or declined) ----
      - id: accept_withdrawn
        type: Result
        visible:
          _eq:
            - _state: accept_view
            - withdrawn
        properties:
          icon:
            name: clock
            color: "var(--ant-color-warning)"
          status: warning
          title: This invitation was withdrawn
          subTitle:
            _nunjucks:
              template: Ask {{ inviter }} to send you a new invitation.
              on:
                inviter:
                  _if_none:
                    - _state: invite.inviter_name
                    - whoever invited you

      # ---- Signed in as the wrong account ----
      - id: accept_wrong_email
        type: Result
        visible:
          _eq:
            - _state: accept_view
            - wrong_email
        properties:
          icon:
            name: clock
            color: "var(--ant-color-warning)"
          status: warning
          title: This invitation is for a different address
          subTitle:
            _nunjucks:
              template: You're signed in as {{ callerEmail }}, but this invitation was sent to {{ invitedEmail }}. Sign out, then open the invitation link again to accept with the invited address.
              on:
                callerEmail:
                  _user: email
                invitedEmail:
                  _state: invite.email
      - id: accept_wrong_email_signout
        type: Button
        visible:
          _eq:
            - _state: accept_view
            - wrong_email
        properties:
          title: Sign out
          block: true
          size: large
          variant: outlined
        events:
          onClick:
            - id: wrong_email_logout
              type: Logout
