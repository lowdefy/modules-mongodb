# Reset-password page, task 12. Serves authPages.resetPassword. Landed on from
# the emailed reset link (forgot-password's redirectTo), which carries the reset
# token as `?token=`. Three renders via `reset_view`:
#   - form    : the choose-a-new-password form (default).
#   - success : the "password updated" result after a successful reset.
#   - expired : a dead-token wall, shown on load when the reset callback
#               redirects here with `?error=INVALID_TOKEN` (consumed / expired
#               link), and after a submit that fails with INVALID_TOKEN. The
#               token can't be renewed from this page, so the form is replaced
#               with a notice and a "request a new reset link" route back to
#               forgot-password.
# Submit validates the confirm-match, then calls ResetPassword with the URL
# token + new password. A dead token flips to the expired wall; any other
# failure surfaces a persistent inline alert above the form (reset_error).
_ref:
  module: layout
  component: auth-page
  vars:
    id: reset-password
    title: ""
    events:
      onInit:
        # Seed the render. The reset callback redirects a consumed / expired
        # link here with `?error=INVALID_TOKEN`; that flips straight to the
        # expired wall so the dead form is never shown. Any other load is a
        # normal reset form.
        - id: seed_reset_view
          type: SetState
          params:
            reset_view:
              _if:
                test:
                  _eq:
                    - _url_query: error
                    - INVALID_TOKEN
                then: expired
                else: form
            reset_error: false
    blocks:
      # ---- Form state ----
      - id: reset_title
        type: Title
        visible:
          _eq:
            - _state: reset_view
            - form
        properties:
          content: Choose a new password
          level: 3
      # Persistent inline alert for a submit that failed on something other than
      # a dead token (a dead token flips to the expired wall instead). Stays put
      # until the user acts, unlike a toast. Set by the submit catch, cleared on
      # load; gated to the form view so it can't linger over success / expired.
      - id: reset_error_alert
        type: Alert
        visible:
          _and:
            - _eq:
                - _state: reset_view
                - form
            - _eq:
                - _state: reset_error
                - true
        properties:
          type: error
          showIcon: true
          message: Couldn't reset your password
          description: Something went wrong. Try again.
      - id: password
        type: PasswordInput
        visible:
          _eq:
            - _state: reset_view
            - form
        required: true
        properties:
          size: large
          label:
            title: New password
            colon: false
            span: 24
      - id: confirm_password
        type: PasswordInput
        visible:
          _eq:
            - _state: reset_view
            - form
        required: true
        validate:
          - pass:
              _eq:
                - _state: password
                - _state: confirm_password
            status: error
            message: Passwords must match.
        properties:
          size: large
          label:
            title: Confirm password
            colon: false
            span: 24
      # Validate the confirm-match, then reset with the URL token. On success
      # show the success state; a bad/expired token maps to a friendly message.
      - id: reset_submit
        type: Button
        visible:
          _eq:
            - _state: reset_view
            - form
        properties:
          title: Update password
          block: true
          size: large
          color: primary
          variant: solid
        events:
          onClick:
            try:
              - id: validate_reset
                type: Validate
              - id: reset_do
                type: ResetPassword
                messages:
                  error: false
                params:
                  newPassword:
                    _state: password
                  token:
                    _url_query: token
              - id: show_reset_success
                type: SetState
                params:
                  reset_view: success
            catch:
              # Validation failures show their own field messages; only map the
              # reset-call failure when the call itself ran and failed. A dead
              # token (INVALID_TOKEN) flips to the expired wall. It can't be
              # retried from here; any other failure raises the persistent inline
              # alert and stays on the form so the user can try again.
              - id: map_reset_error
                type: SetState
                skip:
                  _ne:
                    - _actions: validate_reset.error
                    - null
                params:
                  reset_view:
                    _if:
                      test:
                        _eq:
                          - _actions: reset_do.error.cause.code
                          - INVALID_TOKEN
                      then: expired
                      else: form
                  reset_error:
                    _if:
                      test:
                        _eq:
                          - _actions: reset_do.error.cause.code
                          - INVALID_TOKEN
                      then: false
                      else: true

      # ---- Success state ----
      - id: reset_success
        type: Result
        visible:
          _eq:
            - _state: reset_view
            - success
        properties:
          status: success
          title: Password updated
          subTitle: Your password has been changed. You can now sign in.
      - id: reset_success_login
        type: Button
        visible:
          _eq:
            - _state: reset_view
            - success
        properties:
          title: Continue to sign in
          block: true
          size: large
          color: primary
          variant: solid
        events:
          onClick:
            - id: go_login
              type: Link
              params:
                pageId:
                  _module.pageId: login

      # ---- Expired state ----
      # Dead-token wall: the form is replaced entirely so an already-used or
      # expired link never presents a live-looking reset form. The token can't
      # be renewed here, so the only way forward is a fresh link, routed back
      # to forgot-password.
      - id: reset_expired_alert
        type: Alert
        visible:
          _eq:
            - _state: reset_view
            - expired
        properties:
          type: warning
          showIcon: true
          message: This reset link has expired or was already used
          description: Reset links can only be used once and expire after a short time. Request a new one below.
      - id: reset_expired_request
        type: Button
        visible:
          _eq:
            - _state: reset_view
            - expired
        properties:
          title: Request a new reset link
          block: true
          size: large
          color: primary
          variant: solid
        events:
          onClick:
            - id: go_forgot_password
              type: Link
              params:
                pageId:
                  _module.pageId: forgot-password
