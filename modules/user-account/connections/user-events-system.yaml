id: user-events-system
type: MongoDBCollection
# Deliberately shared: the write surface for the org-member-joined event that
# log-member-joined saves. Accepting an invitation leaves a caller who is
# already active in another organization active there, so the walled
# events-collection would stamp that organization onto the event. Shared does
# NOT mean org-less writes: the endpoint stamps the invitation's own
# organization_id explicitly under policy: tenant (see
# docs/shared/org-scoping.md). Every other event goes through the events
# module's walled new-event endpoint.
tenant: shared # joined event; stamps the accepted invitation's organization explicitly
properties:
  databaseUri:
    _secret: MONGODB_URI
  collection: log-events
  # Its own change-log collection: the engine writes a shared connection's
  # change-log records without organization_id, and one such record in a
  # collection a walled connection reads (log-changes) makes the tenant
  # preflight refuse to serve the app.
  changeLog:
    collection: log-changes-system
    meta:
      user:
        _user: true
  write: true
