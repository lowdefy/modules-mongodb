# Swaps the selected step with the one `vars.offset` (-1 or 1) away. Guarded as well as disabled
# at the ends, since a move past an end writes `undefined` and loses a step.
- id: walkthrough_move_step
  type: SetState
  params:
    walkthrough_draft.steps:
      _js:
        fn: |
          const { steps, from, offset } = args[0] || {};
          const next = (steps || []).slice();
          const to = from + offset;
          if (to < 0 || to >= next.length) return next;
          const moved = next[from];
          next[from] = next[to];
          next[to] = moved;
          return next;
        args:
          - steps:
              _state: walkthrough_draft.steps
            from:
              _state: walkthrough_edit_index
            offset:
              _var: offset
    walkthrough_edit_index:
      _js:
        fn: |
          const { index, offset, total } = args[0] || {};
          const to = index + offset;
          return to < 0 || to >= total ? index : to;
        args:
          - index:
              _state: walkthrough_edit_index
            offset:
              _var: offset
            total:
              _array.length:
                _if_none:
                  - _state: walkthrough_draft.steps
                  - []
- _ref: actions/sync-step.yaml
