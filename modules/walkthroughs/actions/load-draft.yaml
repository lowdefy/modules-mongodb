# Loads the working copy of the walkthrough named by `walkthrough_id` into the editor's state.
# Run on mount and again after every write that changes what is stored, so the editor never keeps
# editing a document it has just replaced.
#
# A list of actions: splice it in with `_build.array.concat`, not a bare `_ref`.
- id: walkthrough_editor_reset
  type: SetState
  params:
    walkthrough_editor_loaded: false
    walkthrough_draft: null
    walkthrough_edit_step: null
    walkthrough_edit_index: null
    walkthrough_draft_steps_held: null
    walkthrough_preview: false
# Reset runs whatever the id, so arriving without one clears the previous walkthrough rather than
# leaving it on screen. The fetch and the seed below are skipped instead of being asked to load
# nothing.
- id: walkthrough_load_draft
  type: CallAPI
  skip:
    _eq:
      - _state: walkthrough_id
      - null
  params:
    endpointId:
      _module.endpointId: get-draft
    payload:
      walkthrough_id:
        _state: walkthrough_id
- id: walkthrough_seed_draft
  type: SetState
  skip:
    _eq:
      - _state: walkthrough_id
      - null
  params:
    walkthrough_draft:
      _js:
        fn: |
          const { draft, walkthroughId } = args[0] || {};
          // `get-draft` resolves each image key to a URL and drops the key, but `save-draft`
          // stores keys — so the key is rebuilt here and carried beside the URL for the rest of
          // the session. It is rebuilt from the module's own
          // `walkthroughs/{walkthrough_id}/{file}` layout rather than by stripping the URL's
          // origin, because the origin is the app's bucket and can change without the layout
          // changing.
          return {
            title: draft.title,
            overview: draft.overview,
            steps: (draft.steps || []).map((step) => ({
              ...step,
              image: step.image
                ? {
                    ...step.image,
                    key: `walkthroughs/${walkthroughId}/${step.image.url.split('/').pop()}`,
                  }
                : null,
            })),
          };
        args:
          - draft:
              _actions: walkthrough_load_draft.response.response
            walkthroughId:
              _state: walkthrough_id
    walkthrough_updated:
      _actions: walkthrough_load_draft.response.response.updated_timestamp
    walkthrough_has_draft:
      _actions: walkthrough_load_draft.response.response.has_draft
    walkthrough_published:
      _actions: walkthrough_load_draft.response.response.published
    walkthrough_edit_index: 0
    walkthrough_editor_loaded: true
- _ref:
    path: actions/sync-step.yaml
    vars:
      sync_id: walkthrough_sync_step_loaded
