# Mirrors the selected step out of the draft so controls bind to one plain path. The id is a var
# so two fragments ending in this one can share an event.
id:
  _var:
    key: sync_id
    default: walkthrough_sync_step
type: SetState
params:
  walkthrough_edit_step:
    _js:
      fn: |
        const { steps, index } = args[0] || {};
        return (steps || [])[index || 0] || null;
      args:
        - steps:
            _state: walkthrough_draft.steps
          index:
            _state: walkthrough_edit_index
