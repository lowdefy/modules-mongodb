id: create-walkthrough
type: Api
description: >-
  Creates an empty walkthrough: no published content, and a draft holding a
  placeholder title. Returns the new id so the caller can open the editor on it.
payloadSchema:
  type: object
  additionalProperties: false
routine:
  - :if:
      _not:
        _module.var: writable
    :then:
      - :reject: Authoring is not enabled in this app.
  # One stamp in state rather than a _ref at each use: `_date: now` yields a fresh value every
  # time it is evaluated, and the timestamp returned to the caller has to be the one stored, or
  # the caller's first save collides with its own create.
  - :set_state:
      walkthrough_id:
        _uuid: true
      stamp:
        _ref: defaults/change_stamp.yaml
  - id: insert
    type: MongoDBInsertOne
    connectionId:
      _module.connectionId: walkthroughs-collection
    properties:
      doc:
        _id:
          _state: walkthrough_id
        title: null
        overview: null
        steps: []
        draft:
          title: Untitled walkthrough
          overview: null
          steps: []
        published: null
        retired: null
        created:
          _state: stamp
        updated:
          _state: stamp
  - :return:
      _id:
        _state: walkthrough_id
      updated_timestamp:
        _state: stamp.timestamp
