id: discard-draft
type: Api
description: >-
  Throws away a walkthrough's draft, leaving its published content exactly as it
  was. This is the only undo authoring has — there is no version history.
payloadSchema:
  type: object
  required:
    - walkthrough_id
    - updated_timestamp
  additionalProperties: false
  properties:
    walkthrough_id:
      type: string
    updated_timestamp:
      description: The update timestamp the caller last received; a stale one is refused.
routine:
  - :if:
      _not:
        _module.var: writable
    :then:
      - :reject: Authoring is not enabled in this app.
  - :set_state:
      stamp:
        _ref: defaults/change_stamp.yaml
  - id: discard
    type: MongoDBUpdateOne
    connectionId:
      _module.connectionId: walkthroughs-collection
    properties:
      filter:
        _id:
          _payload: walkthrough_id
        updated.timestamp:
          _payload: updated_timestamp
      # A zero-match update throws by default; the guard below turns it into a refusal the
      # editor can act on.
      disableNoMatchError: true
      update:
        $set:
          updated:
            _state: stamp
        $unset:
          draft: ''
  - :if:
      _eq:
        - _step: discard.matchedCount
        - 0
    :then:
      - :reject: This walkthrough changed elsewhere since you opened it. Reload before discarding.
  - :return:
      updated_timestamp:
        _state: stamp.timestamp
