id: delete-walkthrough
type: Api
description: >-
  Soft-deletes a walkthrough that has never been published. A published one may
  be linked or cited by id elsewhere, so it is retired instead.
payloadSchema:
  type: object
  required:
    - walkthrough_id
    - updated_timestamp
  additionalProperties: false
  properties:
    walkthrough_id:
      type: string
    updated_timestamp:
      description: The update timestamp the caller last received; a stale one is refused.
routine:
  - :if:
      _not:
        _module.var: writable
    :then:
      - :reject: Authoring is not enabled in this app.
  - id: delete
    type: MongoDBUpdateOne
    connectionId:
      _module.connectionId: walkthroughs-collection
    properties:
      filter:
        _id:
          _payload: walkthrough_id
        updated.timestamp:
          _payload: updated_timestamp
        published: null
        deleted.timestamp:
          $exists: false
      disableNoMatchError: true
      update:
        $set:
          deleted:
            _ref: defaults/change_stamp.yaml
  - :if:
      _eq:
        - _step: delete.matchedCount
        - 0
    :then:
      - :reject: >-
          This walkthrough was published or changed elsewhere since you opened it. Reload before
          deleting it.
  - :return:
      walkthrough_id:
        _payload: walkthrough_id
      deleted: true
