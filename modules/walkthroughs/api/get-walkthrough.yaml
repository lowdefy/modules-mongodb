id: get-walkthrough
type: Api
description: >
  Returns one published walkthrough with its steps, each stored image key already
  resolved to a URL, or null when there is none to play: unknown, deleted, or never
  published. Retired walkthroughs still load, since anything holding an id (a link,
  a citation, a registry row) should keep resolving; hiding them is the consumer's
  decision to make.
payloadSchema:
  type: object
  required:
    - walkthrough_id
  additionalProperties: false
  properties:
    walkthrough_id:
      type: string
routine:
  - id: load_walkthrough
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: walkthroughs-collection
    properties:
      query:
        _id:
          _payload: walkthrough_id
        deleted.timestamp:
          $exists: false
        published:
          $ne: null
      options:
        projection:
          _id: 1
          title: 1
          overview: 1
          steps: 1
          retired: 1
  - :if:
      _eq:
        - _step: load_walkthrough
        - null
    :then:
      - :return: null
  - _ref:
      path: api/routines/resolve_steps.yaml
      vars:
        steps:
          _step: load_walkthrough.steps
  - :return:
      _id:
        _step: load_walkthrough._id
      title:
        _step: load_walkthrough.title
      overview:
        _step: load_walkthrough.overview
      retired:
        _step: load_walkthrough.retired
      steps:
        _state: resolved_steps
