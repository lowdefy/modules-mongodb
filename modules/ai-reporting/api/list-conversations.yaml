# Conversation list for the chat page's sidebar, most recent first. Carries
# titles/metadata only: messages and data_parts are excluded — selecting a
# conversation restores both via a fresh get-conversation-results read (a
# list snapshot races the onFinish save and can be a turn behind, and a stale
# restore would overwrite the saved transcript on the next turn). The cap is
# 200, not a smaller number, because the rail's search and recency grouping
# filter this returned window client-side — the window is what search can
# reach, and a smaller one would make an out-of-window miss indistinguishable
# from no match.
id: list-conversations
type: Api
routine:
  # Scoped by `_user: id`, the same key save-conversation and emit-data-parts
  # write to owner.user_id — see docs/shared/change-stamps.md for the idiom.
  - :if:
      _eq:
        - _user: id
        - null
    :then:
      - :return: []
  - id: find_conversations
    type: MongoDBFind
    connectionId:
      _module.connectionId: conversations-store
    properties:
      query:
        owner.user_id:
          _user: id
        # See docs/shared/soft-delete.md for the idiom.
        deleted.timestamp:
          $exists: false
      options:
        sort:
          updated.timestamp: -1
        limit: 200
        projection:
          data_parts: 0
          messages: 0
  - :return:
      _step: find_conversations
