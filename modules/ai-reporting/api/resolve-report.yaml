# The Dynamic block's resolver: load the report spec (readable-scoped), run each
# query-backed section's pipeline inside :try (a failed section renders as an
# Alert card while the rest of the report renders), compile spec + rows to
# blocks server-side. AnalyticsPipeline is the security gate: it revalidates
# each stored pipeline against the connection-bound catalog with the VIEWING
# user's roles on every resolve, so a section the viewer can't access (or that
# drifted out of the catalog) fails as one Alert card, not a whole-report error.
id: resolve-report
type: InternalApi
routine:
  # Needed once the read opens to shared reports. Until then the owner.user_id
  # match made an unauthenticated read match nothing; a $or on
  # visibility: shared would hand every published report to an anonymous
  # caller. "Shared" means everyone in the app, and the module's baseline
  # everywhere — including the catalog's role gate, where an absent roles list
  # means any AUTHENTICATED user — is an authenticated user.
  - :if:
      _eq:
        - _user: id
        - null
    :then:
      - :reject: You must be signed in to open a report.
  - id: load_report
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: reports-store
    properties:
      query:
        _id:
          _payload: urlQuery.report_id
        # A soft-deleted report resolves as not-found (the fallback slot), the
        # same as one that never existed.
        deleted.timestamp:
          $exists: false
        # Readable: yours, or published to the app. The per-section role gate
        # below is untouched and still runs against the VIEWING user, so opening
        # the read does not open the data — a shared report over a role-gated
        # collection resolves with its gated sections failing.
        $or:
          - owner.user_id:
              _user: id
          - visibility: shared
  - :if:
      _eq:
        - _step: load_report
        - null
    # Whole-report failure — the Dynamic block renders its fallback slot.
    :then:
      - :reject: Report not found.
  # controlFor resolves querySections, which runs validateReportSpec over the
  # whole spec and throws on a grammar failure BEFORE any per-section :try —
  # uncaught there, it reaches the page as the same fallback a missing report
  # gets, with nothing logged. A stored spec that fails grammar is a code bug,
  # not user drift, so pre-run the identical validation (no catalog, same as
  # querySections, so only grammar failures reach here — not per-section access)
  # to leave a diagnostic trail; the reject still lands on the static fallback.
  - :try:
      - :set_state:
          revalidate_spec:
            _analytics.validateReportSpec:
              spec:
                title:
                  _step: load_report.title
                description:
                  _step: load_report.description
                sections:
                  _step: load_report.spec.sections
              roles:
                _user: roles
    :catch:
      - :log:
          msg: A stored report spec failed whole-spec validation on open.
          report_id:
            _payload: urlQuery.report_id
      - :reject: Report spec failed whole-spec validation.
  # No catalog passed here: querySections only extracts the query sections
  # (inert), and the per-section AnalyticsPipeline below is the real gate — so
  # one inaccessible section never throws here and takes down the whole report.
  # `spec` holds { sections } only, so the spec the validator wants is composed
  # from the document's fields — it requires a non-empty title.
  - :for: section
    :in:
      _analytics.querySections:
        spec:
          title:
            _step: load_report.title
          description:
            _step: load_report.description
          sections:
            _step: load_report.spec.sections
        roles:
          _user: roles
    :do:
      - :try:
          - id: run_query
            type: AnalyticsPipeline
            connectionId:
              _module.connectionId: reporting-data
            properties:
              query:
                _item: section.query
              roles:
                _user: roles
        # Leave the failed iteration's step result unset — compileReport
        # renders the sparse entry as an Alert card.
        #
        # :catch receives no error object (controlTry discards it and there is
        # no _error operator), so the gate's message cannot reach the Alert and
        # the viewer gets an honest generic description. This log line is
        # therefore the ONLY place the failure is diagnosable, so it carries
        # enough to identify which query failed for whom. `section_type: filter`
        # means an optionsQuery failed rather than a data section.
        :catch:
          - :log:
              msg: A report section pipeline failed validation or execution for this viewer.
              report_id:
                _payload: urlQuery.report_id
              section_id:
                _item: section.id
              section_type:
                _item: section.type
              collection:
                _item: section.query.collection
  # compileReport's arguments, held once for the two compiles below.
  - :set_state:
      compile:
        spec:
          title:
            _step: load_report.title
          description:
            _step: load_report.description
          sections:
            _step: load_report.spec.sections
        results:
          _step: run_query
        # Catalog is used ONLY to resolve select-filter options from a field's
        # enum values (a display convenience) — not as a security gate.
        catalog:
          _module.var: catalog
        roles:
          _user: roles
        endpointId:
          _module.endpointId: query-data
        # A filtered chart section re-queries here instead: Flint inlines the
        # rows into the option, so the server returns a re-assembled option.
        chartEndpointId:
          _module.endpointId: chart-data
        # The compiler renders a provenance line under the title and gates
        # owner-only chat affordances on these. is_owner repeats the :return's
        # expression; conversation_id is passed as-is so its absence reads as
        # no chat.
        created:
          _step: load_report.created
        updated:
          _step: load_report.updated
        owner:
          _step: load_report.owner
        visibility:
          _step: load_report.visibility
        conversation_id:
          _step: load_report.conversation_id
        is_owner:
          _eq:
            - _step: load_report.owner.user_id
            - _user: id
        # Drives the header's ★ fill and the payload its click sends (the
        # endpoint takes the desired state, not a toggle). Derived per viewer
        # and never returned as the raw array — a caller must not learn who
        # else favourited a report. Absent reads as empty.
        is_favourite:
          _array.includes:
            - _if_none:
                - _step: load_report.favourite_of
                - []
            - _user: id
        # Whether this viewer may publish — the header's ⋯ includes or leaves out
        # its Publish and Unpublish items on it. Decided here because share_roles
        # is a module var and only the config can read it; the compiler gets a
        # boolean, so no `_user` operator has to survive into compiled output.
        # An unset share_roles compiles to a literal false (hasSomeRoles throws on
        # a non-array), the same guard set-report-visibility's own control uses.
        can_share:
          _build.if:
            test:
              _build.ne:
                - _module.var: share_roles
                - null
            then:
              _user.hasSomeRoles:
                _module.var: share_roles
            else: false
        # Whether the header carries the AI summary button and the filters
        # write the drawer's `summary.*` state. A module var, so only the
        # config can read it; the compiler gets a boolean, like can_share.
        ai_summary:
          _module.var: ai_summary
        resolvedAt:
          _date: now
        # Both themes, as plain data, because the choice between them cannot
        # be made here: `_media` is a CLIENT operator, so a `_if` on dark mode
        # written into this routine would be evaluated server-side, where
        # there is no viewport to ask. compileReport emits the switch into the
        # chart block instead, where the browser resolves it per render — so a
        # reader toggling dark mode re-inks the charts without a re-resolve.
        #
        # Loaded here rather than by compileReport because compileReport is
        # plugin JS and cannot _ref module YAML itself. (The chat card and
        # expand modal never pass through compileReport at all; they _ref the
        # same two files directly and make the same choice in page config.)
        theme:
          light:
            _ref: defaults/chart_theme_light.yaml
          dark:
            _ref: defaults/chart_theme_dark.yaml
        # The policy's own size limit: sections that would take the content
        # over it render as Alerts rather than failing the whole report.
        maxBytes:
          _ref:
            path: components/report_policy.yaml
            key: limits.bytes
  # compileReport's blocks are data built from the stored spec, and a Dynamic
  # endpoint may return data as blocks only once a ValidateDynamic step has
  # checked them against the Dynamic block's own policy. The policy checks every
  # string the blocks carry, row values included, so the first check does not
  # throw: each refusal it reports is mapped back to the section that produced
  # it, and that section compiles as an Alert on the second pass. Refusals in
  # the header, or on the content as a whole, still fail the second check, and
  # the page renders its fallback.
  - id: check_blocks
    type: ValidateDynamic
    properties:
      policy:
        _ref: components/report_policy_id.yaml
      throwOnInvalid: false
      blocks:
        _analytics.compileReport:
          _state: compile
  - :if:
      _step: check_blocks.valid
    :then:
      - :return:
          _ref:
            path: api/steps/resolve_report_return.yaml
            vars:
              blocks:
                _step: check_blocks.blocks
  - :log:
      msg: The report policy refused part of a compiled report; the sections involved render as Alerts.
      report_id:
        _payload: urlQuery.report_id
      errors:
        _step: check_blocks.errors
  - id: validate_blocks
    type: ValidateDynamic
    properties:
      policy:
        _ref: components/report_policy_id.yaml
      blocks:
        _analytics.compileReport:
          _object.assign:
            - _state: compile
            - policyErrors:
                _step: check_blocks.errors
  - :return:
      _ref:
        path: api/steps/resolve_report_return.yaml
        vars:
          blocks:
            _step: validate_blocks.blocks
