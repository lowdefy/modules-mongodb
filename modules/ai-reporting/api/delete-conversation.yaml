# Owner-scoped delete from the chat page's conversations rail.
#
# The row stays as a stamped stub (see docs/shared/soft-delete.md) so the rail
# and a reopened deep link both read it as gone, but its text goes in the same
# write: messages, data_parts and title are what the user typed and what the
# data said, and the chat tells them the conversation is deleted. The stub is
# removed by the TTL index on created.timestamp (reference/indexes.md). The
# writers (save-conversation, set-conversation-title, emit-data-parts) skip a
# deleted row, so a reply finishing after this cannot write the text back.
#
# The stamp comes from this module's own defaults/change_stamp.yaml rather
# than the events module's exported component, because reporting declares no
# dependencies. The shape is identical either way.
id: delete-conversation
type: Api
routine:
  - :if:
      _eq:
        - _user: id
        - null
    :then:
      - :reject: You must be signed in to delete a conversation.
  - id: delete
    type: MongoDBUpdateOne
    connectionId:
      _module.connectionId: conversations-store
    properties:
      # Already-deleted conversations are excluded so a repeat delete reports
      # 0 modified rather than overwriting the original stamp's who/when.
      filter:
        _id:
          _payload: conversationId
        owner.user_id:
          _user: id
        deleted.timestamp:
          $exists: false
      # Authorization lives in this filter, so a caller who may not do this
      # matches nothing — the expected outcome, not a fault. Without this flag
      # the request THROWS on a zero match, and the error body hands that caller
      # the filter, this file path and a stack trace. A zero modifiedCount
      # discloses nothing.
      disableNoMatchError: true
      update:
        $set:
          deleted:
            _ref: defaults/change_stamp.yaml
        $unset:
          messages: ""
          data_parts: ""
          title: ""
  - :return:
      ok: true
      deletedCount:
        _step: delete.modifiedCount
