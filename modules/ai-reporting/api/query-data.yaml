# The open query endpoint — one endpoint, three consumers: the agent's
# query_data tool, report filter re-queries for kpi and table sections
# (CallAPI — chart sections re-query chart-data instead, which returns an
# assembled option rather than rows), and panel downloads.
# A report names its section (`report_id` + `section_id`) instead of sending a
# query; the stored query is loaded here (steps/load_report_section.yaml).
# The AnalyticsPipeline request is the single security boundary: it validates
# the AI-authored pipeline against the catalog (bound at the connection) and
# the user's roles, prepends the filter $match, and runs it read-only.
# The filter triples are untrusted client input (a re-query is a browser-side
# CallAPI) — contained because the server builds the $match from a fixed op
# map and the combined pipeline is revalidated through the same walk.
id: query-data
type: Api
description: >
  Run an AI-authored, allowlist-validated read-only aggregation pipeline
  against a cataloged collection. Never raw database access — the pipeline is
  reconstructed and revalidated before execution. Returns result rows.
payloadSchema:
  type: object
  anyOf:
    - required:
        - query
    - required:
        - report_id
        - section_id
  properties:
    report_id:
      type: string
      description: A saved report whose section's stored query to run, instead of `query`.
    section_id:
      type: string
      description: The section of `report_id` whose stored query to run.
    query:
      type: object
      description: The collection and pipeline to run.
      required:
        - collection
        - pipeline
      properties:
        collection:
          type: string
          description: Catalog-declared base collection the pipeline reads from.
        pipeline:
          type: array
          description: Read-only MongoDB aggregation pipeline stages.
    filters:
      type: array
      description: >
        Report filter triples applied as a leading $match before the pipeline
        (report filter re-queries only). Values arrive as deferred __state
        reads resolved client-side; null/undefined values drop the triple, and
        so does an empty array. A value may itself be an array — a multiselect
        selection compiled to $in/$all.
      items:
        type: object
        required:
          - field
          - op
          - value
        properties:
          field:
            type: string
          op:
            type: string
          value: {}
routine:
  # Catalog entries with no `roles` are readable by any AUTHENTICATED user, so
  # the engine's role gate assumes there is a user. Lowdefy endpoints are
  # public unless the app protects them, so every endpoint that reads app data
  # (this one and chart-data) carries this guard — without it an unprotected
  # app exposes every role-less cataloged collection to anonymous callers.
  - :if:
      _eq:
        - _user: id
        - null
    :then:
      - :reject: You must be signed in to query data.
  - :if:
      _ne:
        - _payload: report_id
        - null
    :then:
      - _ref: api/steps/load_report_section.yaml
      - :if:
          _eq:
            - _step: report_section.0
            - null
        :then:
          - :reject: Report section not found.
  - id: run_query
    type: AnalyticsPipeline
    connectionId:
      _module.connectionId: reporting-data
    properties:
      query:
        _if:
          test:
            _ne:
              - _payload: report_id
              - null
          then:
            _step: report_section.0.query
          else:
            _payload: query
      filters:
        _payload: filters
      roles:
        _user: roles
  - :return:
      _step: run_query
