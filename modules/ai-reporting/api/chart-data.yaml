# Chart re-queries only: one chart section, re-run under the live filter values.
# Returns an assembled ECharts option rather than rows because Flint inlines the
# data into the option in type-dependent shapes and derives layout from the
# actual labels — new rows cannot be swapped into a compiled option client-side.
# The presentation spec arrives in the payload from a browser-side CallAPI, so it
# is untrusted client input and is revalidated below. The security boundary is
# unchanged: AnalyticsPipeline validates the pipeline against the catalog (bound
# at the connection) and the user's roles, prepends the filter $match, and runs
# it read-only.
id: chart-data
type: Api
description: >
  Re-run one chart section's allowlist-validated read-only aggregation pipeline
  under the report's live filter values and return the assembled ECharts option
  with the canvas height its layout needs.
payloadSchema:
  type: object
  required:
    - chart
    - title
    - x
    - y
    - query
  properties:
    chart:
      type: string
      description: Chart kind.
    title:
      type: string
      description: Chart title.
    x:
      type: string
      description: The output column used for the category axis (pie item name).
    y:
      type: array
      description: The output column(s) holding the numeric value series.
      items:
        type: string
    stacked:
      type: boolean
      description: Bar charts only — stack the value series instead of grouping them.
    width:
      type: number
      minimum: 200
      maximum: 4000
      description: >
        The pixel width the chart block is drawn at, which decides legend
        orientation and axis label rotation. Untrusted like the rest of this
        payload and only bounded, not verified: a lied-about width costs nothing
        but a chart laid out for a canvas it is not on, and the bounds are here
        so the layout arithmetic stays sane. Omitted, assembly falls back to the
        full report column.
    colors:
      type: object
      additionalProperties:
        type: string
        pattern: "^#[0-9a-fA-F]{6}$"
      description: >
        The report's colour identity map, name to hex: the hue each series or
        pie slice wears in every section of the report that names it. Sent so a
        re-query repaints nothing — it was decided over the unfiltered rows, and
        re-deriving it from whatever the filter left would give a series the hue
        of its new rank. Untrusted like the rest of this payload and, being
        purely aesthetic, only shape-checked: a lied-about map costs nothing but
        a differently coloured chart, and the hex pattern is here so the values
        reach ECharts as colours rather than as arbitrary strings. Omitted,
        assembly falls back to palette order within each chart.
    query:
      type: object
      description: The collection and pipeline to run.
      required:
        - collection
        - pipeline
      properties:
        collection:
          type: string
          description: Catalog-declared base collection the pipeline reads from.
        pipeline:
          type: array
          description: Read-only MongoDB aggregation pipeline stages.
    filters:
      type: array
      description: >
        Report filter triples applied as a leading $match before the pipeline
        (report filter re-queries only). Values arrive as deferred __state
        reads resolved client-side; null/undefined values drop the triple, and
        so does an empty array. A value may itself be an array — a multiselect
        selection compiled to $in/$all.
      items:
        type: object
        required:
          - field
          - op
          - value
        properties:
          field:
            type: string
          op:
            type: string
          value: {}
routine:
  # Catalog entries with no `roles` are readable by any AUTHENTICATED user, so
  # the engine's role gate assumes there is a user. Lowdefy endpoints are
  # public unless the app protects them, so every endpoint that reads app data
  # (this one and query-data) carries this guard — without it an unprotected
  # app exposes every role-less cataloged collection to anonymous callers.
  - :if:
      _eq:
        - _user: id
        - null
    :then:
      - :reject: You must be signed in to query data.
  # No catalog: the grammar and role gate run inside AnalyticsPipeline at
  # execution time. This checks the contract's own shape — chart kind, inert
  # title/x/y strings, query shape — before anything runs.
  - :set_state:
      spec:
        _analytics.validateChartSpec:
          spec:
            chart:
              _payload: chart
            title:
              _payload: title
            x:
              _payload: x
            y:
              _payload: y
            stacked:
              _payload: stacked
            query:
              _payload: query
          roles:
            _user: roles
  - id: run_query
    type: AnalyticsPipeline
    connectionId:
      _module.connectionId: reporting-data
    properties:
      query:
        _state: spec.query
      filters:
        _payload: filters
      roles:
        _user: roles
  - :return:
      _analytics.buildFlintOption:
        chart:
          _state: spec.chart
        x:
          _state: spec.x
        y:
          _state: spec.y
        stacked:
          _state: spec.stacked
        width:
          _payload: width
        colors:
          _payload: colors
        rows:
          _step: run_query
