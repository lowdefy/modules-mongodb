# The single source of a saved report document. Both creation endpoints (the agent's
# generate-report tool and the page's create-report) _ref this, so the stored shape lives
# in one place. Every field below is a fixed insert default except the four the caller
# supplies as vars: the validated title/description/sections and the conversation_id.
#
# title/description/sections are passed as the caller's runtime operators (e.g.
# { _state: validated.title }) rather than a single `validated` object: _ref vars are
# substituted at build time, so a fragment-side dot access like `_var: validated.title`
# into a passed operator resolves to null, not to the operator's future value. Each field
# therefore takes the leaf operator directly, in operator position.
_id:
  _uuid: true
owner:
  _ref: defaults/owner.yaml
# Off the VALIDATED object, not the payload: the validator caps the title
# length and rejects a non-string description, so reading the payload
# would store a value it had already normalized past.
title:
  _var: title
description:
  _var: description
spec:
  sections:
    _var: sections
# What a future compatibility branch or a migration keys on. It cannot be
# backfilled meaningfully later — an existing document gives no way to
# tell which grammar it was written against — so it is written on insert
# by every creator. Nothing branches on it yet.
spec_version: 1
# Private until deliberately published by set-report-visibility. Absent
# reads as private everywhere, so this is a shape convenience.
visibility: private
# Per-user favourite markers, projected to a boolean for the caller so
# nobody learns who else favourited a report. $addToSet / $pull only.
favourite_of: []
conversation_id:
  _var: conversation_id
# Initialised so live documents have a consistent shape; delete-report
# replaces it with a change stamp (docs/shared/soft-delete.md).
deleted: null
created:
  _ref: defaults/change_stamp.yaml
updated:
  _ref: defaults/change_stamp.yaml
