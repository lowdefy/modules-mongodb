name: AI Chat Reporting
version: 0.36.0
description: >
  Chat to your data and generate saved, navigable reports. Ships a reporting
  agent chat surface, a constrained query engine over an app-supplied data
  dictionary, and report pages compiled server-side from AI-generated report
  specs.

dependencies:
  - id: layout
    description: >-
      Page layout wrapper. Every reporting page renders through layout's `page`
      component so the module sits in the host app's chrome (sider, menu,
      profile, notifications) like every other module.

exports:
  pages:
    - id: chat
      description: Conversational surface — AgentChat with charts/downloads panel
    - id: reports-list
      description: Saved reports with open and delete
    - id: report
      description: Report renderer (Dynamic block over resolve-report)
    - id: reports-deleted
      description: Recover soft-deleted reports (restore to private)
  api:
    - id: query-data
      description: Constrained analytics query (report re-queries + panel downloads)
    - id: chart-data
      description: Assemble a chart section's ECharts option under live filter values
    - id: list-reports
      description: List a viewer's reports for a given scope (mine, shared, all, favourites, deleted)
    - id: generate-report
      description: Validate and persist a report spec (agent tool)
    - id: create-report
      description: Validate and persist a report spec from the chat page (records conversation_id)
    - id: set-report-visibility
      description: Publish a saved report to the app, or retract it
    - id: set-report-title
      description: Edit a saved report's title, and optionally its description (owner only)
    - id: restore-report
      description: Bring a soft-deleted report back, as private (owner only)
    - id: set-report-favourite
      description: Star or unstar a readable report, per user
    - id: duplicate-report
      description: Copy a readable report into a private one the caller owns
    - id: remove-report-section
      description: Drop one section from a report, cascading filter bindings (owner only)
    - id: delete-report
      description: Soft-delete a report the caller owns (recoverable from the deleted scope)
  connections:
    - id: reports-store
      description: MongoDB collection for saved report specs
    - id: conversations-store
      description: MongoDB collection for chat conversations
    - id: reporting-data
      description: Read-only ReportingData connection over the app's data
    - id: ai
      description: AI gateway provider connection (remap to reuse an existing one)

vars:
  catalog:
    type: object
    required: true
    description: >
      The collections catalog — the data dictionary AND the
      confidentiality/authorization boundary. A map keyed by collection name
      (`{ [collectionName]: { roles, description, fields, relationships } }`);
      `collection` and every `$lookup.from` in an AI-authored pipeline must be
      a key of this map, and the engine enforces the union of the touched
      collections' `roles` (base plus all lookups, recursively). Declaring a
      collection here is the act of exposing it. Per-entry keys — `roles`
      (optional string[] of user roles allowed to query this collection;
      ABSENT or EMPTY means any authenticated user may query it — role-gating
      is opt-in), `description` (what the collection holds — prompt material
      for the agent), `fields` (optional map of field name → `{ type: one of
      string|number|boolean|date|object|array, description, values (optional
      enum values — feeds report select-filter options), and the optional
      display hints format, currency, locale, decimals — prompt material the
      agent copies into presentation contracts, never enforcement }`), and
      `relationships` (optional array of `{ field, collection, foreignField }`
      declaring which fields join to which collections so the agent can author
      correct `$lookup`s). Feeds the agent's instructions at build time and is
      the allowlist every pipeline validates against. To expose a collection
      while hiding some fields (or to pre-bake array/object-array/cross-
      collection joins at a fixed grain), declare a read-only MongoDB view as
      a first-class catalog entry — see the "reporting over complex data"
      guide.
  app_context:
    type: string
    description: >
      Project context injected verbatim into the reporting agent's
      instructions, under an "About this application" heading between the
      agent's role and the pipeline-authoring rules. Use it for what the
      catalog cannot express: what the app is for, domain vocabulary and
      synonyms users will type, business rules the agent should assume (fiscal
      year, which statuses count as "open", how "active" is defined), and
      preferences for how to answer. Markdown is fine. Omitted from the prompt
      entirely when not set — the agent works without it, and it is never
      validation: nothing here widens what the agent may query, which remains
      exactly what `catalog` declares.
  reports_collection:
    type: string
    default: report_layouts
    description: >
      Collection name for saved report specs.

      The default is `report_layouts` although this module and every endpoint
      call them reports — the name is left over from an earlier concept and is
      deliberately NOT renamed: changing the default would silently point an
      existing app at an empty collection.
  share_roles:
    type: array
    description: >
      User roles whose holders may publish a saved report to the whole app. A
      string array — more than one role can legitimately carry the privilege.
      Checked server-side by set-report-visibility, never in the UI: a hidden
      menu item is an affordance, the match in the endpoint is the
      authorization.

      Publishing and unpublishing are gated differently, deliberately.
      Publishing requires the caller to be the report's owner AND to hold one of
      these roles. Unpublishing requires the caller to be the owner OR to hold
      one of them — so a share_roles holder can retract a report they do not own
      (anyone trusted to decide what the whole app sees is trusted to decide it
      should stop seeing something), and a report stays retractable after its
      author's role is revoked, after the author leaves, or after this var is
      removed. There is no equivalent power to publish, rename, delete or edit
      someone else's report.

      Unset means nothing can be published: every publish call is rejected and
      no publish control renders anywhere. It is NOT a retroactive switch —
      reports already shared stay listed and readable, and their owners can
      still unpublish them.
  conversations_collection:
    type: string
    default: conversations
    description: Collection name for chat conversations.
  model:
    type: string
    default: anthropic/claude-sonnet-5
    description: >
      Gateway model id (provider/model) for the reporting assistant, e.g.
      anthropic/claude-sonnet-5 or anthropic/claude-haiku-4.5.
  welcome:
    type: object
    description: >
      Copy for the chat page's empty state — the surface that teaches both of
      the module's jobs, asking a question and building a report. Six leaves:
      a title, a line naming what the assistant can see, and a label plus a
      starter-prompt list per job track. This copy feeds the AgentChat block's
      `welcome` property, which the chat page maps to a two-track shape: the
      block renders the tracks in-flow as the transcript's leading item, so the
      empty state scrolls up with the conversation and stays reachable by
      scrolling back rather than being hidden on the first send.
    properties:
      title:
        type: string
        default: Ask about your data
        description: The heading shown above both starter tracks.
      data_scope:
        type: string
        description: >
          One line naming what the assistant can see, in the words this
          app's users use — e.g. "I can see your orders, customers and
          shipments." NO default: there is no generic sentence true of every
          app, and a wrong one is a promise the agent then fails to keep, so
          when unset the line is simply not rendered — it never falls back to
          collection names. Deliberately not derived from `catalog`: a
          collection is not an entity a user recognises (one collection can
          span several entities a user asks about by name, several
          collections can be one entity to a user, and a collection can be
          internal plumbing that should never appear in a welcome), and
          `catalog`'s per-collection `description` is prompt material for the
          agent, not copy written for a person.
      explore_label:
        type: string
        default: Get an answer
        description: >
          Heading over the "ask a question" track's starters. An app whose
          users would not describe the module's other job as building a
          "report" should override this alongside `report_label`.
      explore_starters:
        type: array
        default:
          - What does this data cover?
          - Show me the most recent records.
          - What are the top 5 by count?
        description: >
          Starter prompts for the "ask a question" track — a string array.
          Clicking a starter fills the composer rather than sending it, which
          is what makes a generic shipped default safe: a near-miss is an
          editable first draft, not a message the user never meant to send.
      report_label:
        type: string
        default: Build a report
        description: >
          Heading over the "build a report" track's starters. An app whose
          users do not call the output a "report" should override this
          alongside `explore_label`.
      report_starters:
        type: array
        default:
          - Build a report showing trends over time.
          - Build a report comparing categories side by side.
        description: >
          Starter prompts for the "build a report" track — a string array.
          Clicking a starter fills the composer rather than sending it, which
          is what makes a generic shipped default safe: a near-miss is an
          editable first draft, not a message the user never meant to send.

secrets:
  - name: REPORTING_MONGODB_URI
    description: MongoDB URI for report and conversation storage.
  - name: REPORTING_DATA_MONGODB_URI
    description: MongoDB URI for the app data the data dictionary describes.
  - name: AI_GATEWAY_API_KEY
    description: >
      API key for the bundled ai gateway connection. Not needed when the
      app remaps the ai connection to its own provider connection.

plugins:
  - name: "@lowdefy/community-plugin-mongodb"
    version: "^3"
  - name: "@lowdefy/modules-mongodb-plugins"
    version: "^0.36.0"
  # The `ai` connection (AIGateway) and the reporting assistant (AIGatewayAgent)
  # are both types from this package, so the module declares it rather than
  # leaving the host app to know it needs it. Pinned exactly: 5.5.1's
  # buildAgentTools keys agent tools by endpointId instead of the configured
  # name, and a module-scoped endpoint id contains `/`, which the provider's
  # tool-name pattern rejects with a 400 on every chat turn.
  - name: "@lowdefy/connection-ai-gateway"
    version: 0.0.0-experimental-20260814133003

connections:
  - _ref: connections/reports-store.yaml
  - _ref: connections/conversations-store.yaml
  - _ref: connections/reporting-data.yaml
  - _ref: connections/ai.yaml

api:
  - _ref: api/query-data.yaml
  - _ref: api/chart-data.yaml
  # Deliberately absent from exports.api: it exists for the agent, and a
  # consumer calling it directly would be calling the wrong one of the two.
  - _ref: api/query-data-tool.yaml
  - _ref: api/render-chart.yaml
  - _ref: api/render-table.yaml
  - _ref: api/export-data.yaml
  - _ref: api/generate-report.yaml
  - _ref: api/create-report.yaml
  - _ref: api/resolve-report.yaml
  - _ref: api/save-conversation.yaml
  - _ref: api/emit-data-parts.yaml
  - _ref: api/list-conversations.yaml
  - _ref: api/get-conversation-results.yaml
  - _ref: api/set-conversation-title.yaml
  - _ref: api/delete-conversation.yaml
  - _ref: api/list-reports.yaml
  - _ref: api/delete-report.yaml
  - _ref: api/set-report-visibility.yaml
  - _ref: api/set-report-title.yaml
  - _ref: api/restore-report.yaml
  - _ref: api/set-report-favourite.yaml
  - _ref: api/duplicate-report.yaml
  - _ref: api/remove-report-section.yaml

agents:
  - _ref: agents/reporting-assistant.yaml

pages:
  - _ref: pages/chat.yaml
  - _ref: pages/reports-list.yaml
  - _ref: pages/reports-deleted.yaml
  - _ref: pages/report.yaml
