# Open the rename form, filled from `selected_report`.
#
# The fill happens here rather than at the caller so neither surface has to seed
# these paths alongside selected_report. They are separate state paths on purpose
# — typing in the form must not change the name the delete confirm shows — but
# they have to START from the current values, and the only version that is
# current is the one the menu itself is reading. Seeded by the caller instead,
# the report page's compiled literal is frozen at resolve, so a rename saved a
# moment ago comes back stale the next time ⋯ is opened.
- id: report_rename_seed
  type: SetState
  params:
    rename_title:
      _state: selected_report.title
    # Absent description reads as null; the TextArea wants "".
    rename_description:
      _if_none:
        - _state: selected_report.description
        - ""
- id: report_rename_open
  type: CallMethod
  params:
    blockId: rename_modal
    method: setOpen
    args:
      - open: true
