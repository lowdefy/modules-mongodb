# The chart card's ⤢, opened with CallMethod(setOpen, { open: true }) once the
# clicked card has been seeded into `expanded_chart`. What the expand buys is
# WIDTH — the panel column is 420px, this dialog is 75% of the viewport. The
# height stays the part's own: the Flint compiler sized the axis furniture for
# these labels in the same pass that produced the option, so the option only
# fits at the height it returned (the card binds it the same way).
#
# Never hidden with `visible:`. Hiding a container deletes the state of every
# block beneath it, and that pass runs on every state change — so the seeded
# card would be deleted before the modal could open with it. A closed antd
# Modal is already invisible; the block stays visible.
id: expand_chart_modal
type: Modal
layout:
  gap: 16
properties:
  title:
    _state: expanded_chart.title
  width: "75%"
  # View-only: there is nothing to confirm, so no Ok/Cancel row — closing is
  # the X, the mask, or Esc.
  footer: false
blocks:
  - id: expanded_chart_view
    type: EChart
    properties:
      height:
        _if_none:
          - _state: expanded_chart.height
          - 300
      option:
        _state: expanded_chart.option
      theme:
        _ref: defaults/chart_theme.yaml
  # The option is a snapshot of the turn that produced it, so the expanded view
  # dates itself exactly as the card does. A leaf, so `visible:` is safe; parts
  # written before `created` existed render with no date line rather than a
  # blank one.
  - id: expanded_chart_as_of
    type: Paragraph
    visible:
      _ne:
        - _if_none:
            - _state: expanded_chart.created
            - null
        - null
    properties:
      content:
        _nunjucks:
          template: "as of {{ d }}"
          on:
            d:
              _dayjs:
                - _if_none:
                    - _state: expanded_chart.created
                    - 0
                - format: D MMMM
      style:
        fontSize: 12px
        color: var(--ant-color-text-secondary)
        marginBottom: 0
