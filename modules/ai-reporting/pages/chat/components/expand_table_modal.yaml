# The table card's ⤢, opened with CallMethod(setOpen, { open: true }) once the
# clicked card has been seeded into `expanded_table`. A wider, taller grid than
# the 420px card can afford — the rows are still the frozen snapshot the turn
# produced, so the truncation and as-of lines travel with it.
#
# Never hidden with `visible:`. Hiding a container deletes the state of every
# block beneath it, and that pass runs on every state change — so the seeded
# card would be deleted before the modal could open with it. A closed antd
# Modal is already invisible; the block stays visible.
id: expand_table_modal
type: Modal
layout:
  gap: 16
properties:
  title:
    _state: expanded_table.title
  width: "75%"
  # View-only: there is nothing to confirm, so no Ok/Cancel row — closing is
  # the X, the mask, or Esc.
  footer: false
blocks:
  # Same wording as the card's truncation line: a bigger grid reads as more
  # complete, so the cap matters more here, not less. Hidden when the part
  # holds every row it counted (see table_card.yaml for the `_if_none`
  # fallback's role with parts that predate `row_count`).
  - id: expanded_table_truncation
    type: Paragraph
    visible:
      _gt:
        - _if_none:
            - _state: expanded_table.row_count
            - _array.length:
                _state: expanded_table.rows
        - _array.length:
            _state: expanded_table.rows
    properties:
      content:
        _nunjucks:
          template: >-
            first {{ shown }} of {{ total }} rows{% if capped %} — first {{
            cap }} rows{% endif %}
          on:
            shown:
              _array.length:
                _state: expanded_table.rows
            total:
              _if_none:
                - _state: expanded_table.row_count
                - _array.length:
                    _state: expanded_table.rows
            capped:
              _gte:
                - _if_none:
                    - _state: expanded_table.row_count
                    - 0
                - 1000
            cap: 1000
      style:
        fontSize: 12px
        color: var(--ant-color-text-secondary)
        marginBottom: 0
  - _ref:
      path: pages/chat/components/table_grid.yaml
      vars:
        grid_id: expanded_table_grid
        rows_path: expanded_table.rows
        columns_path: expanded_table.spec.columns
        height: 600
  # Dates the snapshot exactly as the card does. A leaf, so `visible:` is safe;
  # parts written before `created` existed render with no date line rather than
  # a blank one.
  - id: expanded_table_as_of
    type: Paragraph
    visible:
      _ne:
        - _if_none:
            - _state: expanded_table.created
            - null
        - null
    properties:
      content:
        _nunjucks:
          template: "as of {{ d }}"
          on:
            d:
              _dayjs:
                - _if_none:
                    - _state: expanded_table.created
                    - 0
                - format: D MMMM
      style:
        fontSize: 12px
        color: var(--ant-color-text-secondary)
        marginBottom: 0
