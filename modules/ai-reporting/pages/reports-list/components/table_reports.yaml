# The reports grid. Fed the whole scope via rowData and left to search / sort /
# page it client-side, the way every other module list here feeds its grid.
# Only the Report column opens the report — its title is styled as a link. A
# whole-row open was the first cut, but a buttons cell can't suppress it: AgGrid's
# native cell listener fires before the button's React stopPropagation, so the ★
# and ⋯ cells opened the row underneath them. Gating the open on the Report
# column sidesteps the event-ordering entirely; the ★ and ⋯ fire their own events.
id: reports_table
type: AgGridBalham
properties:
  height: 70vh
  # Client-side pagination over the already-loaded scope — not the server paging
  # this design dropped, just AgGrid rendering the whole scope a page at a time.
  # It keeps a few-hundred-row grid light, and its footer's "1–25 of N" doubles
  # as the report count (N tracks the current search, since rowData is filtered).
  pagination: true
  paginationPageSize: 25
  paginationPageSizeSelector:
    - 25
    - 50
    - 100
  # When a search empties the grid, this overlay is the no-match state — the page
  # carries no separate empty_search block; the toolbar holds the clear / widen
  # actions whenever a term is present.
  overlayNoRowsTemplate: No matching reports
  # The grid filters its own rowData off the search term. The block's quick filter
  # is dead in this version (AgGrid.js applies quickFilterValue only behind an
  # unsatisfiable guard), and doing it here keeps filtering a pure function of
  # page state — typing re-runs this _js, with no stored filtered list to keep in
  # sync. The star column resolves its icon per row through iconField, so each row
  # carries its favourite-state icon — a display map, not a field the endpoint owns.
  rowData:
    _js: |
      const q = (state('search') || '').toLowerCase().trim();
      const rows = state('reports') || [];
      const matched = q
        ? rows.filter((r) =>
            `${r.title || ''} ${r.description || ''}`.toLowerCase().includes(q)
          )
        : rows;
      const pill = (n, label) => (n > 0 ? `${n} ${label}${n > 1 ? 's' : ''}` : null);
      // Seeded once at mount from share_roles, which is a build-time module var
      // and so unreachable from here. Viewer-level, not per-row: it is the same
      // answer for every report on the page.
      const canShare = state('can_share') === true;
      return matched.map((report) => {
        const sc = report.section_counts || {};
        const shared = report.visibility === 'shared';
        return {
          ...report,
          fav_icon: report.is_favourite ? 'AiFillStar' : 'AiOutlineStar',
          // hide_* rather than can_*, because the menu cell's hiddenField takes
          // the value it hides on. Publish needs a share_roles holder and a report
          // that is still private; Unpublish is the one item whose test has two
          // inputs — a holder may retract a report they do not own.
          hide_rename: !report.is_owner,
          hide_publish: !(report.is_owner && !shared && canShare),
          hide_unpublish: !(shared && (report.is_owner || canShare)),
          hide_delete: !report.is_owner,
          // Pre-built label array for the Contents tag cell — one entry per
          // non-zero section type, filter last. section_counts is an object, so
          // the pills have to be assembled here rather than fed to the cell raw.
          contents: [
            pill(sc.kpi, 'KPI'),
            pill(sc.chart, 'chart'),
            pill(sc.table, 'table'),
            pill(sc.markdown, 'note'),
            pill(sc.download, 'export'),
            pill(report.filter_count, 'filter'),
          ].filter(Boolean),
        };
      });
  defaultColDef:
    resizable: true
    cellStyle:
      wordBreak: break-word
      lineHeight: 1.25
      paddingBottom: 8px
      paddingTop: 8px
  columnDefs:
    # ★ — filled or outline per row via iconField (fav_icon). Fires onFavouriteClick.
    - colId: star
      headerName: ""
      width: 52
      sortable: false
      cellStyle:
        textAlign: center
      cell:
        type: buttons
        buttons:
          - eventName: onFavouriteClick
            iconField: fav_icon
            hideTitle: true
            type: text
    # Report — title over a muted description, the user-admin two-line pattern.
    # This is the one column that opens the report (see onCellClick), so its
    # title reads as a link and its cell carries the pointer cursor.
    - field: title
      colId: report
      headerName: Report
      flex: 1
      minWidth: 260
      wrapText: true
      autoHeight: true
      cellStyle:
        cursor: pointer
      cellRenderer:
        _function:
          __nunjucks:
            template: >-
              <div style="font-weight:600;color:var(--ant-color-link)">{{ title }}</div>{% if description %}<div style="font-size:12px;color:var(--ant-color-text-secondary)">{{ description }}</div>{% endif %}
            on:
              __args: 0.data
    # Contents — one pill per non-zero section type, filter last. The pill labels
    # are pre-built into a string array in rowData (contents) because a tag cell
    # takes an array or scalar, and section_counts is an object. Uniform colour:
    # colorMap keys on the pill text, and the text carries counts, so there is no
    # stable token to two-tone the filter pill against — default blue for all.
    - colId: contents
      field: contents
      headerName: Contents
      minWidth: 220
      flex: 1
      sortable: false
      wrapText: true
      autoHeight: true
      cell:
        type: tag
        default: blue
    # Author — the owner.name snapshot, shown wherever rows can come from other
    # people (Shared, Favourites, All). Hidden only on Mine, where every row is
    # the viewer's own and the column would just repeat their name.
    - field: owner.name
      headerName: Author
      width: 160
      hide:
        _eq:
          - _state: scope
          - mine
    - field: updated.timestamp
      headerName: Updated
      width: 130
      cell:
        type: date
        format: D MMM YYYY
    - field: visibility
      headerName: Visibility
      width: 120
      cell:
        type: tag
        colorMap:
          shared: blue
          private: default
    # ⋯ — the row action menu, as a real popover. Which items a row shows is a
    # display choice off the hide_* booleans rowData computes above; the
    # authorization is the check in each endpoint, so an item shown in error is a
    # display bug, not a security one. Every item's behaviour lives in
    # actions/report_*.yaml, shared with the report page's own ⋯ (which cannot use
    # a cell — it is not a grid).
    - colId: menu
      headerName: ""
      width: 52
      sortable: false
      cellStyle:
        textAlign: center
      cell:
        type: menu
        items:
          - eventName: onMenuOpen
            title: Open
            icon: AiOutlineFileText
          - eventName: onMenuRename
            title: Rename
            icon: AiOutlineEdit
            hiddenField: hide_rename
          - eventName: onMenuPublish
            title: Publish to the app
            icon: AiOutlineGlobal
            hiddenField: hide_publish
          - eventName: onMenuUnpublish
            title: Unpublish
            icon: AiOutlineEyeInvisible
            hiddenField: hide_unpublish
          - eventName: onMenuDuplicate
            title: Duplicate
            icon: AiOutlineCopy
          - eventName: onMenuDelete
            title: Delete
            icon: AiOutlineDelete
            danger: true
            hiddenField: hide_delete
events:
  # Only the Report column opens — see the header comment for why it is a cell
  # event gated on colId rather than a whole-row click. Other columns (Author,
  # Updated, Visibility) are inert; the ★ and ⋯ cells run their own events.
  onCellClick:
    - id: open_report
      type: Link
      skip:
        _ne:
          - _event: colId
          - report
      params:
        pageId:
          _module.pageId: report
        urlQuery:
          report_id:
            _event: row._id
  # set-report-favourite takes the desired state, not a toggle, so send the
  # negation of the row's current one. Refetch so an unstar on the Favourites
  # scope drops the row and the default favourite-first order re-tiers.
  onFavouriteClick:
    _build.array.concat:
      - - id: toggle_favourite
          type: CallAPI
          params:
            endpointId:
              _module.endpointId: set-report-favourite
            payload:
              report_id:
                _event: row._id
              favourite:
                _not:
                  _event: row.is_favourite
      - _ref: pages/reports-list/actions/load_scope.yaml
  # One handler per menu item. Each starts by parking the clicked row in
  # `selected_report`, because the rename and delete modals fire their own onOk
  # with an empty event and cannot read the row from there. list-reports projects
  # description, so the rename form opens with what is stored rather than blank —
  # a blank field would look like "no description" and clear it on save.
  #
  # What each item DOES lives in actions/report_*.yaml, shared verbatim with the
  # report page's ⋯ modal. Only the after-action differs, and that is the var.
  onMenuOpen:
    - id: menu_open_report
      type: Link
      params:
        pageId:
          _module.pageId: report
        urlQuery:
          report_id:
            _event: row._id
  onMenuRename:
    _build.array.concat:
      - - id: seed_selected_rename
          type: SetState
          params:
            selected_report:
              _event: row
      - _ref: actions/report_rename_open.yaml
  onMenuPublish:
    _build.array.concat:
      - - id: seed_selected_publish
          type: SetState
          params:
            selected_report:
              _event: row
      - _ref:
          path: actions/report_publish.yaml
          vars:
            after_write:
              _ref: pages/reports-list/actions/load_scope.yaml
  onMenuUnpublish:
    _build.array.concat:
      - - id: seed_selected_unpublish
          type: SetState
          params:
            selected_report:
              _event: row
      - _ref:
          path: actions/report_unpublish.yaml
          vars:
            after_write:
              _ref: pages/reports-list/actions/load_scope.yaml
  onMenuDuplicate:
    _build.array.concat:
      - - id: seed_selected_duplicate
          type: SetState
          params:
            selected_report:
              _event: row
      - _ref:
          path: actions/report_duplicate.yaml
          vars:
            # The copy lands in Mine, so refetching the scope is enough to surface
            # it — no navigation needed, unlike the report page.
            after_duplicate:
              _ref: pages/reports-list/actions/load_scope.yaml
  onMenuDelete:
    _build.array.concat:
      - - id: seed_selected_delete
          type: SetState
          params:
            selected_report:
              _event: row
      - _ref: actions/report_delete_open.yaml
