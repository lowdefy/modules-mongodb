# Delete confirm — "Delete" over a data tool reads as destructive, so the confirm
# states the truth: the report stops being listed, nothing is queried again, no
# source data is touched. This is the one place a user meets the soft-delete
# idiom, so it is the one place worth spelling out. Recoverable from the
# Recently-deleted page. Not hidden with `visible:` (see report_rename_modal for
# why).
#
# `after_delete` is separate from the other modals' `after_write` because the two
# callers diverge here rather than merely differing in how they refresh: the list
# refetches and stays put, while the report page is now displaying a report that
# no longer exists and has to leave.
id: delete_confirm_modal
type: Modal
# `selected_report` is seeded at runtime by whichever surface opened this — the
# list's onMenuClick, or the report header's compiled SetState, which the build
# cannot see inside the Dynamic block's server-resolved content. There is no
# input block with that id on either page, so the state-refs check has nothing
# to match and would warn on every build.
~ignoreBuildChecks:
  - state-refs
properties:
  title: Delete this report?
  okText: Delete
  okButtonProps:
    danger: true
events:
  onOk:
    _build.array.concat:
      - - id: delete_report
          type: CallAPI
          params:
            endpointId:
              _module.endpointId: delete-report
            payload:
              report_id:
                _state: selected_report._id
      - _var: after_delete
blocks:
  - id: delete_confirm_body
    type: Paragraph
    properties:
      content:
        _nunjucks:
          template: >-
            “{{ t }}” stops being listed. Nothing is queried again and no source
            data is touched — you can restore it from Recently deleted.
          on:
            t:
              _state: selected_report.title
