id: create-deal
type: Api
routine:
  _build.array.concat:
    - - :set_state:
          workflow_id:
            _uuid: true
          event_id:
            _uuid: true

    # Host steps that run before the deal document exists. This is the only
    # slot that can stop a create, so it is the one for validation — `:reject:`
    # here surfaces a message and writes nothing. The whole create payload is in
    # scope (`_payload: form.*`, `_payload: attributes.*`); the deal id is not.
    #
    # Host steps share this routine's step namespace, so the module's own ids
    # are prefixed `deals_` and that prefix is reserved. A host step reusing one
    # builds without complaint and silently shadows it at runtime.
    - _module.var: hooks.pre_insert

    - - id: deals_insert_deal
        type: MongoDBInsertConsecutiveId
        connectionId:
          _module.connectionId: deals-collection
        properties:
          prefix: "D-"
          length: 5
          doc:
            name:
              _payload: form.name
            description:
              _payload: form.description
            company_id:
              _payload: form.company_id
            # Generic host-field passthrough — whatever the host's `fields` blocks
            # bind under state.attributes.* is persisted verbatim. The module knows
            # no domain-specific field keys.
            attributes:
              _if_none:
                - _payload: attributes
                - {}
            salesperson:
              contact_id:
                _user: id
              name:
                _user: profile.name
              email:
                _user: email
            status:
              - stage:
                  _module.var: initial_stage
                created:
                  _ref:
                    module: events
                    component: change_stamp
            outcome: null
            deal_tags:
              _if_none:
                - _payload: form.deal_tags
                - []
            created:
              _ref:
                module: events
                component: change_stamp
            updated:
              _ref:
                module: events
                component: change_stamp
            removed: null

    # Host steps that need the new deal. Adds `_step: deals_insert_deal.insertedId`
    # to what pre_insert had. Runs before the workflow starts so a hook that
    # fails leaves no orphaned workflow behind — at the cost of a deal with no
    # workflow, which the host can repair; the reverse cannot be repaired.
    #
    # Nothing rolls back past this point: the deal is committed, so a failing
    # step here leaves its own writes in place too. Keep them idempotent.
    - _module.var: hooks.post_insert

    - - id: deals_start_workflow
        type: CallApi
        properties:
          endpointId:
            _module.endpointId:
              # {workflow_type}-start, built at build time from the module's
              # workflow_type var — never a literal. The workflows module generates
              # one such endpoint per configured workflow type.
              id:
                _build.string.concat:
                  - _module.var: workflow_type
                  - "-start"
              module: workflows
          payload:
            entity:
              id:
                _step: deals_insert_deal.insertedId

      # The module mints the workflow id; surface it for the event + return below.
      - :set_state:
          workflow_id:
            _step: deals_start_workflow.response.workflow_id

      - id: deals_event_create_deal
        type: CallApi
        properties:
          endpointId:
            _module.endpointId:
              id: new-event
              module: events
          payload:
            type: create-deal
            display:
              _build.object.fromEntries:
                - - _module.var: app_name
                  - title:
                      _nunjucks:
                        template: |
                          <a href="/contacts/view?_id={{ user.id }}">{{ user.profile.name }}</a> created deal {{ deal_id }}.
                        on:
                          user:
                            _user: true
                          deal_id:
                            _step: deals_insert_deal.insertedId
                    description: null
            references:
              deal_ids:
                - _step: deals_insert_deal.insertedId
              company_ids:
                - _payload: form.company_id
            metadata:
              deal_id:
                _step: deals_insert_deal.insertedId
              workflow_id:
                _state: workflow_id

      - :return:
          deal_id:
            _step: deals_insert_deal.insertedId
          workflow_id:
            _state: workflow_id
