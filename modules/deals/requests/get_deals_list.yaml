id: get_deals_list
type: MongoDBAggregation
# Authored organization clause (tenant wall amendment-1). The shared text lead
# emits a first-stage $search whenever `atlas_search` is set, and the wall can
# not prepend its filter before a first-stage-only stage — so the clause is
# authored inside that $search's `compound.filter` by the shared policy
# fragment, and the wall audits it against the caller's organization on every
# run. With `atlas_search` false there is no $search at all, the pipeline leads
# with a plain $match and the wall scopes it mechanically; declaring `authored`
# there is refused, so the declaration resolves away with the stage.
tenant:
  _build.if:
    test:
      _module.var: atlas_search
    then: authored
connectionId:
  _module.connectionId: deals-collection
payload:
  pagination:
    _state: pagination
  filter:
    _state: filter
properties:
  pipeline:
    _build.array.concat:
      # 1. Shared text lead — ranks deal name and deal code (_id). Company name
      # is not stored on the deal document (the $lookup below fetches it for
      # display only), so the company filter matches company_id in the $match.
      - _ref:
          path: ../shared/search/text_lead.yaml
          vars:
            atlas_search:
              _module.var: atlas_search
            term:
              _payload: filter.search
            paths:
              - name
            # This list is refetched right after every deal write, and mongot's
            # stored copy lags index replication, so a stored-source row can
            # come back showing pre-edit values.
            returnStoredSource: false
            should_extra:
              # Deal code — keyword-analyzed and boosted so an exact code match
              # outranks a name match. Not lowercased: codes are stored
              # uppercase.
              - wildcard:
                  query:
                    _string.concat:
                      - "*"
                      - _payload: filter.search
                      - "*"
                  path:
                    value: _id
                    multi: keywordAnalyzer
                  score:
                    boost:
                      value: 3
                  allowAnalyzedField: true

      # 2. Filters. Each multi-select drops out when nothing is selected; the
      # outcome Segmented is always set (defaults to "open"). $and rather than a
      # shallow merge: the filter clauses and the regex clause's $or can collide
      # on a key.
      - - $match:
            $and:
              _array.concat:
                - - removed: null
                - _if:
                    test:
                      _gt:
                        - _if_none:
                            - _payload: filter.stage.length
                            - 0
                        - 0
                    then:
                      - status.0.stage:
                          $in:
                            _payload: filter.stage
                    else: []
                - _if:
                    test:
                      _gt:
                        - _if_none:
                            - _payload: filter.company_id.length
                            - 0
                        - 0
                    then:
                      - company_id:
                          $in:
                            _payload: filter.company_id
                    else: []
                - _if:
                    test:
                      _gt:
                        - _if_none:
                            - _payload: filter.salesperson.length
                            - 0
                        - 0
                    then:
                      - salesperson.name:
                          $in:
                            _payload: filter.salesperson
                    else: []
                - _if:
                    test:
                      _eq:
                        - _payload: filter.outcome
                        - open
                    then:
                      - outcome.type: null
                    else: []
                - _if:
                    test:
                      _eq:
                        - _payload: filter.outcome
                        - won
                    then:
                      - outcome.type: won
                    else: []
                - _if:
                    test:
                      _eq:
                        - _payload: filter.outcome
                        - lost
                    then:
                      - outcome.type: lost
                    else: []
                - _if:
                    test:
                      _gt:
                        - _if_none:
                            - _payload: filter.outcome_reason.length
                            - 0
                        - 0
                    then:
                      - outcome.reason:
                          $in:
                            _payload: filter.outcome_reason
                    else: []
                # Deal code is matched by regex too: the fallback has no
                # keyword-analyzed clause to carry it.
                - _ref:
                    path: ../shared/search/regex_clause.yaml
                    vars:
                      atlas_search:
                        _module.var: atlas_search
                      term:
                        _payload: filter.search
                      paths:
                        - _id
                        - name

      # 3. Company name for display (same lookup as get_active_deals).
      - - $lookup:
            from: companies
            localField: company_id
            foreignField: _id
            as: company

      # 4. Count + paginated results.
      - - $facet:
            count:
              - $count: count
            results:
              _array.concat:
                - _ref:
                    path: ../shared/search/score_stage.yaml
                    vars:
                      atlas_search:
                        _module.var: atlas_search
                      term:
                        _payload: filter.search
                - - _if:
                      test:
                        _ref:
                          path: ../shared/search/use_score.yaml
                          vars:
                            atlas_search:
                              _module.var: atlas_search
                            term:
                              _payload: filter.search
                      then:
                        $sort:
                          score: -1
                          updated.timestamp: -1
                      else:
                        $sort:
                          updated.timestamp: -1
                  - $skip:
                      _if_none:
                        - _payload: pagination.skip
                        - 0
                  - $limit:
                      _if_none:
                        - _payload: pagination.pageSize
                        - 20
                  - $addFields:
                      deal_value:
                        $ifNull:
                          - $value
                          - 0
                  - $project:
                      _id: 1
                      name: 1
                      attributes: 1
                      company_id: 1
                      company_name:
                        $ifNull:
                          - $first: $company.short_name
                          - $first: $company.name
                      status: 1
                      outcome: 1
                      updated: 1
                      salesperson_name: $salesperson.name
                      expected_close_date: 1
                      # Raw value number; hosts format it via card_fields
                      # (currency/abbreviation are host concerns).
                      deal_value: 1
                # App-injected pipeline stages (default []) — splice point for
                # request_stages.get_deals_list.
                - _module.var: request_stages.get_deals_list
