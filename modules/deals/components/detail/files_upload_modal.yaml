id: detail_files_upload_modal
type: Modal
properties:
  title: Manage Files
  footer: false
  width: 560
events:
  onClose:
    - _ref: actions/fetch_deal_files.yaml
    - _ref: actions/set_deal_files.yaml
blocks:
  - _ref:
      module: files
      component: file-manager
      vars:
        block_id: detail_files_manager
        entity_type: deals
        entity_id:
          _state: selected_deal_id
        file_category: deal-attachment
        single_file: false
        hint: Click or drag to upload a deal attachment
