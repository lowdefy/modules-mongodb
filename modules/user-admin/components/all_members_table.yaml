# Members table. Columns: Name (avatar) · Email · Roles (tags; orphaned roles
# flagged) · Status (Active/Suspended tag) · [consumer table_columns slot] ·
# Created · Updated · Signed up. Row click → user detail (view).
# Sort and pagination are server-side (get_all_members), so header sorting is
# off. Each row carries total_results for the Pagination block.
id: members_table
type: Table
properties:
  size: comfortable
  headerMenu: false
  reorderable: false
  emptyText: No members
  rowKey: user_id
  loading:
    _not:
      _request: get_all_members
  defaultColumn:
    sortable: false
    filterable: false
  rowLink:
    pageId:
      _module.pageId: view
    urlQuery:
      user_id: user_id
  data:
    _if_none:
      - _request: get_all_members
      - []
  columns:
    _build.array.concat:
      - - key: name
          title: Name
          type: avatar
          flex: 2
          minWidth: 180
          cell:
            nameField: name
            srcField: picture
            idField: user_id
        - key: email
          title: Email
          flex: 1
          minWidth: 200
        - key: roles
          title: Roles
          type: html
          flex: 1
          minWidth: 160
          wrap: true
          # `roles` arrives pre-resolved as { id, label, description, orphan }
          # items. The read reconciles the member's held ids against the app's
          # role catalog, so a role held in data but absent from the catalog is
          # flagged "no longer configured" here rather than silently dropped.
          cell:
            template:
              _ref: components/roles_cell.txt
        - key: status
          title: Status
          type: tag
          width: 120
          options:
            Active:
              color: green
            Suspended:
              color: red
      # Consumer columns inject between content and audit-date columns.
      - _module.var: components.table_columns
      - - key: created
          title: Created
          type: date
          width: 110
          cell:
            format: YYYY-MM-DD
        - key: updated
          title: Updated
          type: date
          width: 110
          cell:
            format: YYYY-MM-DD
        - key: signed_up
          title: Signed up
          type: date
          width: 110
          cell:
            format: YYYY-MM-DD
