# Edit attributes modal — the app roles and member attributes this app authorizes
# on (UpdateMemberRoles + UpdateMemberAttributes), plus, behind the `org_authority`
# var, the member's organization-authority tier.
#
# The tier is a separate control with its own submit, because it is a separate
# authority: an app role says "show this person the UI", the member row's tier says
# "this person may actually administer the organization", and nothing keeps the two
# in agreement. Folding them into one submit would also mean a refused tier write
# leaving the app-role write applied, with nothing to roll it back.
#
# Role picker options/labels/descriptions come from the app role catalog
# (_build.authConfig.roles), concatenated with one option per held orphan (a role
# the member holds that the catalog no longer declares). The picker seeds from the
# resolved `roles`, so an orphan the member already holds is offered as a removable
# chip; removing and saving drops it, and a dropped orphan is not re-addable since
# it is gone from the catalog. Member attributes bind state.member_attributes.*.
id: modal_access
type: Modal
properties:
  title: Edit attributes
  width: 560
  okText: Save attributes
  cancelText: Cancel
events:
  onOpen:
    - id: seed_access
      type: SetState
      params:
        # Held role ids, mapped from the resolved roles (catalog + held orphans).
        roles:
          _array.map:
            on:
              _request: get_user_detail.0.roles
            callback:
              _function:
                __args: 0.id
        member_attributes:
          _request: get_user_detail.0.member_attributes
        # Seeded on every open, so reopening the modal shows the stored tier
        # rather than an abandoned edit. Seeded whether or not the control renders
        # — one unread state key costs less than a conditional SetState.
        org_role:
          _request: get_user_detail.0.org_role
  onOk:
    _build.array.concat:
      - - id: validate_access
          type: Validate
          params:
            regex:
              - "^roles$"
              - '^member_attributes\.'
        # UpdateMemberRoles + UpdateMemberAttributes. The selected ids submit
        # as-is: an orphan among them is accepted and grants nothing, so an admin
        # who never touched it does not lose the whole save over it.
        - id: save_access
          type: CallAPI
          messages:
            loading: Saving…
            success: Attributes updated.
          params:
            endpointId:
              _module.endpointId: update-access
            payload:
              member_id:
                _request: get_user_detail.0.member_id
              user_id:
                _request: get_user_detail.0.user_id
              roles:
                _state: roles
              member_attributes:
                _state: member_attributes
              target_name:
                _request: get_user_detail.0.name
              target_email:
                _request: get_user_detail.0.email
      - _ref: actions/detail_refetch.yaml
blocks:
  _build.array.concat:
    - - id: roles
        type: MultipleSelector
        properties:
          label:
            title: Roles
            # Only shown when the member holds a role the catalog no longer offers.
            extra:
              _if:
                test:
                  _eq:
                    - _request: get_user_detail.0.has_orphan
                    - true
                then: A role shown here that is no longer in this app can be removed, but not added back.
                else: null
          # Options are the app role catalog concatenated with one option per held
          # orphan. A catalog option: value=id, a rich label (name + description
          # subtitle), a filterString spanning label + description for search, and a
          # plain tag for the selected chip. An orphan option: value=the real id,
          # labelled "<id> (no longer configured)", enabled so its chip stays
          # removable (a disabled option would render a non-removable chip).
          options:
            _array.concat:
              - _build.array.map:
                  on:
                    _build.authConfig: roles
                  callback:
                    _build.function:
                      value:
                        __build.args: 0.id
                      filterString:
                        __build.string.concat:
                          - __build.args: 0.label
                          - " "
                          - __build.if_none:
                              - __build.args: 0.description
                              - ""
                      tag:
                        title:
                          __build.args: 0.label
                      label:
                        __build.string.concat:
                          - '<div style="line-height:1.3"><div>'
                          - __build.args: 0.label
                          - "</div>"
                          - __build.if:
                              test:
                                __build.ne:
                                  - __build.args: 0.description
                                  - null
                              then:
                                __build.string.concat:
                                  - '<div style="font-size:11px;color:var(--ant-color-text-tertiary)">'
                                  - __build.args: 0.description
                                  - "</div>"
                              else: ""
                          - "</div>"
              - _array.map:
                  on:
                    _request: get_user_detail.0.orphan_ids
                  callback:
                    _function:
                      value:
                        __args: 0
                      filterString:
                        __args: 0
                      tag:
                        title:
                          __string.concat:
                            - __args: 0
                            - " (no longer configured)"
                      label:
                        __string.concat:
                          - '<div style="line-height:1.3"><div>'
                          - __args: 0
                          - " (no longer configured)</div></div>"
    - _module.var: fields.member_attributes
    # Organization authority — behind the `org_authority` var. Its own selector and
    # its own button: the tier is a different authority from the app roles above and
    # a different write, so it is not part of "Save attributes".
    - _build.if:
        test:
          _module.var: org_authority
        then:
          - id: org_role_divider
            type: Divider
            properties:
              margin: 4
          - id: org_role
            type: Selector
            required: true
            properties:
              label:
                title: Organization authority
                extra: Who may administer this organization — separate from the app roles above, and not implied by them.
              # `member` is the no-authority value, not an empty one: the write
              # refuses an empty role, so revoking authority writes `member`.
              # Labelled in the app's language rather than BetterAuth's, where
              # "member" reads as a status instead of an absence of authority.
              options:
                - value: owner
                  label: Organization owner
                - value: admin
                  label: Organization admin
                - value: member
                  label: No organization authority
          - id: save_org_role_btn
            type: Button
            layout:
              flex: 0 0 auto
            properties:
              title: Update organization role
              variant: outlined
            events:
              onClick:
                _build.array.concat:
                  - - id: validate_org_role
                      type: Validate
                      params:
                        regex:
                          - "^org_role$"
                    # No `error` message: the write's refusals — demoting the
                    # organization's sole owner, or demoting its creator — are the
                    # reason it runs through the organization plugin at all, and an
                    # admin needs to read them. A static error string here would
                    # replace them with "something went wrong".
                    - id: save_org_role
                      type: CallAPI
                      messages:
                        loading: Updating…
                        success: Organization role updated.
                      params:
                        endpointId:
                          _module.endpointId: update-org-role
                        payload:
                          member_id:
                            _request: get_user_detail.0.member_id
                          user_id:
                            _request: get_user_detail.0.user_id
                          org_role:
                            _state: org_role
                          target_name:
                            _request: get_user_detail.0.name
                          target_email:
                            _request: get_user_detail.0.email
                  - _ref: actions/detail_refetch.yaml
        else: []
