# Edit attributes modal. The app roles and member attributes this app authorizes
# on (UpdateMemberRoles + UpdateMemberAttributes), plus, behind the `org_authority`
# var, the member's organization-authority tier.
#
# The tier writes through its own endpoint (update-org-role) — a separate authority
# from the app roles (an app role says "show this person the UI"; the tier says "this
# person may administer the organization"), a separate write path (the organizations
# plugin, so its last-owner and creator guards run), separately authorized and
# audited. It shares the modal's single Save: onOk runs the tier write FIRST, so a
# refusal halts before any app-role write lands (nothing to roll back), and skips it
# when org_role is unchanged so a plain attributes save never touches the plugin.
#
# The assignable tier is binary — admin (administers the organization) or member (no
# authority). `owner` holds the same capabilities as `admin` (it is the protected
# creator tier, not a higher grade), so it is never minted here: an owner member is
# shown read-only and left untouched by a save.
#
# Role picker options/labels/descriptions come from the app role catalog
# (_build.authConfig.roles), concatenated with one option per held orphan (a role
# the member holds that the catalog no longer declares). The picker seeds from the
# resolved `roles`, so an orphan the member already holds is offered as a removable
# chip; removing and saving drops it, and a dropped orphan is not re-addable since
# it is gone from the catalog. Member attributes bind state.member_attributes.*.
id: modal_access
type: Modal
properties:
  title: Edit attributes
  width: 560
  okText: Save attributes
  cancelText: Cancel
events:
  onOpen:
    - id: seed_access
      type: SetState
      params:
        # Held role ids, mapped from the resolved roles (catalog + held orphans).
        roles:
          _array.map:
            on:
              _request: get_user_detail.0.roles
            callback:
              _function:
                __args: 0.id
        member_attributes:
          _request: get_user_detail.0.member_attributes
        # Seeded on every open, so reopening the modal shows the stored tier
        # rather than an abandoned edit. Seeded whether or not the control renders.
        # One unread state key costs less than a conditional SetState.
        org_role:
          _request: get_user_detail.0.org_role
  onOk:
    _build.array.concat:
      - - id: validate_access
          type: Validate
          params:
            regex:
              _build.array.concat:
                - - "^roles$"
                  - '^member_attributes\.'
                # Only when the tier control renders (org_authority true).
                - _build.if:
                    test:
                      _module.var: org_authority
                    then:
                      - "^org_role$"
                    else: []
      # Tier write FIRST, and only behind the `org_authority` var. Skipped when
      # org_role is unchanged from its seeded value, so a plain attributes save
      # never invokes the org plugin or emits an org-role-updated event — and an
      # owner (shown read-only, seed unchanged) is never rewritten. A refusal
      # (sole owner, creator demotion) halts the chain here, before any app-role
      # write lands. No `error` message: the plugin's own refusal text must reach
      # the admin, not be replaced by a generic string.
      - _build.if:
          test:
            _module.var: org_authority
          then:
            - id: save_org_role
              type: CallAPI
              skip:
                _eq:
                  - _state: org_role
                  - _request: get_user_detail.0.org_role
              messages:
                loading: Updating organisation access…
              params:
                endpointId:
                  _module.endpointId: update-org-role
                payload:
                  member_id:
                    _request: get_user_detail.0.member_id
                  user_id:
                    _request: get_user_detail.0.user_id
                  org_role:
                    _state: org_role
                  target_name:
                    _request: get_user_detail.0.name
                  target_email:
                    _request: get_user_detail.0.email
          else: []
      # UpdateMemberRoles + UpdateMemberAttributes. Reached only on tier success
      # or skip. The selected ids submit as-is: an orphan among them is accepted
      # and grants nothing, so an admin who never touched it does not lose the
      # whole save over it. Idempotent SET, so a failure here after a tier success
      # is resolved by re-running Save.
      - - id: save_access
          type: CallAPI
          messages:
            loading: Saving…
            success: Changes saved.
          params:
            endpointId:
              _module.endpointId: update-access
            payload:
              member_id:
                _request: get_user_detail.0.member_id
              user_id:
                _request: get_user_detail.0.user_id
              roles:
                _state: roles
              member_attributes:
                _state: member_attributes
              target_name:
                _request: get_user_detail.0.name
              target_email:
                _request: get_user_detail.0.email
      - _ref: actions/detail_refetch.yaml
blocks:
  _build.array.concat:
    - - id: roles
        type: MultipleSelector
        properties:
          label:
            title: Roles
            # Only shown when the member holds a role the catalog no longer offers.
            extra:
              _if:
                test:
                  _eq:
                    - _request: get_user_detail.0.has_orphan
                    - true
                then: A role shown here that is no longer in this app can be removed, but not added back.
                else: null
          # Options are the app role catalog concatenated with one option per held
          # orphan. A catalog option: value=id, a rich label (name + description
          # subtitle), a filterString spanning label + description for search, and a
          # plain tag for the selected chip. An orphan option: value=the real id,
          # labelled "<id> (no longer configured)", enabled so its chip stays
          # removable (a disabled option would render a non-removable chip).
          options:
            _array.concat:
              - _build.array.map:
                  on:
                    _build.authConfig: roles
                  callback:
                    _build.function:
                      value:
                        __build.args: 0.id
                      filterString:
                        __build.string.concat:
                          - __build.args: 0.label
                          - " "
                          - __build.if_none:
                              - __build.args: 0.description
                              - ""
                      tag:
                        title:
                          __build.args: 0.label
                      label:
                        __build.string.concat:
                          - '<div style="line-height:1.3"><div>'
                          - __build.args: 0.label
                          - "</div>"
                          - __build.if:
                              test:
                                __build.ne:
                                  - __build.args: 0.description
                                  - null
                              then:
                                __build.string.concat:
                                  - '<div style="font-size:11px;color:var(--ant-color-text-tertiary)">'
                                  - __build.args: 0.description
                                  - "</div>"
                              else: ""
                          - "</div>"
              - _array.map:
                  on:
                    _request: get_user_detail.0.orphan_ids
                  callback:
                    _function:
                      value:
                        __args: 0
                      filterString:
                        __args: 0
                      tag:
                        title:
                          __string.concat:
                            - __args: 0
                            - " (no longer configured)"
                      label:
                        __string.concat:
                          - '<div style="line-height:1.3"><div>'
                          - __args: 0
                          - " (no longer configured)</div></div>"
    - _module.var: fields.member_attributes
    # Organization authority. Behind the `org_authority` var. Saved by the modal's
    # single Save (onOk, tier write first), not a control of its own. The assignable
    # tier is binary — admin or member; `owner` is never minted here (see header).
    - _build.if:
        test:
          _module.var: org_authority
        then:
          - id: org_role_divider
            type: Divider
            properties:
              margin: 4
          # Owner is read-only: the protected creator tier, capability-identical to
          # admin, never set from this control. Shown so the tier is visible; the
          # save leaves it untouched (the tier write skips when org_role is
          # unchanged, and this member's seed is `owner`).
          - id: org_role_owner_display
            type: Html
            visible:
              _eq:
                - _request: get_user_detail.0.org_role
                - owner
            properties:
              html: >
                <div>
                  <div style="margin-bottom:6px;">Organisation authority</div>
                  <div>Owner
                    <span style="color:var(--ant-color-text-tertiary);">— administers this organisation; the protected owner tier.</span>
                  </div>
                  <div style="font-size:12px; color:var(--ant-color-text-tertiary); margin-top:4px;">Ownership isn't changed here.</div>
                </div>
          - id: org_role
            type: Selector
            required: true
            visible:
              _ne:
                - _request: get_user_detail.0.org_role
                - owner
            properties:
              label:
                title: Organisation authority
                extra: Whether this person can administer the organisation — manage its members and their access. Independent of the app roles above.
              # `member` is the no-authority value, not an empty one: the write
              # refuses an empty role, so revoking authority writes `member`.
              # Labelled in plain terms — "No admin access" rather than BetterAuth's
              # "member", where the word reads as a status instead of an absence of
              # authority. `owner` is not offered (see header).
              options:
                - value: admin
                  label: Admin
                - value: member
                  label: No admin access
        else: []
