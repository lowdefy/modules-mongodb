# Members filter row (design Decision 2/8).
# search (name/email) · Role multi-select (options from the auth.roles catalog,
# design Decision 8) · Status segmented (All/Active/Suspended) · Clear.
# Consumer `components.filters` blocks append after the built-ins.
# Every filter change refetches get_all_members via actions/members_refetch.yaml
# (resets to page 1). The role filter matches EXACT elements of the member's
# `app_roles` array — see requests/get_all_members.yaml.
id: members_filters
type: Box
layout:
  flex: 1 1 auto
  gap: 8
  align: middle
  selfAlign: middle
blocks:
  - id: filter.search
    type: TextInput
    layout:
      flex: 1 1 240px
    style:
      maxWidth: 340px
    properties:
      placeholder: Search name or email
      label:
        disabled: true
    events:
      onPressEnter:
        _ref: actions/members_refetch.yaml
      onChange:
        try:
          _ref: actions/members_refetch.yaml
        debounce:
          ms: 500
  - id: filter.roles
    type: MultipleSelector
    layout:
      flex: 0 1 auto
    style:
      minWidth: 160px
      maxWidth: 260px
    properties:
      placeholder: All roles
      allowClear: true
      label:
        disabled: true
      # Options + labels come from the app's authored auth.roles catalog
      # (design Decision 8), NOT a module var — the single source of truth for
      # the assignable role set. Mapped from the `_build.authConfig: roles`
      # projection to a rich label (name + description subtitle), a filterString
      # covering both lines, and a plain tag for the selected chip — matching the
      # role picker in modal_access.yaml. The selected ids are matched as EXACT
      # elements of the member's `app_roles` array ($in), ahead of the read's
      # $lookups — see get_all_members.yaml.
      options:
        _build.array.map:
          on:
            _build.authConfig: roles
          callback:
            _build.function:
              value:
                __build.args: 0.id
              filterString:
                __build.string.concat:
                  - __build.args: 0.label
                  - " "
                  - __build.if_none:
                      - __build.args: 0.description
                      - ""
              tag:
                title:
                  __build.args: 0.label
              label:
                __build.string.concat:
                  - '<div style="line-height:1.3"><div>'
                  - __build.args: 0.label
                  - "</div>"
                  - __build.if:
                      test:
                        __build.ne:
                          - __build.args: 0.description
                          - null
                      then:
                        __build.string.concat:
                          - '<div style="font-size:11px;color:var(--ant-color-text-tertiary)">'
                          - __build.args: 0.description
                          - "</div>"
                      else: ""
                  - "</div>"
    events:
      onChange:
        _ref: actions/members_refetch.yaml
  - id: filter.status
    type: SegmentedSelector
    layout:
      flex: 0 1 auto
    # An inline label column still carries the 8px bottom margin meant for the
    # stacked layout, so the block measures 8px taller than the other controls
    # and the row's centre line lifts it. Cancel it here — the label column
    # itself has no style hook.
    style:
      marginBottom: -8
    properties:
      label:
        title: Status
        inline: true
        colon: false
      options:
        - label: All
          value: all
        - label: Active
          value: active
        - label: Suspended
          value: suspended
    events:
      onChange:
        _ref: actions/members_refetch.yaml
  - id: members_clear
    type: Button
    layout:
      flex: 0 1 auto
    properties:
      title: Clear
      icon: AiOutlineClear
      color: default
      variant: text
    events:
      onClick:
        _build.array.concat:
          # Clear only the Members filter keys (leave the Invitations tab and
          # the sort untouched — independent per-tab state, Decision 2).
          - - id: clear_members_filters
              type: SetState
              params:
                filter.search: null
                filter.roles: null
                filter.status: all
          - _ref: actions/members_refetch.yaml
