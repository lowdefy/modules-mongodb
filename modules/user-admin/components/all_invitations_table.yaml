# Invitations table (design Decision 2 / 7). Reads get_all_invitations
# (pending rows, Invited/Expired derived on expires_at, org-scoped, paginated).
# Columns: Email · Invited by (avatar) · Roles · Status · Expires · row buttons.
# Buttons fire their own block event:
#   Resend / Cancel, shown on Invited rows (onResend, onCancel)
#   Re-invite, shown on Expired rows (onReinvite); routes to the invite flow,
#     whose routine self-reconciles the stale pending row (cancel-then-invite,
#     no duplicate, Decision 7)
id: invitations_table
type: Table
properties:
  size: comfortable
  headerMenu: false
  reorderable: false
  emptyText: No pending invitations
  rowKey: _id
  loading:
    _not:
      _request: get_all_invitations
  defaultColumn:
    sortable: false
    filterable: false
  data:
    _if_none:
      - _request: get_all_invitations
      - []
  columns:
    - key: email
      title: Email
      flex: 2
      minWidth: 230
    - key: inviter_name
      title: Invited by
      type: avatar
      flex: 1
      minWidth: 180
      cell:
        nameField: inviter_name
        idField: inviter_id
    - key: roles
      title: Roles
      type: html
      flex: 1
      minWidth: 160
      wrap: true
      cell:
        template:
          _ref: components/roles_cell.txt
    - key: status
      title: Status
      type: tag
      width: 120
      options:
        Invited:
          color: blue
        Expired:
          color: default
    - key: expires_at
      title: Expires
      type: date
      width: 140
      cell:
        relative: true
    - key: actions
      title: ""
      type: buttons
      width: 190
      pinned: end
      resizable: false
      cell:
        buttons:
          - eventName: onResend
            title: Resend
            size: small
            hidden:
              when:
                key: status
                op: ne
                value: Invited
          - eventName: onCancel
            title: Cancel
            size: small
            danger: true
            hidden:
              when:
                key: status
                op: ne
                value: Invited
          - eventName: onReinvite
            title: Re-invite
            size: small
            hidden:
              when:
                key: status
                op: ne
                value: Expired
events:
  # Resend: InviteMember(resend) on a still-pending Invited row (Decision 7).
  onResend:
    - id: resend_invitation
      type: CallAPI
      messages:
        loading: Resending…
        success: Invitation resent.
      params:
        endpointId:
          _module.endpointId: resend-invitation
        payload:
          # The endpoint reads the stored invitation and preserves its roles,
          # org tier, and attributes when the payload omits them, so the
          # email is all this button needs to send.
          email:
            _event: row.email
    - id: refetch_after_resend
      type: Request
      params: get_all_invitations
  # Cancel: CancelInvitation (reversible; re-invitable later, so no confirm
  # modal on the list: the invite page's pending panel keeps the confirm).
  onCancel:
    - id: cancel_invitation
      type: CallAPI
      messages:
        loading: Cancelling…
        success: Invitation cancelled.
      params:
        endpointId:
          _module.endpointId: cancel-invitation
        payload:
          invitation_id:
            _event: row._id
          email:
            _event: row.email
    - id: refetch_after_cancel
      type: Request
      params: get_all_invitations
  # Re-invite (Expired): route to the invite page, which checks the email on
  # load and prefills the form with the expired row's app roles, org tier and
  # attributes. The invite routine cancels the stale pending row before
  # creating a fresh one (cancel-then-invite), so no duplicate is created.
  onReinvite:
    - id: reinvite_expired
      type: Link
      params:
        pageId:
          _module.pageId: invite
        urlQuery:
          email:
            _event: row.email
