# resend-invitation — InviteMember with native `resend: true` (design Decision 7).
# Re-renders the invitation through the same `auth.email` send path and refreshes
# stored attributes. Only refreshes a still-pending, NON-expired row (re-inviting
# an Expired row routes through `invite` instead). `organizationId` is named
# explicitly: an absent one falls back to the APP's pinned organization, so an
# instance administering another organization would be authorized against — and
# write into — the wrong one. Role-gated app-side; the step declares the
# permission it needs and the engine floors it against the caller's member row in
# the organization the step names. Audit event is the final step.
#
# `find_invitation` reads the stored row so `appRoles`, `orgRole`, and
# `attributes` each fall back to what the invitation already has when the
# payload omits them — a caller can only ever add to or repeat what's stored,
# never blank or downgrade it by omission. The step still defaults an absent
# `orgRole` to `member` beneath the stored fallback, matching InviteMember's own
# default for a genuinely first-time invite.
#
# Payload: { email, roles? (array of role ids), org_role?, member_attributes? }
id: resend-invitation
type: Api
routine:
  # Stored invitation, read for the app_roles/role/attributes fallback below.
  # Mirrors check-invite-email.yaml's find_invitation.
  - id: find_invitation
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: user-invitations
    properties:
      query:
        organization_id:
          _module.var: org_slug
        status: pending
        $expr:
          $eq:
            - $toLower: "$email"
            - _string.toLowerCase:
                _string.trim:
                  _if_none:
                    - _payload: email
                    - ""
      options:
        projection:
          app_roles: 1
          role: 1
          attributes: 1
  - id: resend
    type: InviteMember
    properties:
      email:
        _payload: email
      organizationId:
        _module.var: org_slug
      appRoles:
        _if_none:
          - _payload: roles
          - _step: find_invitation.app_roles
      orgRole:
        _if_none:
          - _payload: org_role
          - _if_none:
              - _step: find_invitation.role
              - member
      attributes:
        _if_none:
          - _payload: member_attributes
          - _step: find_invitation.attributes
      resend: true
  - id: audit
    type: CallApi
    properties:
      endpointId:
        _module.endpointId:
          id: new-event
          module: events
      payload:
        type: invitation-resent
        display:
          _build.object.fromEntries:
            - - _build.app: slug
              - title:
                  _nunjucks:
                    template:
                      _build.if_none:
                        - _module.var: event_display.invitation-resent
                        - _ref:
                            path: defaults/event_display.yaml
                            key: invitation-resent
                    on:
                      user:
                        _user: true
                      target:
                        email:
                          _payload: email
                description: null
  - :return:
      success: true
