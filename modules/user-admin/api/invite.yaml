# invite — submit the invite form. Reconcile any genuinely-stale invitation →
# ensure the contact exists → InviteMember with roles + member attributes →
# audit. The invitation email itself is sent by BetterAuth via `auth.email`;
# this module ships no email endpoint/hook/binding (Decision 7).
#
# Stale-expired reconciliation (verified against BetterAuth 1.6.23):
# createInvitation's re-invite guard (findPendingInvitation) EXCLUDES expired rows
# (expires_at > now), and `resend: true` only refreshes a NON-expired row — so a
# fresh InviteMember over an expired-but-pending row would leave a DUPLICATE
# pending row. We therefore natively find pending rows with expires_at < now for
# the (lowercased email, org) and CancelInvitation each (cancel has no
# expiry/status guard) before inviting. Non-expired pending never reaches submit —
# check-invite-email routes it to Resend — so this only cancels genuinely-stale
# rows. Cancel-then-invite is idempotent: with nothing stale the loop is a no-op.
#
# Partial-failure: the ensure-contact → InviteMember chain is safe because
# ensure-contact reconciles on duplicate key, so retry converges; an unknown-email
# invite that fails at InviteMember may leave an orphan contact the next check
# resolves to "contact, no membership".
#
# Role-gated app-side. Payload: { email, roles (array of role ids), org_role?,
#                                 member_attributes? (object), profile? (object) }
# ensure-contact mints the contact bare; the write-profile splice then persists
# the captured profile onto it (and re-denorms onto the user only if one already
# exists). `profile.profile_created` stays unset, so the invitee still onboards.
id: invite
type: Api
routine:
  # 1) Find genuinely-stale rows: pending AND already expired, for this org and
  #    email (case-insensitive). Non-expired pending is routed to Resend upstream,
  #    so it never reaches here.
  - id: find_stale
    type: MongoDBAggregation
    connectionId:
      _module.connectionId: user-invitations
    properties:
      pipeline:
        - $match:
            organization_id:
              _module.var: org_slug
            status: pending
            $expr:
              $eq:
                - $toLower: "$email"
                - _string.toLowerCase:
                    _string.trim:
                      _if_none:
                        - _payload: email
                        - ""
            expires_at:
              $lt:
                _date: now
        - $project:
            _id: 1

  # 2) Cancel each stale row by id so the fresh invite below can't leave a
  #    duplicate pending row beside it. No-op when find_stale returned nothing.
  #    Every auth step here names its organization explicitly (the write-profile
  #    splice through its `organization_id` var): an absent one falls back to the
  #    APP's pinned organization, so an instance administering another organization
  #    would be authorized against — and write into — the wrong one.
  - :for: stale
    :in:
      _step: find_stale
    :do:
      - id: cancel_stale
        type: CancelInvitation
        properties:
          invitationId:
            _item: stale._id
          organizationId:
            _module.var: org_slug

  # 3) Resolve the target auth user, if one exists. An invitee has no user row
  #    until they accept, but the address may already be a user of another
  #    organization — find_user._id is that user's id, or absent (no document)
  #    when none matches. It both links the minted contact below and gates
  #    write-profile's re-denorm. Matched case-insensitively on the address, the
  #    same idiom check-invite-email uses.
  - id: find_user
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: users
    properties:
      query:
        $expr:
          $eq:
            - $toLower: "$email"
            - _string.toLowerCase:
                _string.trim:
                  _if_none:
                    - _payload: email
                    - ""
      options:
        projection:
          _id: 1

  # 3b) Ensure the contact exists (shared fragment, inlined by relative _ref). The
  #     canonical fragment keys on the email and resolves the row into the
  #     `read_contact` step, so the contact id is `_step: read_contact._id`. It
  #     mints the contact bare; the write-profile splice below persists the
  #     captured profile. `user_id` is passed so an address that is already a user
  #     gets a linked contact immediately; a genuinely new invitee has no user yet,
  #     so their contact is minted unlinked and is claimed on their first
  #     own-contact resolution after accepting.
  - _ref:
      path: ../shared/contact/ensure-contact.yaml
      vars:
        connection_id:
          _module.connectionId: user-contacts-collection
        email:
          _payload: email
        user_id:
          _step: find_user._id

  # 3c) Persist the captured profile onto the contact (shared write-profile
  #     fragment) — the same write seam both update-profile routines use, so the
  #     invited person's name/phone/job land now, not only at first post-accept
  #     edit. profile.name is derived (given + family). The UpdateUserProfile
  #     re-denorm is guarded on user_id, so it no-ops for a pre-accept invitee
  #     (find_user._id absent) and fires only when a user already exists.
  - _ref:
      path: ../shared/contact/write-profile.yaml
      vars:
        connection_id:
          _module.connectionId: user-contacts-collection
        contact_id:
          _step: read_contact._id
        user_id:
          _step: find_user._id
        profile:
          _payload: profile
        avatar_colors:
          _module.var: avatar_colors
        write_stages:
          _module.var: request_stages.write
        organization_id:
          _module.var: org_slug

  # 4) Invite the member. `appRoles` is the app-role id array the member row is
  #    minted with; `orgRole` is the unrelated organization-authority tier, which
  #    the step defaults to `member` (no authority) when the form omits it. Member
  #    attributes ride the invitation (applied to the minted member at accept by
  #    afterAcceptInvitation). The contact is linked from the contact side (its
  #    own user_id at claim time), so no contactId rides the invitation.
  - id: invite_member
    type: InviteMember
    properties:
      email:
        _payload: email
      organizationId:
        _module.var: org_slug
      appRoles:
        _if_none:
          - _payload: roles
          - []
      orgRole:
        _payload: org_role
      attributes:
        _if_none:
          - _payload: member_attributes
          - {}

  # 5) Audit event (FINAL step — fires only on full success).
  - id: audit
    type: CallApi
    properties:
      endpointId:
        _module.endpointId:
          id: new-event
          module: events
      payload:
        type: member-invited
        display:
          _build.object.fromEntries:
            - - _build.app: slug
              - title:
                  _nunjucks:
                    template:
                      _build.if_none:
                        - _module.var: event_display.member-invited
                        - _ref:
                            path: defaults/event_display.yaml
                            key: member-invited
                    on:
                      user:
                        _user: true
                      target:
                        email:
                          _payload: email
                description: null
        references:
          contact_ids:
            - _step: read_contact._id

  - :return:
      success: true
      contactId:
        _step: read_contact._id
