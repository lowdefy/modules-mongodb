# revoke-sessions — RevokeUserSessions ("sign out everywhere", design Decision 5).
# Does not suspend or remove; the person can sign back in immediately. Role-gated
# app-side; the step declares the permission it needs and the engine floors it
# against the caller's member row in the organization the step names. Audit event is
# the final step.
#
# `organizationId` names the organization the floor authorizes in. Sessions are
# deployment-wide, so the floor asks whether the caller administers THAT
# organization and whether the target holds a member row in it; an absent one falls
# back to the APP's pinned organization, which refuses an administrator of any other.
#
# Payload: { user_id, target_name?, target_email? }
id: revoke-sessions
type: Api
routine:
  - id: revoke
    type: RevokeUserSessions
    properties:
      userId:
        _payload: user_id
      organizationId:
        _module.var: org_slug
  - id: audit
    type: CallApi
    properties:
      endpointId:
        _module.endpointId:
          id: new-event
          module: events
      payload:
        type: sessions-revoked
        display:
          _build.object.fromEntries:
            - - _build.app: slug
              - title:
                  _nunjucks:
                    template:
                      _build.if_none:
                        - _module.var: event_display.sessions-revoked
                        - _ref:
                            path: defaults/event_display.yaml
                            key: sessions-revoked
                    on:
                      user:
                        _user: true
                      target:
                        name:
                          _payload: target_name
                        email:
                          _payload: target_email
                description: null
        references:
          user_ids:
            - _payload: user_id
  - :return:
      success: true
