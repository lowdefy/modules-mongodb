# revoke-passkeys — admin recovery when a security key is lost or stolen
# (design Decision 3). RevokeUserPasskeys clears registered passkeys — all of
# them, or one when `passkeyId` is given (an absent `passkey_id` payload revokes
# all). A passkey independently satisfies a required-2FA policy, so a stolen one
# both authenticates and meets the requirement until it is revoked. Revoking
# sessions is a separate step because deleting a passkey does not end a session,
# and a thief keeps the session they hold until it is revoked — that is what
# recovers the account. Sequential, halts on first error, no rollback (the steps
# are idempotent and re-running converges). Audit event is the final durable step.
#
# `organizationId` names the organization the floor authorizes in. The revoke
# reaches deployment-wide `passkey` rows keyed to the `user`, so the floor asks
# whether the caller administers THAT organization and whether the target holds a
# member row in it; an absent one falls back to the APP's pinned organization,
# which refuses an administrator of any other.
#
# Payload: { user_id, passkey_id?, target_name?, target_email? }
id: revoke-passkeys
type: Api
routine:
  - id: revoke-passkeys
    type: RevokeUserPasskeys
    properties:
      userId:
        _payload: user_id
      organizationId:
        _module.var: org_slug
      passkeyId:
        _payload: passkey_id
  - id: revoke
    type: RevokeUserSessions
    properties:
      userId:
        _payload: user_id
      organizationId:
        _module.var: org_slug
  - id: audit
    type: CallApi
    properties:
      endpointId:
        _module.endpointId:
          id: new-event
          module: events
      payload:
        type: passkeys-revoked
        display:
          _build.object.fromEntries:
            - - _build.app: slug
              - title:
                  _nunjucks:
                    template:
                      _build.if_none:
                        - _module.var: event_display.passkeys-revoked
                        - _ref:
                            path: defaults/event_display.yaml
                            key: passkeys-revoked
                    on:
                      user:
                        _user: true
                      target:
                        name:
                          _payload: target_name
                        email:
                          _payload: target_email
                description: null
        references:
          user_ids:
            - _payload: user_id
  # Fire-and-forget after the audit event: a bounced address must never suppress
  # the audit record or tell the admin the recovery failed. No rollback, no
  # try/catch (design Decision 8).
  - id: notify
    type: CallApi
    properties:
      endpointId:
        _module.endpointId:
          id: send-notification
          module: notifications
      payload:
        event_ids:
          - _step: audit.eventId
  - :return:
      success: true
