# delete-user: DeleteUser (design Decision 4). Hard-deletes the login identity
# (user row + its member/invitation/session/account rows); the contact ALWAYS
# survives (contact soft-delete stays the contacts-side convention).
#
# GUARDED: offered only when the user holds NO OTHER memberships, and the routine
# RE-CHECKS server-side before deleting. App A's admin must not destroy an
# identity app B depends on. The check counts member rows in any organization
# OTHER than the one this instance administers (`org_slug`).
#
# Role-gated app-side; the step declares the permission it needs and the engine
# floors it against the caller's member row in the organization the step names.
# Audit is the final step.
#
# `organizationId` names the organization the floor authorizes in. The delete reaches
# a deployment-wide `user` row, so the floor asks whether the caller administers
# THAT organization and whether the target holds a member row in it; an absent one
# falls back to the APP's pinned organization, which refuses an administrator of
# any other. The floor's target-membership requirement does NOT subsume the guard
# above: the guard is the stricter rule that the identity holds no other
# membership anywhere.
#
# Payload: { user_id, target_name?, target_email? }
id: delete-user
type: Api
routine:
  - id: other_memberships
    type: MongoDBAggregation
    connectionId:
      _module.connectionId: user-members
    properties:
      pipeline:
        - $match:
            user_id:
              _payload: user_id
            organization_id:
              $ne:
                _module.var: org_slug
        - $count: count
  - :if:
      _gt:
        - _if_none:
            - _step: other_memberships.0.count
            - 0
        - 0
    :then:
      - :reject: This user belongs to other apps; their login can't be deleted from here. Remove them from this app instead.
  - id: delete
    type: DeleteUser
    properties:
      userId:
        _payload: user_id
      organizationId:
        _module.var: org_slug
  - id: audit
    type: CallApi
    properties:
      endpointId:
        _module.endpointId:
          id: new-event
          module: events
      payload:
        type: user-deleted
        display:
          _build.object.fromEntries:
            - - _build.app: slug
              - title:
                  _nunjucks:
                    template:
                      _build.if_none:
                        - _module.var: event_display.user-deleted
                        - _ref:
                            path: defaults/event_display.yaml
                            key: user-deleted
                    on:
                      user:
                        _user: true
                      target:
                        name:
                          _payload: target_name
                        email:
                          _payload: target_email
                description: null
        references:
          user_ids:
            - _payload: user_id
  - :return:
      success: true
