# reinstate — UnbanUser (design Decision 4). Reversible counterpart to suspend;
# clears the user-level ban. Behind the `suspension` var (default true): when
# false, the routine is a bare reject. Role-gated app-side; the step declares the
# permission it needs and the engine floors it against the caller's member row in
# the organization the step names.
#
# `organizationId` names the organization the floor authorizes in. The unban reaches
# a deployment-wide `user` row, so the floor asks whether the caller administers
# THAT organization and whether the target holds a member row in it; an absent one
# falls back to the APP's pinned organization, which refuses an administrator of
# any other.
#
# Payload: { user_id, target_name?, target_email? }
id: reinstate
type: Api
routine:
  _build.array.concat:
    - _build.if:
        test:
          _build.not:
            _module.var: suspension
        then:
          - - :reject: Suspension is disabled for this deployment (the "suspension" var is false).
        else: []
    - - id: unban
        type: UnbanUser
        properties:
          userId:
            _payload: user_id
          organizationId:
            _module.var: org_slug
      - id: audit
        type: CallApi
        properties:
          endpointId:
            _module.endpointId:
              id: new-event
              module: events
          payload:
            type: user-reinstated
            display:
              _build.object.fromEntries:
                - - _build.app: slug
                  - title:
                      _nunjucks:
                        template:
                          _build.if_none:
                            - _module.var: event_display.user-reinstated
                            - _ref:
                                path: defaults/event_display.yaml
                                key: user-reinstated
                        on:
                          user:
                            _user: true
                          target:
                            name:
                              _payload: target_name
                            email:
                              _payload: target_email
                    description: null
            references:
              user_ids:
                - _payload: user_id
      - :return:
          success: true
