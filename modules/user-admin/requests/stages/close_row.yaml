# Closes the wire row: the shared last stage of every members / invitations read
# (list, detail, export, invitations list). It exists so the row a consumer binds
# a column to is the documented contract in
# `docs/user-admin/reference/row-contract.md` and nothing else.
#
# THE RULE, not just the list. A future $lookup or alias has to extend this:
#   1. Every raw $lookup payload, so a whole source document never rides to the
#      browser: user, contact, passkeys, inviter.
#   2. Every stored field that already ships under a canonical alias, so the row
#      never offers two paths to one value:
#        attributes    → member_attributes
#        app_roles     → roles
#        created_at    → signed_up (members) / created (invitations)
#        profile.picture → top-level picture
#      `expires_at` is deliberately not in that set. The Invitations tab binds the
#      stored column directly, so unsetting it blanks the Expires column.
#   3. Every stored field the contract deliberately does not publish here: `role`
#      is BetterAuth's owner/admin/member tier, unrelated to the app roles `roles`
#      carries. Left on the row it reads as the Roles column's stored value, so a
#      consumer binds a column to it and gets a tier. The detail read publishes it
#      deliberately under `org_role`.
#
# `profile.picture` earns its place beyond tidiness: it holds an ~800-character
# data:image/svg+xml gradient avatar, so leaving both paths ships the blob twice
# per row. Safe for the write path. The profile modal posts the whole `profile`
# subtree back, but write-profile merges it with $mergeObjects against the stored
# bag, so a payload without `picture` leaves the stored value intact.
#
# $unset on an absent field is a no-op, so one stage naming every join key is
# safe in every read: `passkeys` only exists on the detail read, `inviter` only
# on the invitations branch.
#
# ORDERING IS THE POINT. This runs LAST, after `request_stages.get_all_users`, so
# a consumer stage still sees the raw joins (the escape hatch for anything the
# three bags don't cover) and anything it adds survives. A terminal $project
# whitelist cannot do both: placed before the slot it strips the joins out from
# under the consumer, placed after it strips what the consumer just added.
# `request_stages.filter_match` also runs before this and can keep matching
# `user.*` / `contact.*`.
$unset:
  - user
  - contact
  - passkeys
  - inviter
  - inviter_member
  - attributes
  - app_roles
  - role
  - created_at
  - profile.picture
