# Resolve held role ids against the app's authored role catalog
# (`_build.authConfig.roles`) — the single source of truth for role labels
# and descriptions. Each id in the member's / invitation's `appRoles` array
# becomes { id, label, description, orphan }:
#   id          — the raw held role id, verbatim
#   label       — the catalog `label` for the id, or the raw id when unmatched
#   description — the catalog `description` for the id, or null when unmatched
#                 or when the catalog entry carries no description
#   orphan      — true when the id is held in data but absent from the catalog
#                 (a role removed from config); rendered flagged "no longer
#                 configured", never silently stripped.
# $ifNull because $map errors outright on a row that carries no `appRoles`.
$addFields:
  roles:
    $map:
      input:
        $ifNull:
          - "$appRoles"
          - []
      as: rid
      in:
        id: "$$rid"
        label:
          $let:
            vars:
              hit:
                $first:
                  $filter:
                    input:
                      _build.authConfig: roles
                    as: c
                    cond:
                      $eq:
                        - "$$c.id"
                        - "$$rid"
            in:
              $ifNull:
                - "$$hit.label"
                - "$$rid"
        description:
          $let:
            vars:
              hit:
                $first:
                  $filter:
                    input:
                      _build.authConfig: roles
                    as: c
                    cond:
                      $eq:
                        - "$$c.id"
                        - "$$rid"
            in:
              $ifNull:
                - "$$hit.description"
                - null
        orphan:
          $not:
            - $in:
                - "$$rid"
                - $map:
                    input:
                      _build.authConfig: roles
                    as: c
                    in: "$$c.id"
