# Excel export (design Decision 2) — the ONE place members and invitations are
# merged into a single flat "everyone with or pending access" snapshot with a
# uniform `status` column (Active / Suspended / Invited / Expired). Not paginated
# and not filtered: it emits the full set. Members are rooted on `user-members`
# (joined shape) and $unionWith brings in the pending `user-invitations` rows.
# The branches are NOT forced to a common shape: $unionWith concatenates
# heterogeneous documents, and DownloadXlsx resolves each column through
# get(row, column.value), so a key missing on one branch is just an empty cell.
# Invitation rows therefore carry `member_attributes` but no `profile` and no
# `user_attributes` — there is no user and no contact yet.
#
# Roles export as their stored ids joined by ", " (a raw data dump) rather than
# catalog labels, so the export builds without the `_build.authConfig` catalog
# projection. Consumer `download_columns` add further columns (wired in the
# export button's DownloadXlsx schema) and bind the same row paths as
# `table_columns` — see docs/user-admin/reference/row-contract.md.
id: get_users_excel_data
type: MongoDBAggregation
connectionId:
  _module.connectionId: user-members
properties:
  pipeline:
    _build.array.concat:
      # Member rows.
      - _ref: requests/stages/members_base.yaml
      - - $addFields:
            roles:
              $trim:
                input:
                  $reduce:
                    input:
                      $ifNull:
                        - "$appRoles"
                        - []
                    initialValue: ""
                    in:
                      $concat:
                        - "$$value"
                        - ", "
                        - "$$this"
                chars: ", "
            expires: null
        # Pending / expired invitation rows.
        - $unionWith:
            coll: user-invitations
            pipeline:
              _build.array.concat:
                - _ref: requests/stages/invitations_base.yaml
                - - $addFields:
                      name: null
                      roles:
                        $trim:
                          input:
                            $reduce:
                              input:
                                $ifNull:
                                  - "$appRoles"
                                  - []
                              initialValue: ""
                              in:
                                $concat:
                                  - "$$value"
                                  - ", "
                                  - "$$this"
                          chars: ", "
                      created: "$createdAt"
                      updated: null
                      signed_up: null
                      expires: "$expiresAt"
        - $sort:
            status: 1
            email: 1
      # Consumer stages, applied ONCE after the union so they see member and
      # invitation rows alike — and, because nothing whitelists upstream of here,
      # they see the raw `user` / `contact` / `inviter` joins exactly as the same
      # slot does in get_all_members. One slot, one input shape.
      - _module.var: request_stages.get_all_users
      # Close the row like every other read, then drop `picture`: a spreadsheet
      # has no use for an ~800-character data-URI SVG and this read fetches every
      # row at once. The Members list keeps it — the Name column's avatar binds it.
      - - _ref: requests/stages/close_row.yaml
        - $unset: picture
