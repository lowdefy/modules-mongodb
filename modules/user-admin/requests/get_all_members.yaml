# Members list read (design Decision 1/2). Native aggregation rooted on the
# pinned org's `user-members`, joined to `users` + `user-contacts`, filtered by
# the members filter, sorted server-side AFTER the joins (so the order spans the
# whole result set, not just the visible page), then paginated with a $facet that
# returns the post-filter total alongside the page. Each returned row carries
# `total_results` (denormalised from the $count facet) so the shared Pagination
# block and the result count read the true total, never rows.length.
id: get_all_members
type: MongoDBAggregation
connectionId:
  _module.connectionId: user-members
payload:
  pagination:
    _state: pagination
  filter:
    _state: filter
  sort:
    _state: sort
properties:
  pipeline:
    _build.array.concat:
      # Join + flatten the display shape, with the roles clause spliced into the
      # base's pre-join slot: `app_roles` is a stored member field, so matching it
      # on the root, before the $lookups, is what lets the compound
      # { organization_id: 1, app_roles: 1 } index serve the filter. The base's own
      # $match supplies the leading `organization_id` key, and MongoDB coalesces
      # the two adjacent $matches into one, so repeating it here would be dead
      # weight. `$match: {}` when no role is selected, matching every member.
      # The filter is a runtime payload, so the stage cannot be dropped at build
      # time.
      - _ref:
          path: ../shared/org/members_base.yaml
          vars:
            org_value:
              _module.var: org_slug
            pre_join_stages:
              - $match:
                  _if:
                    test:
                      _gt:
                        - _array.length:
                            _if_none:
                              - _payload: filter.roles
                              - []
                        - 0
                    then:
                      app_roles:
                        $in:
                          _payload: filter.roles
                    else: {}
      # Post-$lookup filter, then the consumer's plain-$match filter_match slot.
      - - _ref: requests/stages/members_filter.yaml
      - _module.var: request_stages.filter_match
      # Split total + page in one round-trip.
      - - $facet:
            count:
              - $count: total
            results:
              _build.array.concat:
                - - $sort:
                      _object.assign:
                        - _object.defineProperty:
                            on: {}
                            key:
                              _payload: sort.by
                            descriptor:
                              value:
                                _payload: sort.order
                        - _id: 1
                  - $skip:
                      _payload: pagination.skip
                  - $limit:
                      _payload: pagination.pageSize
                  # Resolve role ids → { label, orphan } against the catalog.
                  - _ref: requests/stages/roles_from_catalog.yaml
                - _module.var: request_stages.get_all_users
                # Close the row LAST, after the consumer slot, so it still sees
                # the raw joins and anything it adds survives.
                - - _ref: requests/stages/close_row.yaml
        - $unwind: "$count"
        - $unwind: "$results"
        - $addFields:
            results.total_results: "$count.total"
        - $replaceRoot:
            newRoot: "$results"
