name: Files
version: 1.1.0
description: File attachment management — upload, download, list, S3 integration

dependencies:
  - id: layout
    description: Card component for file-card wrapper
  - id: events
    description: Change stamp and event logging for file audit

vars:
  s3_region:
    required: true
    description: AWS region for S3 buckets (e.g., us-east-1, ca-central-1)
  log_events:
    type: boolean
    default: true
    description: Log file upload/delete events via the events module
  access_check:
    type: object
    description: >-
      An app endpoint that decides who may work with a record's files. When
      set, list-files, upload-policy, save-file, download-file and delete-file
      each call it before they act, with { operation (list, upload, save,
      download or delete), entity_type, entity_id, file_id } (file_id is null
      for list and upload). Only { allowed: true } lets the operation go ahead;
      { allowed: false, message } stops it with that message, which the block
      shows. Unset, every signed-in member of the organization passes. A record
      may not be saved yet when it is asked: the activities module mints
      activity_id before the activity is saved, so files can be uploaded to a
      new activity, and the endpoint decides what to answer for a record it
      cannot find.
    properties:
      endpoint_id:
        type: string
        default: null
        description: Id of the app endpoint to call.
  max_file_size:
    type: number
    default: 26214400
    description: >-
      Largest upload in bytes (default 25 MB). upload-policy refuses a larger
      declared size, and the presigned policy carries the limit, so S3 refuses a
      larger upload.
  allowed_content_types:
    type: array
    default: null
    description: >-
      Content types upload-policy accepts, such as [application/pdf,
      image/png]. Null (the default) accepts any type.
    items:
      type: string
  components:
    type: object
    description: "Component overrides: file_list (deprecated)"
    properties:
      file_list:
        description: >-
          Deprecated. Override block list rendered by the file-list component.
          Prefer the file-manager or file-card components going forward.

exports:
  connections:
    - id: files-collection
      description: MongoDB connection for file metadata
    - id: files-bucket
      description: S3 bucket for private file storage
    - id: files-bucket-public
      description: S3 bucket for public file storage
  api:
    - id: list-files
      description: >-
        List a record's live file records, newest first. Payload
        { entity_type, entity_id, file_category? }.
    - id: upload-policy
      description: >-
        Mint an upload key under the caller's organization and record and
        return its presigned POST policy. Payload
        { entity_type, entity_id, file: { name, type, size } }.
    - id: save-file
      description: >-
        Record a file uploaded through an upload-policy key. Payload
        { entity_type, entity_id, key, thumbnail?, file_title?,
        file_category?, metadata? }. Returns { fileId }.
    - id: download-file
      description: >-
        Sign a download link for a live file record. Payload { file_id }.
        Returns { url }.
    - id: delete-file
      description: Soft-delete a live file record. Payload { file_id }.
  components:
    - id: file-manager
      description: >-
        Unified FileManager block — drag-drop upload, file type icons,
        thumbnails, clipboard paste, progress bar, download, delete
        confirmation, form fields modal, single-file and max-count modes.
        `metadata_tags` renders read-only tags per file row from the file's
        metadata (entries: { key, label, when, color }; see the FileManager
        plugin docs).
    - id: file-card
      description: >-
        Layout card wrapping file-manager for easy embedding. Passes through
        file-manager's vars (incl. `form_fields` and `metadata_tags`).
    - id: file-list
      description: >-
        Lightweight read-only file list. Lists through list-files on mount
        and downloads through download-file. Vars: block_id, entity_type,
        entity_id, file_category, and `empty_text` (default "No files" — the
        empty-state message).

connections:
  - _ref: connections/files-collection.yaml
  - _ref: connections/files-bucket.yaml
  - _ref: connections/files-bucket-public.yaml

api:
  - _ref: api/list-files.yaml
  - _ref: api/upload-policy.yaml
  - _ref: api/save-file.yaml
  - _ref: api/download-file.yaml
  - _ref: api/delete-file.yaml

components:
  - id: file-manager
    component:
      _ref: components/file-manager.yaml
  - id: file-card
    component:
      _ref: components/file-card.yaml
  - id: file-list
    component:
      _ref: components/file-list.yaml

secrets:
  - name: MONGODB_URI
    description: MongoDB connection URI
  - name: FILES_S3_ACCESS_KEY_ID
    description: AWS access key for S3 file storage
  - name: FILES_S3_SECRET_ACCESS_KEY
    description: AWS secret access key for S3 file storage
  - name: FILES_S3_BUCKET
    description: S3 bucket name for private file storage
  - name: FILES_S3_BUCKET_PUB
    description: S3 bucket name for public file storage

plugins:
  - name: "@lowdefy/modules-mongodb-plugins"
    version: "^1.1.0"
