id:
  _var:
    key: block_id
    default: file_list
type: Box
events:
  onMount:
    _ref:
      path: components/parts/list_files_actions.yaml
      vars:
        state_key:
          _build.string.concat:
            - _var:
                key: block_id
                default: file_list
            - _items
        entity_type:
          _var: entity_type
        entity_id:
          _var: entity_id
        file_category:
          _var:
            key: file_category
            default: null
blocks:
  - id:
      _build.string.concat:
        - _var:
            key: block_id
            default: file_list
        - _empty
    type: Box
    visible:
      _eq:
        - _array.length:
            _if_none:
              - _state:
                  _build.string.concat:
                    - _var:
                        key: block_id
                        default: file_list
                    - _items
              - []
        - 0
    blocks:
      - id:
          _build.string.concat:
            - _var:
                key: block_id
                default: file_list
            - _no_files
        type: Paragraph
        properties:
          content:
            _var:
              key: empty_text
              default: No files
          type: secondary
          style:
            fontSize: 12
            fontStyle: italic
  - id:
      _build.string.concat:
        - _var:
            key: block_id
            default: file_list
        - _items
    type: List
    visible:
      _gt:
        - _array.length:
            _if_none:
              - _state:
                  _build.string.concat:
                    - _var:
                        key: block_id
                        default: file_list
                    - _items
              - []
        - 0
    blocks:
      - id:
          _build.string.concat:
            - _var:
                key: block_id
                default: file_list
            - _items.$.row
        type: Box
        layout:
          gap: 8
          justify: space-between
          contentAlign: middle
        blocks:
          - id:
              _build.string.concat:
                - _var:
                    key: block_id
                    default: file_list
                - _items.$.download
            type: FileDownload
            properties:
              downloadEndpointId:
                _module.endpointId: download-file
              fileList:
                - _state:
                    _build.string.concat:
                      - _var:
                          key: block_id
                          default: file_list
                      - _items.$.file
          - id:
              _build.string.concat:
                - _var:
                    key: block_id
                    default: file_list
                - _items.$.date
            type: Paragraph
            properties:
              type: secondary
              style:
                fontSize: 12
              content:
                _dayjs.format:
                  on:
                    _state:
                      _build.string.concat:
                        - _var:
                            key: block_id
                            default: file_list
                        - _items.$.created.timestamp
                  format: YYYY-MM-DD
