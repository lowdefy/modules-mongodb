id:
  _var:
    key: block_id
    default: file_manager
type: FileManager
properties:
  downloadEndpointId:
    _module.endpointId: download-file
  # Set by the list-files actions, not by an input block.
  files:
    _state:
      _build.string.concat:
        - _var:
            key: block_id
            default: file_manager
        - _files
    ~ignoreBuildChecks:
      - state-refs
  viewOnly:
    _var:
      key: view_only
      default: false
  disabled:
    _var:
      key: disabled
      default: false
  showDelete:
    _var:
      key: allow_delete
      default: true
  singleFile:
    _var:
      key: single_file
      default: false
  maxCount:
    _var:
      key: max_count
      default: null
  accept:
    _var:
      key: accept
      default: "*"
  hint:
    _var:
      key: hint
      default: Click or drag file to upload
  label:
    _var:
      key: label
      default: null
  modalTitle:
    _var:
      key: modal_title
      default: Upload File
  okText:
    _var:
      key: ok_text
      default: Save
  metadataTags:
    _var:
      key: metadata_tags
      default: []
slots:
  form:
    blocks:
      _var:
        key: form_fields
        default: []
events:
  onMount:
    _ref:
      path: components/parts/list_files_actions.yaml
      vars:
        state_key:
          _build.string.concat:
            - _var:
                key: block_id
                default: file_manager
            - _files
        entity_type:
          _var: entity_type
        entity_id:
          _var: entity_id
        file_category:
          _var:
            key: file_category
            default: null
  # A refused policy fails the event: the endpoint's message shows and the
  # upload is dropped rather than held.
  onUploadPolicy:
    try:
      - id: get_upload_policy
        type: CallAPI
        params:
          endpointId:
            _module.endpointId: upload-policy
          payload:
            entity_type:
              _var: entity_type
            entity_id:
              _var: entity_id
            file:
              name:
                _event: file.name
              type:
                _event: file.type
              size:
                _event: file.size
      - id: set_upload_policy
        type: CallMethod
        params:
          blockId:
            _var:
              key: block_id
              default: file_manager
          method: setUploadPolicy
          args:
            - _actions: get_upload_policy.response.response
    catch:
      - id: drop_upload
        type: CallMethod
        params:
          blockId:
            _var:
              key: block_id
              default: file_manager
          method: cancelUpload
          args:
            - _event: file.uid
  onSave:
    _build.array.concat:
      - - id: save_file
          type: CallAPI
          params:
            endpointId:
              _module.endpointId: save-file
            payload:
              entity_type:
                _var: entity_type
              entity_id:
                _var: entity_id
              key:
                _event: file.key
              thumbnail:
                _event: file.thumbnail
              file_title:
                _var:
                  key: file_title
                  default: null
              file_category:
                _var:
                  key: file_category
                  default: null
              metadata:
                _state:
                  _build.string.concat:
                    - _var:
                        key: block_id
                        default: file_manager
                    - .form
      - _ref:
          path: components/parts/list_files_actions.yaml
          vars:
            state_key:
              _build.string.concat:
                - _var:
                    key: block_id
                    default: file_manager
                - _files
            entity_type:
              _var: entity_type
            entity_id:
              _var: entity_id
            file_category:
              _var:
                key: file_category
                default: null
      - _var:
          key: on_save
          default: []
  onDelete:
    _build.array.concat:
      - - id: delete_file
          type: CallAPI
          params:
            endpointId:
              _module.endpointId: delete-file
            payload:
              file_id:
                _event: fileDoc._id
      - _ref:
          path: components/parts/list_files_actions.yaml
          vars:
            state_key:
              _build.string.concat:
                - _var:
                    key: block_id
                    default: file_manager
                - _files
            entity_type:
              _var: entity_type
            entity_id:
              _var: entity_id
            file_category:
              _var:
                key: file_category
                default: null
      - _var:
          key: on_delete
          default: []
  onDownload:
    _build.array.concat:
      - - id: log_download_event
          type: CallAPI
          skip:
            _not:
              _module.var: log_events
          params:
            endpointId:
              _module.endpointId:
                id: new-event
                module: events
            payload:
              type: download-file
              references:
                entity_type:
                  _var: entity_type
                entity_id:
                  _var: entity_id
              metadata:
                file_name:
                  _event: fileDoc.file.name
                file_category:
                  _event: fileDoc.file_category
                file_key:
                  _event: fileDoc.file.key
      - _var:
          key: on_download
          default: []
