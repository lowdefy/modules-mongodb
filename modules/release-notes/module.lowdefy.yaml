name: Release Notes
version: 2.0.0
description: >-
  Release notes the team announces from Pelican: the app's What's new page,
  and the counts Pelican shows before anyone announces. Pelican's release events
  reach the module through the support module's signed webhook.

dependencies:
  - id: layout
    description: Page layout wrapper
  - id: events
    description: >-
      Change stamps on every write to a note and on each person's release
      email choice.
  - id: notifications
    description: The bell notification and email each announcement sends.
  - id: files
    description: >-
      The public files bucket (FILES_S3_BUCKET_PUB) a note's images and videos
      are copied into.

vars:
  about:
    type: string
    default: >-
      What changed in the app, newest first, and whether new releases are also
      emailed to you.
    description: >-
      One sentence on what What's new is for, handed to the layout page
      component as `about`. A layout that shows an `about` on the last crumb
      (a page about text) uses it; one that does not ignores it.
  audiences:
    type: array
    default: []
    description: >-
      The groups of the app's members Pelican can announce to, besides
      everyone, which is always offered. Each is { id, label, query }: query is
      a MongoDB filter over the person's member row in user-members (app_roles,
      attributes).
    items:
      type: object
      properties:
        id:
          type: string
          description: The audience's id, which Pelican sends back in a selection.
        label:
          type: string
          description: The name Pelican shows for the audience.
        query:
          type: object
          description: >-
            A MongoDB filter over a user-members row, such as
            { app_roles: dispatcher }.
  email_template:
    type: string
    default: null
    description: >-
      A notifications template id in the app's own config for the release note
      email. Null uses the module's release-note template.
  region:
    type: string
    required: true
    description: >-
      The AWS region of the public files bucket, for the URLs of a note's
      images and videos.

exports:
  pages:
    - id: view
      description: What's new
  menus:
    - id: default
  connections:
    - id: release-notes
      description: >-
        The notes announced to the app (collection release-notes), one per
        {repository}@{version}, outside the tenant wall
    - id: release-notes-recipients
      description: >-
        Who each note was announced to (collection release-notes-recipients),
        one row per person per note, outside the tenant wall
    - id: release-notes-preferences
      description: >-
        Each person's release note email choice (collection
        release-notes-preferences), one row per user, outside the tenant wall
    - id: release-notes-members
      description: Read-only view of the auth engine's user-members
    - id: release-notes-users
      description: Read-only view of the auth engine's users
    - id: release-notes-organizations
      description: Read-only view of the auth engine's user-organizations
  components:
    - id: get_unread_release_notes_count
      description: >-
        The request get_unread_release_notes_count, the signed-in person's
        count of announced notes they have not opened, as [{ total }] (empty
        when none). Add it to the requests of any page, or to the layout's
        global_requests, to show a New mark while a note is unread.
  api:
    - id: receive
      description: >-
        Internal: the release events the support webhook hands on, named in the
        support module's release_notes_endpoint var
    - id: sweep
      description: >-
        Internal: restarts the delivery of any announced note that stalled.
        Call it every 10 minutes from an app endpoint with a schedules cron.

connections:
  - _ref: connections/release-notes.yaml
  - _ref: connections/release-notes-recipients.yaml
  - _ref: connections/release-notes-preferences.yaml
  - _ref: connections/release-notes-members.yaml
  - _ref: connections/release-notes-users.yaml
  - _ref: connections/release-notes-organizations.yaml

api:
  - _ref: api/receive.yaml
  - _ref: api/deliver.yaml
  - _ref: api/sweep.yaml

pages:
  - _ref: pages/view.yaml

components:
  - id: get_unread_release_notes_count
    component:
      _ref: requests/get_unread_release_notes_count.yaml

menus:
  - _ref: menus.yaml

notifications:
  - _ref: notifications/release-note.yaml

secrets:
  - name: MONGODB_URI
    description: MongoDB connection URI
  - name: FILES_S3_BUCKET_PUB
    description: >-
      The public files bucket a note's images and videos are copied into. The
      What's new page links them by their plain object URL.
