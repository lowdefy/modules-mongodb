# What's new, as a reading page: the notes announced to the signed-in person,
# newest first, beside the one shown (urlQuery.note, else the newest), with
# their release email switch at the foot of the note. On a phone the list of
# one-line rows stacks above the note.
_ref:
  module: layout
  component: page
  vars:
    id: view
    title: What's new
    hide_title: true
    about:
      _module.var: about
    content_width: 1100
    requests:
      - _ref: requests/get_notes.yaml
      - _ref: requests/get_note.yaml
      - _ref: requests/update_note_opened.yaml
      - _ref: requests/get_email_preference.yaml
      - _ref: requests/set_email_preference.yaml
    events:
      onInit:
        _ref: actions/load_page.yaml
      onMount:
        _ref: actions/open_page.yaml
    blocks:
      - id: whats_new
        type: Box
        class:
          .block: min-w-0
        layout:
          gap: 32
        blocks:
          - id: notes_column
            type: Box
            class:
              .block: min-w-0
            layout:
              span: 24
              md:
                span: 8
              direction: column
            blocks:
              - id: notes
                type: List
                class:
                  .block: w-full min-w-0 max-w-full
                properties:
                  direction: column
                layout:
                  gap: 2
                blocks:
                  - _ref: components/note_row.yaml
          - id: note_column
            type: Box
            class:
              .block: min-w-0
            layout:
              span: 24
              md:
                span: 16
              direction: column
              gap: 24
            blocks:
              - _ref: components/note_card.yaml
              - id: notes_empty
                type: Paragraph
                visible:
                  _eq:
                    - _state: note
                    - null
                style:
                  margin: 0
                properties:
                  type: secondary
                  content: Nothing new yet.
              - _ref: components/email_card.yaml
