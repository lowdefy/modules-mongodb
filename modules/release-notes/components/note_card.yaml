# The shown note (`note`, from get_note): its date in grey, the headline, then
# the body with its embeds already rewritten to public URLs.
id: note_card
type: Box
visible:
  _ne:
    - _state: note
    - null
layout:
  direction: column
  gap: 8
blocks:
  - id: note_date
    type: Span
    class: text-[13px] text-[var(--ant-color-text-tertiary)]
    properties:
      content:
        _dayjs.format:
          on:
            _state: note.released_at
          format: D MMMM YYYY
  - id: note_title
    type: Title
    style:
      margin: 0
    properties:
      level: 2
      content:
        _state: note.title
  # The body is the team's own markdown from Pelican. Its videos need HTML,
  # which DangerousMarkdown renders through DOMPurify.
  - id: note_body
    type: DangerousMarkdown
    class:
      .element: >-
        text-[15px] leading-relaxed
        [&_h2]:mt-6 [&_h2]:border-0 [&_h2]:text-xs [&_h2]:font-semibold [&_h2]:uppercase [&_h2]:tracking-wider [&_h2]:text-[var(--ant-color-text-tertiary)]
        [&_h3]:text-lg [&_h3]:font-semibold
        [&_img]:h-auto [&_img]:max-w-full [&_img]:rounded-lg
        [&_video]:w-full [&_video]:rounded-lg
    properties:
      content:
        _state: note.body
