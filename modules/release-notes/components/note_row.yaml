# One note in the What's new list (`notes.$`, a row of get_notes): version with
# its New mark, headline and date. The shown note is outlined.
id: notes.$
type: Box
class:
  _if:
    test:
      _eq:
        - _state: notes.$._id
        - _state: note._id
    then: min-w-0 cursor-pointer rounded-lg border border-solid border-[var(--ant-color-border-secondary)] bg-[var(--ant-color-bg-container)] px-3 py-2.5
    else: min-w-0 cursor-pointer rounded-lg border border-solid border-transparent px-3 py-2.5 hover:bg-[var(--ant-color-fill-quaternary)]
layout:
  direction: column
  gap: 2
events:
  onClick:
    _ref: actions/select_note.yaml
blocks:
  - id: notes.$.heading
    type: Box
    layout:
      gap: 6
      align: middle
      wrap: nowrap
    blocks:
      - id: notes.$.version_label
        type: Span
        class: font-semibold
        layout:
          flex: 0 1 auto
        properties:
          content:
            _string.concat:
              - "Version "
              - _state: notes.$.version
      - id: notes.$.new_mark
        type: Tag
        visible:
          _state: notes.$.new
        layout:
          flex: 0 0 auto
        properties:
          title: New
          color: success
  - id: notes.$.headline
    type: Span
    class: line-clamp-1 text-[13px]
    properties:
      content:
        _state: notes.$.title
  - id: notes.$.date
    type: Span
    class: text-xs text-[var(--ant-color-text-tertiary)]
    properties:
      content:
        _dayjs.format:
          on:
            _state: notes.$.released_at
          format: D MMMM YYYY
