id: receive
type: InternalApi
description: >-
  Takes the release events the support module's webhook hands on, after it has
  checked Pelican's signature, as { delivery, app_version }, and routes them by
  delivery.event. release.audience answers live counts of the people an
  announcement would reach. release.announced stores the note and who is owed
  it, then hands the rest to deliver. Any other event answers 400.
routine:
  - :set_state:
      delivery:
        _payload: delivery
  - :if:
      _eq:
        - _state: delivery.event
        - release.audience
    :then:
      - _ref: api/events/audience.yaml
  - :if:
      _eq:
        - _state: delivery.event
        - release.announced
    :then:
      - _ref: api/events/announced.yaml
  - :reject: Unknown release event
    :status: 400
