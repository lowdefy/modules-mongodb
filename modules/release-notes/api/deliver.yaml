id: deliver
type: InternalApi
description: >-
  Delivers one announced note, one bounded unit of work per call: copies one
  media file into the public files bucket, or else dispatches the release-note
  notification to up to 100 people owed it, all in one organisation. It then
  calls itself detached while work remains. Payload { note_id, failed }:
  failed lists the media names whose copy failed earlier in this chain, left
  for the sweep. Every step is safe to repeat.
routine:
  - :set_state:
      note_id:
        _payload: note_id
      failed:
        _if_none:
          - _payload: failed
          - []
  # Marks the note as being worked on, so the sweep leaves a running chain
  # alone. A note that is gone matches nothing and ends the chain.
  - id: note
    type: MongoDBUpdateOne
    connectionId:
      _module.connectionId: release-notes
    properties:
      disableNoMatchError: true
      filter:
        _id:
          _state: note_id
      update:
        - $set:
            delivering_at: $$NOW
  - :if:
      _eq:
        - _step: note.matchedCount
        - 0
    :then:
      - :return:
          done: true
  - id: stored_note
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: release-notes
    properties:
      query:
        _id:
          _state: note_id
  - :set_state:
      note:
        _step: stored_note
  # A file with no source link or content type cannot be fetched or checked,
  # so it waits for a delivery that brings both.
  - :set_state:
      pending_media:
        _js: |
          const failed = state('failed');
          return (
            (state('note').media || []).find(
              (file) =>
                file.copied !== true &&
                typeof file.source_url === 'string' &&
                typeof file.content_type === 'string' &&
                !failed.includes(file.name),
            ) ?? null
          );
  - :if:
      _ne:
        - _state: pending_media
        - null
    :then:
      - _ref: api/parts/copy-media.yaml
      - id: next_media
        type: CallApi
        properties:
          endpointId:
            _module.endpointId: deliver
          detached: true
          payload:
            note_id:
              _state: note_id
            failed:
              _state: failed
      - :return:
          media:
            _state: pending_media.name
  - _ref: api/parts/notify-batch.yaml
  - :if:
      _eq:
        - _state: batch_size
        - 0
    :then:
      - :return:
          done: true
  - id: next_batch
    type: CallApi
    properties:
      endpointId:
        _module.endpointId: deliver
      detached: true
      payload:
        note_id:
          _state: note_id
        failed:
          _state: failed
  - :return:
      notified:
        _state: batch_size
