# The app `user-contacts` collection, used by `invite` to mint the invitee's
# contact before the invitation is sent, and by `setup-organization` to mint
# the owner's contact in a new organization and write their profile onto it.
#
# Tenant wall: every read and write through this connection is scoped to the
# caller's organization; organization_id is stamped and filtered mechanically.
# That is why the shared ensure-contact fragment is spliced here WITHOUT an
# `organization_id` var: the caller is logged in with the target org
# active, so the wall supplies the org and would reject an authored
# organization_id filter.
id: user-contacts-collection
type: MongoDBCollection
properties:
  databaseUri:
    _secret: MONGODB_URI
  collection: user-contacts
  changeLog:
    collection: log-changes
    meta:
      user:
        _user: true
  write: true
