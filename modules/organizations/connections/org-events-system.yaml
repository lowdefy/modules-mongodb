# The write surface for an organization event logged when the caller is no
# longer in the organization it is about: `org-member-left`, written after the
# server-side leave in the same request. The walled events connection would
# stamp the caller's session organization, which the leave has just ended.
#
# Shared, but not org-less: api/parts/log-event.yaml stamps the organization
# it is given on every write. It change-logs into its own collection, since the
# engine writes a shared connection's change-log records without
# organization_id, and one such record in a collection a walled connection
# reads (log-changes) makes the tenant preflight refuse to serve the app.
id: org-events-system
type: MongoDBCollection
tenant: shared # the left event; stamps the organization the caller left explicitly
properties:
  databaseUri:
    _secret: MONGODB_URI
  collection: log-events
  changeLog:
    collection: log-changes-system
    meta:
      user:
        _user: true
  write: true
