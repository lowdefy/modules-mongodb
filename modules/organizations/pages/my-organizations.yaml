# `my-organizations` page: every organization the caller belongs to, with its
# logo, name, the caller's authority there and its member count, the active
# one first and marked Current. The active row opens its settings; the others
# switch to it through the switch page. Leave takes the caller to their own
# member page in that organization, where leaving happens (through the switch
# page for another organization). Leave is not offered on the caller's only
# membership, and is locked for the only owner. Create organization shows when
# `allow_create_organization` is on.
_ref:
  module: layout
  component: page
  vars:
    id: my-organizations
    content_width: 760
    title:
      _build.string.concat:
        - 'Your '
        - _build.string.toLowerCase:
            _module.var: label_plural
    description:
      _build.string.concat:
        - 'Every '
        - _build.string.toLowerCase:
            _module.var: label
        - ' you belong to.'
    breadcrumbs:
      - label:
          _build.string.concat:
            - 'Your '
            - _build.string.toLowerCase:
                _module.var: label_plural
    requests:
      - _ref: requests/get_my_organizations.yaml
    events:
      onMountAsync:
        - id: fetch_my_organizations
          type: Request
          params: get_my_organizations
        - id: set_my_organizations
          type: SetState
          params:
            my_organizations:
              _if_none:
                - _request: get_my_organizations
                - []
    page_actions:
      _build.if:
        test:
          _module.var: allow_create_organization
        then:
          - id: create_organization_link
            type: Button
            layout:
              flex: 0 1 auto
            properties:
              title:
                _build.string.concat:
                  - 'Create '
                  - _build.string.toLowerCase:
                      _module.var: label
              icon: add
              color: primary
              variant: solid
            events:
              onClick:
                - id: open_create_organization
                  type: Link
                  params:
                    pageId:
                      _module.pageId: create-organization
        else: []
    blocks:
      _build.array.concat:
        - - _ref:
              module: layout
              component: card
              vars:
                id: my_organizations_card
                loading:
                  _eq:
                    - _request: get_my_organizations
                    - null
                skeleton_height: 160
                blocks:
                  - id: my_organizations
                    type: List
                    class:
                      .element: flex flex-col divide-y divide-[var(--ant-color-border-secondary)]
                    blocks:
                      - _ref: components/my_organization_row.yaml
        - _build.if:
            test:
              _build.eq:
                - _module.var: my_organizations_note
                - null
            then: []
            else:
              - id: my_organizations_note
                type: Alert
                properties:
                  type: info
                  showIcon: true
                  message:
                    _module.var: my_organizations_note
