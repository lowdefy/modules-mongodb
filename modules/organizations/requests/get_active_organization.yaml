# The caller's ACTIVE organization's name, slug and created date, for the
# General settings page. Scoped by the session's active organization id, so it
# can only ever read the organization the caller is acting in. The logo is left
# out: the page draws it from get_settings_organization, the settings header's
# read.
id: get_active_organization
type: MongoDBFindOne
connectionId:
  _module.connectionId: user-organizations
properties:
  query:
    _id:
      _user: organization_id
  options:
    projection:
      name: 1
      slug: 1
      created_at: 1
