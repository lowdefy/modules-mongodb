# How many owners the caller's ACTIVE organization has: [{ count }], or [] when
# none. The member page locks the only owner's own authority.
id: get_owner_count
type: MongoDBAggregation
connectionId:
  _module.connectionId: user-members
properties:
  pipeline:
    - $match:
        organization_id:
          _user: organization_id
    - $match:
        $expr:
          $in:
            - owner
            - $split:
                - $ifNull:
                    - "$role"
                    - ''
                - ','
    - $count: count
