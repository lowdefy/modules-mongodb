# Every organization the caller belongs to, for the switcher. Scoped by
# `userId: { _user: id }` — the caller's own member rows by definition, which is
# what makes this read safe on an unwalled connection.
#
# A single-membership caller still gets one row: the switcher renders the active
# organization's name as plain context and offers no dropdown.
id: get_switcher_memberships
type: MongoDBAggregation
connectionId:
  _module.connectionId: user-members
properties:
  pipeline:
    - $match:
        userId:
          _user: id
    - $lookup:
        from: user-organizations
        localField: organizationId
        foreignField: _id
        as: organization
    - $unwind: "$organization"
    - $addFields:
        organization_id: "$organizationId"
        organization_name: "$organization.name"
        is_active:
          $eq:
            - "$organizationId"
            - _user: organizationId
    - $project:
        organization_id: 1
        organization_name: 1
        is_active: 1
    - $sort:
        organization_name: 1
