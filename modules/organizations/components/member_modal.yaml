# One member, opened from the members table: change their app roles, grant or
# revoke organization authority, or remove them from the organization.
#
# App roles and the organization-authority tier are two controls with two
# submits, because they are two authorities: an app role says "show this person
# the UI", the member row's tier says "this person may actually administer the
# organization", and nothing keeps the two in agreement. Folding them into one
# submit would also mean a refused tier write (last-owner, creator protection)
# leaving the app-role write applied, with nothing to roll it back.
#
# Removing yourself is a different engine call — remove-member acts on someone
# else, LeaveOrganization ends your own membership — so the footer swaps by
# `is_self` rather than trying to make one action cover both. Either way the
# engine's last-owner guard is authoritative: it refuses the call and the error
# surfaces as a message.
#
# A role change can alter the caller's own authorization, so UpdateSession runs
# after each write to re-sync the client rather than leaving the page on stale
# roles.
id: member_modal
type: Modal
properties:
  title:
    _nunjucks:
      template: "{{ name | default('Member') }}"
      on:
        name:
          _state: selected_member.name
  width: 480
  okText: Save roles
events:
  onOk:
    _build.array.concat:
      - - id: update_member_roles
          type: CallAPI
          messages:
            loading: Updating roles…
            success: Roles updated.
          params:
            endpointId:
              _module.endpointId: update-member-roles
            payload:
              member_id:
                _state: selected_member.member_id
              roles:
                _state: member_roles
        # Roles resolve from the member row server-side, so a caller who just
        # changed their own would otherwise keep the old set until reload.
        - id: resync_session
          type: UpdateSession
      - _ref: actions/refetch_members.yaml
blocks:
  - id: member_identity
    type: Html
    properties:
      html:
        _nunjucks:
          template: >-
            <div style="font-size:13.5px; color:var(--ant-color-text-secondary)">{{
            email }}{% if joined %} · joined {{ joined }}{% endif %}</div>
          on:
            email:
              _state: selected_member.email
            joined:
              _dayjs.format:
                on:
                  _state: selected_member.signed_up
                format: YYYY-MM-DD
  - id: member_roles
    type: TagMultipleSelector
    properties:
      title: Roles
      options:
        _ref: components/role_options.yaml
  - id: org_role_divider
    type: Divider
    properties:
      margin: 4
  - id: member_org_role
    type: Selector
    required: true
    properties:
      title: Organization authority
      extra: Who may administer this organization — separate from the app roles above, and not implied by them.
      # `member` is the no-authority value, not an empty one: the write refuses
      # an empty tier, so revoking authority writes `member`. Labelled in the
      # app's language rather than BetterAuth's, where "member" reads as a
      # status instead of an absence of authority.
      options:
        - value: owner
          label: Organization owner
        - value: admin
          label: Organization admin
        - value: member
          label: No organization authority
  - id: save_org_role_btn
    type: Button
    layout:
      flex: 0 0 auto
    properties:
      title: Update organization role
      variant: outlined
    events:
      onClick:
        _build.array.concat:
          - - id: validate_org_role
              type: Validate
              params:
                regex:
                  - "^member_org_role$"
            # No `error` message: the write's refusals — demoting the
            # organization's sole owner, or demoting its creator — are the
            # reason it runs through the organization plugin at all, and the
            # caller needs to read them. A static error string here would
            # replace them with "something went wrong".
            - id: save_org_role
              type: CallAPI
              messages:
                loading: Updating…
                success: Organization role updated.
              params:
                endpointId:
                  _module.endpointId: update-org-role
                payload:
                  member_id:
                    _state: selected_member.member_id
                  org_role:
                    _state: member_org_role
            - id: resync_session_after_tier
              type: UpdateSession
          - _ref: actions/refetch_members.yaml
  - id: member_danger_zone
    type: Box
    layout:
      gap: 8
    blocks:
      - id: remove_member_btn
        type: Button
        visible:
          _not:
            _state: selected_member.is_self
        properties:
          title: Remove from organization
          icon: AiOutlineUserDelete
          danger: true
          block: true
        events:
          onClick:
            _build.array.concat:
              - - id: remove_member
                  type: CallAPI
                  messages:
                    loading: Removing…
                    success: Member removed.
                  params:
                    endpointId:
                      _module.endpointId: remove-member
                    payload:
                      member_id:
                        _state: selected_member.member_id
                - id: close_after_remove
                  type: CallMethod
                  params:
                    blockId: member_modal
                    method: toggleOpen
              - _ref: actions/refetch_members.yaml
      - id: leave_organization_btn
        type: Button
        visible:
          _state: selected_member.is_self
        properties:
          title: Leave this organization
          icon: AiOutlineLogout
          danger: true
          block: true
        events:
          onClick:
            - id: leave_organization
              type: LeaveOrganization
              messages:
                loading: Leaving…
                success: You have left the organization.
            # Membership drives the wall and role resolution, so the session has
            # to be re-read before anything else renders.
            - id: resync_after_leave
              type: UpdateSession
            - id: go_home_after_leave
              type: Link
              params:
                home: true
