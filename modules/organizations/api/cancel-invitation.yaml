# cancel-invitation — withdraw a pending invitation to the caller's ACTIVE
# organization by id. Cancelling has no expiry/status guard in the engine, so
# the same endpoint serves live and expired-but-pending rows.
#
# `organizationId` is explicit: under the `tenant` policy there is no pinned
# organization for the step to default to.
#
# The invitation is read first so the `org-invitation-cancelled` event can
# name the invitee.
#
# Payload: { invitation_id }
id: cancel-invitation
type: Api
routine:
  - _ref:
      path: api/parts/read-invitation.yaml
      vars:
        id: read_invitation
        invitation_id:
          _payload: invitation_id

  - id: cancel_invitation
    type: CancelInvitation
    properties:
      invitationId:
        _payload: invitation_id
      organizationId:
        _user: organization_id

  - _ref:
      path: api/parts/log-event.yaml
      vars:
        type: org-invitation-cancelled
        subject:
          user_id:
            _step: read_invitation.0.user_id
          email:
            _step: read_invitation.0.email
          invitation_id:
            _payload: invitation_id
