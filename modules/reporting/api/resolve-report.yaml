# The Dynamic block's resolver: load the report spec (readable-scoped), run each
# query-backed section's pipeline inside :try (a failed section renders as an
# Alert card while the rest of the report renders), compile spec + rows to
# blocks server-side. AnalyticsPipeline is the security gate: it revalidates
# each stored pipeline against the connection-bound catalog with the VIEWING
# user's roles on every resolve, so a section the viewer can't access (or that
# drifted out of the catalog) fails as one Alert card, not a whole-report error.
id: resolve-report
type: InternalApi
routine:
  # Needed once the read opens to shared reports. Until then the owner.user_id
  # match made an unauthenticated read match nothing; a $or on
  # visibility: shared would hand every published report to an anonymous
  # caller. "Shared" means everyone in the app, and the module's baseline
  # everywhere — including the catalog's role gate, where an absent roles list
  # means any AUTHENTICATED user — is an authenticated user.
  - :if:
      _eq:
        - _user: id
        - null
    :then:
      - :reject: You must be signed in to open a report.
  - id: load_report
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: reports-store
    properties:
      query:
        _id:
          _payload: urlQuery.report_id
        # A soft-deleted report resolves as not-found (the fallback slot), the
        # same as one that never existed.
        deleted.timestamp:
          $exists: false
        # Readable: yours, or published to the app. The per-section role gate
        # below is untouched and still runs against the VIEWING user, so opening
        # the read does not open the data — a shared report over a role-gated
        # collection resolves with its gated sections failing.
        $or:
          - owner.user_id:
              _user: id
          - visibility: shared
  - :if:
      _eq:
        - _step: load_report
        - null
    # Whole-report failure — the Dynamic block renders its fallback slot.
    :then:
      - :reject: Report not found.
  # No catalog passed here: querySections only extracts the query sections
  # (inert), and the per-section AnalyticsPipeline below is the real gate — so
  # one inaccessible section never throws here and takes down the whole report.
  # `spec` holds { sections } only, so the spec the validator wants is composed
  # from the document's fields — it requires a non-empty title.
  - :for: section
    :in:
      _analytics.querySections:
        spec:
          title:
            _step: load_report.title
          description:
            _step: load_report.description
          sections:
            _step: load_report.spec.sections
        roles:
          _user: roles
    :do:
      - :try:
          - id: run_query
            type: AnalyticsPipeline
            connectionId:
              _module.connectionId: reporting-data
            properties:
              query:
                _item: section.query
              roles:
                _user: roles
        # Leave the failed iteration's step result unset — compileReport
        # renders the sparse entry as an Alert card.
        #
        # :catch receives no error object (controlTry discards it and there is
        # no _error operator), so the gate's message cannot reach the Alert and
        # the viewer gets an honest generic description. This log line is
        # therefore the ONLY place the failure is diagnosable, so it carries
        # enough to identify which query failed for whom. `section_type: filter`
        # means an optionsQuery failed rather than a data section.
        :catch:
          - :log:
              msg: A report section pipeline failed validation or execution for this viewer.
              report_id:
                _payload: urlQuery.report_id
              section_id:
                _item: section.id
              section_type:
                _item: section.type
              collection:
                _item: section.query.collection
  - :return:
      # The page renders owner-only actions from this; the resolver is the only
      # party that knows it.
      is_owner:
        _eq:
          - _step: load_report.owner.user_id
          - _user: id
      blocks:
        _analytics.compileReport:
          spec:
            title:
              _step: load_report.title
            description:
              _step: load_report.description
            sections:
              _step: load_report.spec.sections
          results:
            _step: run_query
          # Catalog is used ONLY to resolve select-filter options from a field's
          # enum values (a display convenience) — not as a security gate.
          catalog:
            _module.var: catalog
          roles:
            _user: roles
          endpointId:
            _module.endpointId: query-data
