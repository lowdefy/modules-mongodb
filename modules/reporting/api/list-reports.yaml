# Saved reports for the reports-list page, most recent first. The spec stays
# server-side — the list only needs display fields.
id: list-reports
type: Api
routine:
  - :if:
      _eq:
        - _if_none:
            - _user: sub
            - _user: id
        - null
    :then:
      - :return: []
  - id: find_reports
    type: MongoDBFind
    connectionId:
      _module.connectionId: reports-store
    properties:
      query:
        userId:
          _if_none:
            - _user: sub
            - _user: id
        # Soft-deleted reports are excluded — see docs/shared/soft-delete.md for
        # why the predicate tests the stamp's timestamp, not the field itself.
        deleted.timestamp:
          $exists: false
      options:
        sort:
          updatedAt: -1
        limit: 200
        projection:
          title: 1
          description: 1
          createdAt: 1
          updatedAt: 1
  - :return:
      _step: find_reports
