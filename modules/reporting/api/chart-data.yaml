# Chart re-queries only: one chart section, re-run under the live filter values.
# Returns an assembled ECharts option rather than rows because Flint inlines the
# data into the option in type-dependent shapes and derives layout from the
# actual labels — new rows cannot be swapped into a compiled option client-side.
# The presentation spec arrives in the payload from a browser-side CallAPI, so it
# is untrusted client input and is revalidated below. The security boundary is
# unchanged: AnalyticsPipeline validates the pipeline against the catalog (bound
# at the connection) and the user's roles, prepends the filter $match, and runs
# it read-only.
id: chart-data
type: Api
description: >
  Re-run one chart section's allowlist-validated read-only aggregation pipeline
  under the report's live filter values and return the assembled ECharts option
  with the canvas height its layout needs.
payloadSchema:
  type: object
  required:
    - chart
    - title
    - x
    - y
    - query
  properties:
    chart:
      type: string
      description: Chart kind.
    title:
      type: string
      description: Chart title.
    x:
      type: string
      description: The output column used for the category axis (pie item name).
    y:
      type: array
      description: The output column(s) holding the numeric value series.
      items:
        type: string
    stacked:
      type: boolean
      description: Bar charts only — stack the value series instead of grouping them.
    query:
      type: object
      description: The collection and pipeline to run.
      required:
        - collection
        - pipeline
      properties:
        collection:
          type: string
          description: Catalog-declared base collection the pipeline reads from.
        pipeline:
          type: array
          description: Read-only MongoDB aggregation pipeline stages.
    filters:
      type: array
      description: >
        Report filter triples applied as a leading $match before the pipeline
        (report filter re-queries only). Values arrive as deferred __state
        reads resolved client-side; null/undefined values drop the triple, and
        so does an empty array. A value may itself be an array — a multiselect
        selection compiled to $in/$all.
      items:
        type: object
        required:
          - field
          - op
          - value
        properties:
          field:
            type: string
          op:
            type: string
          value: {}
routine:
  # Catalog entries with no `roles` are readable by any AUTHENTICATED user, so
  # the engine's role gate assumes there is a user. Lowdefy endpoints are
  # public unless the app protects them, and this is the only endpoint that
  # reads app data — without this guard an unprotected app exposes every
  # role-less cataloged collection to anonymous callers.
  - :if:
      _eq:
        - _user: id
        - null
    :then:
      - :reject: You must be signed in to query data.
  # No catalog: the grammar and role gate run inside AnalyticsPipeline at
  # execution time. This checks the contract's own shape — chart kind, inert
  # title/x/y strings, query shape — before anything runs.
  - :set_state:
      spec:
        _analytics.validateChartSpec:
          spec:
            chart:
              _payload: chart
            title:
              _payload: title
            x:
              _payload: x
            y:
              _payload: y
            stacked:
              _payload: stacked
            query:
              _payload: query
          roles:
            _user: roles
  - id: run_query
    type: AnalyticsPipeline
    connectionId:
      _module.connectionId: reporting-data
    properties:
      query:
        _state: spec.query
      filters:
        _payload: filters
      roles:
        _user: roles
  - :return:
      _analytics.buildFlintOption:
        chart:
          _state: spec.chart
        x:
          _state: spec.x
        y:
          _state: spec.y
        stacked:
          _state: spec.stacked
        rows:
          _step: run_query
