# onFinish hook: read the validated chart/export specs from the turn's
# toolResults, run each chart's query once (bounded, inside :try — a failed
# query skips its chart), and return chart + download data parts for the chat
# page's adjacent panel. Tools cannot write to the stream — the parts are
# written only from onFinish hook responses. No-ops when the payload carries no
# conversationId — the parts have nowhere to be snapshotted.
id: emit-data-parts
type: Api
routine:
  - :if:
      _eq:
        - _payload: conversationId
        - null
    :then:
      - :return: {}
  # The validated chart specs, in tool-call order, capped at 8 per turn.
  - :set_state:
      chart_specs:
        _mql.expr:
          on:
            results:
              _payload: toolResults
          expr:
            $slice:
              - $map:
                  input:
                    $filter:
                      input: $results
                      cond:
                        $eq:
                          - $$this.toolName
                          - render_chart
                  in: $$this.output.spec
              - 8
      download_specs:
        _mql.expr:
          on:
            results:
              _payload: toolResults
          expr:
            $slice:
              - $map:
                  input:
                    $filter:
                      input: $results
                      cond:
                        $eq:
                          - $$this.toolName
                          - export_data
                  in: $$this.output.spec
              - 8
  - :for: chart
    :in:
      _state: chart_specs
    :do:
      - :try:
          - id: chart_rows
            type: AnalyticsPipeline
            connectionId:
              _module.connectionId: reporting-data
            properties:
              query:
                _item: chart.query
              roles:
                _user: roles
        :catch:
          - :log: A chart pipeline failed at turn end — its chart is skipped.
  # buildDataParts holds the fetched rows already, so it needs no catalog: it
  # re-checks the inert spec shapes and verifies each chart's x/y contract
  # against its rows. A spec that fails is skipped inside buildDataParts, not
  # thrown — the agent's turn is over so it cannot self-correct, and a throw
  # here would lose every chart and download of the turn (handleAgentChat only
  # console.warns a failed hook).
  - :set_state:
      data_parts:
        _analytics.buildDataParts:
          charts:
            _state: chart_specs
          results:
            _step: chart_rows
          downloads:
            _state: download_specs
          roles:
            _user: roles
  # Snapshot this turn's built parts onto the conversation doc so reopening it
  # restores the Results panel. save-conversation (the prior onFinish hook)
  # owns the doc lifecycle (messages, title, created); this hook only appends
  # `data_parts` per turn, mirroring the live panel's onDataPart accumulation.
  # upsert is false: the prior hook has already created the doc, and creating it
  # here would leave a title-less, created-less doc if that hook had failed.
  - :if:
      _gt:
        - _array.length:
            _state: data_parts
        - 0
    :then:
      - id: persist_results
        type: MongoDBUpdateOne
        connectionId:
          _module.connectionId: conversations-store
        properties:
          filter:
            _id:
              _payload: conversationId
            # From _user, never the payload — see save-conversation. This
            # endpoint is HTTP-callable, so a payload-supplied user id would let
            # a caller $push parts into another user's conversation.
            user_id:
              _if_none:
                - _user: sub
                - _user: id
          update:
            $push:
              data_parts:
                $each:
                  _state: data_parts
          options:
            upsert: false
  # `dataParts` is the agent framework's key for parts written back to the
  # stream (handleAgentChat reads `responseData.dataParts`), not a field this
  # module names — so it stays camelCase while the persisted field above is
  # snake_case.
  - :return:
      dataParts:
        _state: data_parts
