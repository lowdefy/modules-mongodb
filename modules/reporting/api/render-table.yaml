# Table tool: validates the table spec (pipeline + presentation contract)
# against the catalog and acks. Tool results are model context (re-sent every
# later step and turn), so this returns only the small validated spec — the
# emit-data-parts onFinish hook reads it from the hook payload's toolResults,
# runs the pipeline once at turn end, verifies the declared columns against
# the actual rows, caps the rows and emits the table dataPart.
id: render-table
type: Api
description: >
  Render a table in the results panel beside the chat. Validates the table
  spec; the table appears when the turn completes. Declare the presentation
  contract: columns, an array of { key, label?, format? }, one per column to
  show, in order, each key naming a column the pipeline outputs.
payloadSchema:
  type: object
  required:
    - title
    - query
    - columns
  properties:
    title:
      type: string
      description: Table title shown in the panel.
    query:
      type: object
      description: The collection and pipeline producing the table's data (same shape as query_data).
      required:
        - collection
        - pipeline
      properties:
        collection:
          type: string
          description: Catalog-declared base collection the pipeline reads from.
        pipeline:
          type: array
          description: Read-only MongoDB aggregation pipeline stages.
    columns:
      type: array
      description: The output column(s) to show, in order.
      items:
        type: object
        required:
          - key
        properties:
          key:
            type: string
            description: The output column to show.
          label:
            type: string
            description: The column heading, defaulting to the key.
          format:
            type: object
            description: >
              Optional number-format descriptor
              { style: decimal | currency, currency?, locale?, decimals? }.
routine:
  # Validation throws on an invalid spec (bad pipeline or malformed contract) —
  # the tool call fails with the validator's actionable message. Passing the
  # catalog runs the full pipeline grammar/role gate now (validate-before-ack).
  - :set_state:
      validated:
        _analytics.validateTableSpec:
          spec:
            title:
              _payload: title
            query:
              _payload: query
            columns:
              _payload: columns
          catalog:
            _module.var: catalog
          roles:
            _user: roles
  - :return:
      ok: true
      title:
        _payload: title
      spec:
        title:
          _payload: title
        query:
          _payload: query
        columns:
          _payload: columns
