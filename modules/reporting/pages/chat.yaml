# Conversational surface: conversations sidebar, AgentChat, and an adjacent
# results panel that accumulates the charts and downloads the emit-data-parts
# hook streams back as the framework's `dataParts` at each turn's end, and
# persists on the conversation doc as `data_parts`.
id: chat
type: Box
properties:
  style:
    padding: 32px 24px 24px 24px
events:
  onInit:
    - id: init_state
      type: SetState
      params:
        conversationId:
          _uuid: true
        charts: []
        tables: []
        downloads: []
        results_scope: all
        # The empty-state starter chips render through two Lists, and a List
        # iterates the array in page state at its own id — so the starters have
        # to be seeded there. Both are furniture resolved from the `welcome`
        # var, not user data; seeding once is enough because the empty state is
        # hidden with `style.display` (see below), which leaves this state in
        # place rather than deleting it.
        explore_starters_list:
          _module.var: welcome.explore_starters
        report_starters_list:
          _module.var: welcome.report_starters
    # The collapse globals are app-scoped and outlive this page's context, while
    # this seed runs only when that context is built — so it fills in a missing
    # value rather than assigning one, and `_if_none` keeps an explicit `false`
    # that a truthiness default would overwrite.
    #
    # The 232 + 348 side columns, two 16px gaps and 48px of page padding are
    # 660px of chrome, so under 1280 the transcript gets less than its ~520px
    # measure with any room to breathe — start both sides collapsed there.
    - id: init_collapsed
      type: SetGlobal
      params:
        reporting_rail_collapsed:
          _if_none:
            - _global: reporting_rail_collapsed
            - _lt:
                - _media: width
                - 1280
        reporting_panel_collapsed:
          _if_none:
            - _global: reporting_panel_collapsed
            - _lt:
                - _media: width
                - 1280
  onMountAsync:
    - id: load_conversations
      type: CallAPI
      params:
        endpointId:
          _module.endpointId: list-conversations
    - id: set_conversations
      type: SetState
      params:
        conversations:
          _api:
            _build.string.concat:
              - _module.endpointId: list-conversations
              - ".response"
layout:
  gap: 16
  # Fixed side columns with a fluid middle. The row wraps by default, and
  # wrapping is decided on base sizes before anything shrinks — so a transcript
  # wider than the space left over would drop the results panel onto a second
  # line instead of narrowing the middle.
  wrap: nowrap
blocks:
  # The rail's collapsed form. `AgentConversations` has no collapsed mode of its
  # own and is hidden with its column, so the strip has to re-offer New chat
  # itself — the rail's own `creation` button is gone while this is showing.
  # Compared against `true` so the strip and the rail are exact complements: the
  # engine treats any non-`false` as visible, so a null global would otherwise
  # show both.
  - id: conversations_strip
    type: Box
    layout:
      flex: 0 0 auto
      gap: 8
    visible:
      _eq:
        - _global: reporting_rail_collapsed
        - true
    blocks:
      - id: expand_rail_button
        type: Button
        properties:
          # `hideTitle` drops the button's own title from the DOM — with it the
          # tooltip and the accessible name — so the name goes on the icon,
          # which renders it into the svg. `hideTitle` still has to stay:
          # without it an untitled button labels itself with its block id.
          icon:
            name: AiOutlineDoubleRight
            title: Show conversations
          hideTitle: true
          type: text
        events:
          onClick:
            - id: expand_rail
              type: SetGlobal
              params:
                reporting_rail_collapsed:
                  _not:
                    _global: reporting_rail_collapsed
      - id: strip_new_chat_button
        type: Button
        properties:
          icon:
            name: AiOutlinePlus
            title: New chat
          hideTitle: true
          type: text
        events:
          onClick:
            _ref: pages/chat/actions/new_conversation.yaml
  - id: conversations_panel
    type: Box
    layout:
      flex: 0 0 232px
      gap: 8
    # Hidden with CSS, never `visible:`. Hiding a container deletes the state of
    # every block beneath it, and only input blocks republish a value when they
    # come back — so `conversations`, written by SetState and rendered by a
    # display block, would be gone for good, and the rail only refetches on
    # mount and at the end of a turn. `display: none` leaves the flex row as if
    # the column were absent.
    style:
      display:
        _if:
          test:
            _eq:
              - _global: reporting_rail_collapsed
              - true
          then: none
          else: null
    blocks:
      - id: conversations_header
        type: Box
        layout:
          justify: end
        blocks:
          - id: collapse_rail_button
            type: Button
            layout:
              flex: 0 0 auto
            properties:
              icon:
                name: AiOutlineDoubleLeft
                title: Hide conversations
              hideTitle: true
              type: text
            events:
              onClick:
                - id: collapse_rail
                  type: SetGlobal
                  params:
                    reporting_rail_collapsed:
                      _not:
                        _global: reporting_rail_collapsed
      # Filters the rail client-side, over the window list-conversations
      # returned. Nothing is refetched as the term changes, so there is no
      # server round trip to debounce.
      - id: conversation_search
        type: TextInput
        properties:
          placeholder: Search conversations
          size: small
          allowClear: true
          label:
            # An unset label falls back to the block id.
            disabled: true
      # Names the window, because search cannot see past it: without the number
      # a conversation that exists but sits outside the 200 most recent reads as
      # no match at all. A leaf display block, so `visible:` is safe here — it
      # holds no state anything reads back.
      - id: conversations_no_match
        type: Paragraph
        visible:
          _and:
            - _ne:
                - _if_none:
                    - _state: conversation_search
                    - ""
                - ""
            - _eq:
                - _array.length:
                    _ref: pages/chat/components/conversation_items.yaml
                - 0
        properties:
          content: >-
            No match in your 200 most recent conversations — search does not
            reach further back than that.
          style:
            fontSize: 12px
            color: var(--ant-color-text-secondary)
      - id: conversations
        type: AgentConversations
        properties:
          # The block styles its own div, so the column width has to be
          # repeated here or the rail renders at the block's 250px default
          # inside a 232px column.
          width: 232
          items:
            _ref: pages/chat/components/conversation_items.yaml
          # `collapsible: false` is load-bearing: the block defaults it to true,
          # and upstream expands only the groups named in `defaultExpandedKeys`
          # — which would render all three headings collapsed and the rail
          # apparently empty. `label` is deliberately unset: upstream treats it
          # as a heading renderer, so a string there labels every group with it.
          groupable:
            collapsible: false
          menu:
            - key: rename
              label: Rename
            - key: delete
              label: Delete
              danger: true
          activeKey:
            _state: conversationId
          creation:
            label: New chat
        events:
          onNew:
            _build.array.concat:
              - _ref: pages/chat/actions/new_conversation.yaml
              # A term left in the box would filter the new conversation back
              # out of the rail the moment the next refetch adds it. Only the
              # rail's own New chat clears it — the collapsed strip's button
              # reveals no rail to be confused by.
              - - id: clear_conversation_search
                  type: SetState
                  params:
                    conversation_search: null
          onMenuClick:
            # One seed for both modals: a modal's own onOk fires with an empty
            # event object, so the row the kebab was clicked on has to be parked
            # in state where the modal can still read it. `rename_title` is the
            # input's own path, and a copy — typing a new title leaves the name
            # the delete confirm shows alone.
            - id: seed_menu_conversation
              type: SetState
              params:
                menu_conversation_id:
                  _event: conversationKey
                menu_conversation_title:
                  _event: conversation.label
                rename_title:
                  _event: conversation.label
            - id: open_rename_modal
              type: CallMethod
              skip:
                _ne:
                  - _event: action
                  - rename
              params:
                blockId: rename_conversation_modal
                method: setOpen
                args:
                  - open: true
            - id: open_delete_modal
              type: CallMethod
              skip:
                _ne:
                  - _event: action
                  - delete
              params:
                blockId: delete_conversation_modal
                method: setOpen
                args:
                  - open: true
          onSelect:
            # Switch first (atomic, infallible) and clear the transcript and
            # panel as the loading state, so a failed fetch can never strand
            # the user on the previous conversation. Then repopulate — messages
            # included — from the FRESH get-conversation-results read, never
            # from the sidebar list snapshot: that snapshot refreshes when the
            # stream ends client-side, racing the server's onFinish save, so it
            # can be a turn behind — and continuing a chat restored from it
            # would overwrite the saved doc with the stale transcript.
            - id: select_conversation
              type: SetState
              params:
                conversationId:
                  _event: key
                charts: []
                tables: []
                downloads: []
                messages: []
            - id: load_results
              type: CallAPI
              params:
                endpointId:
                  _module.endpointId: get-conversation-results
                payload:
                  conversationId:
                    _event: key
            # Drop a response that is no longer for the selected conversation.
            # Selecting A then B quickly runs two of these chains concurrently;
            # if A's response lands after B's SetState, state becomes B's id
            # with A's transcript. AgentChat syncs external messages, so the
            # next send would persist A's transcript under B.
            - id: set_results
              type: SetState
              skip:
                _ne:
                  - _event: key
                  - _state: conversationId
              params:
                messages:
                  _api:
                    _build.string.concat:
                      - _module.endpointId: get-conversation-results
                      - ".response.messages"
                charts:
                  _api:
                    _build.string.concat:
                      - _module.endpointId: get-conversation-results
                      - ".response.charts"
                tables:
                  _api:
                    _build.string.concat:
                      - _module.endpointId: get-conversation-results
                      - ".response.tables"
                downloads:
                  _api:
                    _build.string.concat:
                      - _module.endpointId: get-conversation-results
                      - ".response.downloads"
      # The rail's kebab menu opens these. Each leaves only an empty placeholder
      # div in the column — antd portals the dialog itself to the document body
      # — so they add no chrome to the rail.
      - _ref: pages/chat/components/rename_conversation_modal.yaml
      - _ref: pages/chat/components/delete_conversation_modal.yaml
  - id: chat_panel
    type: Box
    layout:
      flex: 1 1 auto
      gap: 16
    blocks:
      # The two-track empty state, above the chat and shown only on a fresh
      # conversation. It teaches both of the module's jobs by making them
      # clickable: the left track asks a question, the right builds a report.
      #
      # Toggled with `style.display`, not `visible:`. The two starter Lists hold
      # their arrays in page state at their ids, and `visible: false` on a
      # container deletes the state of every block beneath it — the chips would
      # come back blank on the next New chat, because a display block republishes
      # nothing on the way back. `display: none` removes the block from the flow
      # while leaving that seeded state untouched, which is the same reason the
      # rail and results columns collapse this way.
      - id: chat_empty_state
        type: Box
        style:
          display:
            _if:
              test:
                _eq:
                  - _array.length:
                      _if_none:
                        - _state: messages
                        - []
                  - 0
              then: null
              else: none
        layout:
          gap: 16
        blocks:
          - id: empty_state_title
            type: Title
            properties:
              content:
                _module.var: welcome.title
              level: 4
          # The data-scope line names what the assistant can read, in the app's
          # own words. Rendered only when the app authored it: the var has no
          # default and resolves to null when unset, so guard with `_if_none`
          # and drop the line entirely rather than falling back to collection
          # names — there is no generic sentence true of every app, and a wrong
          # one is a promise the agent then fails to keep.
          - id: empty_state_data_scope
            type: Paragraph
            visible:
              _ne:
                - _if_none:
                    - _module.var: welcome.data_scope
                    - ""
                - ""
            properties:
              content:
                _module.var: welcome.data_scope
          - id: empty_state_tracks
            type: Box
            # The tracks share a row and wrap on a narrow window; the gap spaces
            # them without per-track margins.
            layout:
              gap: 16
            blocks:
              - _ref:
                  path: pages/chat/components/starter_track.yaml
                  vars:
                    label:
                      _module.var: welcome.explore_label
                    list_id: explore_starters_list
              - _ref:
                  path: pages/chat/components/starter_track.yaml
                  vars:
                    label:
                      _module.var: welcome.report_label
                    list_id: report_starters_list
      - id: chat
        type: AgentChat
        properties:
          agentId:
            _module.agentId: reporting-assistant
          conversationId:
            _state: conversationId
          messages:
            _state: messages
          height: 75vh
          # A ~62ch measure, so answers read as prose however wide the window
          # runs. antd's body fontSize is 14px and the system sans stack
          # averages about 0.5em per prose character, so 62 characters is
          # ~434px of text; the bubble's avatar (32) + gap (12) + content
          # padding (32) sit inside this container, which is what the property
          # caps.
          maxWidth: 520
          # The block's own `welcome` property is deliberately left unset. It
          # flattens its `prompts` into a single row and declares no areas, so
          # the two teaching tracks (ask a question / build a report) cannot be
          # composed inside it — they are rendered as ordinary blocks above the
          # chat (the `chat_empty_state` Box). This is unrelated to the module's
          # `welcome` var, which supplies that empty state's copy.
        events:
          onDataPart:
            - id: append_chart
              type: SetState
              skip:
                _not:
                  _eq:
                    - _event: type
                    - data-report-chart
              params:
                charts:
                  _array.concat:
                    - _if_none:
                        - _state: charts
                        - []
                    - - _event: data
            - id: append_table
              type: SetState
              skip:
                _not:
                  _eq:
                    - _event: type
                    - data-report-table
              params:
                tables:
                  _array.concat:
                    - _if_none:
                        - _state: tables
                        - []
                    - - _event: data
            - id: append_download
              type: SetState
              skip:
                _not:
                  _eq:
                    - _event: type
                    - data-report-download
              params:
                downloads:
                  _array.concat:
                    - _if_none:
                        - _state: downloads
                        - []
                    - - _event: data
          onMessageComplete:
            _ref: pages/chat/actions/refresh_conversations.yaml
          # The agent generates a title on the first turn; persist it, then
          # refresh the sidebar so the item shows the AI title (not the derived
          # fallback). Persist runs first so the refetch reads the saved title.
          onTitleGenerated:
            _build.array.concat:
              - - id: persist_title
                  type: CallAPI
                  params:
                    endpointId:
                      _module.endpointId: set-conversation-title
                    payload:
                      conversationId:
                        _state: conversationId
                      title:
                        _event: title
              - _ref: pages/chat/actions/refresh_conversations.yaml
  - id: results_panel
    type: Box
    layout:
      flex: 0 0 348px
      gap: 12
    # Hidden with CSS, never `visible:` — hiding this container would delete
    # `charts` and `downloads` with it, and the display blocks that render them
    # republish nothing when it comes back, so the strip's counts and the panel
    # itself would read empty with results in hand.
    style:
      display:
        _if:
          test:
            _eq:
              - _global: reporting_panel_collapsed
              - true
          then: none
          else: null
    blocks:
      - id: results_header
        type: Box
        layout:
          justify: space-between
        blocks:
          - id: results_title
            type: Title
            layout:
              flex: 0 1 auto
            properties:
              content: Results
              level: 4
          - id: collapse_panel_button
            type: Button
            layout:
              flex: 0 0 auto
            properties:
              icon:
                name: AiOutlineDoubleRight
                title: Hide results
              hideTitle: true
              type: text
            events:
              onClick:
                - id: collapse_panel
                  type: SetGlobal
                  params:
                    reporting_panel_collapsed:
                      _not:
                        _global: reporting_panel_collapsed
      # Above the content rather than in it, so the panel keeps one stable home
      # for scoping whether or not it has produced anything yet.
      - id: results_scope
        type: SegmentedSelector
        properties:
          block: true
          size: small
          label:
            # An unset label falls back to the block id, and the header above
            # already names the panel.
            disabled: true
          options:
            - label: All
              value: all
            - label: Charts
              value: charts
            - label: Tables
              value: tables
            - label: Exports
              value: exports
      # The panel is rendered before it has anything in it, so it has to say
      # what it is for; a panel that appears only with the first chart teaches
      # nothing until the user has already succeeded without it.
      - id: results_explainer
        type: Paragraph
        visible:
          _eq:
            - _array.length:
                _array.concat:
                  - _if_none:
                      - _state: charts
                      - []
                  - _if_none:
                      - _state: tables
                      - []
                  - _if_none:
                      - _state: downloads
                      - []
            - 0
        properties:
          content: >-
            Charts, tables and exports you produce land here; tick them to save
            a report.
      - id: charts_section
        type: Box
        # Hidden with CSS, never `visible:` — scoping the panel to Exports would
        # otherwise delete `charts` along with this section, and the list of
        # display blocks under it republishes nothing on the way back.
        style:
          display:
            _if:
              test:
                _or:
                  - _eq:
                      - _state: results_scope
                      - all
                  - _eq:
                      - _state: results_scope
                      - charts
              then: null
              else: none
        blocks:
          - id: charts_empty
            type: Paragraph
            visible:
              _eq:
                - _array.length:
                    _if_none:
                      - _state: charts
                      - []
                - 0
            properties:
              content: No charts yet — ask the assistant to chart something.
          - id: charts
            type: List
            layout:
              gap: 24
            blocks:
              - id: charts.$.chart_title
                type: Title
                properties:
                  content:
                    _state: charts.$.title
                  level: 5
              - id: charts.$.chart
                type: EChart
                properties:
                  height: 300
                  option:
                    _state: charts.$.option
              # The option is a snapshot of the turn that produced it — a reopened
              # conversation shows those numbers, not today's — so the card dates
              # itself. A leaf, so `visible:` is safe. Read through `_if_none`:
              # parts written before the part gained `created` render with no
              # date line rather than a blank one.
              - id: charts.$.as_of
                type: Paragraph
                visible:
                  _ne:
                    - _if_none:
                        - _state: charts.$.created
                        - null
                    - null
                properties:
                  content:
                    _nunjucks:
                      template: "as of {{ d }}"
                      on:
                        d:
                          _dayjs:
                            - _if_none:
                                - _state: charts.$.created
                                - 0
                            - format: D MMMM
                  style:
                    fontSize: 12px
                    color: var(--ant-color-text-secondary)
                    marginBottom: 0
      - id: tables_section
        type: Box
        # Hidden with CSS, never `visible:` — a `List`'s id IS its state key, so
        # hiding this container with `visible:` would delete `tables` and the
        # display blocks under it republish nothing on the way back. `display:
        # none` leaves the state intact while removing the section from the flow.
        style:
          display:
            _if:
              test:
                _or:
                  - _eq:
                      - _state: results_scope
                      - all
                  - _eq:
                      - _state: results_scope
                      - tables
              then: null
              else: none
        blocks:
          - id: tables_empty
            type: Paragraph
            visible:
              _eq:
                - _array.length:
                    _if_none:
                      - _state: tables
                      - []
                - 0
            properties:
              content: No tables yet — ask the assistant for a table.
          - id: tables
            type: List
            layout:
              gap: 24
            # The card file is a one-block sequence, so it fills `blocks`
            # directly — a `_ref` list item would nest it one array too deep.
            blocks:
              _ref: pages/chat/components/table_card.yaml
      - id: downloads_section
        type: Box
        # Hidden with CSS, never `visible:` — scoping the panel to Charts would
        # otherwise delete `downloads` along with this section.
        style:
          display:
            _if:
              test:
                _or:
                  - _eq:
                      - _state: results_scope
                      - all
                  - _eq:
                      - _state: results_scope
                      - exports
              then: null
              else: none
        blocks:
          - id: downloads_empty
            type: Paragraph
            visible:
              _eq:
                - _array.length:
                    _if_none:
                      - _state: downloads
                      - []
                - 0
            properties:
              content: No downloads yet — ask the assistant to export data.
          - id: downloads
            type: List
            layout:
              gap: 16
            blocks:
              - id: downloads.$.item
                type: Box
                layout:
                  gap: 2
                blocks:
                  - id: downloads.$.download
                    type: Button
                    layout:
                      flex: 0 1 auto
                    properties:
                      title:
                        _state: downloads.$.label
                      icon: AiOutlineDownload
                      type: default
                    events:
                      onClick:
                        - id: run_download_query
                          type: CallAPI
                          params:
                            endpointId:
                              _module.endpointId: query-data
                            payload:
                              query:
                                _state: downloads.$.query
                        - id: download_csv
                          type: DownloadCsv
                          params:
                            data:
                              _api:
                                _build.string.concat:
                                  - _module.endpointId: query-data
                                  - ".response"
                            filename: export.csv
                  - id: downloads.$.desc
                    type: Paragraph
                    visible:
                      _ne:
                        - _if_none:
                            - _state: downloads.$.description
                            - ""
                        - ""
                    properties:
                      content:
                        _state: downloads.$.description
                      style:
                        fontSize: 12px
                        color: var(--ant-color-text-secondary)
                        marginBottom: 0
  # The panel's collapsed form. Counts, not just an icon: the point of the strip
  # is that three charts waiting is visible without paying the expand to find
  # out. Compared against `true` so the strip and the panel are exact
  # complements for any value of the global.
  - id: results_strip
    type: Box
    layout:
      flex: 0 0 auto
      gap: 8
    visible:
      _eq:
        - _global: reporting_panel_collapsed
        - true
    blocks:
      - id: expand_panel_button
        type: Button
        properties:
          icon:
            name: AiOutlineDoubleLeft
            title: Show results
          hideTitle: true
          type: text
        events:
          onClick:
            - id: expand_panel
              type: SetGlobal
              params:
                reporting_panel_collapsed:
                  _not:
                    _global: reporting_panel_collapsed
      - id: results_strip_charts
        type: Paragraph
        properties:
          content:
            _nunjucks:
              template: "{{ n }} chart{{ 's' if n != 1 }}"
              on:
                n:
                  _array.length:
                    _if_none:
                      - _state: charts
                      - []
          style:
            fontSize: 12px
            color: var(--ant-color-text-secondary)
            marginBottom: 0
      - id: results_strip_tables
        type: Paragraph
        properties:
          content:
            _nunjucks:
              template: "{{ n }} table{{ 's' if n != 1 }}"
              on:
                n:
                  _array.length:
                    _if_none:
                      - _state: tables
                      - []
          style:
            fontSize: 12px
            color: var(--ant-color-text-secondary)
            marginBottom: 0
      - id: results_strip_exports
        type: Paragraph
        properties:
          content:
            _nunjucks:
              template: "{{ n }} export{{ 's' if n != 1 }}"
              on:
                n:
                  _array.length:
                    _if_none:
                      - _state: downloads
                      - []
          style:
            fontSize: 12px
            color: var(--ant-color-text-secondary)
            marginBottom: 0
