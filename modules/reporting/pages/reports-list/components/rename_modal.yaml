# Rename — one field, opened from the row menu once selected_report is seeded.
# Persist then refetch so the grid re-reads the saved title. Not hidden with
# `visible:` (see row_menu_modal for why).
id: rename_modal
type: Modal
properties:
  title: Rename report
  okText: Save
events:
  onOk:
    _build.array.concat:
      - - id: rename_report
          type: CallAPI
          params:
            endpointId:
              _module.endpointId: set-report-title
            payload:
              report_id:
                _state: selected_report._id
              title:
                _state: rename_title
      - _ref: pages/reports-list/actions/load_scope.yaml
blocks:
  - id: rename_title
    type: TextInput
    properties:
      title: Title
      placeholder: Report title
