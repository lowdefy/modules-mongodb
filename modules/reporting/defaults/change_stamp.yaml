# Audit metadata for a reporting write: who and when.
#
# Reporting declares no module dependencies, so it writes the shape here rather
# than consuming the events module's exported change_stamp component the way
# every other module does. That is a choice, not a limitation — see
# designs/reporting/ux/ownership/design.md ("Reporting writes its own change
# stamp, for now") for the trade-off. The consequence worth knowing: the events
# component resolves to that module entry's `change_stamp` var, so an app that
# adds a field to its audit stamps centrally will NOT see it here.
#
# The shape is identical, and five endpoints write one, so it lives in one file
# rather than being copied into each of them. See docs/shared/change-stamps.md
# for the idiom and docs/shared/soft-delete.md for the `deleted` variant of it.
timestamp:
  _date: now
user:
  name:
    _user: profile.name
  id:
    _user: id
