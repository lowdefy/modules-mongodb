# Audit metadata for a reporting write: who and when.
#
# Reporting declares no module dependencies, so it cannot _ref the events
# module's change_stamp component — but it writes the identical shape, and it
# writes it from five endpoints, so the shape lives here rather than being
# copied into each of them. See docs/shared/change-stamps.md for the idiom and
# docs/shared/soft-delete.md for the `deleted` variant of it.
#
# The id comes from defaults/user_id.yaml so the stamp, the owner reference and
# every scope filter cannot drift apart.
timestamp:
  _date: now
user:
  name:
    _user: profile.name
  id:
    _ref: defaults/user_id.yaml
