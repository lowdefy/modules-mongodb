# The calling user's id, as every reporting document stores it.
#
# `sub ?? id`, because that is what the agent framework derives when it invokes
# an onFinish hook — so a document written by a hook and a document written by a
# browser-invoked endpoint carry the same key.
#
# This lives in one file because the derivation has to be IDENTICAL everywhere:
# it is written by four endpoints and matched by seven, and a writer that
# disagreed with a reader would not error — the read would simply return
# nothing, so a user's reports would silently vanish rather than visibly break.
# `_ref` makes that mechanical instead of something each caller remembers.
_if_none:
  - _user: sub
  - _user: id
