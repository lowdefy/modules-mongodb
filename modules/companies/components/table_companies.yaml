# Companies list. Sorting is the table's own (click a header); search, the
# sort menu and pagination sit around it on the page. A row opens the view page.
id: companies_table
type: Table
properties:
  size: comfortable
  headerMenu: false
  reorderable: false
  emptyText: No companies
  rowKey: _id
  loading:
    _not:
      _request: get_all_companies
  rowLink:
    pageId:
      _module.pageId: view
    urlQuery:
      _id: _id
  data:
    _if_none:
      - _request: get_all_companies
      - []
  columns:
    _build.array.concat:
      - - key: _id
          title: ID
          width: 120
        - key: display_name
          title: Name
          flex: 1
          minWidth: 240
      - _build.if:
          test:
            _module.var: short_name.enabled
          then:
            - key: short_name
              title: Short Name
              width: 140
          else: []
      - - key: description
          title: Description
          flex: 1
          minWidth: 200
      - _module.var: components.table_columns
      - - key: updated_at
          title: Updated At
          type: date
          width: 120
        - key: created_at
          title: Created At
          type: date
          width: 120
