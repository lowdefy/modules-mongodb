id: get_company_excel_data
type: MongoDBAggregation
# Authored organization clause (tenant wall amendment-1). The shared text lead
# emits a first-stage $search whenever `atlas_search` is set, and the wall can
# not prepend its filter before a first-stage-only stage — so the clause is
# authored inside that $search's `compound.filter` by the shared policy
# fragment, and the wall audits it against the caller's organization on every
# run. With `atlas_search` false there is no $search at all, the pipeline leads
# with a plain $match and the wall scopes it mechanically; declaring `authored`
# there is refused, so the declaration resolves away with the stage.
tenant:
  _build.if:
    test:
      _module.var: atlas_search
    then: authored
connectionId:
  _module.connectionId: companies-collection
payload:
  filter:
    _state: filter
  sort:
    _state: sort
  pagination:
    _state: fetch_request_pagination
    ~ignoreBuildChecks: true
properties:
  pipeline:
    _build.array.concat:
      - _ref:
          path: ../shared/search/text_lead.yaml
          vars:
            atlas_search:
              _module.var: atlas_search
            term:
              _payload: filter.search
            paths:
              - _module.var: name_field
              - lowercase_email
      # $and rather than a shallow merge: the structural filter, the regex
      # clause's $or and the consumer filter_match clauses can collide on a key.
      # The clause set mirrors get_all_companies — the export returns exactly the
      # rows the list shows.
      - - $match:
            $and:
              _array.concat:
                - - deleted.timestamp:
                      $exists: false
                # Same paths as the Atlas stage above, so the two search modes
                # cannot disagree about which field holds the company name.
                - _ref:
                    path: ../shared/search/regex_clause.yaml
                    vars:
                      atlas_search:
                        _module.var: atlas_search
                      term:
                        _payload: filter.search
                      paths:
                        - _module.var: name_field
                        - lowercase_email
                - _array.filter:
                    - _module.var: request_stages.filter_match
                    - _function:
                        __ne:
                          - __args: 0
                          - null
      - _ref:
          path: ../shared/search/score_stage.yaml
          vars:
            atlas_search:
              _module.var: atlas_search
            term:
              _payload: filter.search
      - - $addFields:
            display_name:
              $getField:
                field:
                  _module.var: name_field
                input: "$$ROOT"
            updated_at:
              $dateToString:
                date: $updated.timestamp
                format: "%Y-%m-%d"
            created_at:
              $dateToString:
                date: $created.timestamp
                format: "%Y-%m-%d"
        - _if:
            test:
              _ref:
                path: ../shared/search/use_score.yaml
                vars:
                  atlas_search:
                    _module.var: atlas_search
                  term:
                    _payload: filter.search
            then:
              $sort:
                score: -1
                updated.timestamp: -1
            else:
              $sort:
                _object.assign:
                  - _object.defineProperty:
                      on: {}
                      key:
                        _payload: sort.by
                      descriptor:
                        value:
                          _payload: sort.order
                  - _id: 1
      - _module.var: request_stages.get_all_companies
      - - $skip:
            _payload: pagination.skip
        - $limit:
            _payload: pagination.pageSize
