# Shared ensure-contact fragment — one canonical spec, `_ref`'d by relative path
# from user-account (merge-on-signup hook) and from BOTH invite flows
# (organizations and user-admin), so the match-and-write semantics can't drift.
#
# Guarantees a contact exists for one address in one organization, and resolves it
# into the `read_contact` step:
#   - match the contact by lowercased email (within the org, when given);
#   - insert BARE (change-stamped, no profile data) when absent. This fragment
#     writes no profile data; a caller that captures a profile persists it
#     separately via write-profile (both invite flows do exactly this), and
#     `profile.profile_created` stays unset so a new person still onboards;
#   - reconcile to the existing row on a duplicate-key error (the partial-unique
#     `user-contacts.{organizationId,lowercase_email}` index — see
#     docs/user-account/reference/indexes.md — is the guard that closes the race
#     between a first login and an invite).
#
# Idempotent by construction: `$setOnInsert` writes nothing when the row already
# exists, so a caller may run this on every login without touching the change
# stamp of a contact that is already there.
#
# Nothing is written back onto the auth user. The contact carries the link to its
# auth user (`userId`), not the reverse: a contact is per-organization while the
# user is global, so a person holds one contact per organization and a single id on
# the user row could only ever be correct for one of them. See
# resolve-own-contact for how the link is read and, when absent, claimed.
#
# Runs in SYSTEM context (a hook / system-context endpoint) or as a logged-in
# caller. In system context `_user` is null and the auth floor is waived, so the
# change stamp records a system write.
#
# Var-free — every input is an `_ref` var (NEVER `_module.var`):
#   connection_id   — the caller's scoped user-contacts connection id
#   email           — the address to ensure a contact for. Pass a runtime operator
#                     (`_payload: …`): `_var` substitution is build-time, so the
#                     value must still resolve per request.
#   user_id         — optional; the auth user this contact is, when the caller
#                     already knows it (a login hook always does; an invite does
#                     only when the address is already a user). Stamped on insert
#                     so the contact is born linked. When absent — or when a
#                     runtime operator resolves to nothing — the contact is minted
#                     unlinked and resolve-own-contact claims it on that person's
#                     first own-contact resolution.
#   organization_id — optional; explicit organization for system-context callers
#                     writing through an UNWALLED connection (Decision 7). When
#                     set, it joins the upsert filter and read query, so the
#                     match key is the compound-unique {organizationId,
#                     lowercase_email} tuple and MongoDB carries the equality
#                     into the inserted document. Callers on a WALLED connection
#                     must NOT pass it — the wall injects the org and rejects an
#                     authored organizationId filter.
#
# YAML sequence of routine steps — splice with `_build.array.concat`. Callers read
# `_step: read_contact.*`.

# Upsert the contact on lowercase_email. On a concurrent first-touch the
# partial-unique index throws a duplicate-key error; catch it and fall through
# to the read, which returns whichever row won.
- :try:
    - id: upsert_contact
      type: MongoDBUpdateOne
      connectionId:
        _var: connection_id
      properties:
        # The organizationId clause is merged at build time only when the
        # caller passes `organization_id` — an authored organizationId filter
        # on a walled connection would be rejected by the tenant wall.
        filter:
          _build.object.assign:
            - lowercase_email:
                _string.toLowerCase:
                  _string.trim:
                    _var: email
            - _build.if:
                test:
                  _build.not:
                    _build.eq:
                      - _var:
                          key: organization_id
                          default: null
                      - null
                then:
                  organizationId:
                    _var: organization_id
                else: {}
        update:
          # Document-style update: $setOnInsert only, so a matched (invited)
          # contact is never overwritten — only a brand-new one is minted bare.
          $setOnInsert:
            _build.object.assign:
              - _id:
                  _uuid: true
                email:
                  _var: email
                lowercase_email:
                  _string.toLowerCase:
                    _string.trim:
                      _var: email
                hidden: false
                disabled: false
                created:
                  _ref:
                    module: events
                    component: change_stamp
                updated:
                  _ref:
                    module: events
                    component: change_stamp
              # The auth-user link, when the caller knows it — merged at build
              # time only when `user_id` is passed. A caller passing a runtime
              # operator that resolves to nothing writes `userId: null`, which
              # resolve-own-contact treats as unlinked and claimable, so both
              # shapes are safe.
              - _build.if:
                  test:
                    _build.not:
                      _build.eq:
                        - _var:
                            key: user_id
                            default: null
                        - null
                  then:
                    userId:
                      _var: user_id
                  else: {}
        options:
          upsert: true
  :catch:
    - :log: ensure-contact — reconciling on duplicate lowercase_email (concurrent first-touch)

# Read the canonical contact row (inserted, matched, or reconciled) — same
# key as the upsert, including the org clause when given.
- id: read_contact
  type: MongoDBFindOne
  connectionId:
    _var: connection_id
  properties:
    query:
      _build.object.assign:
        - lowercase_email:
            _string.toLowerCase:
              _string.trim:
                _var: email
        - _build.if:
            test:
              _build.not:
                _build.eq:
                  - _var:
                      key: organization_id
                      default: null
                  - null
            then:
              organizationId:
                _var: organization_id
            else: {}
