# Shared contact-match expression — the one definition of "this contact is this
# person", for `$lookup` sub-pipelines that join `users` and `user-contacts`.
# `_ref`'d by relative path from every such join so the rule cannot drift between
# them (get_account, members_base, get_users_for_selector).
#
# A contact is linked to its auth user by `user_id` — that is the identity match.
# The address is matched too, because of the claim window: a contact minted by an
# invite exists before its person has an auth user, so it stays unlinked until that
# person's first own-contact resolution claims it (see resolve-own-contact). Reads
# in that window are exactly the invitee's first visit — the onboarding prefill and
# their row in the members list — so they must find the row by address or the
# invite-captured profile appears to have vanished.
#
# The address half is therefore a read-side tolerance, not a second identity: once
# claimed, `user_id` matches and the address is irrelevant. Both halves are
# single-valued within an organization — `user_id` by the partial-unique
# `{organization_id, user_id}` index, the address by `{organization_id,
# lowercase_email}`.
#
# It evaluates to a MongoDB aggregation expression, so it goes in an `$expr`
# position. The organization clause is NOT included: a `$lookup` is never scoped by
# the tenant wall, so each caller states its own organization alongside this.
#
# This is a var-free file — every input is an `_ref` var (NEVER `_module.var`).
#
# Vars — all four are aggregation expressions written in the CALLER's scope, which
# is what lets one definition serve a join in either direction (`$field` for the
# looked-up collection, `$$var` for a `let` binding from the outer document):
#   contact_user_id_expr — the contact's `user_id`
#   contact_email_expr   — the contact's `lowercase_email`
#   person_id_expr       — the auth user's `_id`
#   person_email_expr    — the auth user's email, LOWERCASED by the caller
#                          (`$toLower`) — `lowercase_email` is stored folded, and
#                          nothing guarantees the auth row's case matches.

$or:
  - $eq:
      - _var: contact_user_id_expr
      - _var: person_id_expr
  - $eq:
      - _var: contact_email_expr
      - _var: person_email_expr
