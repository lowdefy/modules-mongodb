_build.switch:
  branches:
    - if:
        _build.ne:
          - _module.var: card
          - null
      then:
        _module.var: card
  default:
    id: card-section
    type: Box
    layout:
      span: 24
      gap: 8
    blocks:
      _build.array.concat:
        - - id: card
            type: Card
            loading:
              _var:
                key: loading
                default: false
            skeleton:
              type: Card
              blocks:
                - type: Skeleton
                  properties:
                    height:
                      _var:
                        key: skeleton_height
                        default: 300
            properties:
              title:
                _build.if:
                  test:
                    _var:
                      key: hide_title
                      default: false
                  then: null
                  else:
                    _var: title
            layout:
              gap: 16
            # An `extra` slot renders the card header even when it is empty, so
            # only declare it when a caller passed header buttons — otherwise a
            # title-less card gets a blank header band. Tested for presence, not
            # length: header_buttons may be a runtime operator.
            slots:
              _build.if:
                test:
                  _build.eq:
                    - _var:
                        key: header_buttons
                        default: null
                    - null
                then: {}
                else:
                  extra:
                    blocks:
                      _var: header_buttons
            blocks:
              _var:
                key: blocks
                default: []
        # Footer buttons (inline, not sticky)
        - _build.if:
            test:
              _build.gt:
                - _build.array.length:
                    _var:
                      key: footer_buttons
                      default: []
                - 0
            then:
              - id: card-footer
                type: Box
                layout:
                  direction: row-reverse
                  gap: 8
                blocks:
                  _var:
                    key: footer_buttons
                    default: []
            else: []
