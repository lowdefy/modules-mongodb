id:
  _var: id
type: Layout
style:
  minHeight: 100vh
events:
  onInit:
    _var:
      key: events.onInit
      default: []
  onInitAsync:
    _var:
      key: events.onInitAsync
      default: []
  onMount:
    _var:
      key: events.onMount
      default: []
  onMountAsync:
    _var:
      key: events.onMountAsync
      default: []
requests:
  _var:
    key: requests
    default: []
blocks:
  - id: auth-content
    type: Content
    layout:
      direction: column
      justify: center
      flex: 1 1 auto
    slots:
      content:
        style:
          minHeight: 100vh
          alignItems: center
    style:
      padding: 0 20px
    blocks:
      - id: auth-page-container
        type: Box
        style:
          maxWidth:
            _var:
              key: max_width
              default:
                _module.var: auth_page.max_width
        blocks:
          _build.array.concat:
            # Small centred logo above a bandless card is the `minimal` brand treatment only.
            - _build.if:
                test:
                  _build.eq:
                    - _module.var: auth_page.logo_style
                    - minimal
                then:
                  - id: auth-logo-minimal-wrap
                    type: Box
                    layout:
                      justify: center
                    style:
                      textAlign: center
                      marginBottom: 20
                    blocks:
                      - id: auth-logo-minimal
                        type: Img
                        properties:
                          src:
                            _module.var: logo.primary
                          height: 30
                else: []
            - - id: auth-card
                type: Card
                layout:
                  gap: 16
                style:
                  .element:
                    _module.var: auth_page.card_style
                properties:
                  bordered: false
                  theme:
                    borderRadiusLG: 12
                    # antd's Card `bodyPadding` token is a number of px, never a
                    # CSS shorthand — the block schema rejects the string form.
                    # There is no separate token for the inline padding, so the
                    # shorthand collapses to its vertical value.
                    bodyPadding: 28
                slots:
                  # Gradient cover band is the `band` brand treatment only; `minimal` is bandless.
                  cover:
                    blocks:
                      _build.if:
                        test:
                          _build.eq:
                            - _module.var: auth_page.logo_style
                            - band
                        then:
                          - id: auth-cover
                            type: Box
                            layout:
                              justify: center
                              selfAlign: middle
                            style:
                              padding: "32px 32px 24px 32px"
                              background:
                                _module.var: auth_page.cover_background
                              borderRadius: "12px 12px 0 0"
                            blocks:
                              - id: auth-logo
                                type: Img
                                # `properties.width` on Img is a number of px
                                # under the block schema, so the `100%` CSS
                                # length belongs in `style`, not `properties`.
                                style:
                                  width: 100%
                                  maxWidth:
                                    _module.var: auth_page.logo_max_width
                                properties:
                                  src:
                                    _module.var: logo.primary_dark
                        else: []
                blocks:
                  _build.array.concat:
                    - _build.if:
                        test:
                          _build.ne:
                            - _var:
                                key: title
                                default: ""
                            - ""
                        then:
                          - id: auth-title
                            type: Title
                            properties:
                              content:
                                _var: title
                              level: 3
                        else: []
                    - _var:
                        key: blocks
                        default: []
                    - _var:
                        key: actions
                        default: []
            - _build.if:
                test:
                  _build.gt:
                    - _build.array.length:
                        _var:
                          key: nav
                          default: []
                    - 0
                then:
                  - id: auth-nav
                    type: Box
                    style:
                      marginTop: 18
                      textAlign: center
                      fontSize: 12
                      color: "var(--ant-color-text-secondary)"
                    blocks:
                      _var:
                        key: nav
                        default: []
                else: []
            - _build.if:
                test:
                  _build.gt:
                    - _build.array.length:
                        _module.var: footer
                    - 0
                then:
                  - id: auth-footer
                    type: Box
                    style:
                      marginTop: 24
                      textAlign: center
                      fontSize: 12
                      color: "var(--ant-color-text-secondary)"
                    blocks:
                      _module.var: footer
                else: []
