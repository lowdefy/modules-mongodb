# Shared invitations base stages: one canonical pending-invitation read,
# `_ref`'d by relative path from BOTH user-admin (suite Invitations tab +
# Excel export) and organizations (the per-org members page), so the read
# shape can't drift between them.
#
# Root is `user-invitations`, scoped by the REQUIRED `org_value` ref var. The
# two consumers scope differently and the value is theirs to supply:
#   user-admin    : the organization the instance administers, welded in at
#                   build time: `org_value: { _module.var: org_slug }`.
#   organizations : the caller's active organization, read at request time:
#                   `org_value: { _user: organization_id }`.
# Reads the collection directly (bypassing the org-plugin helpers) so it can do
# its own status/expiry derivation:
#   $match status: "pending", excludes accepted / rejected / canceled rows,
#     which appear in neither the Invitations tab nor the export.
#   status: there is NO "expired" status in BetterAuth; it is derived from a
#     pending row's expires_at: future → Invited, past → Expired (Decision 2).
#   app roles ride only `app_roles` (unset in close_row) and surface resolved as
#     `roles` where the export needs them.
#   inviter_name / inviter_id: the "Invited by" column — the inviter's
#     per-org member display copy, falling back to the global `users` row (T18).
- $match:
    organization_id:
      _var: org_value
    status: pending
- $lookup:
    from: users
    localField: inviter_id
    foreignField: _id
    as: inviter
- $unwind:
    path: "$inviter"
    preserveNullAndEmptyArrays: true
# The inviter's per-organization display copy (denormalized onto the member row
# by UpdateUserProfile). The global users row is deployment-wide last-edit-wins,
# so "Invited by" on an invitation sent from THIS organization would otherwise
# render the name last saved in ANOTHER workspace (T18). Falls back to the
# global row for inviters who never saved a profile in this organization.
- $lookup:
    from: user-members
    as: inviter_member
    let:
      inviter_user_id: "$inviter_id"
      invitation_org_id: "$organization_id"
    pipeline:
      - $match:
          $expr:
            $and:
              - $eq:
                  - "$user_id"
                  - "$$inviter_user_id"
              - $eq:
                  - "$organization_id"
                  - "$$invitation_org_id"
- $unwind:
    path: "$inviter_member"
    preserveNullAndEmptyArrays: true
- $addFields:
    inviter_name:
      $ifNull:
        - "$inviter_member.name"
        - "$inviter.name"
    inviter_id: "$inviter_id"
    expires_at: "$expires_at"
    # Stored invite-time member attributes (applied to the member at accept),
    # carried through so Resend can preserve them rather than blank them.
    member_attributes:
      $ifNull:
        - "$attributes"
        - {}
    status:
      $cond:
        - $gt:
            - "$expires_at"
            - _date: now
        - Invited
        - Expired
# inviter_member exists only to derive inviter_name — never ship the joined
# member row (app_roles / attributes are authorization inputs).
- $unset:
    - inviter_member
