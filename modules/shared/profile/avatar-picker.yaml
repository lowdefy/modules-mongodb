# Avatar preview + colour picker — the labelled form row used by the onboarding
# page and the profile edit modal. Left: the 64px preview. Right: the "Avatar"
# field label above a quiet Change colour button.
#
# The preview calls the same derivation the write seams use, so the initials, the
# `?` empty-name fallback and the gradient all come from the one implementation that
# also produces the saved `profile.picture`. It reads `state.profile.avatar_color`,
# which the host seeds with avatar-picker-seed.yaml — an unseeded preview would draw
# a fresh random gradient on every keystroke in the name fields.
#
# `profile.avatar_color` is the only state the Change colour button reads or writes,
# so there is nothing that can disagree with the gradient on screen. It lives under
# `profile` so it travels with that subtree into the payload.
#
# Both children need `flex: 0 0 auto` — a child block with no flex value spans the
# full row, which would stack the preview above the label instead of beside it.
id: avatar_picker
type: Box
layout:
  span: 24
  gap: 16
style:
  marginBottom: 20
blocks:
  - id: avatar_picker_face
    type: Avatar
    layout:
      flex: 0 0 auto
      selfAlign: middle
    properties:
      size: large
      theme:
        containerSizeLG: 64
      src:
        _get:
          from:
            _js:
              fn:
                _ref:
                  path: ../shared/profile/derive-profile.js.njk
              args:
                stored: {}
                incoming:
                  _state: profile
                palette:
                  _module.var: avatar_colors
          key: picture
  - id: avatar_picker_field
    type: Box
    layout:
      flex: 0 0 auto
      selfAlign: middle
      gap: 6
    blocks:
      # The form's own field-label styling — the row reads as a field, so it is
      # labelled like one rather than with a section eyebrow.
      - id: avatar_picker_label
        type: Html
        properties:
          html: Avatar
        style:
          fontSize: 13
          fontWeight: 500
          color: "var(--ant-color-text-secondary)"
      - id: avatar_picker_button
        type: Button
        properties:
          title: Change colour
          icon: AiOutlineReload
          size: small
          shape: round
          variant: outlined
        events:
          onClick:
            # `_js` rather than operator chaining because the palette's `from`
            # values repeat — #c62828 at 0 and 15, #6a1b9a at 2 and 17, plus five
            # more pairs — so the current position can only be recovered by matching
            # both fields. findIndex returning -1 for an absent or off-palette
            # colour lands the first click on entry 0.
            - id: advance_avatar_color
              type: SetState
              params:
                profile.avatar_color:
                  _js:
                    fn: |
                      const palette = args.palette;
                      const current = args.current || {};
                      const index = palette.findIndex(
                        (color) => color.from === current.from && color.to === current.to
                      );
                      return palette[(index + 1) % palette.length];
                    args:
                      palette:
                        _module.var: avatar_colors
                      current:
                        _state: profile.avatar_color
