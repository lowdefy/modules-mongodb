# Core profile fields — the honorific and name parts, as a form row.
#
# Wrapped in a full-width Box so the name fields keep their own tight gap
# regardless of the gap the consuming card/modal sets for its other children.
# span: 24 is required — without it the Box shrinks to content and the child
# spans have no definite width to resolve against.
#
# `stack_honorific` (default false) picks the layout. Default (false) keeps the
# honorific and both names inline on one 24-column row, which needs a wide
# container (the ~560px edit modals, invite form, contacts form). Set true on a
# narrow container (the 420px onboarding card) to drop the honorific onto its
# own row above the names, which then split 50/50 — three inline controls are
# too cramped at 420.
- id: profile_name_row
  type: Box
  layout:
    span: 24
    gap: 8
  blocks:
    _build.if:
      test:
        _var:
          key: stack_honorific
          default: false
      then:
        _build.array.concat:
          - _build.if:
              test:
                _var: show_honorific
              then:
                - id: profile.title
                  type: Selector
                  layout:
                    span: 8
                  properties:
                    title: Title
                    placeholder: Title
                    options:
                      - Mr
                      - Ms
                      - Mrs
                      - Dr
                      - Prof
              else: []
          - - id: profile_name_fields
              type: Box
              layout:
                span: 24
                gap: 8
              blocks:
                - id: profile.given_name
                  type: TextInput
                  required: true
                  layout:
                    span: 12
                  properties:
                    title: First name
                - id: profile.family_name
                  type: TextInput
                  required: true
                  layout:
                    span: 12
                  properties:
                    title: Last name
      else:
        _build.array.concat:
          - _build.if:
              test:
                _var: show_honorific
              then:
                - id: profile.title
                  type: Selector
                  layout:
                    span: 6
                  properties:
                    title: Title
                    placeholder: Title
                    options:
                      - Mr
                      - Ms
                      - Mrs
                      - Dr
                      - Prof
              else: []
          - - id: profile.given_name
              type: TextInput
              required: true
              layout:
                span:
                  _build.if:
                    test:
                      _var: show_honorific
                    then: 9
                    else: 12
              properties:
                title: First name
            - id: profile.family_name
              type: TextInput
              required: true
              layout:
                span:
                  _build.if:
                    test:
                      _var: show_honorific
                    then: 9
                    else: 12
              properties:
                title: Last name
