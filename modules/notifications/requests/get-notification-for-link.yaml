id: get_notification_for_link
type: MongoDBAggregation
connectionId:
  _module.connectionId: notifications-collection
payload:
  _id:
    _url_query: _id
  app_name:
    _build.app: slug
properties:
  pipeline:
    - $match:
        _id:
          _payload: _id
        created.app_name:
          _payload: app_name
        # Pre-auth notification types (module var public_link_types) resolve
        # without a session; everything else needs the caller to BE the
        # recipient (requests/match-recipient.yaml). Legacy records store
        # event_type; pipeline records store type. A record addressed to a
        # login-less contact resolves only through public_link_types, which is
        # correct: there is no session to check.
        $or:
          - event_type:
              $in:
                _module.var: public_link_types
          - type:
              $in:
                _module.var: public_link_types
          - $or:
              _ref: requests/match-recipient.yaml
