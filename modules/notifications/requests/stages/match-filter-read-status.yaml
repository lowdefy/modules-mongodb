# filter.status: unread (default) | all | read.
$match:
  _if:
    test:
      _eq:
        - _payload: filter.status
        - read
    then:
      read: true
    else:
      _if:
        test:
          _eq:
            - _payload: filter.status
            - all
        then: {}
        else:
          read: false
