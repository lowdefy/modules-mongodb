- id: get_notification_facets
  type: Request
  params: get_notification_facets
- id: set_event_types
  type: SetState
  params:
    event_types:
      _js: |
        const facets = request('get_notification_facets') || [];
        const event_types = lowdefyGlobal('enums.event_types') || {};
        return facets.map((facet) => ({
          value: facet._id,
          label: (event_types[facet._id] || {}).title ?? facet._id,
        }));
