# The list's choice opens in the pane. The pane reads open_id, not the list's
# own value: the list is an input, and an input that is not visible (an empty
# list) has its value removed from state.
_build.array.concat:
  - - id: set_open_id
      type: SetState
      params:
        open_id:
          _state: selected_id
  - _ref: actions/open-notification.yaml
