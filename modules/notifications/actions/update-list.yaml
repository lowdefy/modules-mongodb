_build.array.concat:
  - - id: set_pagination
      type: SetState
      params:
        pagination:
          pageSize: 1000
          skip: 0
          current: 1
    - id: fetch
      type: Request
      params: get_notifications
    - id: set_notifications
      type: SetState
      params:
        list:
          _ref:
            path: components/notification-appearance.yaml
            vars:
              records:
                _request: get_notifications.0.notifications
  - _ref: actions/set-types.yaml
