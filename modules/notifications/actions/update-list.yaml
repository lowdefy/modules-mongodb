# Back to page 1 of the current filter, and fresh rail counts.
_build.array.concat:
  - - id: set_pagination
      type: SetState
      params:
        pagination:
          pageSize: 1000
          skip: 0
          current: 1
        new_count: 0
    - id: fetch
      type: Request
      params: get_notifications
    - id: set_notifications
      type: SetState
      params:
        list:
          _ref: components/list-rows.yaml
  - _ref: actions/refresh-counts.yaml
