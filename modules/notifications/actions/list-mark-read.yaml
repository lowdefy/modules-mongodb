# Mark the row in open_id read: in the database, on its row in place (an Unread
# row stays until the next fetch) and in the counts and the bell.
- id: set_row_read
  type: SetState
  params:
    list:
      _js:
        args:
          list:
            _if_none:
              - _state: list
              - []
          id:
            _state: open_id
        fn: |
          return args.list.map((row) =>
            row._id === args.id ? { ...row, read: true } : row,
          );
- id: update_row_read
  type: Request
  params: update_selected_notification
- id: refresh_after_row_read
  type: Request
  params:
    - get_notification_facets
    - notifications_unread_count
