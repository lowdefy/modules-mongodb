# The inbox: header, then rail | list | reading pane filling the page under
# the app header (full_bleed publishes the height left).
_ref:
  module: layout
  component: page
  vars:
    id: all
    title: Notifications
    hide_title: true
    full_bleed: true
    # The page's own live feed: the shared bell, toast and sound actions, plus a
    # count of new rows for the pill above the list and fresh rail counts. New
    # rows never insert themselves under the cursor.
    subscriptions:
      _ref:
        path: components/live-subscription.yaml
        key: subscriptions
        vars:
          on_message:
            # New rows the current view would show (its types; never under
            # Read), and the read state of rows already listed.
            - id: count_new_rows
              type: SetState
              params:
                new_count:
                  _js:
                    args:
                      count:
                        _if_none:
                          - _state: new_count
                          - 0
                      messages:
                        _event: messages
                      types:
                        _if_none:
                          - _state: filter.types
                          - []
                      status:
                        _state: filter.status
                    fn: |
                      if (args.status === 'read') return args.count;
                      const fresh = (args.messages || []).filter((m) => {
                        if (m.operationType !== 'insert' || !m.fullDocument) return false;
                        const type = m.fullDocument.type ?? m.fullDocument.event_type;
                        return args.types.length === 0 || args.types.includes(type);
                      });
                      return args.count + fresh.length;
                list:
                  _js:
                    args:
                      list:
                        _if_none:
                          - _state: list
                          - []
                      messages:
                        _event: messages
                    fn: |
                      const read = {};
                      (args.messages || []).forEach((m) => {
                        if (m.operationType === 'update' && m.fullDocument) {
                          read[m.fullDocument._id] = m.fullDocument.read === true;
                        }
                      });
                      return args.list.map((row) =>
                        row._id in read ? { ...row, read: read[row._id] } : row,
                      );
            - id: live_counts
              type: Request
              params:
                - get_notification_facets
                - get_notifications
    requests:
      - _ref: requests/get-notifications.yaml
      - _ref: requests/get-notification-facets.yaml
      - _ref: requests/get-selected-notification.yaml
      - _ref: requests/update-notifications.yaml
      - _ref: requests/update-selected-notification.yaml
      - _ref: requests/update-selected-unread.yaml
    events:
      onInit:
        - id: init
          type: SetState
          params:
            pagination:
              pageSize: 1000
              skip: 0
              current: 1
            filter:
              status: unread
              view: inbox
              types: []
              search: ""
            open_id:
              _if_none:
                - _url_query: _id
                - null
            selected_id:
              _if_none:
                - _url_query: _id
                - null
            view_picker: inbox
            pane_open: false
            new_count: 0
      onMount:
        _build.array.concat:
          - _ref: actions/update-list.yaml
          # A link to one notification (?_id=) opens it.
          - _build.array.map:
              on:
                _ref: actions/open-notification.yaml
              callback:
                _build.function:
                  __build.object.assign:
                    - __build.args: 0
                    - skip:
                        _eq:
                          - _state: open_id
                          - null
    blocks:
      - id: inbox_styles
        type: Html
        properties:
          html:
            # A leading <style> is hoisted into <head> and dropped by the
            # sanitiser, so the stylesheet trails an empty element.
            _string.concat:
              - "<span></span><style>"
              - _ref: components/notification-list.css
              - "</style>"
      - id: inbox
        type: Box
        class:
          .element: nx-inbox
        layout:
          gap: 16
        blocks:
          - id: inbox_header
            type: Box
            layout:
              span: 24
              gap: 12
              align: bottom
              justify: space-between
            blocks:
              - id: inbox_title
                type: Html
                layout:
                  flex: 1 1 auto
                properties:
                  html:
                    _nunjucks:
                      template: |
                        <div class="nx-title"><h1>Notifications</h1><p>{% if loaded %}{% if unread > 0 %}<strong>{{ unread }} unread</strong>{% else %}All caught up{% endif %} · {{ total }} in total{% else %}&nbsp;{% endif %}</p></div>
                      on:
                        loaded:
                          _ne:
                            - _request: get_notification_facets
                            - null
                        unread:
                          _js:
                            args:
                              facets:
                                _if_none:
                                  - _request: get_notification_facets
                                  - []
                            fn: |
                              return args.facets.reduce((sum, f) => sum + f.unread, 0);
                        total:
                          _js:
                            args:
                              facets:
                                _if_none:
                                  - _request: get_notification_facets
                                  - []
                            fn: |
                              return args.facets.reduce((sum, f) => sum + f.total, 0);
              - id: inbox_actions
                type: Box
                layout:
                  flex: 0 0 auto
                  gap: 16
                  align: middle
                blocks:
                  - id: notifications_sound_toggle
                    type: NotificationSound
                    layout:
                      flex: 0 0 auto
                    properties:
                      app:
                        _build.app: slug
                      toggle: true
                      sounds:
                        _module.var: sounds
                  - _ref: components/button-mark-all.yaml
          - id: inbox_panel
            type: Box
            class:
              .element: nx-panel
            layout:
              span: 24
              wrap: nowrap
            blocks:
              - id: rail_column
                type: Box
                class:
                  .element: nx-region nx-rail
                layout:
                  flex: 0 0 240px
                blocks:
                  - _ref: components/rail.yaml
              - _ref: components/list-column.yaml
              - _ref: components/area-selected.yaml
