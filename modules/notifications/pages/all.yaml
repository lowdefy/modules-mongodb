# The inbox: header, then rail | list | reading pane filling the page under
# the app header (full_bleed publishes the height left).
_ref:
  module: layout
  component: page
  vars:
    id: all
    title: Notifications
    hide_title: true
    full_bleed: true
    # The page's own live feed: the shared bell, toast and sound actions, plus a
    # count of new rows for the pill above the list and fresh rail counts. New
    # rows never insert themselves under the cursor.
    subscriptions:
      _ref:
        path: components/live-subscription.yaml
        key: subscriptions
        vars:
          on_message:
            - id: count_new_rows
              type: SetState
              params:
                new_count:
                  _js:
                    args:
                      count:
                        _if_none:
                          - _state: new_count
                          - 0
                      inserted:
                        _if_none:
                          - _state: notifications_live.inserted
                          - 0
                    fn: |
                      return args.count + args.inserted;
            - id: live_counts
              type: Request
              params:
                - get_notification_facets
                - get_notifications
    requests:
      - _ref: requests/get-notifications.yaml
      - _ref: requests/get-notification-facets.yaml
      - _ref: requests/get-selected-notification.yaml
      - _ref: requests/update-notifications.yaml
      - _ref: requests/update-selected-notification.yaml
      - _ref: requests/update-selected-unread.yaml
    events:
      onInit:
        - id: init
          type: SetState
          params:
            pagination:
              pageSize: 1000
              skip: 0
              current: 1
            filter:
              status: unread
              view: inbox
              types: []
              search: ""
            selected_id:
              _if_none:
                - _url_query: _id
                - null
            view_picker: inbox
            pane_open: false
            new_count: 0
      onMount:
        _build.array.concat:
          - _ref: actions/update-list.yaml
          - - id: open_from_link
              type: Request
              skip:
                _eq:
                  - _state: selected_id
                  - null
              params:
                - get_selected_notification
                - update_selected_notification
    blocks:
      - id: inbox_styles
        type: Html
        properties:
          html:
            # A leading <style> is hoisted into <head> and dropped by the
            # sanitiser, so the stylesheet trails an empty element.
            _string.concat:
              - "<span></span><style>"
              - _ref: components/notification-list.css
              - "</style>"
      - id: inbox
        type: Box
        class:
          .element: nx-inbox
        layout:
          gap: 16
        blocks:
          - id: inbox_header
            type: Box
            layout:
              span: 24
              gap: 12
              align: bottom
              justify: space-between
            blocks:
              - id: inbox_title
                type: Html
                layout:
                  flex: 1 1 auto
                properties:
                  html:
                    _nunjucks:
                      template: |
                        <div class="nx-title"><h1>Notifications</h1><p>{% if loaded %}{% if unread > 0 %}<strong>{{ unread }} unread</strong>{% else %}All caught up{% endif %} · {{ total }} in total{% else %}&nbsp;{% endif %}</p></div>
                      on:
                        loaded:
                          _ne:
                            - _request: get_notification_facets
                            - null
                        unread:
                          _js:
                            args:
                              facets:
                                _if_none:
                                  - _request: get_notification_facets
                                  - []
                            fn: |
                              return args.facets.reduce((sum, f) => sum + f.unread, 0);
                        total:
                          _js:
                            args:
                              facets:
                                _if_none:
                                  - _request: get_notification_facets
                                  - []
                            fn: |
                              return args.facets.reduce((sum, f) => sum + f.total, 0);
              - id: inbox_actions
                type: Box
                layout:
                  flex: 0 0 auto
                  gap: 16
                  align: middle
                blocks:
                  - id: notifications_sound_toggle
                    type: NotificationSound
                    layout:
                      flex: 0 0 auto
                    properties:
                      app:
                        _build.app: slug
                      toggle: true
                  - _ref: components/button-mark-all.yaml
          - id: inbox_panel
            type: Box
            class:
              .element: nx-panel
            layout:
              span: 24
              wrap: nowrap
            blocks:
              - id: rail_column
                type: Box
                class:
                  .element: nx-region nx-rail
                layout:
                  flex: 0 0 240px
                blocks:
                  - _ref: components/rail.yaml
              - _ref: components/list-column.yaml
              - _ref: components/area-selected.yaml
