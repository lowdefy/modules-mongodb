# The inbox. `layout: columns` (default): header, then rail | list | reading
# pane filling the page under the app header (full_bleed publishes the height
# left). `layout: list`: one column of rows, tabs and a Filter button.
_ref:
  module: layout
  component: page
  vars:
    id: all
    title: Notifications
    hide_title: true
    full_bleed:
      _build.eq:
        - _module.var: layout
        - columns
    page_actions:
      _build.if:
        test:
          _build.eq:
            - _module.var: layout
            - list
        then:
          - _ref: components/sound-action.yaml
        else: []
    # The page's own live feed: the shared bell, toast and sound actions, plus a
    # count of new rows for the pill above the list and fresh rail counts. New
    # rows never insert themselves under the cursor.
    subscriptions:
      _ref:
        path: components/live-subscription.yaml
        key: subscriptions
        vars:
          on_message:
            # New rows the current view would show (its types; never under
            # Read), and the read state of rows already listed.
            - id: count_new_rows
              type: SetState
              params:
                new_count:
                  _js:
                    args:
                      count:
                        _if_none:
                          - _state: new_count
                          - 0
                      messages:
                        _event: messages
                      types:
                        _if_none:
                          - _state: filter.types
                          - []
                      status:
                        _state: filter.status
                    fn: |
                      if (args.status === 'read') return args.count;
                      const fresh = (args.messages || []).filter((m) => {
                        if (m.operationType !== 'insert' || !m.fullDocument) return false;
                        const type = m.fullDocument.type ?? m.fullDocument.event_type;
                        return args.types.length === 0 || args.types.includes(type);
                      });
                      return args.count + fresh.length;
                list:
                  _js:
                    args:
                      list:
                        _if_none:
                          - _state: list
                          - []
                      messages:
                        _event: messages
                    fn: |
                      const read = {};
                      (args.messages || []).forEach((m) => {
                        if (m.operationType === 'update' && m.fullDocument) {
                          read[m.fullDocument._id] = m.fullDocument.read === true;
                        }
                      });
                      return args.list.map((row) =>
                        row._id in read ? { ...row, read: read[row._id] } : row,
                      );
            - id: live_counts
              type: Request
              params:
                - get_notification_facets
                - get_notifications
    requests:
      - _ref: requests/get-notifications.yaml
      - _ref: requests/get-notification-facets.yaml
      - _ref: requests/get-selected-notification.yaml
      - _ref: requests/update-notifications.yaml
      - _ref: requests/update-selected-notification.yaml
      - _ref: requests/update-selected-unread.yaml
    events:
      onInit:
        - id: init
          type: SetState
          params:
            pagination:
              pageSize:
                _ref: components/page-size.yaml
              skip: 0
              current: 1
            expanded: {}
            custom_dates: false
            filter:
              status: unread
              view: inbox
              types: []
              search: ""
            open_id:
              _if_none:
                - _url_query: _id
                - null
            selected_id:
              _if_none:
                - _url_query: _id
                - null
            view_picker: inbox
            pane_open: false
            new_count: 0
      onMount:
        _build.array.concat:
          - _ref: actions/update-list.yaml
          # A link to one notification (?_id=) opens it.
          - _build.array.map:
              on:
                _ref: actions/open-notification.yaml
              callback:
                _build.function:
                  __build.object.assign:
                    - __build.args: 0
                    - skip:
                        _eq:
                          - _state: open_id
                          - null
    blocks:
      _build.if:
        test:
          _build.eq:
            - _module.var: layout
            - list
        then:
          _ref: components/layout-list.yaml
        else:
          _ref: components/layout-columns.yaml
