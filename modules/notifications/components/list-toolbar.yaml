# The list layout's toolbar: Unread / All tabs, one Filter button holding the
# views, date presets and (past about ten notifications) search, and Mark all
# as read as a text link.
id: list_toolbar
type: Box
class:
  .element: nx-ltoolbar
layout:
  gap: 12
  align: middle
blocks:
  - _ref: components/list-tabs.yaml
  - id: filter_popover
    type: Popover
    layout:
      flex: 0 0 auto
    properties:
      trigger: click
      placement: bottomRight
      arrow: false
      overlayInnerStyle:
        width: 320
    slots:
      popover:
        blocks:
          - id: filter_panel
            type: Box
            layout:
              direction: column
              gap: 12
            blocks:
              - _ref: components/list-filter-views.yaml
              - _ref: components/list-filter-dates.yaml
              - id: filter.dates
                type: DateRangeSelector
                style:
                  .block:
                    display:
                      _if:
                        test:
                          _if_none:
                            - _state: custom_dates
                            - false
                        then: block
                        else: none
                properties:
                  label:
                    disabled: true
                  placeholder:
                    - Start date
                    - End date
                events:
                  onChange:
                    _ref: actions/update-list.yaml
              - id: filter.search
                type: TextInput
                visible:
                  _gt:
                    - _js:
                        args:
                          facets:
                            _if_none:
                              - _request: get_notification_facets
                              - []
                        fn: |
                          return args.facets.reduce((sum, f) => sum + f.total, 0);
                    - 10
                properties:
                  label:
                    disabled: true
                  placeholder: Search title and message
                  allowClear: true
                  prefixIcon: Search
                events:
                  onChange:
                    _ref: actions/filter-onchange.yaml
    blocks:
      - id: filter_button
        type: Button
        properties:
          size: small
          color: default
          variant: outlined
          icon: ListFilter
          title:
            _nunjucks:
              template: "Filter{% if n %} · {{ n }}{% endif %}"
              on:
                n:
                  _js:
                    args:
                      filter:
                        _if_none:
                          - _state: filter
                          - {}
                    fn: |
                      const f = args.filter;
                      return (
                        ((f.view || 'inbox') !== 'inbox' ? 1 : 0) +
                        ((f.dates || []).length > 0 ? 1 : 0) +
                        (String(f.search || '').trim() !== '' ? 1 : 0)
                      );
  - _ref: components/list-mark-all.yaml
