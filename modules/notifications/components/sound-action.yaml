# The Sound switch with its help line, for a page actions slot: the layout
# page component renders `page_actions` entries, and an app can place this one
# in its own page menu. Plays the viewer's sound (the `sounds` var) when a
# popup notification arrives while the app is open.
id: notifications_sound_action
type: Box
layout:
  gap: 8
  align: middle
  flex: 0 0 auto
blocks:
  - id: notifications_sound_toggle
    type: NotificationSound
    layout:
      flex: 0 0 auto
    properties:
      app:
        _build.app: slug
      toggle: true
      sounds:
        _module.var: sounds
  # On a phone the switch alone fits the page's actions row.
  - id: notifications_sound_help
    type: Html
    layout:
      flex: 0 0 auto
    class:
      .block: hidden sm:block
    properties:
      html: <span data-tone="tertiary">Plays a sound when a notification arrives while you are in the app.</span>
