id: notifications_unread_count
type: MongoDBAggregation
connectionId:
  _module.connectionId: notifications-collection
payload:
  app_name:
    _build.app: slug
properties:
  pipeline:
    - $match:
        read: false
        $or:
          _ref: requests/match-recipient.yaml
        created.app_name:
          _payload: app_name
    - $count: total
