# Marks every unread notification the filters match, across all pages
# (requests/update-notifications.yaml). Names the count whenever a view, type,
# search or date narrows it.
id: button_mark_all_read
type: Button
layout:
  flex: 0 0 auto
properties:
  type: primary
  icon: CheckCheck
  title:
    _if:
      test:
        _or:
          - _gt:
              - _array.length:
                  _if_none:
                    - _state: filter.types
                    - []
              - 0
          - _ne:
              - _if_none:
                  - _state: filter.search
                  - ""
              - ""
          - _gt:
              - _array.length:
                  _if_none:
                    - _state: filter.dates
                    - []
              - 0
      then:
        _nunjucks:
          template: Mark {{ n }} as read
          on:
            n:
              _if_none:
                - _request: get_notifications.0.unread_count.0.total
                - 0
      else: Mark all as read
  disabled:
    _eq:
      - _if_none:
          - _request: get_notifications.0.unread_count.0.total
          - 0
      - 0
events:
  onClick:
    _build.array.concat:
      - - id: update_notifications
          type: Request
          params: update_notifications
        - id: marked_message
          type: DisplayMessage
          params:
            status: success
            content:
              _nunjucks:
                template: Marked {{ n }} as read
                on:
                  n:
                    _if_none:
                      - _request: update_notifications.modifiedCount
                      - 0
      - _ref: actions/update-list.yaml
