# The reading pane: the selected notification, or a quiet placeholder.
id: reading_pane
type: Box
class:
  .element:
    _if:
      test:
        _state: pane_open
      then: nx-region nx-pane
      else: nx-region nx-pane nx-narrow-hidden
layout:
  flex: 1 1 0
blocks:
  - id: pane_placeholder
    type: Html
    visible:
      _eq:
        - _if_none:
            - _state: selected_id
            - null
        - null
    properties:
      html: |
        <div class="nx-placeholder"><div class="nx-ring"><i data-icon="MailOpen"></i></div><strong>Select a notification to read it</strong><span>Opening a notification marks it as read.</span></div>
  - id: selected_item
    type: Box
    visible:
      _ne:
        - _if_none:
            - _state: selected_id
            - null
        - null
    blocks:
      - _ref:
          path: components/view-notification.yaml
          vars:
            notification:
              _request: get_selected_notification.0
