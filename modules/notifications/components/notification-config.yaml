# The bell's config for the layout's header. `color` is the `tone` var (gold or
# red) and is left out when it is unset, so the badge keeps its default.
_build.object.assign:
  - count:
      _if_none:
        - _request: notifications_unread_count.0.total
        - 0
    icon:
      name: bell
    link:
      pageId:
        _module.pageId: all
  - _build.if:
      test:
        _build.ne:
          - _module.var: tone
          - null
      then:
        color:
          _module.var: tone
      else: {}
