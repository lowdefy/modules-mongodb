id: list_box
type: Box
loading:
  _not:
    _request: get_notifications
blocks:
  # Row styles ride in a trailing <style> (a leading one is hoisted into <head>
  # and dropped by the sanitiser). Token-driven, see the stylesheet.
  - id: list_styles
    type: Html
    properties:
      html:
        _string.concat:
          - "<span></span><style>"
          - _ref: components/notification-list.css
          - "</style>"
  - id: list_none
    type: Result
    visible:
      _eq:
        - _request: get_notifications.0.notifications.length
        - 0
    properties:
      icon:
        name: AiOutlineInbox
        color: var(--ant-color-text-quaternary)
      subTitle: No matching notifications. Change the filter to view more.
  - id: list
    type: List
    visible:
      _ne:
        - _request: get_notifications.0.notifications.length
        - 0
    blocks:
      - _ref: components/list-notification-item.yaml
