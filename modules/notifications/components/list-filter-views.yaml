# The Filter popover's views: Inbox and the app's views in one list, each with
# its unread count. Choosing one sets filter.view, as the columns rail does.
id: filter_views
type: ClickableHtml
class:
  .element: nx-lfilter-views
properties:
  dataEvents:
    - onSelect
  html:
    _nunjucks:
      template: |
        <div class="nx-lfilter-h">Show</div>
        {% for item in views %}
        <div class="nx-lfilter-item{% if item.key == selected %} nx-lfilter-item--on{% endif %}" data-event="onSelect" data-key="{{ item.key }}" role="button">
          <i data-icon="{{ item.icon }}"></i>
          <span class="nx-lfilter-label">{{ item.label }}</span>
          {% if item.unread > 0 %}<span class="nx-lfilter-count">{{ item.unread }}</span>{% endif %}
        </div>
        {% endfor %}
      on:
        selected:
          _if_none:
            - _state: filter.view
            - inbox
        views:
          _get:
            key: views
            from:
              _ref: components/rail-items.yaml
events:
  onSelect:
    _build.array.concat:
      - - id: set_view
          type: SetState
          params:
            filter.view:
              _event: key
      - _ref: actions/select-view.yaml
