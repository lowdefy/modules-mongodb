# The list layout's view model, from the rows in state (components/list-rows.yaml):
#
#   { loaded, empty, sections: [{ key, label, count, items }], more }
#
# An item is a row, or a group (rows of the same type on the same day, two or
# more): { kind, key, title, preview, read, icon, iso, time_format, mode, open,
# body, fix, children }. Sections are This week (the last 7 days) and Earlier,
# newest first; their counts and `more` come from the server's true totals, so
# a page cut at 25 rows says how many more there are.
_js:
  args:
    list:
      _if_none:
        - _state: list
        - []
    expanded:
      _if_none:
        - _state: expanded
        - {}
    loaded:
      _ne:
        - _request: get_notifications
        - null
    total:
      _if_none:
        - _request: get_notifications.0.total_count.0.total
        - 0
    week:
      _if_none:
        - _request: get_notifications.0.week_count.0.total
        - 0
    status:
      _if_none:
        - _state: filter.status
        - unread
    view:
      _if_none:
        - _state: filter.view
        - inbox
    empty_texts:
      _module.var: empty
  fn: |
    const now = Date.now();
    const weekMs = 7 * 24 * 60 * 60 * 1000;
    const thisYear = new Date(now).getFullYear();
    const day = (iso) => (iso ? new Date(iso).toLocaleDateString('en-CA') : 'none');

    const decorate = (row) => {
      const at = row.created_at ? new Date(row.created_at) : null;
      const recent = at ? now - at.getTime() < weekMs : false;
      const appearance = row.appearance || {};
      return {
        kind: 'row',
        key: row._id,
        id: row._id,
        type: row.type,
        title: row.title,
        preview: row.preview,
        read: row.read,
        icon: appearance.icon || 'Bell',
        label: appearance.label,
        group_title: appearance.group_title,
        fix: appearance.fix,
        iso: row.created_at,
        recent,
        time_format: recent ? 'relative' : at && at.getFullYear() === thisYear ? 'D MMM' : 'D MMM YYYY',
        mode: row.mode,
        open: args.expanded[row._id] === true,
        body: row.body,
      };
    };

    const rows = args.list.map(decorate);

    // Same type, same day, same side of the week line: one group at the place
    // of its first row.
    const slots = [];
    const byKey = {};
    rows.forEach((row) => {
      const groupKey = `g:${row.type}:${day(row.iso)}:${row.recent}`;
      if (row.type == null) {
        slots.push(row);
      } else if (byKey[groupKey]) {
        byKey[groupKey].children.push(row);
      } else {
        const slot = { groupKey, first: row, children: [row] };
        byKey[groupKey] = slot;
        slots.push(slot);
      }
    });

    const items = slots.map((slot) => {
      if (!slot.children) return slot;
      if (slot.children.length === 1) return slot.first;
      const n = slot.children.length;
      const newest = slot.first;
      const title = newest.group_title
        ? String(newest.group_title).replace('{n}', n)
        : `${newest.label || 'Notifications'} (${n})`;
      return {
        kind: 'group',
        key: slot.groupKey,
        title,
        preview: newest.title,
        read: slot.children.every((c) => c.read),
        icon: newest.icon,
        iso: newest.iso,
        recent: newest.recent,
        time_format: newest.time_format,
        mode: 'group',
        open: args.expanded[slot.groupKey] === true,
        children: slot.children,
      };
    });

    const sections = [];
    const thisWeek = items.filter((item) => item.recent);
    const earlier = items.filter((item) => !item.recent);
    if (thisWeek.length > 0) sections.push({ key: 'week', label: 'This week', count: args.week, items: thisWeek });
    if (earlier.length > 0) {
      sections.push({ key: 'earlier', label: 'Earlier', count: Math.max(args.total - args.week, earlier.length), items: earlier });
    }

    const remaining = Math.max(args.total - rows.length, 0);

    const texts = args.empty_texts || {};
    const own = texts[args.view];
    const empty =
      typeof own === 'string'
        ? own
        : (own && own[args.status === 'unread' ? 'unread' : 'all']) ||
          (args.status === 'unread' ? "You're all caught up" : 'No notifications yet');

    return {
      loaded: args.loaded,
      empty,
      sections,
      more: remaining > 0 ? { n: Math.min(25, remaining), remaining } : null,
    };
