# Type icon in a tinted circle — icon and colour from enums.event_types,
# a bell in the secondary text colour when the type has no entry.
id: list.$.icon
type: Icon
layout:
  flex: 0 0 auto
class: notification-item__icon
style:
  background:
    _string.concat:
      - "color-mix(in srgb, "
      - _ref:
          path: components/list-item-type-lookup.yaml
          vars:
            key: color
            default: var(--ant-color-text-secondary)
      - " 12%, transparent)"
properties:
  size: 18
  name:
    _ref:
      path: components/list-item-type-lookup.yaml
      vars:
        key: icon
        default: AiOutlineBell
  color:
    _ref:
      path: components/list-item-type-lookup.yaml
      vars:
        key: color
        default: var(--ant-color-text-secondary)
