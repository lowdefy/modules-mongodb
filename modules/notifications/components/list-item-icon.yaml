# Type icon in a circle tinted with the notification's colour
# (components/notification-appearance.yaml).
id: list.$.icon
type: Icon
layout:
  flex: 0 0 auto
class: notification-item__icon
style:
  background:
    _string.concat:
      - "color-mix(in srgb, "
      - _state: list.$.appearance.color
      - " 12%, transparent)"
properties:
  size: 18
  name:
    _state: list.$.appearance.icon
  color:
    _state: list.$.appearance.color
