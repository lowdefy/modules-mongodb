# The list layout's rows: sections of rows and groups, a row opening by its
# mode (see components/list-rows.yaml), "Show N more" under the last section.
# One ClickableHtml, so a year of rows is one block, not hundreds.
id: inbox_list
type: ClickableHtml
class:
  .element: nx-llist
properties:
  dataEvents:
    - onOpen
    - onToggle
    - onMarkRead
    - onMore
  html:
    _nunjucks:
      template: |
        {% macro entry(it, nested) %}
        <div class="nx-lrow{% if not it.read %} nx-lrow--unread{% endif %}{% if nested %} nx-lrow--nested{% endif %}{% if it.mode == 'none' %} nx-lrow--static{% endif %}">
          <span class="nx-ldot"{% if it.read %} hidden{% endif %} aria-label="Unread"></span>
          <div class="nx-lbody"{% if it.kind == 'group' %} data-event="onToggle" data-key="{{ it.key }}" role="button"{% elif it.mode != 'none' %} data-event="onOpen" data-id="{{ it.id }}" role="button"{% endif %}>
            <span class="nx-licon"><i data-icon="{{ it.icon }}"></i></span>
            <div class="nx-lmain">
              <div class="nx-lhead">
                <span class="nx-ltitle">{{ it.title }}</span>
                {% if it.kind == 'row' and not it.read %}<span class="nx-lmark" data-event="onMarkRead" data-id="{{ it.id }}" role="button">Mark as read</span>{% endif %}
                {% if it.kind == 'group' %}<i class="nx-lchevron" data-icon="{% if it.open %}ChevronUp{% else %}ChevronDown{% endif %}"></i>{% endif %}
                {% if it.iso %}<time class="nx-ltime" datetime="{{ it.iso }}" data-time="{{ it.time_format }}">{{ it.iso }}</time>{% endif %}
              </div>
              {% if it.preview %}<div class="nx-lpreview">{{ it.preview }}</div>{% endif %}
            </div>
          </div>
          {% if it.kind == 'row' and it.open %}
          <div class="nx-lexpand">
            <div class="notification-email">{{ it.body | safe }}</div>
            {% if it.fix %}<a class="nx-lfix" data-page-id="{{ it.fix.pageId }}"{% if it.fix.query %} data-url-query="{{ it.fix.query }}"{% endif %}>{{ it.fix.title or 'Open' }}</a>{% endif %}
          </div>
          {% endif %}
          {% if it.kind == 'group' and it.open %}
          <div class="nx-lgroup">
            {% for child in it.children %}{{ entry(child, true) }}{% endfor %}
          </div>
          {% endif %}
        </div>
        {% endmacro %}
        {% if model.loaded and model.sections.length == 0 %}
        <div class="nx-lempty">{{ model.empty }}</div>
        {% endif %}
        {% for section in model.sections %}
        <section class="nx-lsection">
          <h6>{{ section.label }} <span>{{ section.count }}</span></h6>
          {% for it in section.items %}{{ entry(it, false) }}{% endfor %}
        </section>
        {% endfor %}
        {% if model.more %}
        <div class="nx-lmore"><span data-event="onMore" role="button">Show {{ model.more.n }} more of {{ model.more.remaining }}</span></div>
        {% endif %}
      on:
        model:
          _ref: components/list-model.yaml
events:
  onOpen:
    - id: set_open
      type: SetState
      params:
        open_id:
          _event: id
        open_mode:
          _js:
            args:
              list:
                _if_none:
                  - _state: list
                  - []
              id:
                _event: id
            fn: |
              const row = args.list.find((r) => r._id === args.id);
              return row ? row.mode : 'none';
    # A link target opens through the link page, as the email link does; it
    # marks the notification read and lands on the target.
    - id: open_link
      type: Link
      skip:
        _ne:
          - _state: open_mode
          - link
      params:
        pageId:
          _module.pageId: link
        urlQuery:
          _id:
            _state: open_id
    - id: toggle_row
      type: SetState
      skip:
        _ne:
          - _state: open_mode
          - expand
      params:
        expanded:
          _js:
            args:
              expanded:
                _if_none:
                  - _state: expanded
                  - {}
              id:
                _state: open_id
            fn: |
              return { ...args.expanded, [args.id]: !args.expanded[args.id] };
    # Opening in place reads it.
    - id: read_row
      type: SetState
      skip:
        _ne:
          - _state: open_mode
          - expand
      params:
        list:
          _js:
            args:
              list:
                _if_none:
                  - _state: list
                  - []
              id:
                _state: open_id
            fn: |
              return args.list.map((row) =>
                row._id === args.id ? { ...row, read: true } : row,
              );
    - id: update_row
      type: Request
      skip:
        _ne:
          - _state: open_mode
          - expand
      params: update_selected_notification
    - id: refresh_after_open
      type: Request
      skip:
        _ne:
          - _state: open_mode
          - expand
      params:
        - get_notification_facets
        - notifications_unread_count
  onToggle:
    - id: toggle_group
      type: SetState
      params:
        expanded:
          _js:
            args:
              expanded:
                _if_none:
                  - _state: expanded
                  - {}
              key:
                _event: key
            fn: |
              return { ...args.expanded, [args.key]: !args.expanded[args.key] };
  onMarkRead:
    _build.array.concat:
      - - id: set_marked_id
          type: SetState
          params:
            open_id:
              _event: id
      - _ref: actions/list-mark-read.yaml
  onMore:
    _ref: actions/list-more.yaml
