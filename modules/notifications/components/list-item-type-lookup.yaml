# enums.event_types.<type>.<key> for the current list row, with a default.
# Legacy records store event_type; pipeline records store type.
_global:
  key:
    _string.concat:
      - enums.event_types.
      - _if_none:
          - _state: list.$.event_type
          - _state: list.$.type
      - "."
      - _var: key
  default:
    _var: default
