# Unread N | All N: the list layout's status tabs, with the counts across all
# of the signed-in user's records (the facets), whatever the filter.
id: list_tabs
type: ClickableHtml
layout:
  flex: 1 1 auto
class:
  .element: nx-ltabs
properties:
  dataEvents:
    - onTab
  html:
    _nunjucks:
      template: |
        <span class="nx-ltab{% if status == 'unread' %} nx-ltab--on{% endif %}" data-event="onTab" data-tab="unread" role="button">Unread{% if loaded %} <span class="nx-ltab-count">{{ unread }}</span>{% endif %}</span>
        <span class="nx-ltab{% if status == 'all' %} nx-ltab--on{% endif %}" data-event="onTab" data-tab="all" role="button">All{% if loaded %} <span class="nx-ltab-count">{{ total }}</span>{% endif %}</span>
      on:
        status:
          _if_none:
            - _state: filter.status
            - unread
        loaded:
          _ne:
            - _request: get_notification_facets
            - null
        unread:
          _js:
            args:
              facets:
                _if_none:
                  - _request: get_notification_facets
                  - []
            fn: |
              return args.facets.reduce((sum, f) => sum + f.unread, 0);
        total:
          _js:
            args:
              facets:
                _if_none:
                  - _request: get_notification_facets
                  - []
            fn: |
              return args.facets.reduce((sum, f) => sum + f.total, 0);
events:
  onTab:
    _build.array.concat:
      - - id: set_status
          type: SetState
          params:
            filter.status:
              _event: tab
      - _ref: actions/update-list.yaml
