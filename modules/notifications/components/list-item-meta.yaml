id: list.$.meta
type: Html
layout:
  flex: 0 0 auto
style:
  textAlign: right
properties:
  html:
    _nunjucks:
      template: |
        <div class="notification-item__meta"><span>{{ time_ago }} ago</span>{% if unread %}<span class="notification-item__dot"></span>{% endif %}</div>
        {% if status %}<div class="notification-chip" style="color: {{ status.color }}; background: color-mix(in srgb, {{ status.color }} 12%, transparent);">{{ status.title }}</div>{% endif %}
      on:
        unread:
          _not:
            _state: list.$.read
        time_ago:
          _dayjs.humanizeDuration:
            on:
              _subtract:
                - _date.valueOf:
                    _date: now
                - _date.valueOf:
                    _state: list.$.created.timestamp
            withSuffix: false
        status:
          _global:
            _string.concat:
              - enums.event_types.
              - _if_none:
                  - _state: list.$.event_type
                  - _state: list.$.type
