# The Filter popover's date presets (Today, Last 7 days, Last 30 days, This
# year) as chips, with "Choose dates" revealing the range picker. A chip sets
# filter.dates, the one date condition the server sees; choosing the active
# chip again clears it.
id: filter_dates
type: ClickableHtml
class:
  .element: nx-lfilter-dates
properties:
  dataEvents:
    - onPreset
  html:
    _nunjucks:
      template: |
        <div class="nx-lfilter-h">Date</div>
        <div class="nx-lchips">
          {% for chip in chips %}
          <span class="nx-lchip{% if chip.on %} nx-lchip--on{% endif %}" data-event="onPreset" data-key="{{ chip.key }}" role="button">{{ chip.label }}</span>
          {% endfor %}
        </div>
      on:
        chips:
          _js:
            args:
              dates:
                _if_none:
                  - _state: filter.dates
                  - []
              custom:
                _if_none:
                  - _state: custom_dates
                  - false
            fn: |
              const { dates, custom } = args;
              const day = (d) => d.toLocaleDateString('en-CA');
              const today = new Date();
              const ago = (n) => day(new Date(today.getTime() - n * 86400000));
              const presets = [
                { key: 'today', label: 'Today', range: [day(today), day(today)] },
                { key: 'week', label: 'Last 7 days', range: [ago(6), day(today)] },
                { key: 'month', label: 'Last 30 days', range: [ago(29), day(today)] },
                { key: 'year', label: 'This year', range: [`${today.getFullYear()}-01-01`, day(today)] },
              ];
              const active = presets.find(
                (p) => dates.length === 2 && dates[0] === p.range[0] && dates[1] === p.range[1],
              );
              return presets
                .map((p) => ({ key: p.key, label: p.label, on: active === p && !custom }))
                .concat([{ key: 'choose', label: 'Choose dates', on: custom || (dates.length > 0 && !active) }]);
events:
  onPreset:
    _build.array.concat:
      - - id: set_dates
          type: SetState
          params:
            custom_dates:
              _js:
                args:
                  key:
                    _event: key
                  custom:
                    _if_none:
                      - _state: custom_dates
                      - false
                fn: |
                  return args.key === 'choose' ? !args.custom : false;
            filter.dates:
              _js:
                args:
                  key:
                    _event: key
                  dates:
                    _if_none:
                      - _state: filter.dates
                      - []
                fn: |
                  const day = (d) => d.toLocaleDateString('en-CA');
                  const today = new Date();
                  const ago = (n) => day(new Date(today.getTime() - n * 86400000));
                  const ranges = {
                    today: [day(today), day(today)],
                    week: [ago(6), day(today)],
                    month: [ago(29), day(today)],
                    year: [`${today.getFullYear()}-01-01`, day(today)],
                  };
                  if (args.key === 'choose') return args.dates;
                  const range = ranges[args.key];
                  const same =
                    args.dates.length === 2 && args.dates[0] === range[0] && args.dates[1] === range[1];
                  return same ? [] : range;
      - _ref: actions/update-list.yaml
