id: update-contact
type: Api
routine:
  # The stored profile, which the derivation needs: a payload that omits
  # `given_name` must still derive a name from the value already on the contact.
  # Queried on `_id` alone — the `apps.<slug>.is_user` clause belongs on the write,
  # where it decides whether the row is written at all.
  - id: read_contact
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: contacts-collection
    properties:
      query:
        _id:
          _payload: _id

  - id: update
    type: MongoDBUpdateOne
    connectionId:
      _module.connectionId: contacts-collection
    properties:
      filter:
        _object.assign:
          - _id:
              _payload: _id
          - _object.defineProperty:
              on: {}
              key:
                _string.concat:
                  - "apps."
                  - _build.app: slug
                  - ".is_user"
              descriptor:
                value:
                  $ne: true
      update:
        _build.array.concat:
          # Stage 1: Merge data objects. The merges are done in MQL rather than in
          # the routine because they are atomic per document — a routine-side merge
          # would let one form save revert a field another had just written. Every
          # payload-derived value is `$literal`-wrapped: in expression context a
          # string beginning with `$` reads as a field path, and `global_attributes`
          # is arbitrary consumer data.
          - - $set:
                # email and lowercase_email are NOT updated — email is immutable after creation
                profile:
                  $mergeObjects:
                    - $ifNull:
                        - "$$ROOT.profile"
                        - {}
                    - $literal:
                        _payload: profile
                global_attributes:
                  $mergeObjects:
                    - $ifNull:
                        - "$$ROOT.global_attributes"
                        - {}
                    - $literal:
                        _payload: global_attributes
                updated:
                  _ref:
                    module: events
                    component: change_stamp
          # Stage 2: the write-owned derived fields — `name`, `avatar_color` and
          # `picture` — from the one shared derivation, merged onto stage 1's bag.
          - - $set:
                profile:
                  $mergeObjects:
                    - "$profile"
                    - $literal:
                        _js:
                          fn:
                            _ref:
                              path: ../shared/profile/derive-profile.js.njk
                          args:
                            stored:
                              _step: read_contact.profile
                            incoming:
                              _payload: profile
                            palette:
                              _module.var: avatar_colors
          # Stage 3: an unnamed profile carries no picture, so the Avatar block's
          # person icon renders rather than initials that claim an identity.
          - - $set:
                profile.picture:
                  $cond:
                    if:
                      $eq:
                        - $ifNull:
                            - "$profile.name"
                            - null
                        - null
                    then: "$$REMOVE"
                    else: "$profile.picture"
          # Consumer pipeline stages
          - _module.var: request_stages.write

  - id: new-event
    type: CallApi
    properties:
      endpointId:
        _module.endpointId:
          id: new-event
          module: events
      payload:
        type: update-contact
        display:
          _build.object.fromEntries:
            _build.array.map:
              on:
                _build.array.filter:
                  on:
                    _build.object.entries:
                      _build.if_none:
                        - _module.var: event_display
                        - _build.object.fromEntries:
                            - - _build.app: slug
                              - _ref: defaults/event_display.yaml
                  callback:
                    _build.function:
                      __build.ne:
                        - __build.if_none:
                            - __build.args: 0.1.update-contact
                            - null
                        - null
              callback:
                _build.function:
                  - __build.args: "0.0"
                  - title:
                      _nunjucks:
                        template:
                          __build.args: 0.1.update-contact
                        on:
                          user:
                            _user: true
                          target:
                            name:
                              _string.trim:
                                _string.concat:
                                  - _string.trim:
                                      _if_none:
                                        - _payload: profile.given_name
                                        - ""
                                  - " "
                                  - _string.trim:
                                      _if_none:
                                        - _payload: profile.family_name
                                        - ""
                    description: null
        references:
          contact_ids:
            - _payload: _id
          company_ids:
            _if_none:
              - _payload: global_attributes.company_ids
              - []
        metadata:
          contact_id:
            _payload: _id

  - :return:
      success: true
