id: create-contact
type: Api
routine:
  - id: check-existing
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: contacts-collection
    properties:
      query:
        lowercase_email:
          _string.toLowerCase:
            _string.trim:
              _if_none:
                - _payload: email
                - ""

  - id: insert
    type: MongoDBUpdateOne
    skip:
      _ne:
        - _step: check-existing
        - null
    connectionId:
      _module.connectionId: contacts-collection
    properties:
      # A server-minted id, so the filter can never match an existing document and
      # this step can only ever insert. A payload's `_id` is not read: the guard
      # above matches on `lowercase_email`, so a known `_id` with a novel email would
      # otherwise walk past it and overwrite that contact. Callers read the
      # authoritative id off the response's `contactId`.
      filter:
        _id:
          _uuid: true
      options:
        upsert: true
      update:
        _build.array.concat:
          # Stage 1: Insert-only fields + merge data objects. Every payload-derived
          # value is `$literal`-wrapped — in expression context a string beginning
          # with `$` reads as a field path, and `$` is legal in an email local-part.
          - - $set:
                email:
                  $literal:
                    _payload: email
                lowercase_email:
                  $literal:
                    _string.toLowerCase:
                      _payload: email
                hidden: false
                disabled: false
                created:
                  _ref:
                    module: events
                    component: change_stamp
                profile:
                  $mergeObjects:
                    - $ifNull:
                        - "$$ROOT.profile"
                        - {}
                    - $literal:
                        _payload: profile
                global_attributes:
                  $mergeObjects:
                    - $ifNull:
                        - "$$ROOT.global_attributes"
                        - {}
                    - $literal:
                        _payload: global_attributes
                updated:
                  _ref:
                    module: events
                    component: change_stamp
          # Stage 2: the write-owned derived fields — `name`, `avatar_color` and
          # `picture` — from the one shared derivation, merged onto stage 1's bag.
          # `stored: {}` because this step is skipped whenever `check-existing`
          # matched, so it only runs for a genuinely new contact.
          - - $set:
                profile:
                  $mergeObjects:
                    - "$profile"
                    - $literal:
                        _js:
                          fn:
                            _ref:
                              path: ../shared/profile/derive-profile.js.njk
                          args:
                            stored: {}
                            incoming:
                              _payload: profile
                            palette:
                              _module.var: avatar_colors
          # Stage 3: an unnamed profile carries no picture, so the Avatar block's
          # person icon renders rather than initials that claim an identity.
          - - $set:
                profile.picture:
                  $cond:
                    if:
                      $eq:
                        - $ifNull:
                            - "$profile.name"
                            - null
                        - null
                    then: "$$REMOVE"
                    else: "$profile.picture"
          # Consumer pipeline stages
          - _module.var: request_stages.write

  - id: new-event
    type: CallApi
    skip:
      _ne:
        - _step: check-existing
        - null
    properties:
      endpointId:
        _module.endpointId:
          id: new-event
          module: events
      payload:
        type: create-contact
        display:
          _build.object.fromEntries:
            _build.array.map:
              on:
                _build.array.filter:
                  on:
                    _build.object.entries:
                      _build.if_none:
                        - _module.var: event_display
                        - _build.object.fromEntries:
                            - - _build.app: slug
                              - _ref: defaults/event_display.yaml
                  callback:
                    _build.function:
                      __build.ne:
                        - __build.if_none:
                            - __build.args: 0.1.create-contact
                            - null
                        - null
              callback:
                _build.function:
                  - __build.args: "0.0"
                  - title:
                      _nunjucks:
                        template:
                          __build.args: 0.1.create-contact
                        on:
                          user:
                            _user: true
                          target:
                            name:
                              _string.trim:
                                _string.concat:
                                  - _string.trim:
                                      _if_none:
                                        - _payload: profile.given_name
                                        - ""
                                  - " "
                                  - _string.trim:
                                      _if_none:
                                        - _payload: profile.family_name
                                        - ""
                    description: null
        references:
          contact_ids:
            - _step: insert.upsertedId
          company_ids:
            _if_none:
              - _payload: global_attributes.company_ids
              - []
        metadata:
          contact_id:
            _step: insert.upsertedId

  - :return:
      contactId:
        _if:
          test:
            _ne:
              - _step: check-existing
              - null
          then:
            _step: check-existing._id
          else:
            _if_none:
              - _step: insert.upsertedId
              - _step: insert.lastErrorObject.upserted
      existing:
        _ne:
          - _step: check-existing
          - null
