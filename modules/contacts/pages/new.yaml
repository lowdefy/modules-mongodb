_ref:
  module: layout
  component: page
  vars:
    id: new
    type:
      _string.concat:
        - "New "
        - _module.var: label
    content_width: 600
    breadcrumbs:
      - home: true
        icon: AiOutlineHome
      - label:
          _module.var: label_plural
        pageId:
          _module.pageId: all
      - label:
          _string.concat:
            - "New "
            - _module.var: label
    events:
      onInit:
        - id: init_state
          type: SetState
          params:
            # The company selector on this form reads _state.cycle_check_* via
            # get_companies_for_selector; initialise them so the build's _state
            # validation passes (this form never cycle-checks — plain picker).
            cycle_check_self_id: null
            cycle_check_ids: []
            global_attributes: {}
    blocks:
      - id: card
        type: Card
        layout:
          gap: 16
        blocks:
          - _ref: components/form_email.yaml
          - id: divider_profile
            type: Divider
            properties:
              title: Profile
          - _ref: components/form_profile.yaml
          - _ref: components/form_global_attributes.yaml
      - _ref:
          module: layout
          component: floating-actions
          vars:
            actions:
              - id: cancel_button
                type: Button
                layout:
                  flex: 0 1 auto
                properties:
                  title: Cancel
                  icon: AiOutlineCloseCircle
                  type: default
                events:
                  onClick:
                    - id: back
                      type: Link
                      params:
                        pageId:
                          _module.pageId: all
              - id: save_button
                type: Button
                layout:
                  flex: 0 1 auto
                properties:
                  title:
                    _string.concat:
                      - "Create "
                      - _module.var: label
                  icon: AiOutlineUserAdd
                  type: primary
                events:
                  onClick:
                    - id: validate
                      type: Validate
                    - id: create_contact
                      type: CallAPI
                      params:
                        endpointId:
                          _module.endpointId: create-contact
                        payload:
                          email:
                            _state: email
                          profile:
                            _state: profile
                          global_attributes:
                            _state: global_attributes
                      messages:
                        success:
                          _string.concat:
                            - _module.var: label
                            - " created."
                    - id: reset
                      type: Reset
                    - id: go_detail
                      type: Link
                      params:
                        pageId:
                          _module.pageId: view
                        urlQuery:
                          _id:
                            _actions: create_contact.response.response.contactId
