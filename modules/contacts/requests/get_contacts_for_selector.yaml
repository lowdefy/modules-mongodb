id: get_contacts_for_selector
type: MongoDBAggregation
connectionId:
  _module.connectionId: contacts-collection
properties:
  pipeline:
    _build.array.concat:
      - - $match:
            hidden:
              $ne: true
            disabled:
              $ne: true
      # Consumer stages (request_stages.selector, default []) run BEFORE the
      # label projection so they can filter/derive on raw document fields —
      # e.g. excluding contacts that are also app users from a picker. After
      # the projection only `label` and `value` survive, which is no use to a
      # consumer wanting to filter. Mirrors get_companies_for_selector.
      - _module.var: request_stages.selector
      - - $project:
            # $concat returns null if ANY operand is null or missing, which
            # rendered a blank, unselectable option for every contact without
            # a name or an email. Guarded the same way as
            # get_role_contacts_for_selector, falling back to lowercase_email.
            label:
              $concat:
                - $ifNull:
                    - "$profile.name"
                    - ""
                - " ("
                - $ifNull:
                    - "$email"
                    - $ifNull:
                        - "$lowercase_email"
                        - "no email"
                - ")"
            value: "$_id"
        - $sort:
            label: 1
