# Aggregation expression — true when the contact is NOT a user record of this
# app. Used by get_contacts_for_selector and get_role_contacts_for_selector
# when `exclude_users_from_selectors` is set.
#
# Deliberately NOT used by search_contacts: adding a nested `_ref` to that
# request — which is itself `_ref`'d with per-call vars from
# contact-selector.yaml.njk — silently breaks `_module.var` resolution
# elsewhere in the module, with no build error. See the changeset.
#
# This is a bare expression, not a `$match` clause, so callers can drop it into
# an `$expr` directly or fold it into an existing `$and`. It deliberately does
# not carry its own `_build.if` guard — each caller decides what the disabled
# case looks like (`{}` when merged into a `$match` object, `true` when used as
# an `$and` operand), which keeps the pipeline free of an always-true `$expr`
# for apps that leave the option off.
#
# `app_name` is build-time, so the field path resolves to a literal string
# before Mongo sees it. A runtime dot-notation key is not expressible as a
# `$match` key, which is why this is an expression rather than
# `apps.<app>.is_user: { $ne: true }` — the same reason
# get_role_contacts_for_selector matches roles through `$expr`.
#
# Missing flag means "not a user record", hence the `$ifNull` default of false.
$ne:
  - $ifNull:
      - _string.concat:
          - "$apps."
          - _module.var: app_name
          - ".is_user"
      - false
  - true
