# Role-filtered contact options for a simple Selector. Returns active contacts
# holding any of `roles` (matched against apps.<app_name>.roles), projecting a
# denormalized { contact_id, name, email } value so read-only views can render
# name + link (the workflows DataDescriptions `contact` field type detects it).
id: get_role_contacts_for_selector
type: MongoDBAggregation
connectionId:
  _module.connectionId: contacts-collection
properties:
  pipeline:
    _build.array.concat:
      - - $match:
            hidden:
              $ne: true
            disabled:
              $ne: true
            # app_name is build-time, so the field path resolves to a literal before
            # Mongo sees it; $setIntersection avoids a runtime dot-notation key.
            $expr:
              $and:
                - $gt:
                    - $size:
                        $setIntersection:
                          - $ifNull:
                              - _string.concat:
                                  - "$apps."
                                  - _module.var: app_name
                                  - ".roles"
                              - []
                          - _var: roles
                    - 0
                # Collapses to `true` when exclude_users_from_selectors is off,
                # leaving `$and: [<roles>]` — what the bare `$gt` compiled to
                # before. The roles check already needs `$expr`, and a `$match`
                # takes only one `$expr` key, so the two fold together here
                # rather than merging as separate clauses.
                - _build.if:
                    test:
                      _module.var: exclude_users_from_selectors
                    then:
                      _ref: requests/stages/expr_not_user_record.yaml
                    else: true
      # Consumer stages (request_stages.selector, default []) run BEFORE the
      # projection so they can filter/derive on raw document fields — after it
      # only `label` and `value` survive. Mirrors get_contacts_for_selector.
      - _module.var: request_stages.selector
      - - $project:
            _id: 0
            value:
              contact_id: "$_id"
              name: "$profile.name"
              email:
                $ifNull:
                  - "$email"
                  - "$lowercase_email"
            label:
              $concat:
                - $ifNull:
                    - "$profile.name"
                    - ""
                - " ("
                - $ifNull:
                    - "$email"
                    - $ifNull:
                        - "$lowercase_email"
                        - "no email"
                - ")"
        - $sort:
            label: 1
