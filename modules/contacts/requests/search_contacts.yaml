# Text-ranked contact search for the ContactSelector block.
# Layered pipeline:
#   1. Text lead — Atlas $search ranking when the module's `atlas_search` flag is
#      set and the input is non-empty; otherwise a no-op stage, and the regex
#      clause in stage 2 does the matching.
#   2. $match — structural filters plus the fallback text clause as a standard
#      Mongo query, so they apply in both search modes. Consumer-pluggable via
#      the `filter` var (plain $match expression, not Atlas compound syntax).
#   3. $limit + $project — cap and shape to the block's { label, value } contract.
# The Atlas index this expects is documented in docs/contacts/reference/indexes.md.
id:
  _var: id
type: MongoDBAggregation
connectionId:
  _module.connectionId: contacts-collection
payload:
  input:
    _var: input
properties:
  pipeline:
    _build.array.concat:
      - _ref:
          path: ../shared/search/text_lead.yaml
          vars:
            atlas_search:
              _module.var: atlas_search
            term:
              _payload: input
            paths:
              - profile.name
              - lowercase_email
      # $and rather than a shallow merge: the structural filters, the regex
      # clause's $or and the consumer `filter` can collide on a key.
      - - $match:
            $and:
              _array.concat:
                - - hidden:
                      $ne: true
                    disabled:
                      $ne: true
                  - _var:
                      key: filter
                      default: {}
                - _build.if:
                    test:
                      _var: company_only_contacts
                    then:
                      _if:
                        test:
                          _gt:
                            - _array.length:
                                _if_none:
                                  - _user: global_attributes.company_ids
                                  - []
                            - 0
                        then:
                          - global_attributes.company_ids:
                              $in:
                                _user: global_attributes.company_ids
                        else: []
                    else: []
                - _ref:
                    path: ../shared/search/regex_clause.yaml
                    vars:
                      atlas_search:
                        _module.var: atlas_search
                      term:
                        _payload: input
                      paths:
                        - profile.name
                        - lowercase_email
        - $limit: 10
        - $project:
            _id: 0
            value:
              contact_id: "$_id"
              name: "$profile.name"
              email:
                $ifNull:
                  - "$email"
                  - "$lowercase_email"
            label:
              $concat:
                - "<div>"
                - $ifNull:
                    - "$profile.name"
                    - ""
                - '</div><div class="secondary smaller">'
                - $ifNull:
                    - "$email"
                    - $ifNull:
                        - "$lowercase_email"
                        - "No email"
                - "</div>"
