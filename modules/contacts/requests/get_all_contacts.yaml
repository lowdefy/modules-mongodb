id: get_all_contacts
type: MongoDBAggregation
connectionId:
  _module.connectionId: contacts-collection
payload:
  pagination:
    _state: pagination
  filter:
    _state: filter
  sort:
    _state: sort
properties:
  pipeline:
    _build.array.concat:
      - _ref:
          path: ../shared/search/text_lead.yaml
          vars:
            atlas_search:
              _module.var: atlas_search
            term:
              _payload: filter.search
            paths:
              - profile.name
              - lowercase_email
      # $and rather than a shallow merge: the structural filters, the regex
      # clause's $or and the consumer filter_match clauses can collide on a key.
      - - $match:
            $and:
              _array.concat:
                - - hidden:
                      $ne: true
                    disabled:
                      $ne: true
                - _ref:
                    path: ../shared/search/regex_clause.yaml
                    vars:
                      atlas_search:
                        _module.var: atlas_search
                      term:
                        _payload: filter.search
                      paths:
                        - profile.name
                        - lowercase_email
                - _array.filter:
                    - _module.var: request_stages.filter_match
                    - _function:
                        __ne:
                          - __args: 0
                          - null
      - _ref:
          path: ../shared/search/score_stage.yaml
          vars:
            atlas_search:
              _module.var: atlas_search
            term:
              _payload: filter.search
      - - $facet:
            count:
              - $count: total
            results:
              _build.array.concat:
                - - _if:
                      test:
                        _ref:
                          path: ../shared/search/use_score.yaml
                          vars:
                            atlas_search:
                              _module.var: atlas_search
                            term:
                              _payload: filter.search
                      then:
                        $sort:
                          score: -1
                          updated.timestamp: -1
                      else:
                        $sort:
                          _object.assign:
                            - _object.defineProperty:
                                on: {}
                                key:
                                  _payload: sort.by
                                descriptor:
                                  value:
                                    _payload: sort.order
                            - _id: 1
                  - $skip:
                      _payload: pagination.skip
                  - $limit:
                      _payload: pagination.pageSize
                  - $addFields:
                      updated_at:
                        $dateToString:
                          date: $updated.timestamp
                          format: "%Y-%m-%d"
                      created_at:
                        $dateToString:
                          date: $created.timestamp
                          format: "%Y-%m-%d"
                - _module.var: request_stages.get_all_contacts
        - $unwind:
            path: $count
        - $unwind:
            path: $results
        - $addFields:
            results.total_results: $count.total
        - $replaceRoot:
            newRoot: $results
