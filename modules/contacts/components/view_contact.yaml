id: contact_details
type: Box
blocks:
  _build.array.concat:
    # Profile SmartDescriptions. Bound to the whole contact row (not just the
    # profile subdoc) so `email` resolves alongside the `profile.*` paths, matching
    # the sibling user-admin and user-account views. The name is not a field here —
    # it is the page title.
    - - id: profile_view
        type: SmartDescriptions
        properties:
          title: Profile
          column: 1
          size: small
          data:
            _request: get_contact.0
          fields:
            _build.array.concat:
              # No `type` — let SmartDescriptions auto-detect the email value and
              # render it as an email (a forced TextInput/string renderer
              # title-cases the first letter, which is wrong for an address).
              - - id: email
                  properties:
                    title: Email
              - _module.var: fields.profile
    # Attributes SmartDescriptions (only when fields are provided)
    - - id: attributes_view
        type: SmartDescriptions
        visible:
          _build.gt:
            - _build.array.length:
                _module.var: fields.global_attributes
            - 0
        properties:
          title: Attributes
          column: 1
          size: small
          data:
            global_attributes:
              _request: get_contact.0.global_attributes
          fields:
            _module.var: fields.global_attributes
