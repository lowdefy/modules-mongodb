# The auth engine's member rows, one per person per organisation, read to
# answer Pelican's users.lookup with only the app's own people. Read-only.
# Engine-owned rows carry no tenant stamp, so the read scopes its organisation
# itself (api/webhook.yaml).
id: support-members
type: MongoDBCollection
tenant: shared # engine-owned rows; the read scopes its organisation itself
properties:
  databaseUri:
    _secret: MONGODB_URI
  collection: user-members
  write: false
