# The page's header: what it is for, and the way to report a problem.
id: support_list_header
type: Box
layout:
  direction: row
  align: middle
  wrap: wrap
  justify: space-between
  gap: 12
blocks:
  - id: support_list_about
    type: Paragraph
    layout:
      flex: 1 1 280px
    class:
      .block: min-w-0
    style:
      marginBottom: 0
    properties:
      type: secondary
      content: Your reports and the replies from the team. Choose a report to read the conversation.
  - id: support_list_report
    type: Button
    layout:
      flex: 0 0 auto
    properties:
      title: Report a problem
      type: primary
    events:
      onClick:
        _ref: actions/open_page_report.yaml
