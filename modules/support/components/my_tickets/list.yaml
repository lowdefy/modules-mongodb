# The tickets, filtered by support_list_filter.*. A dot and a bold title mark a
# ticket with a team message the user has not read; a row opens its ticket page.
id: support_list_box
type: Box
layout:
  gap: 12
blocks:
  - id: support_list_notice
    type: Alert
    visible:
      _ne:
        - _state: support_list_tickets_error
        - null
    properties:
      type: warning
      showIcon: true
      message:
        _string.concat:
          - "Showing your saved tickets. "
          - _state: support_list_tickets_error
  - id: support_list_tickets
    type: ListSelector
    loading:
      _not:
        _state: support_list_loaded
    properties:
      selectable: false
      hoverable: true
      gap: 8
      noData:
        _if:
          test:
            _gt:
              - _array.length:
                  _state: support_list_tickets
              - 0
          then: No tickets match. Change the search or the filters.
          else: No tickets yet. Report a problem with the Help button and it shows here.
      data:
        _js:
          fn: |
            const filter = args.filter || {};
            const search = (filter.search || '').trim().toLowerCase();
            return (args.tickets || []).filter((ticket) => {
              if (filter.type && ticket.type !== filter.type) return false;
              if (filter.status === 'open' && ticket.stage === 'resolved') return false;
              if (filter.status && filter.status !== 'open' && ticket.stage !== filter.status) return false;
              if (!search) return true;
              return [ticket.title, ticket.key].some(
                (text) => (text || '').toLowerCase().includes(search),
              );
            });
          args:
            tickets:
              _state: support_list_tickets
            filter:
              _state: support_list_filter
      html: |
        <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
          <span style="flex: 0 0 8px;">{% if item.unread %}<span data-status="processing" data-tooltip="New reply from the team" aria-label="New reply from the team"></span>{% endif %}</span>
          <div style="flex: 1 1 0; min-width: 0;">
            <div data-truncate="1" style="font-weight: {% if item.unread %}700{% else %}500{% endif %};">{{ item.title }}</div>
            <div data-tone="secondary" style="display: flex; flex-wrap: wrap; gap: 2px 12px;">
              <span>{{ item.key }}</span>
              {% if item.type_label %}<span>{{ item.type_label }}</span>{% endif %}
              {% if item.show_organization and item.organization %}<span>{{ item.organization.name }}</span>{% endif %}
            </div>
          </div>
          <div style="flex: 0 0 auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
            {% if item.stage_label %}<span data-tag="{{ item.stage_tag }}">{{ item.stage_label }}</span>{% endif %}
            <time data-tone="secondary" datetime="{{ item.updated }}" data-time="relative"></time>
          </div>
        </div>
    events:
      onClick:
        - id: support_list_open_ticket
          type: Link
          params:
            pageId:
              _module.pageId: ticket
            pathParams:
              ticket_key:
                _event: item.key
