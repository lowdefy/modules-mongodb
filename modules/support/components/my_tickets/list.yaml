# The tickets as calm rows, filtered by support_list_filter.*: a state icon and
# its word, the title and when it last changed. A bold title marks a ticket that
# waits for the user's reply or has a team message they have not read; a row
# opens its ticket page. With nothing to list it says what to do instead.
id: support_list_box
type: Box
layout:
  gap: 12
blocks:
  - _ref:
      path: components/parts/sync_notice.yaml.njk
      vars:
        id: support_list_notice
        error_state: support_list_tickets_error
        retry:
          _ref:
            path: actions/open_tickets.yaml.njk
            vars:
              prefix: support_list
  - id: support_list_empty
    type: Box
    visible:
      _and:
        - _eq:
            - _state: support_list_loaded
            - true
        - _eq:
            - _array.length:
                _state: support_list_tickets
            - 0
    layout:
      gap: 12
    style:
      padding: 32px 0
    blocks:
      - id: support_list_empty_title
        type: Title
        style:
          marginBottom: 0
        properties:
          level: 4
          content: Tell us what went wrong
      - id: support_list_empty_text
        type: Paragraph
        style:
          marginBottom: 0
        properties:
          type: secondary
          content: Reports and the replies to them show here.
      - id: support_list_empty_report
        type: Button
        layout:
          flex: 0 0 auto
        properties:
          title: Report a problem
          type: primary
        events:
          onClick:
            _ref: actions/open_page_report.yaml
  - id: support_list_none_here
    type: Box
    visible:
      _and:
        - _gt:
            - _array.length:
                _state: support_list_tickets
            - 0
        - _eq:
            - _array.length:
                _state: support_list_rows
            - 0
    layout:
      direction: row
      align: middle
      wrap: wrap
      gap: 4
    blocks:
      - id: support_list_none_text
        type: Paragraph
        layout:
          flex: 0 0 auto
        style:
          marginBottom: 0
        properties:
          type: secondary
          content:
            _if:
              test:
                _eq:
                  - _state: support_list_filter.status
                  - open
              then: Nothing open.
              else: Nothing resolved yet.
      - id: support_list_show_other
        type: Button
        layout:
          flex: 0 0 auto
        visible:
          _eq:
            - _state: support_list_filter.status
            - open
        properties:
          title:
            _nunjucks:
              template: "Show resolved {{ n }}."
              on:
                n:
                  _state: support_list_counts.resolved
          type: link
          size: small
        events:
          onClick:
            - id: support_list_show_resolved
              type: SetState
              params:
                support_list_filter.status: resolved
  - id: support_list_tickets
    type: ListSelector
    loading:
      _not:
        _state: support_list_loaded
    properties:
      selectable: false
      hoverable: true
      size: small
      gap: 4
      theme:
        bodyPaddingSM: 10
        borderRadiusLG: 8
      noData: ""
      data:
        _state: support_list_rows
      html: |
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; cursor: pointer;">
          <div style="flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 12px;">
            <span style="flex: none; display: inline-flex;{% if item.stage_color %} color: {{ item.stage_color }};{% else %} opacity: 0.6;{% endif %}">{% if item.stage_icon %}<i data-icon="{{ item.stage_icon }}"></i>{% endif %}</span>
            <div data-truncate="1" style="flex: 1 1 0; min-width: 0; font-weight: {% if item.unread or item.stage == 'needs_your_reply' %}700{% else %}400{% endif %};">{{ item.title }}</div>
          </div>
          <div style="flex: none; margin-left: auto; padding-left: 28px; display: flex; align-items: center; gap: 12px;">
            {% if item.show_organization and item.organization %}<span data-tone="secondary" data-truncate="1" style="max-width: 120px;">{{ item.organization.name }}</span>{% endif %}
            <span data-tone="secondary" style="white-space: nowrap;">{{ item.stage_label }}</span>
            <time data-tone="secondary" datetime="{{ item.updated }}" data-time="relative" style="min-width: 96px; text-align: right; white-space: nowrap;"></time>
          </div>
        </div>
    events:
      onClick:
        - id: support_list_open_ticket
          type: Link
          params:
            pageId:
              _module.pageId: ticket
            pathParams:
              ticket_key:
                _event: item.key
