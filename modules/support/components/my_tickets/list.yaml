# The tickets as dense rows, filtered by support_list_filter.*. A dot and a bold
# title mark a ticket with a team message the user has not read; a row opens its
# ticket page.
id: support_list_box
type: Box
layout:
  gap: 12
blocks:
  - id: support_list_notice
    type: Alert
    visible:
      _ne:
        - _state: support_list_tickets_error
        - null
    properties:
      type: warning
      showIcon: true
      message:
        _string.concat:
          - "Showing your saved tickets. "
          - _state: support_list_tickets_error
  - id: support_list_tickets
    type: ListSelector
    loading:
      _not:
        _state: support_list_loaded
    properties:
      selectable: false
      hoverable: true
      size: small
      gap: 4
      theme:
        bodyPaddingSM: 10
        borderRadiusLG: 8
      noData:
        _js:
          fn: |
            if (!args.total) {
              return args.help_button
                ? 'No tickets yet. Report a problem with the Help button and it shows here.'
                : 'No tickets yet.';
            }
            if (args.status === 'open' && !args.search && !args.type) return 'No open tickets. Choose All to see resolved ones.';
            return 'No tickets match. Change the search or the filters.';
          args:
            # An app with the help button off (launcher.show: false) has its
            # own way in, so the empty list does not point at the button.
            help_button:
              _module.var: launcher.show
            total:
              _array.length:
                _state: support_list_tickets
            status:
              _state: support_list_filter.status
            search:
              _state: support_list_filter.search
            type:
              _state: support_list_filter.type
      data:
        _js:
          fn: |
            const filter = args.filter || {};
            const search = (filter.search || '').trim().toLowerCase();
            return (args.tickets || []).filter((ticket) => {
              if (filter.type && ticket.type !== filter.type) return false;
              if (filter.status === 'open' && ticket.stage === 'resolved') return false;
              if (filter.status === 'resolved' && ticket.stage !== 'resolved') return false;
              if (!search) return true;
              return [ticket.title, ticket.key].some(
                (text) => (text || '').toLowerCase().includes(search),
              );
            });
          args:
            tickets:
              _state: support_list_tickets
            filter:
              _state: support_list_filter
      html: |
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; cursor: pointer;">
          <div style="flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <span style="flex: 0 0 8px;">{% if item.unread %}<span data-status="processing" data-tooltip="New reply from the team" aria-label="New reply from the team"></span>{% endif %}</span>
            <span data-tone="secondary" style="flex: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;">{{ item.key }}</span>
            <div data-truncate="1" style="flex: 1 1 0; min-width: 0; font-weight: {% if item.unread %}700{% else %}500{% endif %};">{{ item.title }}</div>
          </div>
          <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding-left: 18px;">
            {% if item.show_organization and item.organization %}<span data-tone="secondary">{{ item.organization.name }}</span>{% endif %}
            <span data-tone="secondary" data-truncate="1" style="flex: 0 0 72px;">{{ item.type_label }}</span>
            <span style="flex: 0 0 100px;">{% if item.stage_label %}<span data-tag="{{ item.stage_tag }}">{{ item.stage_label }}</span>{% endif %}</span>
            <time data-tone="secondary" datetime="{{ item.updated }}" data-time="relative" style="flex: 0 0 104px; text-align: right; white-space: nowrap;"></time>
          </div>
        </div>
    events:
      onClick:
        - id: support_list_open_ticket
          type: Link
          params:
            pageId:
              _module.pageId: ticket
            pathParams:
              ticket_key:
                _event: item.key
