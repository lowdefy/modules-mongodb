# The ticket page's header: the title, and under it one line: the stage with its
# icon, the type, when the ticket was opened and its key. Shown once the ticket
# has loaded.
id: support_page_thread_header
type: Box
visible:
  _ne:
    - _state: support_page_thread
    - null
layout:
  gap: 4
blocks:
  - id: support_page_thread_title
    type: Title
    style:
      marginBottom: 0
    properties:
      level: 3
      content:
        _state: support_page_thread.view.title
  - id: support_page_thread_meta
    type: Html
    properties:
      html:
        _nunjucks:
          template: |
            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px;">
              {% if stage %}<span style="display: inline-flex; align-items: center; gap: 6px;{% if stage.color %} color: {{ stage.color }};{% endif %}"><i data-icon="{{ stage.icon }}"></i><span{% if not stage.color %} data-tone="secondary"{% endif %}>{{ stage.label }}</span></span>{% endif %}
              {% if type_label %}<span data-tone="secondary">{{ type_label }}</span>{% endif %}
              {% if created %}<span data-tone="secondary">Opened {{ created | date('D MMM') }}</span>{% endif %}
              {% if organization %}<span data-tone="secondary">{{ organization }}</span>{% endif %}
              <span data-tone="secondary">{{ key }}</span>
            </div>
          on:
            key:
              _state: support_page_thread.view.key
            created:
              _state: support_page_thread.view.created
            organization:
              _state: support_page_thread.organization.name
            stage:
              _get:
                from:
                  _ref: enums/stages.yaml
                key:
                  _if_none:
                    - _state: support_page_thread.view.stage
                    - none
            type_label:
              _js:
                fn: |
                  const type = args.type;
                  const known = (args.types || []).find((entry) => entry.value === type);
                  return known ? known.label : (type || null);
                args:
                  type:
                    _state: support_page_thread.view.type
                  types:
                    _module.var: types
