# The ticket page's header: the title, and under it the key, type and stage with
# when the ticket was opened and last changed. Shown once the ticket has loaded.
id: support_page_thread_header
type: Box
visible:
  _ne:
    - _state: support_page_thread
    - null
layout:
  gap: 8
blocks:
  - id: support_page_thread_title
    type: Title
    style:
      marginBottom: 0
    properties:
      level: 3
      content:
        _state: support_page_thread.view.title
  - id: support_page_thread_meta
    type: Html
    properties:
      html:
        _nunjucks:
          template: |
            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;">
              <strong>{{ key }}</strong>
              {% if stage %}<span data-tag="{{ stage.tag }}">{{ stage.label }}</span>{% endif %}
              {% if type_label %}<span data-tag="default">{{ type_label }}</span>{% endif %}
              {% if organization %}<span data-tone="secondary">{{ organization }}</span>{% endif %}
            </div>
            <div data-tone="secondary" style="margin-top: 4px;">
              {% if created %}Opened {{ created | date('D MMM YYYY, HH:mm') }}{% endif %}
              {%- if updated %}, last activity <time datetime="{{ updated }}" data-time="relative"></time>{% endif %}
            </div>
          on:
            key:
              _state: support_page_thread.view.key
            created:
              _state: support_page_thread.view.created
            updated:
              _state: support_page_thread.view.updated
            organization:
              _state: support_page_thread.organization.name
            stage:
              _get:
                from:
                  _ref: enums/stages.yaml
                key:
                  _if_none:
                    - _state: support_page_thread.view.stage
                    - none
            type_label:
              _js:
                fn: |
                  const type = args.type;
                  const known = (args.types || []).find((entry) => entry.value === type);
                  return known ? known.label : (type || null);
                args:
                  type:
                    _state: support_page_thread.view.type
                  types:
                    _module.var: types
