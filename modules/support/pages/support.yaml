# My tickets: every ticket the user has, open and resolved, newest activity
# first, with a search box and filters. A row opens the ticket page (ticket.yaml).
# Report a problem, in the title row, opens the page's own drawer with the
# report form, so a person can report a problem from here whether or not the
# app has a help button or an assistant.
_ref:
  module: layout
  component: page
  vars:
    id: support
    title: My tickets
    content_width: 960
    breadcrumbs:
      - label: Support
      - label: My tickets
    page_actions:
      - id: support_list_report
        type: Button
        properties:
          title: Report a problem
          type: primary
        events:
          onClick:
            _ref: actions/open_page_report.yaml
    requests:
      - _ref:
          path: requests/upload_policy.yaml
          vars:
            block_id: support_page_report_files
    events:
      onInit:
        - id: support_list_init
          type: SetState
          params:
            support_list_tickets: []
            support_list_tickets_error: null
            support_list_loaded: false
            support_list_filter.search: null
            support_list_filter.status: open
            support_list_filter.type: null
            support_page_report.type: null
            support_page_report.title: null
            support_page_report.message: null
            support_page_report.files: []
            support_page_report_extra: null
            support_page_report_error: null
            support_page_report_open: false
            support_page_report_sending: false
      onMount:
        _build.array.concat:
          # The ticket page may have left its live thread open.
          - _ref:
              path: actions/leave_live_thread.yaml.njk
              vars:
                prefix: support_page
          - _ref:
              path: actions/open_tickets.yaml.njk
              vars:
                prefix: support_list
          - - id: support_list_loaded_set
              type: SetState
              params:
                support_list_loaded: true
    blocks:
      - id: support_list_column
        type: Box
        layout:
          gap: 16
        blocks:
          - _ref: components/my_tickets/filters.yaml
          - _ref: components/my_tickets/list.yaml
      - _ref:
          path: components/report/report_drawer.yaml.njk
          vars:
            prefix: support_page_report
            secondary:
              _module.var: report_secondary
