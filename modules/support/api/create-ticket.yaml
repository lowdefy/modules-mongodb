id: create-ticket
type: Api
description: >-
  Files a ticket for the session user from the report form: { type, title,
  message, context, files: [{ key, name }] }. Files are keys the user uploaded
  through the module's upload policy. Answers { ok, ticket } or { ok: false,
  error } and never retries on its own: a repeat after a lost answer files a
  second ticket.
payloadSchema:
  type: object
  properties:
    context:
      type: object
    files:
      type: array
routine:
  - _ref: api/parts/require-user.yaml
  - _ref:
      path: api/parts/check-input.yaml
      vars:
        ticket: true
  - :if:
      _ne:
        - _state: input_error
        - null
    :then:
      - :return:
          ok: false
          error:
            _state: input_error
  - _ref: api/parts/organization.yaml
  - id: send_ticket
    type: CallApi
    properties:
      endpointId:
        _module.endpointId: send-ticket
      payload:
        type:
          _payload: type
        title:
          _payload: title
        message:
          _payload: message
        context:
          _if_none:
            - _payload: context
            - {}
        files:
          _if_none:
            - _payload: files
            - []
        organization:
          _state: organization
  - :return:
      _step: send_ticket
