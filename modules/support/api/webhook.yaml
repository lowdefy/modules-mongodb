id: webhook
type: Api
description: >-
  Pelican's webhook: every change to one of the app's tickets. The verify gate
  checks the delivery was signed with SUPPORT_WEBHOOK_SECRET in the last five
  minutes, else Lowdefy answers 401. A ticket event writes the reporter view
  into the copy of the user the body names, creating the row for a ticket the
  team logged, and a new team message sends that user a support-reply
  notification. A test delivery answers 200 and writes nothing. A release.*
  event goes to the endpoint the release_notes_endpoint var names, whose answer
  is the webhook's, or answers 404 when the var is null. A users.lookup event
  answers the email and name of the app's members among its user_ids when the
  user_lookup var is on, else 404. Any other event answers 404. The app lists
  support/webhook in auth.api.public.
webhook:
  verify:
    type: SupportWebhookVerify
    connectionId:
      _module.connectionId: support_webhook
    properties:
      rawBody:
        _payload: rawBody
      timestamp:
        _payload: headers.pelican-timestamp
      signature:
        _payload: headers.pelican-signature
routine:
  - :set_state:
      delivery:
        _payload: body
  - :if:
      _eq:
        - _state: delivery.event
        - test
    :then:
      - :return:
          ok: true
  - :if:
      _js: |
        const delivery = state('delivery');
        return Boolean(delivery) && typeof delivery.event === 'string' && delivery.event.startsWith('release.');
    :then:
      _build.if:
        test:
          _build.eq:
            - _module.var: release_notes_endpoint
            - null
        then:
          - :reject: This app does not take release notes
            :status: 404
        else:
          - id: release_notes
            type: CallApi
            properties:
              endpointId:
                _module.var: release_notes_endpoint
              payload:
                delivery:
                  _state: delivery
                app_version:
                  _module.var: app_version
          - :return:
              _step: release_notes
  - :if:
      _eq:
        - _state: delivery.event
        - users.lookup
    :then:
      _build.if:
        test:
          _build.eq:
            - _module.var: user_lookup
            - true
        then:
          - :if:
              _js: |
                const ids = state('delivery').user_ids;
                if (!Array.isArray(ids) || ids.length === 0 || ids.length > 200) return true;
                return !ids.every((id) => typeof id === 'string' && id !== '');
            :then:
              - :reject: A users.lookup names 1 to 200 user ids.
                :status: 422
          # Only ids with a member row in this app are answered: users holds
          # everyone on the auth database, which can span organisations and apps.
          - id: looked_up_users
            type: MongoDBAggregation
            connectionId:
              _module.connectionId: support-members
            properties:
              pipeline:
                - $match:
                    _build.if:
                      test:
                        _build.eq:
                          - _build.authConfig: organizations.policy
                          - tenant
                      then:
                        user_id:
                          $in:
                            _state: delivery.user_ids
                      else:
                        user_id:
                          $in:
                            _state: delivery.user_ids
                        organization_id:
                          _organization: id
                - $group:
                    _id: $user_id
                - $lookup:
                    from: users
                    localField: _id
                    foreignField: _id
                    as: user
                    pipeline:
                      - $project:
                          name: 1
                          email: 1
                - $unwind: $user
                - $project:
                    _id: 0
                    id: $_id
                    # $toLower turns a missing email into "", so test the type.
                    email:
                      $cond:
                        - $and:
                            - $eq:
                                - $type: $user.email
                                - string
                            - $ne:
                                - $user.email
                                - ""
                        - $toLower: $user.email
                        - null
                    name:
                      $ifNull:
                        - $user.name
                        - null
          - :return:
              users:
                _step: looked_up_users
        else:
          - :reject: This app does not share user details
            :status: 404
  - :set_state:
      ticket_events:
        - ticket.created
        - ticket.message
        - ticket.message_deleted
        - ticket.stage
        - ticket.updated
  - :if:
      _js: |
        const delivery = state('delivery');
        if (!delivery || typeof delivery !== 'object') return true;
        return !state('ticket_events').includes(delivery.event);
    :then:
      - :reject: Unknown event
        :status: 404
  - :if:
      _js: |
        const delivery = state('delivery');
        if (typeof delivery.user_id !== 'string' || delivery.user_id === '') return true;
        const ticket = delivery.ticket;
        if (!ticket || typeof ticket !== 'object') return true;
        if (typeof ticket.id !== 'string' || ticket.id === '') return true;
        return typeof ticket.version !== 'number';
    :then:
      - :reject: >-
          A support webhook names an event, the user_id the ticket belongs to,
          and the ticket's reporter view with its id and version.
  # No session here: the user filter comes from the verified body.
  - id: stored_row
    type: MongoDBFindOne
    connectionId:
      _module.connectionId: support-tickets
    properties:
      query:
        _id:
          _state: delivery.ticket.id
        user_id:
          _state: delivery.user_id
  - :set_state:
      stored_row:
        _step: stored_row
  - :if:
      _gte:
        - _if_none:
            - _state: stored_row.view.version
            - 0
        - _state: delivery.ticket.version
    :then:
      - :return:
          ok: true
  - _ref:
      path: api/parts/write-view.yaml
      vars:
        view:
          _state: delivery.ticket
        user_id:
          _state: delivery.user_id
        organization: null
  - :if:
      _eq:
        - _state: delivery.event
        - ticket.message
    :then:
      - _ref: api/parts/notify-reply.yaml
  - :return:
      ok: true
