id: new-event
type: Api
routine:
  - id: insert-event
    type: MongoDBInsertOne
    connectionId:
      _module.connectionId: events-collection
    properties:
      doc:
        _object.assign:
          - _payload: display
          - _payload: references
          - _id:
              _if_none:
                - _payload: _id
                - _uuid: true
            date:
              _date: now
            created:
              # Optional actor override: a caller may pass `payload.actor`
              # ({name, id}) when the session cannot stamp itself correctly —
              # the onboarding save creates the caller's name, so the session
              # it would stamp from doesn't hold one yet (T1). Absent payloads
              # keep the plain template.
              _object.assign:
                - _ref: defaults/change_stamp.yaml
                - _if:
                    test:
                      _ne:
                        - _if_none:
                            - _payload: actor
                            - null
                        - null
                    then:
                      user:
                        _payload: actor
                    else: {}
            type:
              _payload: type
            metadata:
              _payload: metadata
            files:
              _payload: files
  - :return:
      eventId:
        _step: insert-event.insertedId
