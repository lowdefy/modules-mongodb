id: get_activities
type: MongoDBAggregation
connectionId:
  _module.connectionId: activities-collection
payload:
  pagination:
    _state: pagination
  filter:
    _state: filter
  sort:
    _state: sort
properties:
  pipeline:
    _build.array.concat:
      - _ref:
          path: ../shared/search/text_lead.yaml
          vars:
            atlas_search:
              _module.var: atlas_search
            term:
              _payload: filter.search
            # The list is refetched immediately after a write, and mongot's
            # stored copy lags index replication — reading it would show the
            # pre-write document.
            returnStoredSource: false
            paths:
              - title
              # `description` is Tiptap rich text stored as `{ html, text }`;
              # search the plain-text subpath, not the html markup.
              - description.text
      # $and rather than a shallow merge: the structural filters, the regex
      # clause's $or and the consumer filter_match clauses can collide on a
      # key — both date bounds address `updated.timestamp`, and merging would
      # drop one of them.
      - - $match:
            $and:
              _array.concat:
                - - deleted.timestamp:
                      $exists: false
                - _if:
                    test:
                      _ne:
                        - _payload: filter.type
                        - null
                    then:
                      - type:
                          _payload: filter.type
                    else: []
                - _if:
                    test:
                      _ne:
                        - _payload: filter.stage
                        - null
                    then:
                      # `status` is the stage history, so the unpositioned path
                      # matches an activity that reached the stage at any point;
                      # `status.0.stage` would narrow it to the current stage.
                      - status.stage:
                          _payload: filter.stage
                    else: []
                - _if:
                    test:
                      _ne:
                        - _payload: filter.contact_id
                        - null
                    then:
                      - contacts.contact_id:
                          _payload: filter.contact_id
                    else: []
                - _if:
                    test:
                      _ne:
                        - _payload: filter.company_id
                        - null
                    then:
                      - company_ids:
                          _payload: filter.company_id
                    else: []
                - _if:
                    test:
                      _ne:
                        - _payload: filter.date_from
                        - null
                    then:
                      - updated.timestamp:
                          $gte:
                            _date:
                              _if_none:
                                - _payload: filter.date_from
                                - 0
                    else: []
                - _if:
                    test:
                      _ne:
                        - _payload: filter.date_to
                        - null
                    then:
                      - updated.timestamp:
                          $lte:
                            _date:
                              _if_none:
                                - _payload: filter.date_to
                                - 0
                    else: []
                - _ref:
                    path: ../shared/search/regex_clause.yaml
                    vars:
                      atlas_search:
                        _module.var: atlas_search
                      term:
                        _payload: filter.search
                      paths:
                        - title
                        - description.text
                - _array.filter:
                    - _module.var: request_stages.filter_match
                    - _function:
                        __ne:
                          - __args: 0
                          - null
      - _ref:
          path: ../shared/search/score_stage.yaml
          vars:
            atlas_search:
              _module.var: atlas_search
            term:
              _payload: filter.search
      - - $facet:
            count:
              - $count: total
            results:
              _build.array.concat:
                - - _if:
                      test:
                        _ref:
                          path: ../shared/search/use_score.yaml
                          vars:
                            atlas_search:
                              _module.var: atlas_search
                            term:
                              _payload: filter.search
                      then:
                        $sort:
                          score: -1
                          updated.timestamp: -1
                      else:
                        $sort:
                          _object.assign:
                            - _object.defineProperty:
                                on: {}
                                key:
                                  _payload: sort.by
                                descriptor:
                                  value:
                                    _payload: sort.order
                            - _id: 1
                  - $skip:
                      _payload: pagination.skip
                  - $limit:
                      _payload: pagination.pageSize
                  - _ref: requests/stages/add_derived_fields.yaml
                  - _ref: requests/stages/lookup_contacts.yaml
                  - _ref: requests/stages/lookup_companies.yaml
                - _module.var: request_stages.get_all_activities
        - $unwind:
            path: $count
        - $unwind:
            path: $results
        - $addFields:
            results.total_results: $count.total
        - $replaceRoot:
            newRoot: $results
