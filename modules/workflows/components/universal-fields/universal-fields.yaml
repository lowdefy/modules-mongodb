# Universal-fields EDIT surface (Part 24; Part 64 shrank it to two fields;
# Part 67 removed the display group).
#
# Renders the action-level universal-fields EDIT inputs (assignees / due_date)
# for one action. The surface is always a plain Box (no card chrome): its
# container owns the chrome. Every consumer gets the same standalone Update
# button that calls the per-workflow `{workflow_type}-update-fields` operation —
# independent of any form submit or FSM transition. (Part 64 removed the
# editable `description` field; the action body `description` is now
# author-authored config, rendered separately by
# `components/action-description.yaml`.)
#
# Placement (Part 56 addendum DA1): the EDIT inputs are hosted inside
# `universal-fields-modal.yaml` (opened by the title-bar ✎ chip). Read-only
# display of assignees + due now lives entirely in the title-bar chips
# (`universal-fields-chips.yaml`) on every surface — including the in-context
# check-action surface — so the former `mode: display` group was removed
# (Part 67), and with it the `mode` var: this component now only renders edit
# inputs.
#
# Consumed via `_ref: { path: ..., vars: {...} }` with OPERATOR-valued vars, so
# block-id namespacing uses `_string.concat` (not njk). Vars:
#   - state_path   state namespace for the edit inputs (default `fields`). Block
#                  ids become `{state_path}.{field}`; the Update Validate is
#                  scoped to `^{state_path}\.`.
#   - workflow_type literal (form njk) or `_state` operator (check) — builds the
#                  Update endpoint id at runtime.
#   - action_id    operator leaf the Update payload posts (action root differs
#                  per consumer, so the consumer passes it).
#   - allowed_edit operator leaf — gates the Update button (visible) and the
#                  inline inputs (disabled). Defaults false.
#   - show         presence list of field names to render (default both). Accepts
#                  a build-time literal array (form pages) OR a runtime operator
#                  (check surfaces — see universal-fields-chips.yaml for why the
#                  check surfaces cannot resolve this at build time), so gating is
#                  runtime `visible` for both. A hidden input is state-pruned,
#                  which is the behaviour we want: planFieldsUpdate treats an
#                  absent key as "leave unchanged", so an undeclared field is
#                  never written or cleared by an Update.
#   - show_update_button  build-time flag — render the in-body Update button
#                  (default true). The edit modal sets false and drives the
#                  Update from its native footer Ok instead (Part 56 addendum).
#   - on_complete  actions appended after the Update CallAPI (default []).
id: universal_fields
type: Box
# Render nothing when the presence list is empty or not yet loaded. The form
# templates additionally omit the whole ref at build time when the list is empty
# (task 11), so on form pages this is belt-and-braces; on the check surfaces it is
# the only gate.
visible:
  _gt:
    - _array.length:
        _if_none:
          - _var:
              key: show
              default: [assignees, due_date]
          - []
    - 0
layout:
  gap: 16
blocks:
  # ── Edit inputs + standalone Update button ────────────────────────────────
  - id: universal_fields_edit_group
    type: Box
    layout:
      gap: 16
    blocks:
      _build.array.concat:
        # assignees → user-multi-selector (cross-module, Part 24a).
        # Wrapped in a gated Box because the cross-module component exposes no
        # `visible` var — a local wrapper beats widening a shared API for one
        # caller. Block ids are state paths regardless of nesting, so the wrapper
        # does not move where the selector reads/writes. Bonus: while hidden the
        # selector never mounts, so its user-fetch request never fires.
        - - id: universal_fields_assignees_field
            type: Box
            visible:
              _array.includes:
                - _if_none:
                    - _var:
                        key: show
                        default: [assignees, due_date]
                    - []
                - assignees
            blocks:
              - _ref:
                  module: user-account
                  component: user-multi-selector
                  vars:
                    id:
                      _string.concat:
                        - _var: state_path
                        - .assignees
                    title: Assignees
        # due_date → DateSelector
        - - id:
              _string.concat:
                - _var: state_path
                - .due_date
            type: DateSelector
            visible:
              _array.includes:
                - _if_none:
                    - _var:
                        key: show
                        default: [assignees, due_date]
                    - []
                - due_date
            properties:
              title: Due date
              disabled:
                _eq:
                  - _var:
                      key: allowed_edit
                      default: false
                  - false
        # Update button — rendered only when the consumer hosts the action in the
        # body (show_update_button: true). The edit MODAL passes false and runs
        # the SAME sequence from its native footer Ok instead. The action
        # sequence is the shared update_fields_actions.yaml fragment (one
        # correct way).
        - _build.if:
            test:
              _var:
                key: show_update_button
                default: true
            then:
              - id: button_update_fields
                type: Button
                properties:
                  title: Update
                  type: primary
                visible:
                  _eq:
                    - _var:
                        key: allowed_edit
                        default: false
                    - true
                events:
                  onClick:
                    _ref:
                      path: components/universal-fields/update_fields_actions.yaml
                      vars:
                        state_path:
                          _var: state_path
                        workflow_type:
                          _var: workflow_type
                        action_id:
                          _var: action_id
                        on_complete:
                          _var:
                            key: on_complete
                            default: []
            else: []
