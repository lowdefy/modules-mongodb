vars:
  key:
    type: string
    required: true
  title:
    type: string
    required: false
  visible:
    type: boolean
    default: true
  required:
    type: boolean
    default: false
  options:
    type: array
    default: []
  # Alternative options source: an enum map (slug -> { title, color, icon }).
  # Ignored when `options` is supplied.
  enum:
    type: object
    default: {}
  extra:
    type: string
    required: false
  label_disabled:
    type: boolean
    default: false
  on_change:
    type: array
    default: []

config:
  id:
    _var: key
  type: RadioSelector
  visible:
    _var:
      key: visible
      default: true
  required:
    _var:
      key: required
      default: false
  properties:
    title:
      _var: title
    label:
      align: right
      colon: false
      extra:
        _var: extra
      disabled:
        _var:
          key: label_disabled
          default: false
    # `options` wins when supplied; otherwise the enum map is converted.
    options:
      _var:
        key: options
        default:
          _ref:
            path: components/fields/helpers/enum_options.yaml
            key: config
            vars:
              enum:
                _var:
                  key: enum
                  default: {}
  events:
    onChange:
      _var:
        key: on_change
        default: []
