vars:
  key:
    type: string
    required: true
  title:
    type: string
    required: false
  visible:
    type: boolean
    default: true
  required:
    type: boolean
    default: false
  label_span:
    type: number
    default: 0
  hideAddButton:
    type: boolean
    default: false
  hideRemoveButton:
    type: boolean
    default: false
  minItems:
    type: number
    default: 0
  blocks:
    type: array
    default: []

config:
  id:
    _string.concat:
      - _var: key
      - _label
  type: Label
  visible:
    _var:
      key: visible
      default: true
  layout:
    span:
      _subtract:
        - 24
        - _var:
            key: label_span
            default: 0
    push:
      _var:
        key: label_span
        default: 0
  validate:
    _build.if:
      test:
        _build.eq:
          - _var:
              key: required
              default: false
          - true
      then:
        - message: This field is required.
          status: error
          pass:
            _gt:
              - _array.length:
                  _state:
                    _var: key
              - 0
      else: []
  properties:
    disabled: true
  blocks:
    # The core ControlledList renders `properties.title` as plain text
    # (antd Typography.Text), so markup is escaped. To allow HTML in the
    # list title, render it through an Html block (DOMPurify-sanitised) above
    # the list instead, and leave the block's own `title` unset. Only emitted
    # when `title` is set; the bold weight mirrors the antd header look.
    _build.array.concat:
      - _build.if:
          test:
            _build.ne:
              - _var:
                  key: title
                  default: null
              - null
          then:
            - id:
                _string.concat:
                  - _var: key
                  - _title
              type: Html
              visible:
                _var:
                  key: visible
                  default: true
              style:
                fontWeight: 600
                marginBottom: 8
              properties:
                html:
                  _var: title
          else: []
      - - id:
            _var: key
          type: ControlledList
          layout:
            gap: 8
          visible:
            _var:
              key: visible
              default: true
          properties:
            hideAddButton:
              _var:
                key: hideAddButton
                default: false
            hideRemoveButton:
              _var:
                key: hideRemoveButton
                default: false
            minItems:
              _var:
                key: minItems
                default: 0
          blocks:
            _var:
              key: blocks
              default: []
