vars:
  key:
    type: string
    required: true
  title:
    type: string
    required: false
  visible:
    type: boolean
    default: true
  fileList:
    type: array
    required: true
  label_disabled:
    type: boolean
    default: true
  download_endpoint_id:
    type: string
    default: download-form-file
  download_payload:
    type: object
    default:
      workflow_id: action.workflow_id

config:
  id:
    _string.concat:
      - _var: key
      - _download_label
  type: Label
  visible:
    _var:
      key: visible
      default: true
  properties:
    title:
      _var: title
    span: 8
    style:
      marginTop: 6px
    disabled:
      _var:
        key: label_disabled
        default: true
  blocks:
    - id:
        _var: key
      type: FileDownload
      properties:
        # Unset, form files sign through this module's download-form-file for
        # the page's workflow, which checks the key is in a form slot the
        # caller may view.
        downloadEndpointId:
          _var:
            key: download_endpoint_id
            default:
              _module.endpointId: download-form-file
        downloadPayload:
          _var:
            key: download_payload
            default:
              workflow_id:
                _state: action.workflow_id
        fileList:
          _var: fileList
