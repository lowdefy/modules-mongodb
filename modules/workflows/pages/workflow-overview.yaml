# Workflow overview page (part 17).
#
# Addressed by ?workflow_id=<id>. Single CallApi to get-workflow-overview
# (part 19), then renders the workflow header + action cards. The workflow
# title, entity back-link, and per-action form metadata all ride the API
# response (part 46) — this page reads no module config vars.
_ref:
  module: layout
  component: page
  vars:
    id: workflow-overview
    content_width: 1100
    title:
      _state: workflow.title
    # No back_link → the title-block falls back to browser-history back.
    show_back_button: true
    # Breadcrumb trail: Home / [entity list] / entity / workflow (terminal).
    breadcrumbs:
      _ref:
        path: components/overview-breadcrumbs.yaml
        vars:
          tail:
            - label:
                _state: workflow.title
    # Eyebrow names the entity this workflow hangs off ("Company: Acme Corp");
    # the subtitle underneath adds its id, linked to the record.
    type:
      _ref: components/overview-entity-eyebrow.yaml
    description:
      _ref: components/overview-entity-subtitle.yaml
    status:
      _state: workflow.status.0.stage
    status_enum:
      _ref: components/workflow_lifecycle_stages.yaml
    loading:
      _not:
        _state: workflow
    # Expand/collapse-all lives in the title bar's right-hand actions slot: it is
    # a page-scoped control (it rewrites the whole collapse_map in one SetState),
    # and putting it here spends the empty right edge instead of a dedicated
    # toolbar row above the cards.
    page_actions:
      - id: collapse_all_toggle
        type: Button
        layout:
          # Without an explicit flex a block falls into the 24-span column grid
          # (flex 0 0 100%) rather than sizing to its label.
          flex: 0 0 auto
        properties:
          type: default
          size: small
          title:
            _js:
              args:
                groups:
                  _state: groups_list
                map:
                  _state: collapse_map
              fn: |
                const groups = args.groups || [];
                const ids = [];
                for (const g of groups) for (const a of (g.actions || [])) ids.push(a.key ? a.type + '.' + a.key : a.type);
                const map = args.map || {};
                const allExpanded = ids.length > 0 && ids.every((id) => map[id]);
                return allExpanded ? 'Collapse all' : 'Expand all';
        events:
          onClick:
            - id: toggle_all
              type: SetState
              params:
                collapse_map:
                  _js:
                    args:
                      groups:
                        _state: groups_list
                      map:
                        _state: collapse_map
                    fn: |
                      const groups = args.groups || [];
                      const ids = [];
                      for (const g of groups) for (const a of (g.actions || [])) ids.push(a.key ? a.type + '.' + a.key : a.type);
                      const map = args.map || {};
                      const allExpanded = ids.length > 0 && ids.every((id) => map[id]);
                      if (allExpanded) return {};
                      const next = {};
                      for (const id of ids) next[id] = true;
                      return next;
    # Presigned S3 GET, so file fields inside the action cards download rather
    # than rendering "No files available" (DataDescriptions needs the policy
    # request id). Instantiated id: download_policy_workflow_overview.
    requests:
      - _ref:
          module: files
          component: download-policy
          vars:
            block_id: workflow_overview
    events:
      onMount:
        # workflow_id presence guard.
        - id: redirect_no_workflow
          type: Link
          skip:
            _ne:
              - _url_query: workflow_id
              - null
          params:
            back: true
        # Single CallApi to get-workflow-overview.
        - id: call_get_overview
          type: CallAPI
          params:
            endpointId:
              _module.endpointId: get-workflow-overview
            payload:
              workflow_id:
                _url_query: workflow_id
        # Stash the response in _state.workflow, plus put the grouped actions
        # under their own top-level state key so the List block can read from it.
        - id: set_overview_state
          type: SetState
          params:
            workflow:
              _actions: call_get_overview.response.response.workflow
            groups_list:
              _actions: call_get_overview.response.response.groups
        # Null-redirect guard — Api returns workflow: null when no actions
        # pass the access filter (or the workflow doc is missing).
        # - id: redirect_no_workflow_doc
        #   type: Link
        #   skip:
        #     _ne:
        #       - _state: workflow
        #       - null
        #   params:
        #     back: true
    blocks:
      # Segmented status bar (Part 66): one coloured segment per action state,
      # fed the whole summary object so the page does no arithmetic.
      - _ref:
          path: components/overview-progress-bar.yaml
          vars:
            summary:
              _state: workflow.summary
      # Action cards grouped by action group (engine emits groups in declaration
      # order; cards within keep declaration order). Each group renders an
      # icon + title header (suppressed for ungrouped/null-title groups) above
      # its card list.
      #
      # List spacing: blocks-basic List builds its item flex-container from
      # properties.direction/wrap and merges its `.element` CSS slot into it, so
      # the gap BETWEEN items lives on `style: .element: gap`. (A bare `style.gap`
      # would land on the outer BlockLayout div, not the flex container — which is
      # why it had no effect.) layout.gap cannot space items either — the
      # framework Area wraps each item individually, so layout.gap only spaces the
      # blocks WITHIN one item. Hence here: layout.gap spaces the header from its
      # own cards inside each group; `.element` gap spaces the group sections.
      - id: groups_list
        type: List
        properties:
          direction: column
          wrap: nowrap
        layout:
          gap: 8
        style:
          .element:
            gap: 24px
        blocks:
          - id: groups_list.$.group_header
            type: Box
            visible:
              _ne:
                - _state: groups_list.$.title
                - null
            layout:
              gap: 8
              selfAlign: middle
              # `align` centres the icon against the title; `selfAlign` above
              # only places this Box in its parent. Without it the row stretches
              # and the icon top-aligns while the h5 sits lower on its own
              # line-height.
              align: middle
            blocks:
              - id: groups_list.$.group_icon
                type: Icon
                layout:
                  flex: 0 0 auto
                visible:
                  _ne:
                    - _state: groups_list.$.icon
                    - null
                properties:
                  name:
                    _state: groups_list.$.icon
              - id: groups_list.$.group_title
                type: Title
                layout:
                  flex: 1 1 auto
                # antd headings carry a bottom margin, which would offset the
                # centring above.
                style:
                  .element:
                    marginBottom: 0
                properties:
                  level: 5
                  content:
                    _state: groups_list.$.title
          - id: groups_list.$.actions
            type: List
            properties:
              direction: column
              wrap: nowrap
            style:
              .element:
                gap: 8px
            blocks:
              # One collapsible, status-tinted card per action.
              - _ref:
                  path: components/overview-action-card.yaml
                  vars:
                    prefix: groups_list.$.actions.$
                    s3_get_policy_request_id: download_policy_workflow_overview
