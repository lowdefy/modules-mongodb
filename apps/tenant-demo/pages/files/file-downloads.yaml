# Every download block, on a page whose own config uses no CallAPI action and
# no _event operator: the blocks render plain links and need neither, which
# e2e/files/download-blocks.spec.js proves by loading this page directly.
#
# The files are written into the page, as a page holding a file's key would
# have them: the endpoint, not the page, decides what is signed. Each key is
# the files module record a test seeds, except not-a-record.pdf, which no
# record holds, so the file link answers 404 for it.
id: file-downloads
type: Box
layout:
  gap: 16
style:
  padding: 24
blocks:
  - id: file_downloads_title
    type: Title
    properties:
      content: File downloads
      level: 3
  - id: file_downloads_intro
    type: Paragraph
    properties:
      type: secondary
      content: >
        The plugin's download blocks, each linking to the files module's file
        link endpoint. The endpoint loads the file's record on every open, so
        a file of another organization, a file the access check refuses and a
        key no record holds answer 404, whatever the page holds.

  - id: download_file_download_title
    type: Title
    properties:
      content: FileDownload
      level: 5
  - id: download_file_download
    type: FileDownload
    properties:
      linkEndpointId: files/file
      fileList:
        - key: lot/20240101_000000000/0b7c6a8e-3f2d-4c1b-9a8e-1d2c3b4a5f60/old.pdf
          name: old.pdf
        - key: lot/20240101_000000000/0b7c6a8e-3f2d-4c1b-9a8e-1d2c3b4a5f60/private.pdf
          name: private.pdf

  - id: download_file_manager_title
    type: Title
    properties:
      content: FileManager
      level: 5
  - id: download_file_manager
    type: FileManager
    properties:
      viewOnly: true
      linkEndpointId: files/file
      files:
        - file:
            key: lot/20240101_000000000/0b7c6a8e-3f2d-4c1b-9a8e-1d2c3b4a5f60/old.pdf
            name: old.pdf
            type: application/pdf

  - id: download_events_timeline_title
    type: Title
    properties:
      content: EventsTimeline
      level: 5
  - id: download_events_timeline
    type: EventsTimeline
    properties:
      linkEndpointId: files/file
      disableContactLink: true
      data:
        - id: event-with-files
          title: Contract signed
          created:
            timestamp: "2026-07-01T09:00:00.000Z"
            user:
              id: user-e2e
              name: E2E User
          files:
            - key: lot/20240101_000000000/0b7c6a8e-3f2d-4c1b-9a8e-1d2c3b4a5f60/old.pdf
              name: old.pdf
            - key: lot/20240101_000000000/0b7c6a8e-3f2d-4c1b-9a8e-1d2c3b4a5f60/not-a-record.pdf
              name: not-a-record.pdf

  - id: download_data_descriptions_title
    type: Title
    properties:
      content: DataDescriptions
      level: 5
  - id: download_data_descriptions
    type: DataDescriptions
    properties:
      linkEndpointId: files/file
      column: 1
      data:
        contract:
          fileList:
            - key: lot/20240101_000000000/0b7c6a8e-3f2d-4c1b-9a8e-1d2c3b4a5f60/old.pdf
              name: old.pdf
