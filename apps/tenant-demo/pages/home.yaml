_ref:
  module: layout
  component: page
  vars:
    id: home
    title:
      _app: name
    breadcrumbs:
      - home: true
        icon: home
    events:
      onInit:
        # The docked assistant's state contract — required on any page that
        # mounts the module's panel.
        - _ref:
            module: ai-assistant
            component: state
    blocks:
      - id: description
        type: Paragraph
        properties:
          content: |
            Explore the modules in this monorepo. Each card opens a working demo of that module.

      # The ai-assistant module's open-with-prompt: a button outside the panel
      # that opens it on a new thread and sends the prompt, whether the panel
      # is open, closed or not yet opened.
      - id: ask_assistant_tour
        type: Button
        properties:
          title: Ask the assistant for a tour
          icon: bot
          type: default
        events:
          onClick:
            _ref:
              module: ai-assistant
              component: open-with-prompt
              vars:
                prompt: Give me a short tour of the modules in this demo app, and say which one to open first.

      # CRM modules
      - id: crm_divider
        type: Divider
        properties:
          orientation: left
          title: CRM
      - id: crm_cards
        type: Box
        layout:
          gap: 16
        blocks:
          - _ref:
              path: pages/components/explore_card.yaml.njk
              vars:
                id: deals
                icon: Presentation
                title: Deals
                description: Deal pipeline — capture, progress, and win or lose.
                note: Demonstrates the Deals module orchestrating Workflows, Companies, Contacts, Files & Activities.
                pageId: deals/all
          - _ref:
              path: pages/components/explore_card.yaml.njk
              vars:
                id: companies
                icon: Store
                title: Companies
                description: Company records — list, detail, edit, and create.
                pageId:
                  _module.pageId:
                    module: companies
                    id: all
          - _ref:
              path: pages/components/explore_card.yaml.njk
              vars:
                id: contacts
                icon: Contact
                title: Contacts
                description: Contact management with a reusable picker.
                pageId:
                  _module.pageId:
                    module: contacts
                    id: all
          - _ref:
              path: pages/components/explore_card.yaml.njk
              vars:
                id: activities
                icon: Flag
                title: Activities
                description: Calls, meetings, and emails linked to records.
                pageId:
                  _module.pageId:
                    module: activities
                    id: all

      # Platform modules
      - id: platform_divider
        type: Divider
        properties:
          orientation: left
          title: Platform
      - id: platform_cards
        type: Box
        layout:
          gap: 16
        blocks:
          - _ref:
              path: pages/components/explore_card.yaml.njk
              vars:
                id: files
                icon: attach
                title: Files
                description: Entity attachments — file-card, file-manager, file-list.
                note: Showcases the files module components, form slot, and download logging.
                pageId: files-demo
          - _ref:
              path: pages/components/explore_card.yaml.njk
              vars:
                id: notifications
                icon: bell
                title: Notifications
                description: Inbox, bell, and deep-link routing.
                pageId:
                  _module.pageId:
                    module: notifications
                    id: all
          - _ref:
              path: pages/components/explore_card.yaml.njk
              vars:
                id: release_notes
                icon: document
                title: Release Notes
                description: Changelog rendered from CHANGELOG.md.
                pageId:
                  _module.pageId:
                    module: release-notes
                    id: view

      # The module's docked variant: corner launcher bottom right.
      - _ref:
          module: ai-assistant
          component: panel
