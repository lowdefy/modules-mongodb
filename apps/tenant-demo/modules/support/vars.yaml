# The tenant demo installs support for its webhook, which hands Pelican's
# release.* events to the release-notes module. The help button and panel are
# not wired into the layout here; apps/demo shows them.
pelican_url:
  _build.env:
    key: SUPPORT_PELICAN_URL
    default: https://pelican.lowdefy.app
environment:
  _build.env:
    key: STAGE
    default: development
app_version:
  _build.env:
    key: APP_VERSION
    default: null
release_notes_endpoint: release-notes/receive
