send_routine:
  _ref: modules/notifications/send-routine.yaml
# Origin for email link URLs — point at the deployed origin in production.
server_url: http://localhost:3000
# Inbox views: groups of notification types at the top of the inbox rail.
views:
  - id: approvals
    title: Approvals
    icon: CircleCheck
    types:
      - quote-approved
  - id: account
    title: Account & security
    icon: ShieldCheck
    types:
      - two-factor-reset
      - passkeys-revoked
      - sessions-revoked
  - id: support
    title: Support
    icon: LifeBuoy
    types:
      - support-reply
# Blocks in the opened notification's header.
components:
  notification_header_slots:
    _ref: modules/notifications/header-slots.yaml
# Notification sounds offered to the viewer.
sounds:
  _ref: modules/notifications/sounds.yaml
