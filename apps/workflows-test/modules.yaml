# Keep workflows after its declared dependencies (layout, events,
# notifications) — the experimental build's entry-vars resolve is
# order-sensitive when cross-module _refs are involved.

# user-account is not a workflows dependency, but layout declares a
# dependency on it (the page component embeds its profile-avatar), so
# the build requires the entry.
- id: user-account
  source: "file:../../modules/user-account"

- id: layout
  source: "file:../../modules/layout"

- id: events
  source: "file:../../modules/events"

- id: notifications
  source: "file:../../modules/notifications"
  vars:
    _ref: modules/notifications/vars.yaml

- id: workflows
  source: "file:../../modules/workflows"
  vars:
    _ref: modules/workflows/vars.yaml

# The workflows module declares a `contacts` dependency (the contact-selector
# field components). Wiring contacts pulls in companies + files too (contacts ↔
# companies are mutually dependent; both depend on files). Beyond the
# contact-selector these pages are not exercised by the workflows-test specs;
# the entries satisfy the build-time dependency graph. Every entry below sets
# only the vars the build requires; all others use their defaults.
- id: companies
  source: "file:../../modules/companies"
  vars:
    atlas_search:
      _ref:
        path: app_config.yaml
        key: atlas_search

- id: contacts
  source: "file:../../modules/contacts"
  vars:
    atlas_search:
      _ref:
        path: app_config.yaml
        key: atlas_search

- id: files
  source: "file:../../modules/files"
  vars:
    s3_region: us-east-1

# activities and deals are listed so their searchable requests compile against
# this app's plain mongod. deals depends on activities, so both are needed.
- id: activities
  source: "file:../../modules/activities"
  vars:
    atlas_search:
      _ref:
        path: app_config.yaml
        key: atlas_search

- id: deals
  source: "file:../../modules/deals"
  vars:
    atlas_search:
      _ref:
        path: app_config.yaml
        key: atlas_search
    stages:
      prospecting:
        title: Prospecting
    # Must name a workflow this app's workflows_config declares — the deal pages
    # resolve its `{type}-start` / `{type}-submit` endpoints at build time.
    workflow_type: form-lifecycle
