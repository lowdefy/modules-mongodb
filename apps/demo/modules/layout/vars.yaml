page_type: sidebar
# Content area padding for every page, in place of the page block's 40px.
content_style:
  padding: 0 24px 24px 24px
footer:
  - id: footer-text
    type: Html
    properties:
      html:
        _nunjucks:
          template: |
            <p>{{ name }}</p>
            <p>© 2026 Resonancy. All rights reserved.</p>
          on:
            name:
              _app: name

# App-wide seams — the same widget rides EVERY page that uses the layout `page`
# component, without any page opting in. `global_events.onInit` seeds the
# widget's state contract after the page's own onInit; `global_blocks` renders
# it after the page content (it floats, so its place in the tree is immaterial).
global_events:
  onInit:
    - id: seed_whats_new
      type: SetState
      params:
        whats_new_dismissed: false
    - id: fetch_unread_release_notes
      type: Request
      params: get_unread_release_notes_count
    - _ref:
        module: support
        component: on-init
global_requests:
  _build.array.concat:
    - _ref:
        module: support
        component: requests
    # Tickets waiting for the person's reply, read on the home page.
    - - _ref:
          module: support
          component: get-awaiting-reply-count
    # The unread count behind the What's new launcher below.
    - - _ref:
          module: release-notes
          component: get_unread_release_notes_count
# The support panel's live thread, opened only while a thread is open.
global_subscriptions:
  _ref:
    module: support
    component: subscriptions
global_blocks:
  - _ref:
      module: support
      component: launcher
  # The report form in a drawer, opened by open-report with no model call: it
  # works when the help button is off or the assistant is unavailable.
  - _ref:
      module: support
      component: report-drawer
      vars:
        secondary:
          - id: report_ask_assistant
            type: Button
            properties:
              title: Ask the assistant instead
              type: link
              size: small
            events:
              onClick:
                - id: report_ask_assistant_link
                  type: Link
                  params:
                    pageId: home
  - id: whats_new_launcher
    type: Button
    # Shown while a release note is unread; hidden on What's new itself, where
    # it would float over the note.
    visible:
      _and:
        - _gt:
            - _if_none:
                - _request: get_unread_release_notes_count.0.total
                - 0
            - 0
        - _not:
            _state: whats_new_dismissed
        - _ne:
            - _location: pageId
            - release-notes/view
    style:
      position: fixed
      right: 24
      bottom: 24
      zIndex: 10
    properties:
      title: What's new
      icon: Megaphone
      shape: round
    events:
      onClick:
        - id: dismiss_whats_new
          type: SetState
          params:
            whats_new_dismissed: true
        - id: open_release_notes
          type: Link
          params:
            pageId: release-notes/view
