send_routine:
  _ref: modules/notifications/send-routine.yaml
# Origin for email link URLs — point at the deployed origin in production.
server_url: http://localhost:3000
# SendGrid HTTP API transport for notification emails. The API key comes from
# the module's SENDGRID_API_KEY secret (its default) — set that env
# var to the SendGrid API key in the demo environment (the same value the
# earlier SMTP-relay setup kept in NOTIFICATIONS_SMTP_PASS).
transport: sendgrid
sendgrid:
  from: Lowdefy Demo <notify@demo.lowdefy.dev>
# Inbox views: groups of notification types at the top of the inbox rail.
views:
  - id: approvals
    title: Approvals
    icon: CircleCheck
    types:
      - quote-approved
  - id: account
    title: Account & security
    icon: ShieldCheck
    types:
      - two-factor-reset
      - passkeys-revoked
      - sessions-revoked
  - id: support
    title: Support
    icon: LifeBuoy
    types:
      - support-reply
# Notification sounds offered to the viewer.
sounds:
  _ref: modules/notifications/sounds.yaml
# The inbox layout. The demo shows the three-column inbox; build it with
# NOTIFICATIONS_LAYOUT=list to see the one-column list (the list e2e spec does).
layout:
  _build.if_none:
    - _build.env: NOTIFICATIONS_LAYOUT
    - columns
# Notifications a person must act on, which an app counts elsewhere: stored and
# emailed, but kept out of the inbox, its counts, the bell and the toasts.
action_types:
  - action-needed
# The list layout's own first row: one live summary with a link.
summary_row:
  - id: inbox_summary
    type: Box
    class:
      .element: nx-lsummary
    layout:
      gap: 12
      align: middle
    blocks:
      - id: inbox_summary_text
        type: Html
        layout:
          flex: 1 1 0
        properties:
          html: |
            <strong>Quotes need a decision</strong><span>Open the deals board to review them.</span>
      - id: inbox_summary_open
        type: Button
        layout:
          flex: 0 0 auto
        properties:
          title: Open
          type: link
          size: small
        events:
          onClick:
            - id: open_deals
              type: Link
              params:
                pageId: deals/all
      # Renews the demo licence: its notifications are read for everyone.
      - id: inbox_summary_renew
        type: Button
        layout:
          flex: 0 0 auto
        properties:
          title: Renew licence
          type: link
          size: small
        events:
          onClick:
            - id: renew_licence
              type: CallAPI
              params:
                endpointId: notifications-resolve-licence
# The bell's count badge colour: gold or red.
tone: gold
