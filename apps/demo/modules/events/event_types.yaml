create-deal:
  color: "#1890ff"
  title: Deal Created
  icon: FilePlus
action-approve:
  color: "#52c41a"
  title: Action Approved
  icon: check-circle
# Saved by user-account's accept page (log-member-joined).
org-member-joined:
  color: "#52c41a"
  title: Joined
  icon: UserPlus
# Saved by user-account's Access tokens tile (create-mcp-token / revoke-mcp-token).
org-mcp-token-created:
  color: "#1890ff"
  title: Token Created
  icon: Key
org-mcp-token-revoked:
  color: "#ff4d4f"
  title: Token Switched Off
  icon: Key
# Notification pipeline types — badges for records the notifications module's
# dispatch pipeline writes (record.type = notification config id).
quote-approved:
  color: "#52c41a"
  title: Quote Approved
  icon: check-circle
  # The list layout's group row for several of this type on one day.
  group_title: "{n} quotes approved"
user-invite:
  color: "#1890ff"
  title: User Invited
  icon: UserPlus
# The list layout reads `group_title` ({n} is the count) and `fix` (the page
# that fixes the problem, shown as a button when a notification with no link
# opens in place).
support-reply:
  color: "#722ed1"
  title: Support reply
  icon: LifeBuoy
  group_title: "{n} support replies"
sync-stopped:
  color: "#faad14"
  title: Sync stopped
  icon: FolderSync
  group_title: "{n} folders stopped syncing"
  fix:
    title: Open deals
    pageId: deals/all
# An action type (the notifications module's `action_types` var): stored and
# emailed, but never listed in the inbox or counted by the bell.
action-needed:
  color: "#ff4d4f"
  title: Needs you
  icon: CircleAlert
