agent_id: demo-assistant
# One global assistant for the whole demo app — a constant scope. A per-record
# assistant would pass a state operator here instead.
scope: demo
panel_title: Demo Assistant
panel_subtitle: modules-mongodb demo
welcome:
  title: Demo Assistant
  description: Ask anything about the modules in this demo app.
  prompts:
    - label: What modules are in this repo?
      description: A tour of what the monorepo ships
    - label: How do threads work?
      description: How this assistant stores and titles conversations
sender_placeholder: Ask about the demo app…
title_domain: a Lowdefy module demo app

# Demonstrates the consumer-owned event seams. A real app would send the rating to an
# endpoint here; the toast is enough to show the wiring reaches the app.
message_display:
  actions:
    - copy
    - feedback
    - delete
on_feedback:
  - id: demo_ack_feedback
    type: DisplayMessage
    params:
      content:
        _string.concat:
          - 'Thanks — recorded a '
          - _event: rating
          - ' (demo only).'

# Demonstrates the notice seam: an app that has stopped the assistant says so in place of the
# conversation instead of leaving a composer that cannot send. Driven from page state here so the
# demo can show both states; a real app would read a subscription or credit balance.
notice:
  _if:
    test:
      # The switch lives on the assistant page; the panel on home reads the same var and has
      # none, where the key resolving to undefined is the answer rather than a mistake.
      _state: demo_assistant_paused
      ~ignoreBuildChecks: true
    then:
      type: warning
      message: The assistant is paused
      description: This workspace has run out of AI credits. Your earlier chats are still here.
    else: null

# Demonstrates the styling seams. Both default to antd's primary tokens, which the
# app's theme already supplies — so these are set to the SAME brand colour on
# purpose, to show where a consumer whose palette does not come from `colorPrimary`
# hooks in without reaching into the module's blocks from a stylesheet.
toolbar:
  size: middle
  accent: '#7c3aed'
  accent_text: '#ffffff'
  secondary: '#f4f4f5'
thread_selection:
  border: '#7c3aed'
  background: '#f5f3ff'
