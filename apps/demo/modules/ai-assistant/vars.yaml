agent_id: demo-assistant
# One global assistant for the whole demo app — a constant scope. A per-record
# assistant would pass a state operator here instead.
scope: demo
panel_title: Demo Assistant
panel_subtitle: modules-mongodb demo
welcome:
  title: Demo Assistant
  description: Ask anything about the modules in this demo app.
  prompts:
    - label: What modules are in this repo?
      description: A tour of what the monorepo ships
    - label: How do threads work?
      description: How this assistant stores and titles conversations
sender_placeholder: Ask about the demo app…
title_domain: a Lowdefy module demo app

# Demonstrates the consumer-owned event seams. A real app would send the rating to an
# endpoint here; the toast is enough to show the wiring reaches the app.
message_display:
  actions:
    - copy
    - feedback
on_feedback:
  - id: demo_ack_feedback
    type: DisplayMessage
    params:
      content:
        _string.concat:
          - 'Thanks — recorded a '
          - _event: rating
          - ' (demo only).'
