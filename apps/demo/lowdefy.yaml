lowdefy: 0.0.0-experimental-20260805130407
name: Module Demo App
slug: demo

cli:
  watch:
    - ../../modules/shared

theme:
  antd:
    algorithm: compact
    token:
      colorPrimary: "#7c3aed"

config:
  homePageId: router

global:
  enums:
    event_types:
      _ref:
        module: events
        component: event_types

plugins:
  # @lowdefy/community-plugin-mongodb dropped (design task 1): the built-in
  # @lowdefy/connection-mongodb (vendored, supportsJSON) now serves every MongoDB
  # connection/request in the demo — including the companies module's
  # MongoDBInsertConsecutiveId — plus the auth.database MongoDBAuthAdapter. The
  # community plugin is fully superseded; the built-in is auto-included (no pin).
  - name: "@lowdefy/community-plugin-xlsx"
    version: 1.1.0
  - name: "@lowdefy/community-plugin-nodemailer"
    version: 1.1.4
  - name: "@lowdefy/modules-mongodb-plugins"
    version: workspace:*

auth:
  secret:
    _secret: AUTH_SECRET
  database:
    id: mdb_adapter
    type: MongoDBAuthAdapter
    properties:
      uri:
        _secret: MONGODB_URI
  # Full method matrix so every _build.authConfig-gated branch in the login
  # page and account workspace resolves and builds into a demo artifact (task
  # 01). No real OAuth secrets are needed — ldf:b reads only the config
  # projection.
  emailAndPassword:
    enabled: true
    requireEmailVerification: true
    minPasswordLength: 8
  magicLink:
    enabled: true
    expiresIn: 1800
  twoFactor:
    enabled: true
  passkey:
    enabled: true
    rpId: localhost
    rpName: Module Demo App
  providers:
    - id: google
      type: Google
      properties:
        clientId:
          _secret: GOOGLE_CLIENT_ID
        clientSecret:
          _secret: GOOGLE_CLIENT_SECRET
  # Auth emails (verify, reset, magic-link, invite) send through the `auth-smtp`
  # SMTP connection (see connections below): the runtime resolves it by
  # connectionId at send time and the connection owns from/transport/filter. An
  # optional `templates` map (verifyEmail/resetPassword/magicLink/invitation →
  # notification ids) can override the default copy.
  email:
    connectionId: auth-smtp
  # The user-account module contributes its own authPages (login, signup,
  # verify-email, …) and public pages (two-factor, logout) via its manifest, so
  # they are NOT repeated in `pages.public` below; app config would win on
  # collision.
  # Pinned-org policy: this app's own organization, ensured by slug at startup
  # with its id set to that slug. A user-admin instance names the organization it
  # administers through its own `org_slug` var, so the instance administering this
  # one repeats the value below rather than inheriting it.
  organizations:
    policy: pinned
    org: demo
    # open: uninvited self-signup is admitted — a user.create.after hook auto-joins
    # the pinned org with the org plugin's built-in (inert) `member` role, so the
    # hard wall lets them in while role-gated pages still gate. invite-only is the
    # secure default (a non-member is rejected with MEMBERSHIP_REQUIRED until an
    # admin invites them); open lets the demo exercise the full signup→verify flow.
    signup: open
  # Authored role catalog (role-catalog design) — the single source of truth for
  # assignable roles, their labels, and help text. Every gate reference must be
  # declared here.
  roles:
    - id: user-admin
      label: User Admin
      description: Administers users across the pinned suite (ban, invite, roles, sessions).
    - id: customer-user-admin
      label: Customer User Admin
      description: Administers the users of the customer portal organization.
    - id: admin
      label: Admin
      description: Application administrator.
    - id: manager
      label: Manager
      description: Team manager.
    - id: user
      label: User
      description: Standard application user.
  # App-level page gate: every page requires a session except this public list.
  # Modules contribute their own public pages (user-account: login/signup/…,
  # two-factor, logout; notifications: link, invalid, file-download), so this
  # list is only the app's own public surface — the 404 and router entry pages.
  #
  # One glob per user-admin instance is the read side's whole authorization: the
  # organization an instance administers is welded into its reads at build time,
  # so no per-request check remains. `**` is what makes one line enough — it
  # covers every item the instance ships now and every one added later, while
  # stopping at the instance boundary (`*` does not cross a slash, `**` does), so
  # neither surface can reach the other organization's members.
  pages:
    protected: true
    public:
      - "404"
      - router
    roles:
      user-admin:
        - user-admin/**
      customer-user-admin:
        - customer-user-admin/**
  # The endpoint gate is required, not defence in depth. This entity declares
  # neither `protected` nor `public`, so an endpoint matching no glob resolves
  # `{ public: true }` and answers with no session at all — an unlisted admin
  # instance hands its organization's members, emails and export to anyone. The
  # write steps are floored separately by the engine against the caller's member
  # row in the organization each step names; reads have no such floor.
  api:
    roles:
      user-admin:
        - user-admin/**
      customer-user-admin:
        - customer-user-admin/**

modules:
  _ref: modules.yaml

menus:
  _ref: menus.yaml

connections:
  - id: auth-smtp
    type: SMTP
    properties:
      from:
        _secret: AUTH_FROM_ADDRESS
      host:
        _secret: SMTP_HOST
      port:
        _secret: SMTP_PORT
      secure:
        _eq:
          - _secret: SMTP_SECURE
          - "true"
      auth:
        user:
          _secret: SMTP_USER
        pass:
          _secret: SMTP_PASS
  - id: demo-contacts
    type: MongoDBCollection
    properties:
      databaseUri:
        _secret: MONGODB_URI
      collection: user-contacts
  # Sales-pipeline workflow entity connection — the `deals` id the deals module's
  # GetEntityWorkflows queries match on (module r/w the collection via deals-collection).
  - id: deals
    type: MongoDBCollection
    properties:
      databaseUri:
        _secret: MONGODB_URI
      collection: deals
      write: true
      changeLog:
        collection: log-changes
        meta:
          user:
            _user: true

api: []

pages:
  - _ref: pages/router.yaml
  - _ref: pages/avatar.yaml
  - _ref: pages/user-components-demo.yaml
  - _ref: pages/404.yaml
  - _ref: pages/home.yaml
  - _ref: pages/files/files-demo.yaml
  - _ref: pages/quote-builder.yaml
  - _ref: pages/start-company-setup.yaml
