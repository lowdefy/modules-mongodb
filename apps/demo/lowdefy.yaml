lowdefy: 5.5.1
name: Module Demo App
slug: demo

cli:
  watch:
    - ../../modules/shared

theme:
  antd:
    algorithm: compact
    token:
      colorPrimary: '#7c3aed'

config:
  homePageId: router

global:
  enums:
    event_types:
      _ref:
        module: events
        component: event_types

plugins:
  - name: '@lowdefy/community-plugin-mongodb'
    version: 3.0.0
  - name: '@lowdefy/community-plugin-xlsx'
    version: 1.1.0
  - name: '@lowdefy/community-plugin-nodemailer'
    version: 1.1.4
  - name: '@lowdefy/modules-mongodb-plugins'
    version: workspace:*
  - name: '@lowdefy/connection-anthropic'
    version: 5.5.1

auth:
  authPages:
    signIn: /user-account/login
    verifyRequest: /user-account/verify-email-request
    error: /user-account/login
  theme:
    brandColor: '#7c3aed'
  adapter:
    id: mdb_adapter
    type: MultiAppMongoDBAdapter
    properties:
      invite:
        required: true
      databaseUri:
        _secret: MONGODB_URI
      appName:
        _ref:
          path: app_config.yaml
          key: app_name
      verificationTokens:
        uses: 5
      collections:
        accounts: user-accounts
        contacts: user-contacts
        sessions: user-sessions
        verificationTokens: user-verification-tokens
  providers:
    - id: email
      type: EmailProvider
      properties:
        maxAge: 1800
        server:
          host: smtp.sendgrid.net
          port: 465
          auth:
            user: apikey
            pass:
              _secret: SENDGRID_API_KEY
        from:
          _secret: AUTH_FROM_ADDRESS
        templateVariables:
          appName: Lowdefy Modules MongoDB Demo
          logoHeight: 80px
  userFields:
    id: user.id
    profile: user.profile
    app_attributes: user.app_attributes
    global_attributes: user.global_attributes
    roles: user.roles
  pages:
    protected: true
    public:
      - '404'
      - notifications-invalid
      - notifications-link
      - router
      - user-account/login
      - user-account/verify-email-request
    roles:
      user-admin:
        - user-admin/*
  api:
    protected: true
    roles:
      user-admin:
        - user-admin/*

modules:
  _ref: modules.yaml

menus:
  _ref: menus.yaml

connections:
  - id: demo-contacts
    type: MongoDBCollection
    properties:
      databaseUri:
        _secret: MONGODB_URI
      collection: user-contacts
  # Model connection for the demo-assistant agent (ai-assistant module demo).
  # Build needs no key; the secret is only read at runtime.
  - id: anthropic
    type: Anthropic
    properties:
      apiKey:
        _secret: ANTHROPIC_API_KEY
  # Sales-pipeline workflow entity connection — the `deals` id the deals module's
  # GetEntityWorkflows queries match on (module r/w the collection via deals-collection).
  - id: deals
    type: MongoDBCollection
    properties:
      databaseUri:
        _secret: MONGODB_URI
      collection: deals
      write: true
      changeLog:
        collection: log-changes
        meta:
          user:
            _user: true

api: []

agents:
  # The agent behind the ai-assistant module demo. The module brings the chat
  # shell and thread lifecycle; the agent — model, prompt, tools — is the app's.
  - id: demo-assistant
    type: ClaudeAgent
    connectionId: anthropic
    properties:
      model: claude-haiku-4-5
      maxSteps: 4
      instructions: >-
        You are the assistant in the Lowdefy modules-mongodb demo app. Answer
        briefly and concretely. The repo ships reusable Lowdefy modules backed
        by MongoDB: layout, events, files, notifications, user-account,
        user-admin, contacts, companies, activities, deals, workflows,
        release-notes, and this ai-assistant. You have no tools; when asked
        about specifics you cannot know, say so and point at the repo docs.

pages:
  - _ref: pages/router.yaml
  - _ref: pages/avatar.yaml
  - _ref: pages/user-components-demo.yaml
  - _ref: pages/404.yaml
  - _ref: pages/home.yaml
  - _ref: pages/assistant-demo.yaml
  - _ref: pages/files/files-demo.yaml
  - _ref: pages/quote-builder.yaml
  - _ref: pages/start-company-setup.yaml
