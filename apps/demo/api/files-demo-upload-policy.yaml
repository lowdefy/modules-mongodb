# Mints an S3 post policy for the FileManager onUploadPolicy example on the
# files demo page. Files over 1 MB get no policy, which the block treats as a
# quiet cancel. A pasted image is named pasted-YYYYMMDD-HHmmss.png here, since
# clipboard files arrive with a generic name.
id: files-demo-upload-policy
type: Api
routine:
  - :if:
      _gt:
        - _payload: size
        - 1048576
    :then:
      - :return:
          upload: null
  - id: policy
    type: AwsS3PresignedPostPolicy
    connectionId: files/files-bucket
    properties:
      key:
        _string.concat:
          - files-demo/policy-event/
          - _uuid: true
          - /
          - _if:
              test:
                _payload: pasted
              then:
                _string.concat:
                  - pasted-
                  - _dayjs.format:
                      on:
                        _date: now
                      format: YYYYMMDD-HHmmss
                  - .png
              else:
                _payload: name
      fields:
        Content-Type:
          _payload: content_type
      conditions:
        - - content-length-range
          - 1
          - 1048576
  - :return:
      upload:
        _step: policy
